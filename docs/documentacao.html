<style>
:root {
  --bg: #07080c;
  --s1: #0b0d13;
  --s2: #10131b;
  --s3: #171b26;
  --s4: #212636;
  --ink: #e9ecf4;
  --ink-2: #aab0c3;
  --ink-3: #7f869b;
  --hair: rgba(233, 236, 244, 0.07);
  --magenta: #ff8a3d;
  --ambar: #ffb020;
  --vermelho: #ff6a5e;
  --verde: #4fd1a1;
  --ciano: #5ec8ff;
  --magenta-acesa: #ffb27a;
  --lilas: #c9a6ff;
  --demanda: #ff4fa3; 
  --humor: var(--magenta);
  --display: 'Sofia Sans Extra Condensed', 'Geist Sans', sans-serif;
  --sans: 'Geist Sans', system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
  --raio: 14px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}

:root[data-humor='rodando'] { --humor: var(--ambar); }
:root[data-humor='erro'] { --humor: var(--vermelho); }
:root[data-humor='feito'] { --humor: var(--verde); }
:root[data-humor='ouvindo'] { --humor: var(--ciano); }
:root[data-humor='falando'] { --humor: var(--magenta-acesa); }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
  overflow: hidden;
}

::selection { background: color-mix(in oklab, var(--humor) 38%, transparent); color: var(--ink); }
:focus-visible { outline: 2px solid color-mix(in oklab, var(--humor) 80%, white); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--s4); border-radius: 10px; border: 3px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }
input, textarea, button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
a { color: inherit; text-underline-offset: 3px; }
.num, time, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }



.app {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  height: 100vh;
  position: relative;
  isolation: isolate;
}


.app::before {
  content: '';
  position: absolute;
  inset: -20vh auto auto -18vw;
  width: 70vw;
  height: 70vh;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--humor) 22%, transparent), transparent);
  pointer-events: none;
  z-index: -1;
  transition: background 1.2s var(--ease);
}



.lateral {
  display: flex;
  flex-direction: column;
  background: color-mix(in oklab, var(--s1) 86%, transparent);
  padding: 22px 16px 16px;
  min-height: 0;
  gap: 18px;
  
  overflow-y: auto;
}

.marca {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 8px;
}
.marca b { font: 800 26px/1 var(--display); letter-spacing: 0.04em; }
.marca span { font: 400 11px/1 var(--mono); color: var(--ink-3); letter-spacing: 0.06em; }

.presenca { display: grid; justify-items: center; gap: 2px; margin-top: -4px; }
.moldura { position: relative; }
.orbe { position: relative; }
.orbe canvas { display: block; }

.orbe[data-sem-webgl='true'] {
  border-radius: 50%;
  background: radial-gradient(circle, transparent 30%, color-mix(in oklab, var(--humor) 40%, white) 34%, var(--humor) 44%, #2a1206 56%, transparent 60%);
  transform: scale(0.8) scaleY(0.5);
}
.estado-ia {
  font: 800 48px/0.95 var(--display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in oklab, var(--humor) 55%, var(--ink));
  transition: color 0.8s var(--ease);
  margin-top: -10px;
}
.mostrador { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mostrador .aro { fill: none; stroke: var(--hair); stroke-width: 1; }
.mostrador .tick { stroke: color-mix(in oklab, var(--ink-3) 45%, transparent); stroke-width: 1; }
.mostrador .tick.longo { stroke: var(--ink-3); }
.mostrador .tick.agora { stroke: var(--humor); stroke-width: 2; }
.estado-sub {
  font: 400 13px/1.4 var(--sans);
  color: var(--ink-2);
  min-height: 17px;
  text-align: center;
  max-width: 250px;
}


.botao-especial {
  --cor-especial: #4fe160;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid color-mix(in oklab, var(--cor-especial) 45%, transparent);
  border-radius: var(--raio);
  background: linear-gradient(135deg, color-mix(in oklab, var(--cor-especial) 14%, var(--s2)), var(--s1) 70%);
  box-shadow: 0 0 0 0 transparent, inset 0 1px 0 color-mix(in oklab, var(--cor-especial) 18%, transparent);
  color: var(--ink);
  font: 700 12px/1.2 var(--sans);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  text-align: left;
  transition: box-shadow 0.28s var(--ease), border-color 0.28s var(--ease), transform 0.18s var(--ease);
}
.botao-especial:hover { border-color: var(--cor-especial); box-shadow: 0 0 22px -6px var(--cor-especial); transform: translateY(-1px); }
.botao-especial[aria-current='page'] { border-color: var(--cor-especial); box-shadow: 0 0 18px -8px var(--cor-especial); }
.botao-especial img, .botao-especial svg { flex: none; width: 30px; height: 30px; }
.botao-especial svg { color: var(--cor-especial); stroke-width: 1.6; }
.lateral[data-recolhida] .botao-especial { justify-content: center; padding: 8px; }
.lateral[data-recolhida] .botao-especial span { display: none; }

.alas { display: grid; gap: 2px; }
.alas.sistema { margin-top: auto; }
.alas h2 {
  font: 500 11px/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 8px;
  padding: 0 10px;
}
.ala-item {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-2);
  text-align: left;
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.ala-item:hover { background: var(--s3); color: var(--ink); }
.ala-item[aria-current='page'] { background: var(--s3); color: var(--ink); }
.ala-item[aria-current='page'] svg { color: var(--magenta); }
.ala-item svg { width: 17px; height: 17px; stroke-width: 1.6; }
.ala-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ala-numero { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ambar); color: var(--bg); font: 600 11px/18px var(--mono); text-align: center; }
.lateral[data-recolhida] .ala-item { position: relative; }
.lateral[data-recolhida] .ala-numero { position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 3px; font-size: 9.5px; line-height: 15px; }

.relogio-lateral { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 10px 0; color: var(--ink-3); font: 400 11px/1 var(--mono); letter-spacing: 0.06em; }


.marca span { margin-left: auto; }
.recolher {
  display: grid;
  place-items: center;
  align-self: center;
  margin-left: 8px;
  padding: 5px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-3);
  transition: background 0.2s var(--ease), color 0.2s var(--ease);
}
.recolher:hover { background: var(--s3); color: var(--ink); }
.recolher svg { width: 17px; height: 17px; stroke-width: 1.6; }
.app:has(> .lateral[data-recolhida]) { grid-template-columns: 72px minmax(0, 1fr); }
.lateral[data-recolhida] { padding: 22px 10px 16px; scrollbar-width: none; }
.lateral[data-recolhida] .marca { justify-content: center; padding: 0; }
.lateral[data-recolhida] .recolher { margin-left: 0; }
.lateral[data-recolhida] :is(.marca b, .marca span, .estado-ia, .estado-sub, .alas h2, .ala-item span, .relogio-lateral) { display: none; }
.lateral[data-recolhida] .ala-item { grid-template-columns: 22px; justify-content: center; padding: 9px; }



.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 12px; border-radius: 8px; border: 0;
  background: var(--s3); color: var(--ink);
  font: 500 13px/1 var(--sans);
  white-space: nowrap;
  transition: background 0.2s var(--ease), color 0.2s var(--ease), transform 0.15s var(--ease);
}
.btn:hover:not(:disabled) { background: var(--s4); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; }
.btn svg { width: 15px; height: 15px; stroke-width: 1.8; }
.btn.primario { background: var(--ink); color: var(--bg); }
.btn.primario:hover:not(:disabled) { background: #fff; }
.btn.fantasma { background: transparent; color: var(--ink-2); }
.btn.fantasma:hover:not(:disabled) { background: var(--s3); color: var(--ink); }
.btn.pequeno { height: 28px; padding: 0 10px; font-size: 12px; }
.btn[aria-pressed='true'] { background: color-mix(in oklab, var(--magenta) 22%, var(--s2)); color: var(--ink); }
.btn[aria-pressed='true'] .num { color: var(--magenta-acesa); }



.principal { display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; min-width: 0; }
.rolagem { overflow-y: auto; padding: 34px clamp(24px, 3.4vw, 56px) 40px; }

.topo {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  margin-bottom: 26px;
}
.topo h1 {
  font: 800 clamp(64px, 7vw, 104px)/0.84 var(--display);
  letter-spacing: 0.005em;
  text-transform: uppercase;
  margin: 0;
}
.topo .sub { color: var(--ink-2); font-size: 16px; margin: 10px 0 0; }

.vazio-ala { padding: 60px 24px; text-align: center; color: var(--ink-2); background: var(--s1); border-radius: var(--raio); }
.vazio-ala p { margin: 0 auto; max-width: 52ch; }
.carregando { color: var(--ink-3); padding: 24px 4px; font: 400 13px/1 var(--mono); }



.player { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; background: var(--s1); border-radius: var(--raio); padding: 12px; margin-bottom: 22px; }
.player video { display: block; width: 100%; max-height: 62vh; border-radius: 10px; background: #000; }
.player-info { display: flex; align-items: center; gap: 10px; padding: 0 4px 2px; }
.player-info .video-nome { flex: 1; }
.player-info .video-nome b { font-size: 16px; }
.player-info .video-nome b::first-letter { text-transform: uppercase; }
.player-info .btn svg { color: var(--magenta); }

.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.tema { background: var(--s1); border-radius: var(--raio); padding: 16px 16px 10px; min-width: 0; }
.tema h2 {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font: 800 30px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase;

}
.tema h2 span { min-width: 0; overflow-wrap: anywhere; text-align: right; font: 400 11px/1.3 var(--mono); letter-spacing: 0.06em; color: var(--ink-3); text-transform: none; }
.tema ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.pasta-video { margin-top: 6px; border-radius: 10px; background: var(--s2); }
.pasta-video summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 10px; cursor: pointer; font: 500 12px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); }
.pasta-video summary .num { color: var(--ink-3); }
.pasta-video[open] summary { color: var(--ink); }
.pasta-video ul { padding: 0 4px 6px; }
.pasta-video .video:hover { background: var(--s3); }
.video {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 2px 4px 2px 0; border-radius: 10px;

}
.video:hover { background: var(--s2); }
.video[aria-current] { background: color-mix(in oklab, var(--magenta) 10%, var(--s2)); }
.video-tocar { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding: 6px 6px; border: 0; background: none; text-align: left; border-radius: 10px; }
.video-tocar > svg { width: 15px; height: 15px; flex: none; color: var(--magenta); stroke-width: 1.8; }
.video-nome { display: grid; gap: 3px; min-width: 0; }
.video-nome b { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video .video-nome b::first-letter { text-transform: uppercase; }
.video-nome small { color: var(--ink-3); font-size: 11px; letter-spacing: 0.03em; }
.video .btn { opacity: 0; transition: opacity 0.2s var(--ease); }
.video:hover .btn, .video:focus-within .btn, .video[aria-current] .btn { opacity: 1; }
.vazio-linha { color: var(--ink-2); margin: 0; padding: 4px; font-size: 14px; }


.fabrica { display: grid; gap: 14px; }
.fabrica-barra { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.fabrica-vazia { margin: 0; padding: 14px 4px; color: var(--ink-2); font-size: 14px; }
.filme-na-barra {
  --cor: var(--ciano);
  display: grid; gap: 6px; flex: 0 0 auto; width: 220px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 12px;
  background: var(--s1); color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
}
.filme-na-barra:hover { background: var(--s2); }
.filme-na-barra[aria-pressed='true'] { border-color: color-mix(in oklab, var(--cor) 60%, transparent); background: var(--s2); }
.filme-na-barra[data-situacao='parado'] { --cor: var(--ambar); background: color-mix(in oklab, var(--ambar) 10%, var(--s1)); }
.filme-na-barra[data-situacao='erro'] { --cor: var(--vermelho); }
.filme-na-barra[data-situacao='entregue'] { --cor: var(--verde); }
.filme-na-barra b { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filme-na-barra b::first-letter, .filme-aberto h2::first-letter { text-transform: uppercase; }
.filme-situacao { color: var(--cor); font: 500 11px/1.2 var(--mono); letter-spacing: 0.03em; }
.etapas-do-filme { display: flex; gap: 3px; }
.etapa { flex: 1; height: 5px; border-radius: 3px; background: var(--s4); }
.etapa[data-situacao='pronto'] { background: color-mix(in oklab, var(--ink-3) 70%, var(--s4)); }
.etapa[data-situacao='trabalhando'] { background: var(--ciano); }
.etapa[data-situacao='erro'] { background: var(--vermelho); }
.etapa[aria-current='step'] { background: var(--cor); box-shadow: 0 0 8px color-mix(in oklab, var(--cor) 70%, transparent); }
.filme-erro { margin: 0; color: var(--vermelho); font-size: 12px; overflow-wrap: anywhere; }
.fabrica-corpo { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 14px; align-items: start; }
.fabrica-conversa, .filme-aberto { background: var(--s1); border-radius: var(--raio); padding: 14px 16px; min-width: 0; }

.filme-aberto header .mono { color: var(--ink-3); font-size: 12px; }
.filme-noticia { margin: 0; color: var(--ink-2); font-size: 13px; }
.filme-aberto .abas { margin-bottom: 12px; }
.parte-do-filme p { margin: 0; padding: 18px 4px; color: var(--ink-2); font-size: 14px; line-height: 1.5; max-width: 62ch; }


.estilos { display: grid; gap: 16px; }
.estilos .vazio-ala .mono { color: var(--ink); overflow-wrap: anywhere; }
.familia-estilos { padding-bottom: 16px; }
.grade-estilos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.estilo { display: flex; flex-direction: column; min-width: 0; border-radius: 12px; background: var(--s2); overflow: hidden; transition: background 0.2s var(--ease); }
.estilo:hover { background: var(--s3); }
.estilo[aria-current] { background: color-mix(in oklab, var(--magenta) 10%, var(--s2)); }
.estilo-previa { display: block; position: relative; aspect-ratio: 16 / 9; padding: 0; border: 0; background: #000; cursor: pointer; }

.estilo-info { display: grid; gap: 6px; padding: 10px 12px 12px; flex: 1; align-content: start; }

.categoria-biblioteca { display: grid; gap: 10px; }

.aviso {

  padding: 14px 16px; border-radius: 12px; margin-bottom: 22px;

.tubo {
  --pa: #ff8a3d; --pb: #4a1a08; --pc: #ffe6d2; 
  --alt: 18px;
  display: grid; gap: 7px; min-width: 0;
}
.tubo[data-rodando='true'] { --pa: #ffb020; --pb: #7a2a06; --pc: #fff1cf; }
.tubo[data-fino='true'] { --alt: 8px; }
.tubo-vidro {
  position: relative; height: var(--alt); border-radius: 999px; overflow: hidden;
  background:
    linear-gradient(180deg, rgba(233, 236, 244, 0.07), transparent 45%, rgba(0, 0, 0, 0.4)),
    color-mix(in oklab, var(--pb) 22%, var(--bg));
  box-shadow: inset 0 1px 0 rgba(233, 236, 244, 0.06), inset 0 -2px 5px rgba(0, 0, 0, 0.55);
}
.tubo-plasma {
  position: absolute; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 4px) * var(--pct) / 100);
  min-width: calc(var(--alt) - 4px);
  border-radius: 999px; overflow: hidden;
  background: linear-gradient(180deg, var(--pc) -30%, var(--pa) 34%, var(--pb) 115%);
  animation: enche 1.6s var(--ease) both;
  transition: filter 1s var(--ease);
}
.tubo[data-fino='true'] .tubo-plasma { top: 1px; bottom: 1px; left: 1px; width: calc((100% - 2px) * var(--pct) / 100); }
.tubo-nebulosa {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 40%, color-mix(in oklab, var(--pc) 70%, transparent) 0 0.6px, transparent 1.2px) 0 0 / 29px 11px,
    radial-gradient(circle at 70% 75%, color-mix(in oklab, var(--pc) 45%, transparent) 0 0.5px, transparent 1.1px) 0 0 / 43px 13px,
    radial-gradient(38% 130% at 22% 42%, color-mix(in oklab, var(--pc) 55%, transparent), transparent 72%) 0 0 / 180px 100%,
    radial-gradient(30% 150% at 62% 72%, color-mix(in oklab, var(--pb) 90%, transparent), transparent 72%) 0 0 / 240px 100%,
    radial-gradient(34% 120% at 86% 28%, color-mix(in oklab, var(--pa) 70%, var(--pc)), transparent 70%) 0 0 / 140px 100%;
  background-repeat: repeat;
  opacity: 0.9;
  animation: deriva 16s linear infinite;
}

.tubo-plasma::after {
  content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 12px;
  background: radial-gradient(closest-side, var(--pc), transparent);
  animation: menisco 2.6s ease-in-out infinite alternate;
}
.tubo-reflexo {
  position: absolute; left: 7px; right: 7px; top: 2px; height: 32%;
  border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0));
}
.tubo[data-fino='true'] .tubo-reflexo { left: 3px; right: 3px; top: 1px; height: 30%; }
.tubo[data-rodando='true'] .tubo-nebulosa { animation-duration: 3.5s; }
.tubo[data-rodando='true'] .tubo-plasma::after { animation-duration: 0.7s; }

.tubo[data-frio='true'] .tubo-plasma { filter: saturate(0.3) brightness(0.72); }
.tubo[data-frio='true'] .tubo-nebulosa { animation-duration: 48s; }
.tubo-marcas { display: grid; padding: 0 2px; height: 6px; align-items: start; }
.tubo-marcas i { justify-self: center; width: 1px; height: 4px; background: color-mix(in oklab, var(--ink-3) 40%, transparent); }
.tubo-marcas i[data-acesa='true'] { height: 6px; width: 1.5px; background: color-mix(in oklab, var(--pa) 80%, var(--ink)); }
.tubo[data-frio='true'] .tubo-marcas i[data-acesa='true'] { background: var(--ink-3); }

@keyframes enche { from { clip-path: inset(0 100% 0 0 round 999px); } to { clip-path: inset(0 0 0 0 round 999px); } }
@keyframes deriva { to { background-position: 58px 0, -43px 0, 180px 0, -240px 0, 280px 0; } }
@keyframes menisco { from { opacity: 0.55; } to { opacity: 1; } }

<script type="application/json" id="dados">{"adrs": [{"amended_by": null, "amends": null, "body_md": "> **Substitu\u00edda pelo [ADR-0002](0002-consolidacao-contrato-unico.md) (2026-06-29):** a decis\u00e3o de dois contratos foi revista; tudo passou a um contrato \u00fanico de Servi\u00e7os Cont\u00ednuos, com a Ana como Entreg\u00e1vel.\n\nOs servi\u00e7os da VITTA TECH para o cliente de sa\u00fade foram divididos em **dois contratos aut\u00f4nomos**, o **Contrato de Servi\u00e7os Cont\u00ednuos** (App de Reuni\u00f5es, Site e sua gest\u00e3o) e o **Contrato Ana** (agentes de IA conversacional), em vez de um contrato \u00fanico (\"Patamares\") ou de um guarda-chuva com anexos de escopo. O **Anexo de Prote\u00e7\u00e3o de Dados (DPA/LGPD)**, pe\u00e7a mais pesada e id\u00eantica nos dois, \u00e9 um documento \u00fanico, assinado uma vez e referenciado por ambos. Cada contrato nasce com seu valor (Servi\u00e7os Cont\u00ednuos R$ 5.000, Ana R$ 0) e cresce pela soma dos **Anexos de Entreg\u00e1vel** aceitos.\n\n## Op\u00e7\u00f5es consideradas\n\n- **Contrato \u00fanico (status quo):** modelo de \"Patamares\" de 5k a 9k. Acoplava tudo: a Ana (frente incerta, dependente de homologa\u00e7\u00e3o da API MV e da pol\u00edtica da Meta para WhatsApp) n\u00e3o podia ser pausada sem mexer na receita firme do App de Reuni\u00f5es.\n- **Guarda-chuva + anexos de escopo (MSA + SOWs):** mais enxuto no total, mas \u00e9 juridicamente um \u00fanico instrumento; conflita com o objetivo de ter dois contratos separ\u00e1veis e acopla as duas frentes.\n- **Dois contratos 100% completos:** cada um com seu pr\u00f3prio DPA; duplica cerca de 70% do texto jur\u00eddico e dobra o custo de revis\u00e3o por advogado.\n\n## Consequ\u00eancias\n\n- A Ana pode ser pausada ou encerrada sem afetar os R$ 5.000/m\u00eas dos Servi\u00e7os Cont\u00ednuos.\n- Novos agentes da fam\u00edlia Ana (ex.: **Retell**, voz por liga\u00e7\u00e3o) entram como **Anexo de Entreg\u00e1vel** do Contrato Ana, sem contrato novo. Por isso o **objeto do Contrato Ana \u00e9 redigido de forma ampla** (\"agentes de IA conversacional\"), n\u00e3o restrito ao agente atual.\n- O DPA \u00e9 redigido como documento standalone, com um \u00fanico ponto de atualiza\u00e7\u00e3o quando entra novo subprocessador (ex.: Retell).\n- Cl\u00e1usulas gerais menores (PI, sigilo, limita\u00e7\u00e3o de responsabilidade) ainda aparecem nos dois contratos, em forma condensada.", "cita": [], "decisao": "Os servi\u00e7os da VITTA TECH para o cliente de sa\u00fade foram divididos em **dois contratos aut\u00f4nomos**, o **Contrato de Servi\u00e7os Cont\u00ednuos** (App de Reuni\u00f5es, Site e sua gest\u00e3o) e o **Contrato Ana** (agentes de IA conversacional), em vez de um...", "emenda": [], "emendada_por": [], "file": "docs/adr/0001-arquitetura-dois-contratos.md", "number": 1, "slug": "0001-arquitetura-dois-contratos", "status": "superseded", "substitui": [], "substituida_por": [2], "superseded_by": "0002", "supersedes": null, "title": "Dois contratos aut\u00f4nomos com Anexo de Prote\u00e7\u00e3o de Dados (DPA) compartilhado"}, {"amended_by": null, "amends": null, "body_md": "A divis\u00e3o em **dois contratos aut\u00f4nomos** decidida no ADR-0001 (Servi\u00e7os Cont\u00ednuos + Contrato Ana, com DPA compartilhado) foi **revista**. Os servi\u00e7os para o cliente de sa\u00fade passam a viver em **um \u00fanico Contrato de Servi\u00e7os Cont\u00ednuos**, cuja mensalidade \u00e9 a **soma dos Entreg\u00e1veis aceitos e em opera\u00e7\u00e3o**: Aplicativo do hospital (R$ 5.000), Site e Central de Comando (+R$ 1.000), Ana no WhatsApp (+R$ 2.000) e Meta de desempenho da Ana (+R$ 1.000), at\u00e9 R$ 9.000/m\u00eas. A Ana deixa de ser contrato separado e passa a ser um conjunto de Entreg\u00e1veis.\n\n## Contexto\n\nO ADR-0001 separou a Ana para que ela pudesse ser pausada sem afetar a receita firme do Aplicativo do hospital. Na pr\u00e1tica, o **modelo de soma de Entreg\u00e1veis** (Cl\u00e1usula 3 mais Termo de Entreg\u00e1vel) j\u00e1 entrega esse isolamento: cada entrega s\u00f3 passa a incidir quando aceita e em opera\u00e7\u00e3o, e pode ser ligada ou desligada por Termo de Entreg\u00e1vel, sem mexer no restante. O custo de manter dois instrumentos (duas assinaturas, dois faturamentos, cl\u00e1usulas gerais duplicadas) deixou de se justificar para um \u00fanico cliente.\n\n## Op\u00e7\u00f5es consideradas\n\n- **Dois contratos (ADR-0001):** isolamento jur\u00eddico maior, por\u00e9m duas assinaturas, dois faturamentos e duplica\u00e7\u00e3o das cl\u00e1usulas gerais, para um s\u00f3 cliente.\n- **Um contrato \u00fanico com Entreg\u00e1veis modulares (escolhida):** uma assinatura, um faturamento e a flexibilidade de ligar ou desligar entregas via Termo de Entreg\u00e1vel. A escada de valor (R$ 5k at\u00e9 9k) comunica a evolu\u00e7\u00e3o ao cliente num \u00fanico documento, aumentando a percep\u00e7\u00e3o de valor.\n\n## Consequ\u00eancias\n\n- A Ana \u00e9 Entreg\u00e1vel do Contrato de Servi\u00e7os Cont\u00ednuos, n\u00e3o contrato pr\u00f3prio. Novos agentes (ex.: Retell) entram como novos Anexos de Entreg\u00e1vel do mesmo contrato.\n- A LGPD fica condensada na Cl\u00e1usula 8 do contrato; um DPA standalone mais detalhado \u00e9 op\u00e7\u00e3o para quando a Ana entrar em opera\u00e7\u00e3o com dados sens\u00edveis de sa\u00fade.\n- O conceito de \"Contrato Ana\" e a estrutura de dois contratos saem do vocabul\u00e1rio (ver CONTEXT.md).\n- Preserva-se o que o ADR-0001 trouxe de bom: objeto amplo, Termo de Entreg\u00e1vel que dispensa aditivo, e a possibilidade de pausar a Ana (agora encerrando o Entreg\u00e1vel, n\u00e3o o contrato).", "cita": [], "decisao": "A divis\u00e3o em **dois contratos aut\u00f4nomos** decidida no ADR-0001 (Servi\u00e7os Cont\u00ednuos + Contrato Ana, com DPA compartilhado) foi **revista**. Os servi\u00e7os para o cliente de sa\u00fade passam a viver em **um \u00fanico Contrato de Servi\u00e7os Cont\u00ednuos**...", "emenda": [], "emendada_por": [], "file": "docs/adr/0002-consolidacao-contrato-unico.md", "number": 2, "slug": "0002-consolidacao-contrato-unico", "status": "accepted", "substitui": [1], "substituida_por": [], "superseded_by": null, "supersedes": "0001", "title": "Consolida\u00e7\u00e3o em um contrato \u00fanico de Servi\u00e7os Cont\u00ednuos"}, {"amended_by": null, "amends": null, "body_md": "A base de conhecimento da Ana (valores particulares, diferenciais, conv\u00eanios, estimativas de cirurgia; hoje 4 tools `googleSheetsTool` lendo a planilha `Base_Ana_HospitalSaoMatheus_CONSOLIDADA`) **permanece edit\u00e1vel como planilha, mas sai da rota cr\u00edtica de runtime na fase MV**. O padr\u00e3o adotado: um workflow agendado no n8n sincroniza as 4 abas para 4 tabelas no Postgres que j\u00e1 existe no stack (Coolify), e as 4 tools viram `postgresTool` com busca filtrada (`unaccent` + `ILIKE` via `$fromAI`, com fallback para dump completo quando o filtro n\u00e3o casar). Na fase Central de Comando, o CRUD da Central substitui o Sheets como superf\u00edcie de edi\u00e7\u00e3o, apontando para as mesmas tabelas, e o sync \u00e9 desligado. Plano B permanente se a Central atrasar: NocoDB self-hosted projetando UI de planilha sobre o mesmo Postgres.\n\n## Contexto\n\n- Requisito duro do cliente: algu\u00e9m do hospital, n\u00e3o t\u00e9cnico, edita valores/diferenciais/conv\u00eanios como se fosse planilha.\n- As 4 tools est\u00e3o em typeVersion 4.7 e retornam TODAS as linhas que casam com o filtro (confirmado no c\u00f3digo-fonte do node: a doc diz \"first match\", mas isso vale s\u00f3 para vers\u00f5es < 4.5). Get_Cirurgias e Get_Convenios n\u00e3o t\u00eam filtro nenhum e retornam a aba crua. O padr\u00e3o dump-tudo se confirma para as 4 tools.\n- Quota do Google Sheets API (fonte oficial, p\u00e1gina de 29/mai/2026): 300 leituras/min por projeto, 60/min por usu\u00e1rio. Como o n8n usa uma \u00fanica credencial Google, o teto efetivo da Ana \u00e9 60/min (elev\u00e1vel sob pedido). No volume estimado (volume real a medir; faixa de trabalho 2 a 35 mil conversas/m\u00eas com 1 a 2 tool calls cada), a m\u00e9dia fica em ~1 a 4 leituras/min com picos de 15 a 20/min: **quota n\u00e3o \u00e9 o risco dominante hoje**.\n- Os riscos reais do Sheets na rota cr\u00edtica: lat\u00eancia por chamada (0,5 a 3s em relatos de comunidade, contra <10ms num SELECT local; sem benchmark oficial), timeouts/429 espor\u00e1dicos virando resposta degradada, e a cobran\u00e7a de excedente de quota que o Google anunciou para \"later in 2026\" (sem tabela de pre\u00e7o publicada at\u00e9 03/jul/2026).\n- Custo de tokens do dump-tudo: o input do gpt-5.2 custa US$ 1,75/M tokens (confirmado no OpenRouter e no pre\u00e7o padr\u00e3o da OpenAI; US$ 0,875 \u00e9 o pre\u00e7o da Batch API, inaplic\u00e1vel a chat em tempo real). Com abas de ~100 linhas (~6k tokens/dump) e 70 mil chamadas/m\u00eas, o dump-tudo custaria ~US$ 735 a 1.470/m\u00eas s\u00f3 de input. Medir o tamanho real das abas \u00e9 a medi\u00e7\u00e3o n\u00famero 1.\n- O Postgres j\u00e1 \u00e9 \u00f3rg\u00e3o vital do stack (mem\u00f3ria, fila, lock, log de tool calls: 15+ n\u00f3s no `Ana.json`). Migrar o runtime para ele n\u00e3o adiciona pe\u00e7a nova de infraestrutura, e o node Postgres do n8n funciona como AI tool (Select/Execute Query com `$fromAI`), confirmado na doc oficial.\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Edi\u00e7\u00e3o p/ leigo | Runtime | Custo | Veredito |\n|---|---|---|---|---|\n| Sheets puro (atual) | \u00d3tima | 0,5-3s, Google na rota cr\u00edtica, excedente cobrado em 2026 | zero hoje | OK agora; ruim no crescimento |\n| **Sheets \u2192 sync \u2192 Postgres** | \u00d3tima (continua na planilha) | <10ms, local | zero | **Escolhida (fase MV)** |\n| **Postgres + Central de Comando** | Boa (CRUD sob medida, com auditoria) | <10ms | dentro do Entreg\u00e1vel do Site | **Alvo final (fase Central)** |\n| NocoDB sobre o Postgres | Muito boa (planilha real; Postgres/MySQL no core OSS; SQL Server e Oracle s\u00e3o Enterprise) | <10ms | zero licen\u00e7a, 1 container | Plano B se a Central atrasar |\n| Supabase | Boa (Table Editor, mas UI de admin de banco) | baixa | Free pausa ap\u00f3s 1 semana de inatividade; Pro US$ 25/m\u00eas | Descartada: segundo Postgres redundante |\n| Baserow | Muito boa | baixa | zero licen\u00e7a, ~2GB RAM | Descartada: n\u00e3o projeta UI sobre Postgres existente (desde a 1.29 h\u00e1 data sync com PostgreSQL, mas \u00e9 c\u00f3pia, n\u00e3o proje\u00e7\u00e3o; viraria segunda fonte de verdade) |\n| Airtable | Excelente | m\u00e9dia (SaaS) | US$ 20/usu\u00e1rio/m\u00eas | Descartada: custo + pre\u00e7os hospitalares fora do stack |\n| n8n Data Tables | P\u00e9ssima (editor do n8n) | baixa | zero | Descartada como UI |\n| RAG vetorial/embeddings | n/a | n/a | n/a | Descartado: fuzzy matching onde se exige exatid\u00e3o de pre\u00e7o; o \"RAG\" correto para tabela \u00e9 SQL filtrado |\n\n## Plano em fases\n\n- **Fase 0 (agora, junto do hotfix):** n\u00e3o migrar nada. Ativar Retry on Fail nos 4 n\u00f3s; adicionar filtro `Ativo = S` em Get_Cirurgias/Get_Convenios se as abas tiverem a coluna; medir tamanho das abas (linhas/tokens por dump), dura\u00e7\u00e3o dos n\u00f3s de Sheets nos logs e tool calls por conversa.\n- **Fase MV (1 a 2 dias, junto da integra\u00e7\u00e3o de agendamento):** 4 tabelas no Postgres + workflow de sync agendado (TTL 10 min, upsert; bot\u00e3o \"sincronizar agora\" opcional via n8n Form) + trocar as tools para `postgresTool` com `unaccent + ILIKE` e regra de fallback no prompt (resultado vazio \u2192 repetir sem filtro antes de negar disponibilidade). O hospital continua editando a mesma planilha.\n- **Fase Central:** CRUD das 4 tabelas na Central de Comando (frente Lucas/Rib); desligar o sync; Sheets vira backup. A Ana n\u00e3o muda nada (j\u00e1 l\u00ea do Postgres). Pr\u00e9-requisito t\u00e9cnico: a fase MV conclu\u00edda, sen\u00e3o a Central teria que escrever no Sheets via API do Google (pior dos mundos).\n\n## Consequ\u00eancias\n\n- O requisito de edi\u00e7\u00e3o leiga \u00e9 preservado em todas as fases (planilha \u2192 planilha \u2192 CRUD da Central), com zero treinamento na transi\u00e7\u00e3o da fase MV.\n- O runtime da Ana nunca fica acoplado ao cronograma da frente do site: se a Central atrasar, o sync continua; se atrasar demais, NocoDB entra como ponte.\n- Trade-offs assumidos: staleness de at\u00e9 10 min entre edi\u00e7\u00e3o e Ana (aceit\u00e1vel para pre\u00e7os; o bot\u00e3o de sync cobre corre\u00e7\u00e3o urgente); risco de falso negativo do filtro que n\u00e3o casa (mitigado por normaliza\u00e7\u00e3o + fallback dump + monitoramento dos logs de tool call).\n- Gatilhos que antecipam a fase MV da base mesmo sem a integra\u00e7\u00e3o de agendamento: alguma aba passar de ~200-300 linhas (~10k tokens/dump); custo mensal de input atribu\u00edvel aos dumps passar de ~US$ 100-200; caso observado de pre\u00e7o/conv\u00eanio trocado entre linhas.\n\n## Fontes principais (acesso 03/jul/2026)\n\ndevelopers.google.com/workspace/sheets/api/limits (quotas; cobran\u00e7a de excedente \"later in 2026\"; p\u00e1gina de 29/mai/2026) \u00b7 docs.n8n.io (node Postgres como AI tool; `$fromAI`; Data Tables) \u00b7 github.com/n8n-io/n8n `readOperation.ts` (default de filtro v4.5+) \u00b7 nocodb.com/docs (external data source: Postgres/MySQL no OSS) \u00b7 baserow.io (data sync PostgreSQL desde 1.29) \u00b7 supabase.com/pricing (Free pausa em 1 semana) \u00b7 airtable.com/pricing (Team US$ 20/usu\u00e1rio/m\u00eas) \u00b7 openrouter.ai/openai/gpt-5.2 + pricing OpenAI (US$ 1,75/M input, 400k contexto).", "cita": [], "decisao": "A base de conhecimento da Ana (valores particulares, diferenciais, conv\u00eanios, estimativas de cirurgia; hoje 4 tools `googleSheetsTool` lendo a planilha `Base_Ana_HospitalSaoMatheus_CONSOLIDADA`) **permanece edit\u00e1vel como planilha, mas sai...", "emenda": [], "emendada_por": [], "file": "docs/adr/0003-base-de-conhecimento.md", "number": 3, "slug": "0003-base-de-conhecimento", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Base de conhecimento da Ana: Sheets como UI de edi\u00e7\u00e3o, Postgres como runtime"}, {"amended_by": null, "amends": null, "body_md": "Todo o conhecimento operacional do ecossistema MV/Global Health se concentra num \u00fanico lugar: o **Playground GH** (`ana/api-mv/playground/`, servido por `server.py` em `localhost:8777`), que deixa de ser uma p\u00e1gina s\u00f3 e vira um **portal local completo, com v\u00e1rias p\u00e1ginas**: a bancada da API (o `index.html` atual), o roteiro por endpoint (passo a passo com dados mocados + query de confer\u00eancia para o DBeaver), as p\u00e1ginas do **Atlas do banco de produ\u00e7\u00e3o** (modelo real, dom\u00ednios, volumes, cruzamento com a API) e a se\u00e7\u00e3o de **insights de diretoria e novos fluxos**. A ideia anterior de um atlas em arquivo separado (decidida e revertida no mesmo grilling de 22/jul/2026, por pedido do Pedro) morre aqui: um s\u00f3 localhost, cheio de p\u00e1ginas.\n\nA fronteira de ambientes, que antes seria por ferramenta, passa a ser garantida por tr\u00eas regras:\n\n1. **Chamada ao vivo, s\u00f3 homologa\u00e7\u00e3o.** O `server.py` continua falando apenas com a API GH de homolog e com o Oracle TST (somente SELECT). Nenhuma rota chama produ\u00e7\u00e3o, nunca.\n2. **Produ\u00e7\u00e3o entra s\u00f3 como conhecimento est\u00e1tico.** As p\u00e1ginas do atlas s\u00e3o alimentadas pelos CSVs que o Pedro deposita em `ana/api-mv/absorcao-producao/resultados/` depois de rodar o pacote manualmente no DBeaver da produ\u00e7\u00e3o (\u00fanica via permitida). O servidor exp\u00f5e essa pasta em leitura para as p\u00e1ginas; a subpasta `amostras/` (dado pessoal, fora do git) nunca \u00e9 servida nem renderizada.\n3. **Cada p\u00e1gina declara seu ambiente.** P\u00e1ginas de homolog/TST e p\u00e1ginas de retrato da produ\u00e7\u00e3o s\u00e3o rotuladas de forma vis\u00edvel, para nunca se confundir o que \u00e9 bancada de teste com o que \u00e9 fato da opera\u00e7\u00e3o real.\n\n## Contexto\n\n- Pol\u00edtica de acesso vigente (07/jul/2026): homolog = leitura direta pela sess\u00e3o; produ\u00e7\u00e3o = s\u00f3 o Pedro, manualmente, no DBeaver, credencial nunca no `.env`. Desde 13/jul a rede da VPN n\u00e3o alcan\u00e7a nem a TST da sess\u00e3o, ent\u00e3o \"queries prontas + Pedro executa\" \u00e9 o \u00fanico caminho para qualquer banco.\n- Nem Pedro nem o TI sabem como o MV funciona de verdade em produ\u00e7\u00e3o (tabelas relevantes, rela\u00e7\u00f5es, dom\u00ednios, como a API GH toca o banco). O ciclo C7 (montar o pacote e o portal) \u2192 C8 (rodar na produ\u00e7\u00e3o) \u2192 C9 (absorver nos CSVs e preencher o atlas) ataca isso.\n- O Pedro quer uma mesa \u00fanica: manter atlas e playground como artefatos separados criaria duas portas para o mesmo assunto.\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Veredito |\n|---|---|\n| Atlas em HTML separado (duplo clique) + playground intocado | Revertida pelo Pedro no pr\u00f3prio grilling: queria um localhost \u00fanico e completo |\n| Tudo dentro do `index.html` atual (uma p\u00e1gina gigante) | Descartada: o arquivo j\u00e1 tem ~1.900 linhas; p\u00e1ginas separadas com navega\u00e7\u00e3o comum escalam melhor |\n| **Portal multi-p\u00e1gina no mesmo servidor local** | **Escolhida**: um endere\u00e7o s\u00f3 (`localhost:8777`), navega\u00e7\u00e3o comum, fronteira por p\u00e1gina e por regra de chamada** |\n\n## Consequ\u00eancias\n\n- Futuras sess\u00f5es sabem onde escrever cada achado: comportamento da API homolog e confer\u00eancias TST v\u00e3o para a bancada e o roteiro; qualquer fato sobre produ\u00e7\u00e3o vai para as p\u00e1ginas do atlas e para `absorcao-producao/`.\n- Regra de dados por camada: resultado commit\u00e1vel (cat\u00e1logo, contagens, dom\u00ednios) n\u00e3o carrega dado pessoal; amostras completas ficam em `absorcao-producao/resultados/amostras/`, fora do git e fora do servidor.\n- O `server.py` ganha duas responsabilidades novas e pequenas (servir p\u00e1ginas est\u00e1ticas do diret\u00f3rio do playground e os CSVs commit\u00e1veis da absor\u00e7\u00e3o), sem mudar as regras de seguran\u00e7a existentes (token fora do navegador, SELECT-only, homolog-only).\n- Quando os CSVs do C8 chegam, as p\u00e1ginas do atlas passam de \"hip\u00f3tese\" a \"evid\u00eancia\" sem reescrever o portal: elas leem os arquivos depositados.", "cita": [], "decisao": "Todo o conhecimento operacional do ecossistema MV/Global Health se concentra num \u00fanico lugar: o **Playground GH** (`ana/api-mv/playground/`, servido por `server.py` em `localhost:8777`), que deixa de ser uma p\u00e1gina s\u00f3 e vira um **portal...", "emenda": [], "emendada_por": [], "file": "docs/adr/0004-fronteira-playground-atlas.md", "number": 4, "slug": "0004-fronteira-playground-atlas", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Playground vira portal \u00fanico multi-p\u00e1gina; fronteira de ambientes passa a ser por p\u00e1gina"}, {"amended_by": null, "amends": null, "body_md": "A Ana deixa de ser um conjunto de workflows n8n e passa a viver na plataforma **fazer.ai agents** (tenant `vitta-tech`, agente id 1), que concentra prompt, ferramentas nativas (kanban, tags, handoff, notas), base de conhecimento e o v\u00ednculo com as inboxes do Chatwoot. Os workflows \"Ana\" e \"Desliga Ana\" do n8n foram desativados em 30/jul/2026 (os subworkflows ficam inertes sem o fluxo principal); o export completo permanece em `ana/workflows/` como acervo e rota de retorno de emerg\u00eancia.\n\nJunto com a troca de plataforma, o roadmap foi **reconstitu\u00eddo ao est\u00e1gio inicial**: o anterior (trilhas A a G, grafo de depend\u00eancias, trilho da receita) foi arquivado intacto em `roadmap/arquivo/`, e o novo mostra s\u00f3 o est\u00e1gio de **testes de viabilidade sem Global Health** (s\u00e9rie V) mais o bloco Pendente (GH1: sess\u00e3o de desenho de valor das APIs GH; OV1: protocolo da ouvidoria).\n\n## Contexto\n\n- O onboarding do fazer.ai agents foi conclu\u00eddo em 29/jul/2026 com E2E aprovado: o SOP do n8n foi traduzido para a plataforma, e o bot do Telegram (SaoMatheusBot) ficou vinculado ao agente novo via Chatwoot.\n- Com n8n e fazer.ai agents ligados ao mesmo bot, qualquer teste ficava amb\u00edguo (quem respondeu?) e havia risco de resposta dupla.\n- O roadmap antigo cresceu em torno da integra\u00e7\u00e3o MV/Global Health, que est\u00e1 parada em depend\u00eancias externas; o Pedro pediu um recome\u00e7o enxuto (\"est\u00e1gio muito inicial, com o que a gente j\u00e1 tem\"), com a GH como pendente expl\u00edcito.\n- Decis\u00f5es do grilling de 30/jul/2026 registradas no CONTEXT.md: modelo `gpt-5-mini` para os testes, planilha lida ao vivo via tools HTTP em abas publicadas (nunca a `6_Ouvidoria_Log`), crit\u00e9rio de pronto = Roteiro de cen\u00e1rios.\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Veredito |\n|---|---|\n| Continuar no n8n e evoluir l\u00e1 | Descartada: a migra\u00e7\u00e3o para a plataforma j\u00e1 estava feita e aprovada; manter dois c\u00e9rebros duplica manuten\u00e7\u00e3o |\n| Rodar n8n e fazer.ai agents em paralelo (transi\u00e7\u00e3o longa) | Descartada: mesmo bot, respostas amb\u00edguas, testes inv\u00e1lidos |\n| **fazer.ai agents como \u00fanico c\u00e9rebro, n8n desativado** | **Escolhida**: um c\u00e9rebro s\u00f3, observabilidade nativa (Chatwoot + Langfuse), retorno poss\u00edvel em minutos religando os workflows |\n\n## Consequ\u00eancias\n\n- A \"vis\u00e3o\" dos testes passa a ser: conversas no Chatwoot (`chatwoot.mala-ia.cloud`), racioc\u00ednio e custo por resposta no Langfuse (`langfuse.hospitalsaomatheus.cloud`).\n- As leituras da planilha do Google (a antiga `Get_Consultas`) precisam ser recriadas como tools HTTP na plataforma (tarefas V3/V4).\n- `ana/workflows/` congela como acervo do n8n: n\u00e3o h\u00e1 mais re-export a manter.\n- O roadmap anterior em `roadmap/arquivo/` guarda os textos prontos da Global Health e do analista de TI; a fase GH recome\u00e7a pela tarefa pendente GH1 (sess\u00e3o de desenho de valor), sem herdar a estrutura antiga.\n- `CLAUDE.md` e a skill `/check` passaram a descrever a nova estrutura (bloco `DADOS` do mapa, checagem da inst\u00e2ncia fazer.ai em vez do drift do n8n).", "cita": [], "decisao": "A Ana deixa de ser um conjunto de workflows n8n e passa a viver na plataforma **fazer.ai agents** (tenant `vitta-tech`, agente id 1), que concentra prompt, ferramentas nativas (kanban, tags, handoff, notas), base de conhecimento e o...", "emenda": [], "emendada_por": [], "file": "docs/adr/0005-ana-no-fazer-ai-agents.md", "number": 5, "slug": "0005-ana-no-fazer-ai-agents", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Ana roda no fazer.ai agents; n8n aposentado; roadmap reconstitu\u00eddo ao est\u00e1gio de viabilidade"}, {"amended_by": "0015", "amends": null, "body_md": "Os valores de consultas, exames, estimativas de cirurgias e a cobertura de conv\u00eanios que a Ana usa passam a morar num **NocoDB** rodando no Coolify da VPS (servi\u00e7o `nocodb-base-ana`, base \"Base Ana\", 4 tabelas). O usu\u00e1rio de neg\u00f3cio edita numa interface de planilha na web; a Ana l\u00ea por **tools HTTP sobre shared views p\u00fablicas somente leitura** (HTTPS com Let's Encrypt); a edi\u00e7\u00e3o vale na resposta seguinte, sem redeploy. O Google Sheets deixa de ser fonte: as planilhas originais viram legado (xlsx brutos, incluindo os logs com dado pessoal, guardados em `dados-locais/`, fora do git; snapshot sem dado pessoal em `ana/base-conhecimento/`).\n\n## Contexto\n\n- O plano original (grilling da manh\u00e3 de 30/jul/2026) era manter o Google Sheets e ler as 4 abas publicadas em CSV. Na execu\u00e7\u00e3o, dois atritos mataram a ideia: o fluxo de publica\u00e7\u00e3o/compartilhamento do Google \u00e9 cheio de passos manuais na conta dona, e o compartilhamento por link da planilha consolidada **exp\u00f4s a aba `6_Ouvidoria_Log` (nome + CPF de pacientes)**, incidente corrigido na hora restringindo a planilha.\n- O Pedro pediu alternativas em que ele deposita os dados e a sess\u00e3o faz o resto, com um requisito essencial: uma tela onde o usu\u00e1rio de neg\u00f3cio edite os dados no futuro, e a possibilidade de migrar para banco \"de verdade\" depois.\n- Medi\u00e7\u00e3o real da VPS (KVM 4, 16 GB): ~10,4 GB usados, ~5,7 GB livres; o container do NocoDB custa ~0,3 a 0,5 GB.\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Veredito |\n|---|---|\n| Google Sheets publicado em CSV (plano original) | Abandonada: fric\u00e7\u00e3o manual alta e risco LGPD demonstrado na pr\u00e1tica |\n| Supabase novo (gerenciado, gratuito) | Descartada: edi\u00e7\u00e3o de neg\u00f3cio cairia no Studio (ferramenta de dev) |\n| Tabelas no Supabase self-hosted do Hospital Reuni\u00f5es | Descartada: acopla a Ana ao banco de produ\u00e7\u00e3o de outro sistema |\n| M\u00f3dulo CRUD no app Hospital Reuni\u00f5es | Adiada: melhor destino final poss\u00edvel, mas \u00e9 projeto, n\u00e3o sandbox |\n| **NocoDB no Coolify** | **Escolhida**: sandbox imediato que j\u00e1 entrega a tela de edi\u00e7\u00e3o do neg\u00f3cio, API para a Ana e Postgres/export para migra\u00e7\u00e3o futura |\n\n## Consequ\u00eancias\n\n- A leitura da Ana n\u00e3o usa segredo nenhum: shared views s\u00e3o somente leitura por constru\u00e7\u00e3o e s\u00f3 existem para as 4 tabelas sem dado pessoal. Escrita exige login no NocoDB.\n- O executor HTTP do fazer.ai agents s\u00f3 aceita HTTPS; o servi\u00e7o ganhou router Traefik com certificado Let's Encrypt no dom\u00ednio sslip.io (labels custom no compose do servi\u00e7o). Um dom\u00ednio pr\u00f3prio (ex.: `dados.hospitalsaomatheus.cloud`, DNS na Cloudflare) fica como melhoria opcional.\n- O prompt do agente ganhou a se\u00e7\u00e3o \"Tabelas Oficiais\" com preced\u00eancia sobre a `search_knowledge` para valores e cobertura; a KB continua para o restante (lista geral de conv\u00eanios, institucional).\n- Os logs operacionais do n8n (Reclama\u00e7\u00f5es, Agendamentos Conv\u00eanio, Avalia\u00e7\u00f5es) N\u00c3O foram importados: na plataforma nova esses registros acontecem por outros mecanismos (ex.: ouvidoria via `private_note`); os arquivos ficam em `dados-locais/` como hist\u00f3rico.\n- Migra\u00e7\u00e3o futura \u00e9 export/import trivial (ou apontar o NocoDB para um Postgres), inclusive para dentro do app Hospital Reuni\u00f5es se um dia fizer sentido.", "cita": [], "decisao": "Os valores de consultas, exames, estimativas de cirurgias e a cobertura de conv\u00eanios que a Ana usa passam a morar num **NocoDB** rodando no Coolify da VPS (servi\u00e7o `nocodb-base-ana`, base \"Base Ana\", 4 tabelas). O usu\u00e1rio de neg\u00f3cio edita...", "emenda": [], "emendada_por": [15], "file": "docs/adr/0006-base-ana-nocodb.md", "number": 6, "slug": "0006-base-ana-nocodb", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A fonte de dados edit\u00e1vel da Ana sai do Google Sheets e vira NocoDB self-hosted (Base Ana)"}, {"amended_by": "0017, 0028", "amends": null, "body_md": "O portal local de `localhost:8777` deixa de ser \"o playground do mundo MV/GH\" e vira o **Ana OS**: o cockpit \u00fanico do Programa Ana, morando na pasta `os/` na raiz do repo, redesenhado por inteiro no estilo do `DESIGN.md` (refer\u00eancia Aaply: canvas cinza claro, amarelo el\u00e9trico, bot\u00f5es pill, cards arredondados, tema claro). Ele re\u00fane, numa navega\u00e7\u00e3o comum:\n\n- **Home/cockpit**: o roadmap (est\u00e1gio enxuto + Pendente + faixa nova de **Ideias**) e o painel de aplica\u00e7\u00f5es com links.\n- **Arquitetura**: diagrama vivo das conex\u00f5es (Telegram \u2192 Chatwoot \u2192 fazer.ai agents \u2192 NocoDB/Langfuse; futuro WhatsApp oficial), no estilo de fluxo com cards e setas que \u00e9 a assinatura do DESIGN.md.\n- **Mapa das APIs**: endpoints da GH agrupados por tema, cada um com selo de testabilidade derivado da din\u00e2mica dos bancos (leitura de cat\u00e1logo / escrita no SaaS GH, invis\u00edvel no Oracle / finaliza\u00e7\u00e3o, \u00fanico ponto com prova no banco).\n- **Playground GH** (bancada + roteiro), **Atlas**, **Absor\u00e7\u00e3o** e **Insights**: as p\u00e1ginas existentes, redesenhadas.\n- **Biblioteca**: os `.md` do repo renderizados no navegador a partir de allowlist expl\u00edcita.\n\nO `roadmap/mapa.html` (mesa de trabalho de duplo clique, reconstru\u00edda na manh\u00e3 do mesmo dia) **aposenta** para `roadmap/arquivo/` quando o OS entrar no ar. Os dados do roadmap saem de bloco embutido em HTML e passam a viver num **arquivo JSON versionado** dentro de `os/`; o server ganha **uma \u00fanica rota de escrita**, restrita a esse arquivo, para a UI criar/editar cards (a faixa de Ideias em particular). Todas as demais regras de seguran\u00e7a seguem intactas: proxy s\u00f3 para homolog GH, Oracle TST somente SELECT, `amostras/` e `dados-locais/` nunca servidos, produ\u00e7\u00e3o jamais.\n\nEsta decis\u00e3o **estende o ADR-0004** (a \"mesa \u00fanica\" passa a incluir o roadmap e a documenta\u00e7\u00e3o) e **supersede a decis\u00e3o do mapa.html de 30/jul/2026** (o duplo clique perde para o endere\u00e7o \u00fanico; o roadmap passa a exigir o `server.py` rodando).\n\n## Contexto\n\n- Grilling de 30/jul/2026 (noite): o Pedro quer uma \"central de front-ending\", um OS da Ana, com roadmap expansivo para ideias, o estudo das APIs organizado por tema (o que d\u00e1 e o que n\u00e3o d\u00e1 para testar, dado que s\u00f3 o Oracle TST \u00e9 consult\u00e1vel e o banco SaaS da GH \u00e9 inacess\u00edvel), documenta\u00e7\u00e3o naveg\u00e1vel e o visual do `DESIGN.md`.\n- J\u00e1 existiam duas mesas: o portal (6 p\u00e1ginas) e o mapa.html. Uma terceira central contradiria o pr\u00f3prio ADR-0004; a escolha foi fundir no portal, que j\u00e1 tem servidor com as regras de seguran\u00e7a prontas.\n- A organiza\u00e7\u00e3o tem\u00e1tica das APIs puxa a metade \"cat\u00e1logo e viabilidade\" da pendente GH1; a metade \"onde encaixar no fluxo da Ana\" segue Pendente para sess\u00e3o pr\u00f3pria.\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Veredito |\n|---|---|\n| Terceira central nova agregando links | Descartada: tr\u00eas portas para o mesmo assunto |\n| mapa.html cresce e absorve tudo (duplo clique) | Descartada: `file://` n\u00e3o chama API nem l\u00ea CSVs; o playground seguiria mundo \u00e0 parte |\n| **Portal evolui e vira o Ana OS** | **Escolhida** |\n| Redesign gradual (shell agora, p\u00e1ginas depois) | Recomendada pela sess\u00e3o, recusada pelo Pedro: ele quer o visual coeso de sa\u00edda |\n| OS 100% leitura (ideias s\u00f3 via sess\u00e3o) | Descartada: capturar ideia precisa ser gesto de segundos, sen\u00e3o o backlog morre |\n\n## Consequ\u00eancias\n\n- **Riscos assumidos**: o redesign completo de uma tacada reescreve p\u00e1ginas que funcionam (bancada, roteiro); exige teste de fuma\u00e7a por p\u00e1gina antes de aposentar as vers\u00f5es antigas. O roadmap deixa de abrir com duplo clique.\n- A regra do CLAUDE.md \"atualize os DOIS (TODO.md e mapa.html)\" passa a ser \"TODO.md e o JSON de dados do OS\"; o `/check` reconcilia os dois. Atualizar o CLAUDE.md faz parte da implanta\u00e7\u00e3o.\n- `ana/api-mv/` segue existindo (scripts, dicion\u00e1rio, absor\u00e7\u00e3o); s\u00f3 as p\u00e1ginas e o server migram para `os/`, com os caminhos de absor\u00e7\u00e3o e da allowlist de docs ajustados.\n- Tema claro apenas (o DESIGN.md \u00e9 light); o dark mode do mapa antigo n\u00e3o \u00e9 portado.\n- GH1 \u00e9 reformulada no Pendente: sobra a sess\u00e3o de desenho do fluxo; o cat\u00e1logo tem\u00e1tico vira p\u00e1gina do OS.", "cita": [], "decisao": "O portal local de `localhost:8777` deixa de ser \"o playground do mundo MV/GH\" e vira o **Ana OS**: o cockpit \u00fanico do Programa Ana, morando na pasta `os/` na raiz do repo, redesenhado por inteiro no estilo do `DESIGN.md` (refer\u00eancia Aaply...", "emenda": [], "emendada_por": [17, 28], "file": "docs/adr/0007-ana-os.md", "number": 7, "slug": "0007-ana-os", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Ana OS: o portal absorve o roadmap e vira o cockpit \u00fanico do programa"}, {"amended_by": "0031, 0034", "amends": null, "body_md": "O Ana OS troca de design system e ganha um mapa de execu\u00e7\u00e3o. Duas decis\u00f5es amarradas, tomadas no grilling de 31/jul/2026:\n\n1. **Visual novo, substitui\u00e7\u00e3o total.** O `os/DESIGN.md` (estilo Aaply: canvas cinza, amarelo el\u00e9trico, pills) \u00e9 reescrito a partir da refer\u00eancia refero.design depositada pelo Pedro: sidebar preta arredondada flutuante s\u00f3 de \u00edcones (com tooltip), canvas quase branco, cards brancos de raio grande, tipografia preta pesada, sparklines discretas, uma sombra s\u00f3. As **10 p\u00e1ginas** do OS s\u00e3o redesenhadas nesse sistema de uma vez (redesign gradual foi recusado de novo, como no ADR-0007). Tema claro \u00fanico. Fontes locais mantidas (Poppins + Inter).\n\n2. **Grafo de execu\u00e7\u00e3o em p\u00e1gina pr\u00f3pria.** Nasce a p\u00e1gina **Roadmap** do OS: um grafo SVG desenhado \u00e0 m\u00e3o (sem biblioteca externa), layout em colunas da esquerda para a direita (feitas \u2192 est\u00e1gio ativo \u2192 propostas \u2192 horizonte), n\u00f3s como cards, arestas com seta. Cada n\u00f3 **acion\u00e1vel** (tarefa `fazer`, pendente, proposta) tem um bot\u00e3o **copiar prompt**: texto pronto para colar no Claude Code, em pt-BR, passo a passo para leigo; tarefa manual do Pedro vira prompt \"me guie enquanto eu fa\u00e7o\". N\u00f3 feito aparece conclu\u00eddo, sem bot\u00e3o. Clique abre painel lateral com ficha e prompt vis\u00edvel. Anima\u00e7\u00f5es discretas: entrada em cascata, tra\u00e7o fluindo no caminho ativo, pulso na fronteira, bloqueada esmaecida com cadeado.\n\nA home segue a geometria da refer\u00eancia: fileira de indicadores no topo (feitas, fronteira, a fazer, propostas, pendentes, ideias), dois cards grandes de destaque (a fronteira atual e a pr\u00f3xima proposta destravada, ambos com copiar prompt), painel de aplica\u00e7\u00f5es e faixa de Ideias edit\u00e1vel como antes. **M\u00e9tricas sempre funcionais**: mensalidade, KPI e escada de valor continuam proibidos no roadmap visual.\n\n## O grafo reverte conscientemente o \"sem grafo\" do ADR-0007\n\nO CONTEXT.md dizia \"continua sem grafo de depend\u00eancias\" e o mapa.html com grafo foi aposentado. A revers\u00e3o \u00e9 consciente e o prop\u00f3sito \u00e9 outro: o mapa antigo era mesa de arrastar cards; o grafo novo \u00e9 **mapa de leitura e execu\u00e7\u00e3o**, alimentado pelo `roadmap.json`, cujo produto \u00e9 o prompt copi\u00e1vel de cada passo. Continua sem trilho da receita, sem criticidade derivada, sem kanban.\n\n## Camada de propostas\n\nOs passos futuros recomendados pelas sess\u00f5es (P1..P6 na cria\u00e7\u00e3o: demo do cat\u00e1logo GH ao diretor, VPN da TST, prova da finaliza\u00e7\u00e3o/GH-18, tools GH de identifica\u00e7\u00e3o, hor\u00e1rios livres na conversa, agendamento fim a fim em homolog) entram numa chave nova `propostas` do `roadmap.json`, com ID pr\u00f3prio, deps e prompt, renderizadas com visual distinto (tracejado). O \"desenho do fluxo GH\" n\u00e3o vira proposta duplicada: ele \u00e9 a pr\u00f3pria pendente GH1, que ganha posi\u00e7\u00e3o no grafo (deps V6 + P3 e prompt), sem mudar de natureza no TODO.md. **Proposta n\u00e3o entra no TODO.md**: vira tarefa (com ficha e \"pronto quando\") s\u00f3 quando o Pedro a puxa para o est\u00e1gio, no ritual normal dos dois arquivos. Alternativa recusada: criar as 7 como tarefas oficiais agora (incharia o est\u00e1gio, misturando compromisso com hip\u00f3tese; a fronteira real \u00e9 a V6).\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Veredito |\n|---|---|\n| Redesign gradual (home primeiro, resto depois) | Recusado: o Pedro quer o visual coeso de sa\u00edda, como no ADR-0007 |\n| Grafo dentro da home | Recusado: espremido, trai a geometria da refer\u00eancia; p\u00e1gina pr\u00f3pria |\n| Propostas como tarefas oficiais no TODO.md | Recusado: compromisso \u00e9 do Pedro, n\u00e3o da sess\u00e3o |\n| Prompts em arquivo separado do roadmap.json | Recusado: dois arquivos para sincronizar; campo `prompt` no n\u00f3 |\n| Prompt tamb\u00e9m nos n\u00f3s feitos (hist\u00f3rico) | Recusado: ru\u00eddo; bot\u00e3o s\u00f3 onde h\u00e1 a\u00e7\u00e3o |\n\n## Consequ\u00eancias\n\n- `os/DESIGN.md`, `tokens.css`, `os.css` e `nav.js` reescritos; as 10 p\u00e1ginas redesenhadas exigem **fuma\u00e7a por p\u00e1gina** de novo (rotas, allowlist, escrita do roadmap, visual), como no ADR-0007.\n- `roadmap.json` ganha as chaves `propostas` e o campo `prompt` nos n\u00f3s acion\u00e1veis; o `/check` deve **preservar** esses campos ao reconciliar com o TODO.md (propostas n\u00e3o t\u00eam espelho narrativo).\n- CLAUDE.md atualizado (descri\u00e7\u00e3o do espelho de dados inclui propostas).\n- Este ADR **supersede a parte visual do ADR-0007** (o Aaply deixa de ser a refer\u00eancia) e **revisa a decis\u00e3o \"sem grafo\"** registrada no mesmo ADR e no CONTEXT.md.\n- A imagem de refer\u00eancia sai da raiz do repo para `os/assets/referencia-refero.jpg`.\n- Nascem as tarefas OS6 (redesign) e OS7 (grafo) no est\u00e1gio.", "cita": [], "decisao": "O Ana OS troca de design system e ganha um mapa de execu\u00e7\u00e3o. Duas decis\u00f5es amarradas, tomadas no grilling de 31/jul/2026:", "emenda": [], "emendada_por": [31, 34], "file": "docs/adr/0008-redesign-cockpit-grafo.md", "number": 8, "slug": "0008-redesign-cockpit-grafo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Redesign do Ana OS (refer\u00eancia refero) e grafo de execu\u00e7\u00e3o com prompts copi\u00e1veis"}, {"amended_by": null, "amends": null, "body_md": "Fecha a metade restante da GH1 (a sess\u00e3o de desenho do fluxo). A decis\u00e3o: a Ana **n\u00e3o ganha 22 tools**, uma por endpoint da API GH. Ela ganha as **7 ferramentas de agenda que o SOP reescrito j\u00e1 define** (`docs/04-sop-ana-reescrito.md`): `Identificar_paciente`, `Buscar_disponibilidade`, `Pre_requisitos_agendamento`, `Gerenciar_anexos`, `Efetivar_agendamento`, `Listar_agendamentos`, `Remarcar_ou_cancelar`. Cada ferramenta encapsula a cadeia de endpoints GH correspondente; o modelo conversa na linguagem do SOP e a fachada fala HTTP com a homologa\u00e7\u00e3o.\n\nExecutada em modo aut\u00f4nomo por decis\u00e3o do Pedro (06/ago/2026): sem grilling, com as recomenda\u00e7\u00f5es de boa pr\u00e1tica registradas aqui para revis\u00e3o a posteriori.\n\n## Contexto\n\n- O cat\u00e1logo e a viabilidade dos endpoints j\u00e1 estavam resolvidos (Mapa das APIs, ADR-0007; p\u00e1gina Cadeias, 06/ago). Faltava o desenho: onde cada endpoint entra no fluxo de atendimento.\n- O SOP reescrito de `docs/04` (era n8n) j\u00e1 desenhou o fluxo inteiro em cima de 7 ferramentas compostas. O desenho continua v\u00e1lido na plataforma fazer.ai agents; o que muda \u00e9 o ve\u00edculo de implementa\u00e7\u00e3o.\n- Evid\u00eancia emp\u00edrica do V6: o `gpt-5-mini` re-chamou a mesma tool 13 vezes num cen\u00e1rio. Dar 22 endpoints crus a esse modelo multiplica loops, custo e erro de encadeamento. A fachada reduz a superf\u00edcie de decis\u00e3o do modelo.\n- Fatos de arquitetura (D\u00e1cilla/MV, 24/jul): a API roda sobre o banco SaaS da GH; s\u00f3 a finaliza\u00e7\u00e3o grava no Soul (Oracle). Isso define os gates: GH-19 (massa de homolog) trava a disponibilidade hoje; GH-18 (a homolog grava na TST?) \u00e9 o gate da finaliza\u00e7\u00e3o.\n\n## O mapa: ferramenta \u2192 endpoints \u2192 momento no fluxo\n\n| Ferramenta (SOP) | Endpoints GH encapsulados | Onde entra no fluxo |\n|---|---|---|\n| `Identificar_paciente` | `GET /pessoas` (por CPF e por telefone), `POST /pessoas` | Se\u00e7\u00f5es 2/3/5, passo de cadastro, ap\u00f3s coleta validada. Cadastro novo exige data de nascimento |\n| `Buscar_disponibilidade` | `GET /consultas` ou `GET /exames` \u2192 `GET /prestadores` \u2192 `GET /convenios` (+`/planos`, `/subPlanos` quando via conv\u00eanio) \u2192 `GET /agendas/v2` | Ap\u00f3s o paciente dizer o que quer e a via. Devolve a lista numerada do SOP |\n| (carteiras, dentro da via conv\u00eanio) | `GET /carteiras`, `POST /carteiras`, `DELETE /carteiras/{id}` | Se\u00e7\u00e3o 3, passo da carteirinha. `nrCarteira` \u00e9 obrigat\u00f3rio (achado de campo, 417) |\n| `Pre_requisitos_agendamento` | `GET /consultas/tipos` (consulta) ou `GET /exames/perguntas` + `GET /exames/instrucaoGeral` (exame) | Ap\u00f3s a escolha do hor\u00e1rio. `impedeRealizacao = S` aciona a Regra H\u00edbrida |\n| `Gerenciar_anexos` | `POST /anexos/agendamento` (consulta de exigidos), `POST /anexos/upload` | Quando o item exige anexo (pedido m\u00e9dico, carteirinha) |\n| `Efetivar_agendamento` | `POST /horarios/agendar` (+ `GET /horarios/{id}/instrucoes` no sucesso) | S\u00f3 ap\u00f3s confirma\u00e7\u00e3o expl\u00edcita. \u00c9 a finaliza\u00e7\u00e3o: o \u00fanico ponto que grava no Soul (GH-18) |\n| `Listar_agendamentos` | `GET /agendamentos`, `GET /agendamentos/{id}` | Se\u00e7\u00e3o 4.1 e a confer\u00eancia anti-duplicidade da Regra 17. `tipoAgendamento` em CAIXA ALTA (min\u00fasculo = 500) |\n| `Remarcar_ou_cancelar` | `POST /horarios/reagendar`, `DELETE /agendamentos/{id}` | Se\u00e7\u00f5es 4.2/4.3, com confirma\u00e7\u00e3o refor\u00e7ada. Tamb\u00e9m finaliza\u00e7\u00e3o |\n\nOs 22 endpoints do Mapa das APIs est\u00e3o cobertos; nenhum fica \u00f3rf\u00e3o e nenhuma ferramenta nova foi inventada al\u00e9m das que o SOP j\u00e1 usa.\n\n## Ve\u00edculo de implementa\u00e7\u00e3o (decidido por fase)\n\n| Fase | O qu\u00ea | Ve\u00edculo |\n|---|---|---|\n| P4 | `Identificar_paciente` (busca por CPF/telefone) | **Tools HTTP diretas** na plataforma, como as da Base Ana: a busca \u00e9 1 endpoint, n\u00e3o precisa de orquestra\u00e7\u00e3o. O `POST /pessoas` (cadastro) entra aqui com sanitiza\u00e7\u00e3o de nome |\n| P5 | `Buscar_disponibilidade` e `Pre_requisitos_agendamento` | **Proxy fino de orquestra\u00e7\u00e3o** (servi\u00e7o pequeno no Coolify da VPS), porque comp\u00f5em 3 a 4 chamadas encadeadas. As tools da plataforma apontam para o proxy, nunca para a GH direto |\n| P6 | `Efetivar_agendamento`, `Listar_agendamentos`, `Remarcar_ou_cancelar`, `Gerenciar_anexos` | Mesmo proxy. Gate: a Prova no banco (P3/GH-18) precisa confirmar que a finaliza\u00e7\u00e3o chega ao Oracle antes de a Ana prometer protocolo a paciente |\n\n## Regras transversais da fachada\n\n- **Segredo:** o token GH mora na credencial da tool/vault da plataforma (ou no ambiente do proxy), **nunca no prompt do agente**. Homologa\u00e7\u00e3o somente; produ\u00e7\u00e3o jamais entra nas ferramentas locais ou da plataforma.\n- **Sanitiza\u00e7\u00e3o de entrada:** nome sem n\u00fameros (a API recusa com 417), CPF reduzido a 11 d\u00edgitos, enums em CAIXA ALTA. A fachada corrige antes de chamar, em vez de confiar no modelo.\n- **Tradu\u00e7\u00e3o de erro:** o formato `{\"mensagens\":[{\"tipo\":\"ERROR\",\"descricao\":...}]}` (417) \u00e9 regra de neg\u00f3cio leg\u00edvel; a fachada devolve a `descricao` ao modelo para alimentar a Regra H\u00edbrida, sem vazar jarg\u00e3o HTTP ao paciente.\n- **Contrato de falha:** toda falha de ferramenta cai na Regra H\u00edbrida do SOP (fila certa + `Escalar_humano`), que j\u00e1 est\u00e1 desenhada; nada de retry cego (Regra 17: conferir com `Listar_agendamentos` antes de repetir).\n\n## Consequ\u00eancias\n\n- As propostas P4 \u2192 P5 \u2192 P6 do grafo s\u00e3o exatamente as fases deste desenho; nenhuma tarefa nova nasce da GH1. P3 (GH-18) deixa de bloquear o desenho e passa a ser gate s\u00f3 da P6, onde sempre foi decisiva.\n- O prompt do agente em produ\u00e7\u00e3o hoje (v4, est\u00e1gio de viabilidade) n\u00e3o muda agora: o SOP de `docs/04` \u00e9 o alvo para quando as tools de agenda entrarem (P4 em diante), adaptando os nomes \u00e0s tools reais da plataforma.\n- As etapas/tags novas do SOP (`FALHA AGENDAMENTO` e `FILA` separados por travess\u00e3o (U+2014) no nome da etapa, `agendado-bot`, `AGENDADO` autom\u00e1tico) esbarram no Congelamento do Chatwoot (06/jul): configurar junto com a entrada do canal principal, n\u00e3o antes.\n- A GH-19 continua sendo o desbloqueio pr\u00e1tico da P5: sem massa publicada, `Buscar_disponibilidade` devolve lista vazia. O desenho n\u00e3o espera por ela; a implementa\u00e7\u00e3o da P4 j\u00e1 pode come\u00e7ar.", "cita": [], "decisao": "Fecha a metade restante da GH1 (a sess\u00e3o de desenho do fluxo). A decis\u00e3o: a Ana **n\u00e3o ganha 22 tools**, uma por endpoint da API GH. Ela ganha as **7 ferramentas de agenda que o SOP reescrito j\u00e1 define** (`docs/04-sop-ana-reescrito.md`)...", "emenda": [], "emendada_por": [], "file": "docs/adr/0009-desenho-fluxo-gh.md", "number": 9, "slug": "0009-desenho-fluxo-gh", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A Ana fala com a Global Health por uma fachada de 7 ferramentas de agenda, n\u00e3o pelos 22 endpoints crus"}, {"amended_by": "0015, 0016", "amends": null, "body_md": "Fecha a pendente **OV1**. A Ana passa a informar ao paciente um n\u00famero de protocolo de ouvidoria no formato `ANO-NNNN` (ex.: `2026-0001`), gerado por uma tabela nova da Base Ana (`5_Ouvidoria_Protocolos`), gravada e lida por ferramentas HTTP da plataforma. O n\u00famero **nunca \u00e9 composto pelo modelo**: quem numera \u00e9 o banco (autoincremento) e quem formata \u00e9 uma coluna de f\u00f3rmula do pr\u00f3prio NocoDB. A tabela \u00e9 a \u00fanica da Base Ana que **n\u00e3o** ganha shared view p\u00fablica: ela \u00e9 lida com credencial, ao contr\u00e1rio das quatro tabelas de valores.\n\nExecutada em modo aut\u00f4nomo por decis\u00e3o do Pedro (06/ago/2026): a entrevista prevista no card virou decis\u00e3o da sess\u00e3o, com as escolhas de desenho marcadas para revis\u00e3o na se\u00e7\u00e3o final.\n\n## Contexto\n\n- O SOP em produ\u00e7\u00e3o pro\u00edbe a Ana de inventar protocolo (Regra Global \"nunca invente n\u00fameros... todo protocolo vem de ferramenta\"). Resultado pr\u00e1tico hoje: a Se\u00e7\u00e3o 7.3 do prompt tem o texto \"sua ocorr\u00eancia foi registrada com o protocolo [protocolo]\", mas **n\u00e3o existe ferramenta que produza esse n\u00famero**. A frente 3 (ouvidoria 24/7) roda sem protocolo.\n- O mecanismo antigo morreu na migra\u00e7\u00e3o do n8n. O subfluxo `Registrar_reclamacao` (`ana/workflows/Registrar_reclamacao.json`) recebia o `protocolo` como **entrada** e apenas anexava a linha na aba `6_Ouvidoria_Log` do Google Sheets, com `Nome_Solicitante`, `CPF_Solicitante`, `Nome_Paciente` e a descri\u00e7\u00e3o. Foi exatamente essa aba que vazou pelo compartilhamento por link e motivou o ADR-0006.\n- A tarefa com prazo de 5 dias \u00fateis e o alerta em D+4, que sustentavam operacionalmente a promessa do script (\"nossa equipe entrar\u00e1 em contato em at\u00e9 5 dias \u00fateis\"), tamb\u00e9m ficaram no n8n. Hoje nada mede o cumprimento do prazo.\n- A Base Ana (ADR-0006) funciona assim: as tools da Ana leem **shared views p\u00fablicas somente leitura**, sem segredo nenhum; qualquer escrita exige autentica\u00e7\u00e3o. Nenhuma tabela com dado de paciente entrou nessa base at\u00e9 agora, por decis\u00e3o do pr\u00f3prio ADR-0006.\n- O protocolo de **agendamento** (num\u00e9rico, devolvido pela Global Health em `Efetivar_agendamento`) \u00e9 outro objeto e outro espa\u00e7o de numera\u00e7\u00e3o. O formato com ano e h\u00edfen escolhido aqui torna os dois visualmente distingu\u00edveis numa conversa.\n\n## Op\u00e7\u00f5es consideradas\n\n| Op\u00e7\u00e3o | Veredito |\n|---|---|\n| **Sequencial ANO-NNNN em tabela nova do NocoDB** | **Escolhida**: n\u00famero curto, leg\u00edvel ao telefone, audit\u00e1vel, e a tabela j\u00e1 resolve status e prazo da manifesta\u00e7\u00e3o. Custo de implanta\u00e7\u00e3o medido em minutos |\n| Usar o id da conversa do Chatwoot | Descartada: vaza detalhe de infraestrutura para o paciente, n\u00e3o \u00e9 sequencial nem por ano, muda de significado se a inst\u00e2ncia for migrada, e ainda amarra um n\u00famero p\u00fablico a um identificador interno de sistema |\n| Esperar a integra\u00e7\u00e3o com o MV | Descartada: adia por tempo indefinido uma frente que j\u00e1 est\u00e1 no ar 24/7 e que \u00e9 justamente onde a promessa ao paciente \u00e9 mais sens\u00edvel. A ouvidoria n\u00e3o depende de agenda, e o MV n\u00e3o numera manifesta\u00e7\u00e3o de ouvidoria hoje |\n| N\u00e3o dar protocolo nenhum | Descartada como estado final: \u00e9 o que existe hoje. Continua sendo o comportamento correto de **falha** (ver Regra H\u00edbrida abaixo), n\u00e3o o comportamento normal |\n\n## A tabela `5_Ouvidoria_Protocolos`\n\nBase Ana (`pigw746ba6w6l52`), no mesmo NocoDB das quatro tabelas de valores.\n\n| Coluna | Tipo NocoDB | Quem preenche | Regra |\n|---|---|---|---|\n| `Id` | ID (autoincremento) | NocoDB | Base at\u00f4mica da numera\u00e7\u00e3o. Nunca \u00e9 dito ao paciente |\n| `Protocolo` | Formula | NocoDB | `CONCAT(YEAR({Data_Abertura}), '-', RIGHT(CONCAT('000', {Id}), 4))`. \u00c9 o \u00fanico n\u00famero que a Ana l\u00ea em voz alta. Se a vers\u00e3o do NocoDB n\u00e3o tiver `YEAR`, usar `LEFT(DATESTR({Data_Abertura}), 4)` no lugar |\n| `Data_Abertura` | Created time | NocoDB | Carimbo do servidor. O modelo n\u00e3o escreve data, ent\u00e3o n\u00e3o h\u00e1 data errada nem fuso divergente |\n| `Conversa_Id` | SingleLineText | tool (ver ressalva) | Ponte para a conversa no Chatwoot, onde mora o conte\u00fado completo |\n| `Categoria` | SingleLineText | tool | O `motivo_categoria` que o prompt j\u00e1 infere: Atendimento, Demora, Cobran\u00e7a, Higiene, Conduta profissional, Infraestrutura, Elogio |\n| `Setor` | SingleLineText | tool | O `setor_identificado` que o prompt j\u00e1 infere do relato |\n| `Resumo` | LongText | tool | Uma a duas linhas em linguagem de relato (\"paciente relata que...\"). **Sem CPF, sem nomes (solicitante, paciente ou profissional), sem dado cl\u00ednico** |\n| `Status` | SingleSelect: Aberto (padr\u00e3o), Respondido, Encerrado | equipe da ouvidoria | A tool n\u00e3o escreve; nasce Aberto |\n| `Prazo_Resposta` | Formula | NocoDB | `DATEADD({Data_Abertura}, 7, 'day')`. Aproxima em dias corridos a promessa de 5 dias \u00fateis, para o painel interno enxergar o vencido. N\u00e3o \u00e9 a promessa em si |\n\n### Por que o banco numera, e n\u00e3o a ferramenta\n\nA alternativa \u00f3bvia (a tool l\u00ea o \u00faltimo protocolo do ano e grava o seguinte) \u00e9 uma leitura seguida de uma escrita, sem transa\u00e7\u00e3o: duas manifesta\u00e7\u00f5es simult\u00e2neas, num canal que atende 24 horas, podem ler o mesmo \"\u00faltimo\" e gravar o mesmo n\u00famero. Protocolo repetido em canal que vira prova \u00e9 um defeito caro e silencioso. O `Id` autoincremento do banco \u00e9 at\u00f4mico por constru\u00e7\u00e3o, e a coluna de f\u00f3rmula transforma o `Id` no formato final sem nenhuma l\u00f3gica do lado da Ana. Ningu\u00e9m pode inventar, truncar ou desalinhar o n\u00famero.\n\n**Consequ\u00eancia assumida:** o `NNNN` \u00e9 um sequencial cont\u00ednuo, n\u00e3o reinicia em janeiro. Depois de 42 manifesta\u00e7\u00f5es em 2026, a primeira de 2027 ser\u00e1 `2027-0043`. O prefixo continua dizendo o ano de abertura, a unicidade \u00e9 garantida e ningu\u00e9m precisa lembrar de zerar nada. Reiniciar por ano exigiria uma tabela de contadores (e a corrida de volta) ou um offset editado na f\u00f3rmula toda virada de ano. N\u00e3o vale o pre\u00e7o. Acima de 9999 registros o `RIGHT(...,4)` truncaria: no volume de uma ouvidoria hospitalar isso \u00e9 d\u00e9cada, e a corre\u00e7\u00e3o \u00e9 trocar 4 por 5 na f\u00f3rmula.\n\n### Ressalva sobre `Conversa_Id`\n\nN\u00e3o est\u00e1 confirmado que a plataforma fazer.ai exponha o id da conversa como vari\u00e1vel interpol\u00e1vel no corpo de uma tool HTTP (`tool_create` n\u00e3o documenta vari\u00e1veis de contexto). Enquanto isso n\u00e3o for confirmado com a fazer.ai, a coluna existe e fica vazia, e o v\u00ednculo se faz na dire\u00e7\u00e3o inversa: o `Escalar_humano` j\u00e1 leva o resumo para a `FILA OUVIDORIA`, e o prompt passa a incluir o protocolo nesse resumo. A conversa aponta para o protocolo, em vez do protocolo apontar para a conversa. Se a vari\u00e1vel existir, o campo passa a ser preenchido sem nenhuma outra mudan\u00e7a.\n\n## Sigilo: esta tabela \u00e9 um \u00edndice, n\u00e3o um dossi\u00ea\n\nDuas regras inegoci\u00e1veis, ambas herdadas do incidente que gerou o ADR-0006:\n\n1. **A tabela n\u00e3o entra em shared view p\u00fablica.** As quatro tabelas de valores s\u00e3o p\u00fablicas porque n\u00e3o t\u00eam dado pessoal. Esta tem, por natureza, o rastro de uma queixa. Leitura e escrita passam por credencial.\n2. **Identifica\u00e7\u00e3o n\u00e3o desce para a tabela.** Nome, CPF, nome do paciente e o relato completo continuam onde j\u00e1 est\u00e3o hoje: na conversa do Chatwoot, que tem controle de acesso, e no resumo do `Escalar_humano`. A tabela guarda o m\u00ednimo para rastrear e cobrar prazo (n\u00famero, data, categoria, setor, status). Isso muda o desenho antigo do Sheets de prop\u00f3sito: se este banco vazar amanh\u00e3, o que sai \u00e9 \"2026-0007, Demora, Recep\u00e7\u00e3o, Aberto\", n\u00e3o nome e CPF de quem reclamou.\n\n## O fluxo na conversa (revis\u00e3o da Se\u00e7\u00e3o 7.3 do prompt)\n\n1. Coleta e confirma\u00e7\u00e3o do paciente seguem exatamente como est\u00e3o hoje (Se\u00e7\u00f5es 7.1 e 7.2).\n2. `registrar_ouvidoria` grava a linha e devolve o `Id`.\n3. `consultar_protocolo_ouvidoria` devolve o campo `Protocolo` daquele `Id`.\n4. **S\u00f3 ent\u00e3o** a Ana informa o n\u00famero ao paciente. Antes disso ela n\u00e3o menciona protocolo, nem no condicional.\n5. **Se qualquer uma das duas chamadas falhar:** Regra H\u00edbrida. A Ana nunca inventa, nunca estima e nunca promete o n\u00famero para depois na mesma frase em que erra. Ela acolhe, segue para `FILA OUVIDORIA` e `Escalar_humano`, e diz a verdade operacional, que \u00e9 suficiente:\n   ```\n   Registrei seu relato e j\u00e1 encaminhei para a nossa ouvidoria.\n   Nossa equipe vai entrar em contato em at\u00e9 5 dias \u00fateis.\n   ```\n6. **Nunca registrar duas vezes a mesma manifesta\u00e7\u00e3o.** Uma grava\u00e7\u00e3o por conversa. Se houver d\u00favida se entrou, consultar pelo `Id` j\u00e1 devolvido, jamais gravar de novo (\u00e9 o espelho da Regra 17 do agendamento).\n7. O protocolo de ouvidoria (`2026-0007`) e o protocolo de agendamento (num\u00e9rico, da Global Health) nunca se misturam: s\u00e3o ferramentas diferentes, formatos diferentes e momentos diferentes do SOP.\n\n## Implementa\u00e7\u00e3o por fases\n\n| Fase | O qu\u00ea | Quem | Estado |\n|---|---|---|---|\n| 1 | Desenho, spec da tabela e spec das tools | esta sess\u00e3o | Feito (este ADR) |\n| 2 | Criar a tabela `5_Ouvidoria_Protocolos` no NocoDB e gerar um API token | Pedro, no console | **Pendente**. Nenhuma via segura desta m\u00e1quina cria tabela (ver abaixo) |\n| 3 | Guardar o token no vault da plataforma e criar as duas tools | orquestrador, serializado | Pendente da fase 2 |\n| 4 | Costurar a Se\u00e7\u00e3o 7.3 do prompt (a chamada das tools e o texto de falha) | orquestrador | Pendente da fase 3 |\n| 5 | Colapsar as duas tools numa s\u00f3, quando o proxy fino do ADR-0009 (P5) existir | mais tarde | Opcional, sem mudan\u00e7a de tabela nem de formato |\n\n**Por que a fase 2 n\u00e3o foi executada nesta sess\u00e3o:** o MCP `nocodb-base-ana` s\u00f3 tem ferramentas de **dados** (`queryRecords`, `createRecords`, `getTableSchema` e afins). N\u00e3o existe nenhuma ferramenta de metadados, ent\u00e3o criar tabela por ele \u00e9 imposs\u00edvel. A \u00fanica credencial de NocoDB nesta m\u00e1quina \u00e9 o token do pr\u00f3prio MCP (escopo `/mcp`), e a API de metadados do NocoDB exige um `xc-token` de API, que n\u00e3o existe aqui e n\u00e3o deve ser fabricado por uma sess\u00e3o de agente. A escrita autenticada (fase 3) tem a mesma trava: depende de um segredo novo, criado pelo Pedro.\n\n## Spec das ferramentas (para o orquestrador criar depois, n\u00e3o criadas agora)\n\nHost: `nocodb-ucc0hkwgqdsa38p5xrwa1x0h.31.97.29.32.sslip.io`. `TABLE_ID` \u00e9 o id que o NocoDB atribuir \u00e0 tabela nova. Credencial no vault: **`nocodb-base-ana-token`**, tipo header, header `xc-token` (mesmo padr\u00e3o da `gh-homolog-token`, que usa o header `Token`). `input_schema` no **formato compacto nativo** da inst\u00e2ncia, nunca JSON Schema padr\u00e3o (achado da V12).\n\n**`registrar_ouvidoria`** (risk_tier `medium`, escrita)\n```\nmethod: POST\nurl_template: https://<host>/api/v2/tables/<TABLE_ID>/records\nallowed_hosts: [\"nocodb-ucc0hkwgqdsa38p5xrwa1x0h.31.97.29.32.sslip.io\"]\nheaders: {\"Content-Type\": \"application/json\", \"Accept\": \"application/json\"}\ncredential_ref: \"nocodb-base-ana-token\"\ninput_schema: {\n  \"categoria\": {\"type\": \"string\", \"required\": true,\n                \"description\": \"Categoria inferida do relato: Atendimento, Demora, Cobranca, Higiene, Conduta profissional, Infraestrutura ou Elogio\"},\n  \"setor\":     {\"type\": \"string\", \"required\": true,\n                \"description\": \"Setor identificado no relato (ex.: Pronto-Socorro, Recepcao, Enfermagem, Faturamento). Usar 'Nao informado' se o relato nao permitir inferir\"},\n  \"resumo\":    {\"type\": \"string\", \"required\": true,\n                \"description\": \"Uma a duas linhas em linguagem de relato (paciente relata que...). NUNCA incluir CPF, nome de paciente, de solicitante ou de profissional, nem dado clinico\"}\n}\nbody: {\"Categoria\": \"{{categoria}}\", \"Setor\": \"{{setor}}\", \"Resumo\": \"{{resumo}}\"}\nretorno esperado: [{\"Id\": 12}]\n```\n\n**`consultar_protocolo_ouvidoria`** (risk_tier `low`, leitura)\n```\nmethod: GET\nurl_template: https://<host>/api/v2/tables/<TABLE_ID>/records\nallowed_hosts: [mesmo]\nheaders: {\"Accept\": \"application/json\"}\ncredential_ref: \"nocodb-base-ana-token\"\ninput_schema: {\n  \"id\": {\"type\": \"string\", \"required\": true,\n         \"description\": \"O Id devolvido por registrar_ouvidoria nesta mesma conversa\"}\n}\nquery: {\"where\": \"(Id,eq,{{id}})\", \"fields\": \"Protocolo\", \"limit\": \"1\"}\nretorno esperado: {\"list\": [{\"Protocolo\": \"2026-0012\"}]}\n```\n\nNa fase 5, as duas viram uma: `POST /ouvidoria/manifestacoes` no proxy fino, que insere, rel\u00ea e devolve `{\"protocolo\": \"2026-0012\"}` numa chamada s\u00f3. O token do NocoDB sai do vault e passa a viver no ambiente do proxy, e a plataforma deixa de falar autenticada com o banco.\n\n## Decis\u00f5es aut\u00f4nomas a revisar pelo Pedro\n\n1. **O `NNNN` n\u00e3o reinicia por ano** (`2027-0043` depois de 42 registros em 2026). Trocar isso custa uma tabela de contadores e a corrida de volta.\n2. **A tabela n\u00e3o guarda nome nem CPF**, ao contr\u00e1rio da `6_Ouvidoria_Log` do Sheets. Se a equipe da ouvidoria precisar identificar sem abrir o Chatwoot, isso muda o desenho e reabre a discuss\u00e3o de sigilo.\n3. **Duas ferramentas encadeadas** (gravar e depois ler o n\u00famero) enquanto o proxy n\u00e3o existe. Alternativa era esperar o proxy do P5, o que empurraria a ouvidoria para depois da agenda.\n4. **Colunas al\u00e9m do m\u00ednimo pedido:** `Categoria` e `Setor` entraram porque o prompt j\u00e1 infere os dois e eles s\u00e3o o que a ouvidoria usa para rote
