s trilhas A-G, PENDENCIAS.md, mapas antigos), arquivado intacto. Os textos prontos para a Global Health e para o analista de TI moram l\u00e1, al\u00e9m do hist\u00f3rico das trilhas de banco MV, p\u00f3s-atendimento e canal principal. O `mapa.html` de 30/jul/2026 (aposentado no mesmo dia pelo Ana OS) e o playground pr\u00e9-OS (`ana/api-mv/arquivo/playground-pre-os/`) moram no acervo tamb\u00e9m.\n_Avoid_: apagar; tratar o acervo como fonte do estado atual (\u00e9 hist\u00f3ria, n\u00e3o fronteira).\n\n**Pendente (bloco do roadmap)**:\nA faixa do Roadmap do OS com as d\u00edvidas conscientes, uma linha cada: hoje s\u00f3 o sistema de protocolo da ouvidoria (OV1). A GH1 (desenho do fluxo GH) foi puxada e conclu\u00edda em 06/ago/2026 (ADR-0009); o token Cloudflare (V7) desceu para o radar. Sem tarefas detalhadas at\u00e9 cada uma ser puxada para o est\u00e1gio ativo.\n\n### Pessoas e partes\nExtinto em 09/out/2026 (ADR-0031): estava vazio; d\u00edvida consciente \u00e9 issue com `canal:aguardando` ou item do radar.\n\n**VITTA TECH**:\nVITTA TECH Desenvolvimento de Software Customiz\u00e1vel LTDA, a CONTRATADA. Assina e fatura o contrato; Lucas e Rib se resolvem internamente, sem aparecer para o cliente.\n\n## Flagged ambiguities\n\n- **\"Patamar\"** era o conceito do contrato \u00fanico antigo (faixas 5k\u21926k\u21928k\u21929k acionadas por marcos). Na estrutura atual **deixa de existir como termo**: a mensalidade \u00e9 a soma dos Entreg\u00e1veis aceitos. Os valores totais coincidem (R$ 5/6/8/9 mil), mas a l\u00f3gica \u00e9 modular, n\u00e3o de \"faixas\". N\u00e3o usar \"patamar\".\n- **\"Consultoria\"**: n\u00e3o h\u00e1 rubrica \"consultoria\" no contrato. O estudo e a viabilidade da Ana (e de outras entregas futuras) correm **inclu\u00eddos na mensalidade vigente** do Aplicativo do hospital, at\u00e9 o respectivo Entreg\u00e1vel ser aceito. N\u00e3o chamar isso de consultoria nem de linha separada.\n- **Um contrato, n\u00e3o dois**: chegou-se a desenhar um \"Contrato Ana\" separado (ADR-0001); a decis\u00e3o foi revista e tudo est\u00e1 num **contrato \u00fanico** (ADR-0002). A Ana \u00e9 Entreg\u00e1vel, n\u00e3o contrato.\n\n## Example dialogue\n\n- *\"O cliente aceitou a Ana no WhatsApp. E agora?\"*\n- *\"Assinamos o Termo de Entreg\u00e1vel da Ana. Ele vira um Anexo de Entreg\u00e1vel do contrato e os R$ 2.000/m\u00eas passam a incidir no m\u00eas seguinte: a mensalidade sobe de R$ 6.000 para R$ 8.000.\"*\n- *\"E quando come\u00e7armos o agente de voz?\"*\n- *\"O Retell entra como novo Anexo de Entreg\u00e1vel do mesmo contrato, sem contrato novo: s\u00f3 o termo com escopo e valor.\"*\n", "projeto": "Ana", "repo_url": "https://github.com/pedrorezendefig/programa-ana", "temas": [{"numeros": [35], "tema": "Fluxo de trabalho"}, {"numeros": [1, 2, 26], "tema": "Contrato e comercial"}, {"numeros": [5, 12, 13, 14, 24], "tema": "A Ana e a plataforma"}, {"numeros": [3, 6, 10, 15, 16], "tema": "Base de dados e ouvidoria"}, {"numeros": [9, 23, 25], "tema": "Integra\u00e7\u00e3o Global Health e MV"}, {"numeros": [4, 7, 8, 11, 17, 18, 19, 28, 29, 30, 31, 34], "tema": "Ana OS e Retrato"}, {"numeros": [20, 21, 22, 27, 32, 33], "tema": "Bancada e testes"}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('dados').textContent);
  D.adrs = D.adrs || [];
  D.temas = D.temas || [];

  // ---------- utilitários (markdown.ts, ligacoes.ts e abas.ts do app) ----------

  const escapar = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const normalizar = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').normalize('NFC').toLowerCase();
  const escaparRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const linhasDe = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);
  const num4 = (n) => String(n).padStart(4, '0');
  const cortar = (t, max) => (t.length <= max ? t : `${t.slice(0, Math.max(1, max - 1)).trimEnd()}…`);
  const slugDe = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  const f1 = (v) => v.toFixed(1);

  function linhaMd(texto) {
    const guardados = [];
    const guardar = (h) => `\u0000${guardados.push(h) - 1}\u0000`;
    let t = texto.replace(/`([^`]+)`/g, (_m, c) => guardar(`<code>${escapar(c)}</code>`));
    t = t.replace(/!\[([^\]]*)\]\([^)]*\)/g, (_m, alt) => (alt ? `[${alt}]` : ''));
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^)]*")?\)/g, (_m, txt, url) =>
      (/^https?:\/\//i.test(url) ? `${guardar(`<a href="${escapar(url)}" target="_blank" rel="noreferrer">`)}${txt}${guardar('</a>')}` : txt));
    t = escapar(t);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
    t = t.replace(/(^|[^\w])_(?!\s)(.+?)_(?!\w)/g, '$1<em>$2</em>');
    return t.replace(/\u0000(\d+)\u0000/g, (_m, i) => guardados[Number(i)]);
  }

  const celulas = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
  const ehSeparador = (l) => /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);

  function markdown(fonte, nivelBase = 3) {
    const linhas = (fonte || '').replace(/<!--[\s\S]*?-->/g, '').replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let i = 0;
    while (i < linhas.length) {
      const l = linhas[i];
      if (!l.trim()) { i += 1; continue; }
      const cerca = /^\s*(```|~~~)\s*([\w-]*)/.exec(l);
      if (cerca) {
        const corpo = [];
        i += 1;
        while (i < linhas.length && !linhas[i].trim().startsWith(cerca[1])) corpo.push(linhas[i++]);
        i += 1;
        const lang = cerca[2] ? ` class="lang-${escapar(cerca[2])}"` : '';
        out.push(`<pre><code${lang}>${escapar(corpo.join('\n'))}</code></pre>`);
        continue;
      }
      const titulo = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l);
      if (titulo) {
        const n = Math.min(6, nivelBase + Math.max(0, titulo[1].length - 2));
        out.push(`<h${n}>${linhaMd(titulo[2])}</h${n}>`);
        i += 1;
        continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i += 1; continue; }
      if (/^\s*\|/.test(l) && i + 1 < linhas.length && ehSeparador(linhas[i + 1])) {
        const cab = celulas(l);
        i += 2;
        const corpo = [];
        while (i < linhas.length && /^\s*\|/.test(linhas[i])) corpo.push(celulas(linhas[i++]));
        out.push(`<div class="md-tabela"><table><thead><tr>${cab.map((c) => `<th>${linhaMd(c)}</th>`).join('')}</tr></thead><tbody>${
          corpo.map((r) => `<tr>${r.map((c) => `<td>${linhaMd(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
      if (/^\s*>/.test(l)) {
        const corpo = [];
        while (i < linhas.length && /^\s*>/.test(linhas[i])) corpo.push(linhas[i++].replace(/^\s*>\s?/, ''));
        out.push(`<blockquote>${markdown(corpo.join('\n'), nivelBase)}</blockquote>`);
        continue;
      }
      const item = /^\s*([-*+]|\d+[.)])\s+/;
      if (item.test(l)) {
        const ordenada = /^\s*\d/.test(l);
        const itens = [];
        while (i < linhas.length && (item.test(linhas[i]) || (/^\s{2,}\S/.test(linhas[i]) && itens.length))) {
          if (item.test(linhas[i])) itens.push(linhas[i].replace(item, '').replace(/^\[([ xX])\]\s+/, (_m, x) => (x.trim() ? '☑ ' : '☐ ')));
          else itens[itens.length - 1] += ` ${linhas[i].trim()}`;
          i += 1;
        }
        const tag = ordenada ? 'ol' : 'ul';
        out.push(`<${tag}>${itens.map((x) => `<li>${linhaMd(x)}</li>`).join('')}</${tag}>`);
        continue;
      }
      const paragrafo = [];
      while (i < linhas.length && linhas[i].trim() && !/^\s*(#{1,6}\s|```|~~~|>|\||([-*+]|\d+[.)])\s)/.test(linhas[i])) paragrafo.push(linhas[i++].trim());
      if (!paragrafo.length) paragrafo.push(linhas[i++].trim());
      out.push(`<p>${linhaMd(paragrafo.join(' '))}</p>`);
    }
    return out.join('\n');
  }

  // ---------- o fluxograma (desenharFluxo e pulsosDoFluxo) ----------

  function desenharFluxo(fluxo) {
    const lista = fluxo.nos || [];
    if (!lista.length) return null;
    const CX = (fluxo.grade && fluxo.grade.coluna) || 90;
    const RY = (fluxo.grade && fluxo.grade.linha) || 96;
    const W = (fluxo.grade && fluxo.grade.largura) || 1080;
    const pos = new Map();
    for (const n of lista) {
      const subs = linhasDe(n.sub);
      const w = n.w || 200;
      const h = 40 + 14 * Math.max(subs.length, 1);
      pos.set(n.id, { n, subs, cx: n.x * CX, top: n.y * RY, w, h, cy: n.y * RY + h / 2 });
    }
    const arestas = [];
    for (const a of fluxo.arestas || []) {
      const A = pos.get(a.de);
      const B = pos.get(a.para);
      if (!A || !B) continue;
      const modo = a.modo || (Math.abs(A.cy - B.cy) < 1 ? 'reto' : 'baixo');
      let d;
      let lab;
      if (modo === 'reto') {
        const dir = B.cx > A.cx ? 1 : -1;
        const x1 = A.cx + (dir * A.w) / 2;
        const x2 = B.cx - (dir * B.w) / 2;
        d = `M ${f1(x1)} ${f1(A.cy)} H ${f1(x2)}`;
        lab = { x: (x1 + x2) / 2, y: A.cy - 6, anchor: 'middle' };
      } else if (modo === 'lado') {
        const y1 = A.top + A.h;
        const dir = B.cx > A.cx ? 1 : -1;
        const x2 = B.cx - (dir * B.w) / 2;
        d = `M ${f1(A.cx)} ${f1(y1)} V ${f1(B.cy)} H ${f1(x2)}`;
        lab = { x: (A.cx + x2) / 2, y: B.cy - 6, anchor: 'middle' };
      } else if (modo === 'volta' || modo === 'direita') {
        const x1 = A.cx + A.w / 2;
        const xc = modo === 'volta' ? x1 + 40 : W - 15;
        const x2 = B.cx + B.w / 2;
        d = `M ${f1(x1)} ${f1(A.cy)} H ${f1(xc)} V ${f1(B.cy)} H ${f1(x2)}`;
        lab = { x: xc - 8, y: (A.cy + B.cy) / 2, anchor: 'end' };
      } else {
        const y1 = A.top + A.h;
        const y2 = B.top;
        if (Math.abs(A.cx - B.cx) < 1) {
          d = `M ${f1(A.cx)} ${f1(y1)} V ${f1(y2)}`;
          lab = { x: A.cx + 8, y: (y1 + y2) / 2, anchor: 'start', lado: true };
        } else {
          const ym = y1 + (a.meio == null ? 0.5 : a.meio) * (y2 - y1);
          d = `M ${f1(A.cx)} ${f1(y1)} V ${f1(ym)} H ${f1(B.cx)} V ${f1(y2)}`;
          lab = { x: (A.cx + B.cx) / 2, y: ym - 6, anchor: 'middle' };
        }
      }
      const rot = linhasDe(a.rotulo);
      arestas.push({
        d, de: a.de, para: a.para, tracejada: !!a.tracejada,
        rotulos: rot.map((texto, i) => ({
          texto, anchor: lab.anchor, x: lab.x,
          y: lab.lado ? lab.y + (i - (rot.length - 1) / 2) * 13 + 4 : lab.y - (rot.length - 1 - i) * 13,
        })),
      });
    }
    const raias = (fluxo.raias || []).map((r) => {
      const x = r.x1 * CX;
      const w = (r.x2 - r.x1) * CX;
      const titulo = String(r.titulo || '');
      const chipW = Math.round(titulo.length * 6.8) + 22;
      return { x, y: r.y1 * RY, w, h: (r.y2 - r.y1) * RY, titulo, chipW, chipX: r.alinhar === 'direita' ? x + w - 10 - chipW : x + 10 };
    });
    let H = 0;
    pos.forEach((p) => { H = Math.max(H, p.top + p.h); });
    raias.forEach((r) => { H = Math.max(H, r.y + r.h); });
    return { largura: W, altura: Math.ceil(H) + 12, nos: [...pos.values()], arestas, raias };
  }

  const SEGUNDOS_POR_SETA = 0.9;
  const PAUSA_NO_FIM = 1.2;

  function pulsosDoFluxo(desenho) {
    const vez = new Map(desenho.nos.map((n) => [n.n.id, 0]));
    for (let volta = 0; volta < desenho.nos.length; volta++) {
      for (const a of desenho.arestas) vez.set(a.para, Math.max(vez.get(a.para) || 0, (vez.get(a.de) || 0) + 1));
    }
    const vezes = desenho.arestas.map((a) => vez.get(a.de) || 0);
    const passos = vezes.length ? Math.max(...vezes) + 1 : 0;
    const periodo = passos * SEGUNDOS_POR_SETA + PAUSA_NO_FIM;
    const fracao = (s) => Number((s / periodo).toFixed(4));
    return {
      periodo: Number(periodo.toFixed(2)),
      pulsos: desenho.arestas.map((a, i) => ({ d: a.d, inicio: fracao(vezes[i] * SEGUNDOS_POR_SETA), fim: fracao((vezes[i] + 1) * SEGUNDOS_POR_SETA) })),
    };
  }

  // ---------- decisões e glossário (gruposDeDecisoes, glossario e ligacoes.ts) ----------

  function gruposDeDecisoes(adrs, temas, historico, busca) {
    const q = normalizar(busca.trim());
    const passa = (a) => (historico || a.status === 'accepted') && (!q || normalizar(`${a.title}\n${a.body_md}`).includes(q));
    const maisNovaPrimeiro = (xs) => [...xs].sort((a, b) => b.number - a.number);
    const porNumero = new Map(adrs.map((a) => [a.number, a]));
    const usadas = new Set();
    const grupos = [];
    for (const t of temas) {
      const lista = t.numeros.map((n) => porNumero.get(n)).filter(Boolean);
      lista.forEach((a) => usadas.add(a.number));
      const visiveis = lista.filter(passa);
      if (visiveis.length) grupos.push({ tema: t.tema, adrs: maisNovaPrimeiro(visiveis) });
    }
    const resto = adrs.filter((a) => !usadas.has(a.number) && passa(a));
    if (resto.length) grupos.push({ tema: temas.length ? 'Outras' : 'Decisões', adrs: maisNovaPrimeiro(resto) });
    return grupos;
  }

  function vinculos(a) {
    return [['emenda', a.emenda], ['emendada por', a.emendada_por], ['substitui', a.substitui], ['substituída por', a.substituida_por], ['cita', a.cita]]
      .filter(([, ns]) => ns && ns.length);
  }

  function glossario(md) {
    const secoes = [];
    let atual = null;
    let termo = null;
    for (const l of String(md || '').split('\n')) {
      const h = /^## (.+?)\s*$/.exec(l);
      if (h) { atual = { titulo: h[1], termos: [] }; secoes.push(atual); termo = null; continue; }
      const t = /^\*\*(.+?)\*\*:?\s*(.*)$/.exec(l);
      if (t && atual) { termo = { nome: t[1], slug: slugDe(t[1]), definicao: t[2].trim(), evitar: null }; atual.termos.push(termo); continue; }
      if (!termo) continue;
      if (!l.trim()) { termo = null; continue; }
      const ev = /^_Evitar_:\s*(.*)$/.exec(l.trim());
      if (ev) termo.evitar = ev[1];
      else termo.definicao = `${termo.definicao} ${l.trim()}`.trim();
    }
    return secoes.filter((s) => s.termos.length);
  }

  const casaPalavra = (nome) => new RegExp(`(?<![\\p{L}\\p{N}])${escaparRe(normalizar(nome))}s?(?![\\p{L}\\p{N}])`, 'u');

  function ligarTermosEDecisoes(termos, adrs) {
    const porTermo = new Map();
    const porDecisao = new Map();
    const textos = adrs.map((a) => [a.number, normalizar(`${a.title}\n${a.body_md}`)]);
    for (const t of termos) {
      const re = casaPalavra(t.nome);
      for (const [n, texto] of textos) {
        if (!re.test(texto)) continue;
        porTermo.set(t.slug, [...(porTermo.get(t.slug) || []), n]);
        porDecisao.set(n, [...(porDecisao.get(n) || []), t.slug]);
      }
    }
    return { decisoesDoTermo: (slug) => porTermo.get(slug) || [], termosDaDecisao: (n) => porDecisao.get(n) || [] };
  }

  function marcarTermosNoHtml(html, termos) {
    if (!termos.length) return html;
    const porNome = new Map(termos.map((t) => [normalizar(t.nome), t.slug]));
    const nomes = [...porNome.keys()].sort((a, b) => b.length - a.length).map(escaparRe);
    const re = new RegExp(`(?<![\\p{L}\\p{N}])(${nomes.join('|')})s?(?![\\p{L}\\p{N}])`, 'gu');
    const vistos = new Set();
    let fechado = 0;
    return html.split(/(<[^>]*>)/).map((parte, i) => {
      if (i % 2) {
        const tag = /^<(\/?)(code|pre|a)\b/i.exec(parte);
        if (tag) fechado += tag[1] ? -1 : 1;
        return parte;
      }
      if (fechado > 0 || !parte) return parte;
      let norm = '';
      const origem = [];
      let pos = 0;
      for (const c of parte) {
        for (const n of normalizar(c)) { norm += n; origem.push(pos); }
        pos += c.length;
      }
      origem.push(parte.length);
      let saida = '';
      let ate = 0;
      for (const m of norm.matchAll(re)) {
        const slug = porNome.get(m[1]);
        if (vistos.has(slug)) continue;
        vistos.add(slug);
        const de = origem[m.index];
        const fim = origem[m.index + m[0].length];
        saida += `${parte.slice(ate, de)}<span class="termo-citado" data-termo="${slug}" tabindex="0">${parte.slice(de, fim)}</span>`;
        ate = fim;
      }
      return saida + parte.slice(ate);
    }).join('');
  }

  // ---------- ícones (lucide, os mesmos do app) ----------

  const ICONE = {
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    externo: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    mao: '<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  };
  const icone = (nome, extra = '') => `<svg ${extra} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE[nome]}</svg>`;

  // ---------- o estado da página ----------

  const secoes = glossario(D.glossario);
  const termos = secoes.flatMap((s) => s.termos);
  const ligacoes = ligarTermosEDecisoes(termos, D.adrs);
  const desenho = D.fluxo ? desenharFluxo(D.fluxo) : null;
  const pulsos = desenho ? pulsosDoFluxo(desenho) : null;
  const parado = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PARTES = [['fluxo', 'Fluxo'], ['decisoes', 'Decisões'], ['glossario', 'Glossário']];
  const CLASSE = { auto: 'automático', humano: 'parada humana', decisao: 'decisão', fim: 'produção' };
  const PONTO = { accepted: 'ok', superseded: 'hist', deprecated: 'hist', proposed: 'novo' };
  const STATUS = { accepted: 'aceita', superseded: 'substituída', deprecated: 'abandonada', proposed: 'proposta' };
  const estado = { busca: '', historico: false };
  const explicacoes = new Map();

  const frase = (n) => {
    const m = n.detalhe && /^.*?[.!?](?=\s|$)/.exec(n.detalhe);
    return m ? m[0] : n.detalhe || linhasDe(n.sub).join(', ');
  };
  (D.fluxo && D.fluxo.nos || []).forEach((n) => explicacoes.set(`no:${n.id}`, {
    titulo: n.titulo || n.id, regra: frase(n), campos: n.comando ? [{ rotulo: 'Comando', texto: n.comando }] : [],
  }));
  termos.forEach((t) => explicacoes.set(`termo:${t.slug}`, {
    titulo: t.nome, regra: t.definicao.replace(/`/g, ''), campos: t.evitar ? [{ rotulo: 'Evitar', texto: t.evitar }] : [],
  }));

  function rota() {
    const [s, ...r] = decodeURIComponent(location.hash.replace(/^#/, '')).split('/');
    const parte = PARTES.some(([k]) => k === s) ? s : D.fluxo ? 'fluxo' : 'decisoes';
    return { parte, resto: r.join('/') };
  }
  const abrir = (item) => { location.hash = item ? `#${item}` : '#'; };

  const filtrarGlossario = (busca, manter = '') => {
    const q = normalizar(busca.trim());
    return secoes.map((s) => ({ ...s, termos: s.termos.filter((t) => !q || t.slug === manter || normalizar(`${t.nome} ${t.definicao}`).includes(q)) }))
      .filter((s) => s.termos.length);
  };
  const vazio = (texto) => `<div class="vazio-ala"><p>${escapar(texto)}</p></div>`;
  const tituloDa = (n) => (D.adrs.find((a) => a.number === n) || {}).title;

  // ---------- Fluxo ----------

  function svgDoFluxo(no) {
    const nos = desenho.nos.map(({ n, subs, cx, top, w, h }) => {
      const humano = n.classe === 'humano';
      const x0 = cx - w / 2;
      const tx = humano ? x0 + 34 : cx;
      const largura = w - 20 - (humano ? 24 : 0);
      const ancora = humano ? 'start' : 'middle';
      const rotulo = escapar([n.titulo, ...subs].join(': '));
      return `<g class="fx-explica" data-explica="no:${escapar(n.id)}" aria-label="${rotulo}">`
        + `<g class="fx-no" data-classe="${escapar(n.classe || 'auto')}" data-no="${escapar(n.id)}" data-on="${n.id === no}" role="button" tabindex="0" aria-label="${rotulo}" aria-pressed="${n.id === no}">`
        + `<rect x="${x0}" y="${top}" width="${w}" height="${h}" rx="6"/>`
        + (n.classe === 'decisao' ? `<rect class="fx-dupla" x="${x0 + 3}" y="${top + 3}" width="${w - 6}" height="${h - 6}" rx="4"/>` : '')
        + (humano ? icone('mao', `class="fx-mao" x="${x0 + 8}" y="${top + 9}" width="18" height="18"`) : '')
        + `<text class="fx-t" x="${tx}" y="${top + 21}" text-anchor="${ancora}">${escapar(cortar(n.titulo || n.id, Math.floor(largura / 6.4)))}</text>`
        + subs.map((l, j) => `<text class="fx-s" x="${tx}" y="${top + 37 + j * 14}" text-anchor="${ancora}">${escapar(cortar(String(l), Math.floor(largura / 6)))}</text>`).join('')
        + '</g></g>';
    }).join('');
    const animacao = !parado && pulsos ? `<g class="fx-pulsos" aria-hidden="true">${pulsos.pulsos.map((p) =>
      `<circle class="fx-pulso" r="3.5" opacity="0"><animateMotion path="${p.d}" dur="${pulsos.periodo}s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;${p.inicio};${p.fim};1"/>`
      + `<animate attributeName="opacity" dur="${pulsos.periodo}s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;${p.inicio};${p.fim}"/></circle>`).join('')}</g>` : '';
    return `<svg class="fluxo-svg" viewBox="0 0 ${desenho.largura} ${desenho.altura}" width="${desenho.largura}" role="group" aria-label="Fluxo de trabalho, ${desenho.nos.length} passos">`
      + '<defs><marker id="fx-ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="fx-seta" d="M 0 0 L 10 5 L 0 10 Z"/></marker></defs>'
      + desenho.raias.map((r) => `<g class="fx-raia"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"/>`
        + `<rect class="fx-raia-chip" x="${r.chipX}" y="${r.y + 10}" width="${r.chipW}" height="22" rx="11"/>`
        + `<text x="${r.chipX + r.chipW / 2}" y="${r.y + 25}" text-anchor="middle">${escapar(r.titulo)}</text></g>`).join('')
      + `<g class="fx-arestas">${desenho.arestas.map((a) => `<path class="fx-aresta" data-tracejada="${a.tracejada}" d="${a.d}" marker-end="url(#fx-ponta)"/>`).join('')}</g>`
      + animacao + nos
      + `<g class="fx-rotulos">${desenho.arestas.flatMap((a) => a.rotulos.map((r) => `<text x="${r.x}" y="${r.y}" text-anchor="${r.anchor}">${escapar(r.texto)}</text>`)).join('')}</g>`
      + '</svg>';
  }

  function passoDoFluxo(no) {
    const n = (D.fluxo.nos || []).find((x) => x.id === no);
    if (!n) return '';
    const subs = linhasDe(n.sub);
    const bloco = (rot, corpo) => `<span class="rotulo-k">${rot}</span>${corpo}`;
    return `<aside class="resumo-pr passo-fluxo" data-classe="${escapar(n.classe || 'auto')}" aria-label="Passo ${escapar(n.titulo)}">`
      + `<div class="resumo-cab"><span class="fase-pr">${escapar(CLASSE[n.classe || 'auto'] || n.classe)}${subs.length ? ` · ${escapar(subs.join(' · '))}` : ''}</span>`
      + `<button type="button" class="btn fantasma pequeno" data-abrir="fluxo" aria-label="Fechar o passo">${icone('x')}</button></div>`
      + `<h3>${escapar(n.titulo)}</h3>`
      + (n.detalhe ? bloco('Como funciona', `<p>${escapar(n.detalhe)}</p>`) : '')
      + (n.porque ? bloco('Por que existe', `<p>${escapar(n.porque)}</p>`) : '')
      + (n.notas && n.notas.length ? bloco('Dentro deste passo', `<ul>${n.notas.map((t) => `<li>${escapar(t)}</li>`).join('')}</ul>`) : '')
      + (n.comando ? bloco('Comando', `<p class="mono">${escapar(n.comando)}</p>`) : '')
      + (n.skill && D.repo_url ? `<a class="repo-link mono" href="${escapar(`${D.repo_url}/blob/main/.claude/skills/${encodeURIComponent(n.skill)}/SKILL.md`)}" target="_blank" rel="noreferrer">.claude/skills/${escapar(n.skill)}/SKILL.md ${icone('externo')}</a>` : '')
      + '</aside>';
  }

  function fluxo(no, conteudo) {
    if (!desenho) { conteudo.innerHTML = vazio('Este repositório não tem o fluxo de trabalho desenhado.'); return; }
    // O desenho fica montado entre um passo e outro, como na aba: o pulso não recomeça a cada clique.
    const camada = conteudo.querySelector('.fluxograma-do-time');
    if (camada) {
      camada.querySelector('.passo-fluxo')?.remove();
      camada.insertAdjacentHTML('afterbegin', passoDoFluxo(no));
      camada.querySelectorAll('.fx-no').forEach((g) => {
        const on = String(g.getAttribute('data-no') === no);
        g.setAttribute('data-on', on);
        g.setAttribute('aria-pressed', on);
      });
      return;
    }
    const f = D.fluxo;
    conteudo.innerHTML = `<h2 class="aba-titulo">${escapar(f.titulo || 'Fluxo de trabalho')}</h2>`
      + '<p class="aba-nota">Passe o mouse num passo para ver o que ele faz e o comando. Clique para ler como ele funciona. Âmbar é onde alguém precisa agir.</p>'
      + `<div class="fluxograma-do-time">${passoDoFluxo(no)}<div class="fluxo-rolagem">${svgDoFluxo(no)}</div>`
      + (f.legenda && f.legenda.length ? `<div class="fx-legenda">${f.legenda.map((l) => `<span data-classe="${escapar(l.classe)}">${escapar(l.texto)}</span>`).join('')}</div>` : '')
      + '</div>'
      + (f.portas && f.portas.length ? '<section class="cartao-area"><h3>As portas de entrada</h3><div class="md-tabela"><table><thead><tr><th>Porta</th><th>Quando</th><th>Caminho</th></tr></thead><tbody>'
        + f.portas.map((p) => `<tr><td><b>${escapar(p.porta)}</b></td><td>${escapar(p.quando)}</td><td class="mono">${escapar(p.caminho)}</td></tr>`).join('')
        + '</tbody></table></div></section>' : '');
  }

  // ---------- Decisões ----------

  function adrAberta(a) {
    const citados = ligacoes.termosDaDecisao(a.number).map((s) => termos.find((t) => t.slug === s)).filter(Boolean);
    return `<aside class="resumo-pr adr-aberta" aria-label="ADR ${num4(a.number)}">`
      + `<div class="resumo-cab"><span class="fase-pr">ADR ${num4(a.number)} · ${escapar(STATUS[a.status] || a.status)}</span>`
      + `<button type="button" class="btn fantasma pequeno" data-abrir="decisoes" aria-label="Fechar a ADR">${icone('x')}</button></div>`
      + `<h3>${escapar(a.title)}</h3>`
      + vinculos(a).map(([rot, ns]) => `<div class="adr-vinculos"><span class="rotulo-k">${rot}</span>${ns.map((n) =>
        `<button type="button" class="chip" data-abrir="decisoes/${n}" title="${escapar(tituloDa(n) || '')}">${num4(n)}${tituloDa(n) ? ` ${escapar(cortar(tituloDa(n), 40))}` : ''}</button>`).join('')}</div>`).join('')
      + (citados.length ? `<div class="adr-vinculos termos-da-decisao"><span class="rotulo-k">termos</span>${citados.map((t) =>
        `<span class="explica termo-glossario" data-explica="termo:${t.slug}"><button type="button" class="chip" data-abrir="glossario/${t.slug}">${escapar(t.nome)}</button></span>`).join('')}</div>` : '')
      + `<div class="md-repo">${marcarTermosNoHtml(markdown(a.body_md, 4), citados)}</div>`
      + (D.repo_url ? `<a class="repo-link mono" href="${escapar(`${D.repo_url}/blob/main/${a.file}`)}" target="_blank" rel="noreferrer">${escapar(a.file)} ${icone('externo')}</a>` : '')
      + '</aside>';
  }

  function decisoes(aberta, conteudo) {
    if (!D.adrs.length) { conteudo.innerHTML = vazio('Este repositório não tem docs/adr.'); return; }
    const fora = D.adrs.filter((a) => a.status !== 'accepted').length;
    const adr = D.adrs.find((a) => a.number === aberta) || null;
    const grupos = gruposDeDecisoes(D.adrs, D.temas, estado.historico, estado.busca);
    conteudo.innerHTML = (fora ? `<div class="filtros"><button type="button" class="chip" data-acao="historico" aria-pressed="${estado.historico}">Ver histórico <span class="num">${fora}</span></button></div>` : '')
      + (adr ? adrAberta(adr) : '')
      + (grupos.length ? '' : vazio('Nenhuma decisão com essa busca.'))
      + grupos.map((g) => `<details class="tema-adr" open><summary><span>${escapar(g.tema)}</span> <span class="num">${g.adrs.length}</span></summary>`
        + `<div class="grade-adr linha-do-tempo">${g.adrs.map((a) =>
          `<button type="button" class="adr-mini" data-status="${PONTO[a.status] || 'erro'}" aria-pressed="${a.number === aberta}" data-abrir="${a.number === aberta ? 'decisoes' : `decisoes/${a.number}`}" title="${escapar(a.decisao.replace(/\*\*|`/g, ''))}">`
          + `<span class="adr-cab"><span class="mono">${num4(a.number)}</span><span class="adr-ponto" aria-label="${escapar(STATUS[a.status] || a.status)}"></span></span>`
          + `<span class="adr-titulo">${escapar(a.title)}</span>`
          + (a.substituida_por.length ? `<span class="nota">substituída pela ${a.substituida_por.map(num4).join(', ')}</span>` : '')
          + '</button>').join('')}</div></details>`).join('');
    if (adr) conteudo.querySelector('.adr-aberta').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // ---------- Glossário ----------

  function glossarioDaPagina(alvo, conteudo) {
    if (!D.glossario) { conteudo.innerHTML = vazio('Este repositório não tem CONTEXT.md.'); return; }
    const filtradas = filtrarGlossario(estado.busca, alvo);
    if (secoes.length && !filtradas.length) { conteudo.innerHTML = vazio('Nenhum termo com essa busca.'); return; }
    conteudo.innerHTML = `<nav class="indice-glossario" aria-label="Termos">${filtradas.map((s) => `<div><span class="rotulo-k">${escapar(s.titulo)}</span><div class="chips-pequenos">`
        + s.termos.map((t) => `<button type="button" class="chip" aria-pressed="${t.slug === alvo}" data-abrir="glossario/${t.slug}">${escapar(t.nome)}</button>`).join('')
        + '</div></div>').join('')}</nav>`
      + filtradas.map((s) => `<section class="secao-glossario"><h2 class="aba-titulo">${escapar(s.titulo)}</h2><dl>${s.termos.map((t) => {
        const ds = [...ligacoes.decisoesDoTermo(t.slug)].sort((a, b) => b - a);
        return `<div id="g-${t.slug}" class="termo" data-alvo="${t.slug === alvo}"><dt>${escapar(t.nome)}</dt><dd>`
          + `<span>${markdown(t.definicao).replace(/^<p>|<\/p>$/g, '')}</span>`
          + (t.evitar ? `<span class="evitar">Evitar: ${escapar(t.evitar)}</span>` : '')
          + (ds.length ? `<span class="adr-vinculos decisoes-do-termo"><span class="rotulo-k">decisões</span>${ds.map((n) =>
            `<button type="button" class="chip" data-abrir="decisoes/${n}" title="${escapar(tituloDa(n) || '')}">${num4(n)} ${escapar(cortar(tituloDa(n) || '', 40))}</button>`).join('')}</span>` : '')
          + '</dd></div>';
      }).join('')}</dl></section>`).join('')
      + `<details class="fonte-md"><summary>Ver o CONTEXT.md inteiro</summary><div class="md-repo">${markdown(D.glossario)}</div></details>`;
    if (alvo) document.getElementById(`g-${alvo}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ---------- o Cartão de explicação (Explica e ExplicaNoSvg) ----------

  const LARGURA = 280;
  let aberto = null;

  function cartao(ex) {
    const el = document.createElement('span');
    el.className = 'explica-cartao';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', ex.titulo);
    el.innerHTML = `<span class="micro">${escapar(ex.titulo)}</span><span class="explica-regra">${escapar(ex.regra)}</span>`
      + (ex.campos.length ? `<dl class="explica-campos">${ex.campos.map((c) => `<div><dt>${escapar(c.rotulo)}</dt><dd>${escapar(c.texto)}</dd></div>`).join('')}</dl>` : '');
    return el;
  }

  function fecharCartao() {
    if (aberto) aberto.cartao.remove();
    aberto = null;
  }

  // A caixa do fluxograma e o termo citado no texto da decisão abrem o cartão solto na camada (fora da rolagem),
  // logo abaixo deles; o chip do termo abre dentro dele, como o Explica do app.
  function abrirCartao(alvo) {
    if (aberto && aberto.alvo === alvo) return;
    fecharCartao();
    const chave = alvo.getAttribute('data-explica') || `termo:${alvo.getAttribute('data-termo')}`;
    const ex = explicacoes.get(chave);
    if (!ex) return;
    const el = cartao(ex);
    const camada = alvo.closest('.fluxograma-do-time, .adr-aberta');
    if (alvo.classList.contains('explica') || !camada) {
      alvo.appendChild(el);
    } else {
      const r = alvo.getBoundingClientRect();
      const base = camada.getBoundingClientRect();
      el.classList.add('solto');
      el.style.setProperty('--x', `${Math.max(0, Math.min(r.left - base.left, base.width - LARGURA))}px`);
      el.style.setProperty('--y', `${r.bottom - base.top}px`);
      camada.appendChild(el);
    }
    aberto = { alvo, cartao: el };
  }

  const ALVO = '[data-explica], .termo-citado';
  const conteudo = document.getElementById('conteudo');
  const entrar = (e) => { const alvo = e.target.closest && e.target.closest(ALVO); if (alvo) abrirCartao(alvo); };
  const sair = (e) => {
    if (!aberto) return;
    const para = e.relatedTarget;
    if (!para || !(aberto.alvo.contains(para) || aberto.cartao.contains(para))) fecharCartao();
  };
  conteudo.addEventListener('mouseover', entrar);
  conteudo.addEventListener('focusin', entrar);
  conteudo.addEventListener('mouseout', sair);
  conteudo.addEventListener('focusout', sair);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') fecharCartao();
    const no = e.target.closest && e.target.closest('.fx-no');
    if (no && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); no.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  conteudo.addEventListener('click', (e) => {
    if (aberto && !aberto.cartao.contains(e.target)) fecharCartao();
    const no = e.target.closest('.fx-no');
    if (no) { const id = no.getAttribute('data-no'); abrir(id === rota().resto ? 'fluxo' : `fluxo/${id}`); return; }
    const botao = e.target.closest('[data-abrir], [data-acao]');
    if (!botao) return;
    if (botao.getAttribute('data-acao') === 'historico') { estado.historico = !estado.historico; desenhar(); return; }
    abrir(botao.getAttribute('data-abrir'));
  });

  // ---------- a página ----------

  const busca = document.getElementById('busca');
  busca.addEventListener('input', () => { estado.busca = busca.value; desenhar(); });
  document.getElementById('partes').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) abrir(b.getAttribute('data-parte'));
  });

  let parteDesenhada = null;
  function desenhar() {
    const { parte, resto } = rota();
    const buscando = estado.busca.trim() !== '';
    const achados = {
      decisoes: gruposDeDecisoes(D.adrs, D.temas, estado.historico, estado.busca).reduce((n, g) => n + g.adrs.length, 0),
      glossario: filtrarGlossario(estado.busca).reduce((n, s) => n + s.termos.length, 0),
    };
    document.getElementById('partes').innerHTML = PARTES.map(([k, nome]) =>
      `<button type="button" data-parte="${k}" aria-pressed="${parte === k}">${nome}${buscando && k in achados ? `<span class="num">${achados[k]}</span>` : ''}</button>`).join('');
    document.getElementById('filtros').style.display = parte === 'fluxo' ? 'none' : '';
    document.getElementById('contagem').textContent = `${termos.length} termos · ${D.adrs.length} decisões`;
    fecharCartao();
    if (parte !== parteDesenhada) conteudo.innerHTML = '';
    parteDesenhada = parte;
    if (parte === 'fluxo') fluxo(resto, conteudo);
    else if (parte === 'decisoes') decisoes(Number(resto) || null, conteudo);
    else glossarioDaPagina(resto, conteudo);
  }

  document.getElementById('titulo').textContent = D.projeto || '';
  window.addEventListener('hashchange', desenhar);
  desenhar();
})();
</script>
</body>
</html>
