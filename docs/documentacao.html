e l\u00e1 tem quatro abas (Issues, PRs, Produ\u00e7\u00e3o e Documenta\u00e7\u00e3o), com o fluxograma do processo e um bal\u00e3o curto em cada passo. A Ana tinha outro desenho: o Cockpit com mesa, grafo e radar, as etiquetas `canal:` e `radar`, nenhum PR e nenhum CI, e skills do Matt Pocock de uma vers\u00e3o diferente da do pipeline. O Pedro pediu os mesmos conceitos nos tr\u00eas.\n\n## Decis\u00e3o\n\n1. **O Ana OS \u00e9 o painel do fluxo.** `tools/workflow-dashboard/` veio do IAE OS e o `os/server.py` o serve na raiz da porta 8777, com o `/api/data` do coletor. O Cockpit sai: a aba Issues faz o papel da mesa, do grafo e do radar.\n2. **As esferas viram sub-abas de Documenta\u00e7\u00e3o.** O que a Ana faz, As regras, Onde busca e Global Health continuam desenhadas pelo motor do Retrato em `os/esferas.html`, dentro de um quadro do painel, com os dados ao vivo do `os/server.py`. Ficam ao lado de Fluxo, Mapa, Decis\u00f5es, Gloss\u00e1rio e Stack.\n3. **Etiquetas do fluxo.** `canal:comigo` virou `ready-for-agent`; `canal:dispare` e `canal:aguardando` viraram `ready-for-human`; `radar` virou `needs-triage` quando a issue n\u00e3o tinha canal. As etiquetas antigas sa\u00edram. O \"Bloqueada por\" do corpo virou o bloqueio nativo do GitHub.\n4. **O pipeline do IAE, adaptado.** Entram `/ask-ana`, `/grill-with-docs`, `/to-prd`, `/to-issues`, `/pegar-issue`, `/tdd`, `/ship`, `/onda-enxuta`, `/express`, `/minhas-issues` e os agentes `ana-implementador`, `ana-revisor` e `ana-corretor`. Saem as skills da outra vers\u00e3o que faziam o mesmo papel. As pr\u00f3prias da Ana (`bancada`, `testes`, `check`) ficam.\n5. **O \"app\" \u00e9 a pasta `ana/`.** PR que toca `ana/` passa pelo `ana-revisor` uma vez e pelo CI; o resto \u00e9 ferramenta e passa s\u00f3 pelo CI.\n6. **Sem deploy.** A subida termina no merge, como no IAE. A aba Produ\u00e7\u00e3o mostra \"sem deploy ainda\". O que muda na plataforma fazer.ai continua sendo aplicado \u00e0 m\u00e3o.\n7. **Nada de push direto na `main`.** Tudo entra por branch e PR.\n\n## Alternativas\n\n- **Manter o Cockpit e s\u00f3 acrescentar abas.** Dois lugares para ver as issues, com etiquetas diferentes dos outros dois projetos. Descartado.\n- **Reescrever as esferas no painel novo.** O motor do Retrato tamb\u00e9m desenha o site do diretor; duplicar o desenho faria os dois divergirem. Descartado: o quadro reaproveita o motor.\n\n## Consequ\u00eancias\n\n- O `/check` e o `os/roadmap_github.py` leem as etiquetas novas.\n- As p\u00e1ginas de `os/arquivo/` seguem abrindo por URL direta, com a barra estreita.\n- Quando a Ana ganhar deploy autom\u00e1tico, a Fase 4.4 do roteiro de instala\u00e7\u00e3o do Hospital (`tools/instalar-fluxo/ROTEIRO.md`) diz o que adaptar na subida.", "cita": [], "decisao": "", "emenda": [30, 31, 34], "emendada_por": [], "file": "docs/adr/0035-o-programa-ana-adota-o-fluxo-do-iae-e-do-hospital.md", "number": 35, "slug": "0035-o-programa-ana-adota-o-fluxo-do-iae-e-do-hospital", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O programa Ana adota o fluxo de trabalho do IAE e do Hospital"}], "fluxo": {"arestas": [{"de": "grill", "para": "porta"}, {"de": "porta", "meio": 0.3, "para": "toprd", "rotulo": "A: pedido grande"}, {"de": "porta", "para": "issue", "rotulo": "B: uma tarefa s\u00f3"}, {"de": "porta", "meio": 0.3, "para": "ship", "rotulo": "C: ajuste pequeno"}, {"de": "toprd", "para": "toissues"}, {"de": "toissues", "para": "montar"}, {"de": "montar", "para": "onda"}, {"de": "issue", "para": "onda"}, {"de": "onda", "para": "revisao"}, {"de": "ship", "modo": "lado", "para": "revisao"}, {"de": "revisao", "para": "merge", "rotulo": "tudo certo"}, {"de": "merge", "para": "deploy"}, {"de": "deploy", "para": "demonstracao", "rotulo": "no ar"}], "fonte": "Pacote do fluxo (ADR 0023 do PedroOS). Mude aqui e vale em todo Projeto; a raia pr\u00f3pria de um Projeto fica em `raias`, no bloco `fluxo` de projetos/<nome>.j plano em tarefas", "titulo": "/to-issues", "w": 240, "x": 2, "y": 3.85}, {"classe": "auto", "comando": "/montar-ondas-enxutas", "detalhe": "Olha as fatias abertas, separa as que mexem nos mesmos arquivos e monta as Ondas em ordem. No fim pergunta se pode lan\u00e7ar.", "id": "montar", "skill": "montar-ondas-enxutas", "sub": "monta as Ondas sem conflito", "titulo": "/montar-ondas-enxutas", "w": 240, "x": 2, "y": 4.8}, {"classe": "auto", "comando": "/triage", "detalhe": "O pedido vira uma issue s\u00f3, com a lista do que conta como pronto. Essa lista vira os testes, e \u00e9 ela que o revisor confere. Depois a issue entra na pr\u00f3xima Onda.", "id": "issue", "skill": "triage", "sub": "uma tarefa que diz o que \u00e9 pronto", "titulo": "Issue com crit\u00e9rios", "w": 240, "x": 6, "y": 2.9}, {"classe": "auto", "comando": "/ship \"<descri\u00e7\u00e3o>\"", "detalhe": "Para o ajuste pequeno que j\u00e1 est\u00e1 pronto: salva a mudan\u00e7a, roda os testes e abre o PR, sem PRD e sem issue.", "id": "ship", "skill": "ship", "sub": "o ajuste vai direto para o PR", "titulo": "/ship", "w": 240, "x": 10, "y": 2.9}, {"classe": "auto", "comando": "/onda-enxuta #PRD", "detalhe": "Uma sess\u00e3o de fundo pega as tarefas da Onda, uma por agente, e cada agente abre o PR da sua. Voc\u00ea s\u00f3 entra quando alguma coisa precisa de voc\u00ea, e o aviso chega no celular.", "id": "onda", "notas": ["/tdd: cada tarefa come\u00e7a pelo teste que falha, e o c\u00f3digo vem depois.", "Checagens: os testes, o CI e as lentes de seguran\u00e7a e de design rodam em todo PR.", "Retro: quando a Onda termina, a /retro-onda pode tirar dela o que melhorar no fluxo."], "skill": "onda-enxuta", "sub": ["o agente faz as tarefas em lotes", "e abre um PR por tarefa"], "titulo": "/onda-enxuta", "w": 420, "x": 4, "y": 6.0}, {"classe": "auto", "comando": "agentes onda-revisor e onda-corretor", "detalhe": "Um agente que n\u00e3o escreveu o c\u00f3digo l\u00ea o PR procurando s\u00f3 o que \u00e9 grave. Se achar problema, outro agente corrige e os testes rodam de novo. Depois de tr\u00eas tentativas sem sucesso, a tarefa volta para uma pessoa com o motivo escrito.", "id": "revisao", "sub": ["um revisor l\u00ea o PR uma vez", "o corretor conserta o que ele achar"], "titulo": "Revis\u00e3o", "w": 420, "x": 6, "y": 7.3}, {"classe": "auto", "comando": "fechar_onda.py", "detalhe": "Com a revis\u00e3o e o CI verdes, a subida junta os PRs na main um de cada vez. Se um der problema, s\u00f3 ele sai do lote e os outros seguem.", "id": "merge", "sub": "um PR de cada vez", "titulo": "Merge", "w": 240, "x": 6, "y": 8.4}, {"classe": "auto", "comando": "fechar_onda.py", "detalhe": "Um deploy por Onda: a vers\u00e3o nova sobe, e a subida confere se o app responde com ela. No Projeto que n\u00e3o tem deploy, o caminho termina no merge.", "id": "deploy", "sub": "a vers\u00e3o nova vai para o ar", "titulo": "Deploy", "w": 240, "x": 6, "y": 9.5}, {"classe": "fim", "comando": "/divulgar, ou Gerar demonstra\u00e7\u00e3o na aba Ondas", "detalhe": "Com a entrega no ar, o v\u00eddeo narrado e a p\u00e1gina mostram o que mudou para quem usa. Um PRD tem uma Demonstra\u00e7\u00e3o s\u00f3, com as fatias juntas.", "id": "demonstracao", "sub": "o v\u00eddeo do que mudou", "titulo": "Demonstra\u00e7\u00e3o", "w": 240, "x": 6, "y": 10.6}], "portas": [{"caminho": "/to-prd, /to-issues, /montar-ondas-enxutas, /onda-enxuta", "porta": "A. PRD e fatias", "quando": "Pedido grande: vira v\u00e1rias tarefas, mexe no banco ou quem decide precisa saber"}, {"caminho": "/triage, e a issue entra na Onda", "porta": "B. Issue \u00fanica", "quando": "Uma tarefa s\u00f3, que cabe numa sess\u00e3o"}, {"caminho": "/ship \"<descri\u00e7\u00e3o>\"", "porta": "C. PR direto", "quando": "Ajuste pequeno, que j\u00e1 est\u00e1 pronto"}], "raias": [{"id": "a", "titulo": "A. PRD e fatias", "x1": 0.1, "x2": 4.0, "y1": 2.35, "y2": 5.7}, {"id": "b", "titulo": "B. Issue \u00fanica", "x1": 4.1, "x2": 8.0, "y1": 2.35, "y2": 5.7}, {"id": "c", "titulo": "C. PR direto", "x1": 8.1, "x2": 11.9, "y1": 2.35, "y2": 5.7}], "tipo": "fluxo", "titulo": "Fluxo do time"}, "glossario": "# VITTA TECH: Contratos e Solu\u00e7\u00f5es\n\nContexto do relacionamento comercial entre a VITTA TECH (empresa do Pedro) e o cliente do setor de sa\u00fade: o contrato de presta\u00e7\u00e3o de servi\u00e7os e as solu\u00e7\u00f5es de software que ele cobre.\n\n## Language\n\n### Estrutura contratual\n\n**Contrato de Servi\u00e7os Cont\u00ednuos**:\nO contrato (\u00fanico) da rela\u00e7\u00e3o. A mensalidade \u00e9 a **soma dos Entreg\u00e1veis aceitos e em opera\u00e7\u00e3o**, numa escada de valor que cresce conforme cada entrega entra no ar: Aplicativo do hospital (R$ 5.000/m\u00eas vigentes) \u2192 Site e Central de Comando (+R$ 1.000) \u2192 Ana no WhatsApp (+R$ 2.000) \u2192 Meta de desempenho da Ana (+R$ 1.000), at\u00e9 R$ 9.000/m\u00eas. A frente do Site e da Central de Comando \u00e9 tocada por Lucas e Rib, com Pedro auxiliando.\n_Avoid_: contrato de consultoria; \"patamar\"; dois contratos separados (a ideia de um \"Contrato Ana\" \u00e0 parte foi descartada na consolida\u00e7\u00e3o, ver ADR-0002).\n\n**Entreg\u00e1vel**:\nCada solu\u00e7\u00e3o ou marco que, ao ser aceito e entrar em opera\u00e7\u00e3o, acrescenta o seu valor \u00e0 mensalidade. S\u00e3o modulares e somam na ordem em que s\u00e3o aceitos. O desenvolvimento e os estudos de viabilidade das entregas futuras j\u00e1 est\u00e3o inclu\u00eddos na mensalidade vigente, at\u00e9 que cada uma seja aceita.\n\n**Anexo de Entreg\u00e1vel**:\nAnexo do contrato que descreve uma entrega aceita e o valor mensal que ela destrava. A pilha de anexos cresce conforme as entregas acontecem.\n\n**Termo de Entreg\u00e1vel**:\nDocumento de 1 a 2 p\u00e1ginas assinado no aceite de uma entrega: descreve o que foi entregue, vira Anexo de Entreg\u00e1vel do contrato e faz o novo valor mensal passar a incidir, independentemente de aditivo.\n_Avoid_: termo de aceite de marco, aditivo (o termo dispensa aditivo formal)\n\n**Prote\u00e7\u00e3o de dados (LGPD)**:\nNo contrato, os pap\u00e9is Controlador (cliente) e Operador (VITTA), a seguran\u00e7a e os incidentes est\u00e3o na Cl\u00e1usula 8. Um Anexo de Prote\u00e7\u00e3o de Dados (DPA) standalone mais detalhado \u00e9 op\u00e7\u00e3o para quando a Ana entrar em opera\u00e7\u00e3o com dados sens\u00edveis de sa\u00fade.\n_Avoid_: DPA por contrato (s\u00f3 h\u00e1 um contrato agora)\n\n### Solu\u00e7\u00f5es\n\n**Aplicativo do hospital**:\nAplica\u00e7\u00e3o web j\u00e1 em produ\u00e7\u00e3o, hoje voltada \u00e0 gest\u00e3o de reuni\u00f5es (atas, assinaturas digitais, pend\u00eancias) e em evolu\u00e7\u00e3o cont\u00ednua para al\u00e9m de reuni\u00f5es. Sustenta os R$ 5.000/m\u00eas vigentes; a mensalidade cobre tamb\u00e9m o desenvolvimento e os estudos de viabilidade das pr\u00f3ximas entregas (entre elas a Ana), at\u00e9 cada uma ser aceita.\n_Avoid_: App de Reuni\u00f5es (nome antigo, restrito demais)\n\n**Site e Central de Comando**:\nSite institucional do cliente mais a Central de Comando a ele integrada. O aceite do **MVP do site** destrava +R$ 1.000/m\u00eas (mensalidade total R$ 6.000), que cobre a entrega e a gest\u00e3o/evolu\u00e7\u00e3o cont\u00ednua (frente de Lucas e Rib).\n\n**Central de Comando**:\nPainel administrativo que centraliza a gest\u00e3o dos ativos digitais do hospital: consome as m\u00e9tricas do site, traz um CMS para editar o conte\u00fado do site direto por l\u00e1, tem recursos de IA e integra APIs externas (entre elas a da Meta/Instagram). Integrada ao Site e entregue/evolu\u00edda na mesma esteira cont\u00ednua, dentro do mesmo +R$ 1.000.\n\n**Ana**:\nAgente de IA de atendimento e agendamento de pacientes via WhatsApp (fazer.ai agents + Chatwoot), com integra\u00e7\u00e3o ao sistema hospitalar MV via API Global Health pendente. Entreg\u00e1vel do Contrato de Servi\u00e7os Cont\u00ednuos: a **entrega funcional** (integra\u00e7\u00e3o com o MV operante, fluxos testados, em produ\u00e7\u00e3o) destrava +R$ 2.000 (total R$ 8.000); a **meta de desempenho (KPI)** destrava +R$ 1.000 (total R$ 9.000).\n\n**Meta da Ana**:\nIndicador de desempenho/maturidade da Ana, ainda **n\u00e3o definido**, que ao ser atingido destrava +R$ 1.000/m\u00eas. Marco pactuado por escrito no Termo de Entreg\u00e1vel correspondente.\n_Avoid_: KPI do Patamar 4; \"evolu\u00e7\u00e3o da Ana\" (nome antigo; virou meta de KPI)\n\n**Retell**:\nFuturo agente de voz conversacional (plataforma Retell) para o mesmo cliente. Amadurece depois da Ana; entrar\u00e1 no Contrato de Servi\u00e7os Cont\u00ednuos como novo Anexo de Entreg\u00e1vel.\n_Avoid_: Retail\n\n### Ana: linguagem do dom\u00ednio\n\n**fazer.ai agents (plataforma da Ana)**:\nA plataforma que executa a Ana desde 29/jul/2026 (tenant `vitta-tech`): prompt, ferramentas nativas, base de conhecimento e v\u00ednculo com as inboxes do Chatwoot. Observabilidade das conversas no Chatwoot e do racioc\u00ednio/custos no Langfuse. O n8n est\u00e1 aposentado (decis\u00e3o de 30/jul/2026; workflows a desativar, export preservado em `ana/workflows/`).\n_Avoid_: \"LangChain\" como nome da plataforma (\u00e9 o motor interno dela); tratar o n8n como c\u00e9rebro vivo da Ana.\n\n**Testes de viabilidade (sem GH)**:\nO est\u00e1gio atual do programa: provar que a Ana no fazer.ai agents segura o SOP no canal de teste, rodando gpt-5-mini e lendo as tabelas oficiais da [[base-ana]] ao vivo, sem nenhuma chamada \u00e0 Global Health. Conclu\u00eddo quando o Roteiro de cen\u00e1rios passa.\n_Avoid_: misturar integra\u00e7\u00e3o MV/GH neste est\u00e1gio (\u00e9 pendente, discutida em sess\u00e3o pr\u00f3pria).\n\n**Base Ana (app do hospital)**:\nA base edit\u00e1vel que alimenta a Ana. **Desde 19/ago/2026 (V26, o \u00faltimo passo do ADR-0015) mora no Postgres do Hospital Reuni\u00f5es**, o app que o hospital j\u00e1 usa e paga: as 5 tabelas (consultas particulares, exames, estimativas de cirurgias, conv\u00eanios por especialidade e protocolos de ouvidoria) s\u00e3o editadas na tela `/admin/dados-atendimento` (secret\u00e1rias e super admins editam, facilitadores leem) e no painel `/ouvidoria`; a Ana l\u00ea e escreve pelos endpoints `/api/ana/*` com API key de servi\u00e7o guardada no vault do fazer.ai; a mudan\u00e7a vale na resposta seguinte, sem cache. As 6 tools da Ana (1 a 4, 11 e 12) apontam todas para `api.hospitalsaomatheus.cloud`. **Hist\u00f3ria:** a Base Ana nasceu em 30/jul/2026 num NocoDB no Coolify da VPS (ADR-0006), substituindo o Google Sheets; migrou tabela a tabela entre 14 e 19/ago (V21, V22, V23, V24) e o servi\u00e7o `nocodb-base-ana` foi **parado** no Coolify em 19/ago/2026, com backup das 5 tabelas fora do git, paridade sem diverg\u00eancia de conte\u00fado e sinal verde na issue #293 do repo Hospital. Parado n\u00e3o \u00e9 removido: o servi\u00e7o fica assim por um tempo antes de qualquer remo\u00e7\u00e3o, e religar \u00e9 `coolify service start ucc0hkwgqdsa38p5xrwa1x0h`.\n_Avoid_: tratar o NocoDB como fonte viva (est\u00e1 parado e n\u00e3o volta a ser fonte) ou voltar a ler valores do Google Sheets; tratar a KB (`search_knowledge`) como fonte de valores (a preced\u00eancia \u00e9 das tabelas); p\u00f4r dado pessoal de paciente no app (a ouvidoria guarda \u00edndice, n\u00e3o dossi\u00ea).\n\n**Roteiro de cen\u00e1rios**:\nO crit\u00e9rio de pronto de cada vers\u00e3o de prompt: cen\u00e1rios com gabarito (esperado / falha se) rodados contra o canal real, conferindo no Chatwoot a etapa/tag e no Langfuse as ferramentas. Evoluiu por vers\u00f5es: v1 (06/ago, Telegram manual), v2 (12/ago, trio l\u00f3gico, 9/9 na bateria automatizada) e v3 (12/ago, valida a v6.3: regress\u00f5es do fluxo humano, exames, agenda GH/portal e robustez conversacional; `roadmap/roteiro-cenarios-v3.md`). Desde o v2 a execu\u00e7\u00e3o padr\u00e3o \u00e9 a **bateria automatizada pela inbox de API \"Ana E2E\"** (runner e2e.py, `/teste` como primeira mensagem), com o Telegram como confer\u00eancia opcional.\n_Avoid_: declarar teste conclu\u00eddo por conversa livre sem roteiro; esquecer que conversa de API n\u00e3o tem card no kanban (etapa se confere pelos logs).\n**Bancada de cen\u00e1rios**:\nO aparato versionado que executa um [[roteiro-de-cenarios]] contra o canal real: o runner `ana/bancada/e2e.py` mais um arquivo de cen\u00e1rios por roteiro em `ana/bancada/cenarios/`. Cada cen\u00e1rio declara os turnos a enviar e asser\u00e7\u00f5es literais (`contem`, `nao_contem`, `tools`); o runner conduz a conversa pela inbox de API \"Ana E2E\" do Chatwoot, coleta as ferramentas chamadas nos logs da plataforma (`GET /api/v1/logs`, chave `AGENTS_API_TOKEN` no `.env`) e imprime placar mais transcript. Nasce na V25 (18/ago/2026) para pagar a d\u00edvida do runner antigo, que vivia em scratchpad de sess\u00e3o e se perdeu. **Palavra de dois donos**: esta \u00e9 a *bancada de cen\u00e1rios* (c\u00f3digo no repo); a *bancada da API* \u00e9 a p\u00e1gina do [[ana-os]] que chama a API GH ao vivo (ver Playground GH). Uma execu\u00e7\u00e3o da bancada \u00e9 uma **bateria**; uma passada datada de um roteiro, com veredito anotado por cen\u00e1rio, \u00e9 uma **rodada**.\n_Avoid_: runner em scratchpad ou credencial escrita no c\u00f3digo (as chaves vivem no `.env`); confundir com a bancada da API GH (aquela \u00e9 p\u00e1gina do OS, esta \u00e9 c\u00f3digo); declarar placar sem o transcript junto.\n\n**Conversa gravada**:\nA \u00faltima conversa real de um cen\u00e1rio da [[bancada-de-cenarios]], guardada num arquivo por cen\u00e1rio em `ana/bancada/conversas/<id>.json`, dentro do git (ADR-0032, 09/out/2026): os turnos (o que o paciente enviou, o que a Ana respondeu), as ferramentas chamadas, as confer\u00eancias objetivas e o veredito. Cada bateria sobrescreve o arquivo; o hist\u00f3rico das rodadas \u00e9 o `git log`. \u00c9 o que o [[player]] toca.\n_Avoid_: conversa de exemplo escrita \u00e0 m\u00e3o (o OS s\u00f3 mostra conversa real); guardar contato com dado de paciente.\n\n**Bancada ao vivo**:\nO painel do Claude Code (mod em `.claude/skills/bancada/`, ADR-0033, 13/out/2026) com duas abas. A aba Bateria mostra a [[bancada-de-cenarios]] rodando: lista dos cen\u00e1rios com o estado de cada um, a conversa do selecionado turno a turno, as ferramentas e as confer\u00eancias, as rodadas da mesma bateria lado a lado e as marcas \"regrediu\" e \"melhorou\". L\u00ea o arquivo de eventos `ana/bancada/resultados/ao-vivo.jsonl`, que o runner escreve a cada acontecimento; parado, mostra a \u00faltima [[conversa-gravada]] de cada cen\u00e1rio. A aba Testes desenha o relat\u00f3rio da [[mesa-de-testes]] em cores, com filtros por tecla. Abre sozinho quando uma bateria come\u00e7a; `/bancada` abre, `/bancada testes` abre na aba Testes, `/bancada rodar` dispara uma rodada, `/bancada parar` encerra. A skill `bancada` \u00e9 o ritual das tr\u00eas rodadas com diagn\u00f3stico versionado em `ana/bancada/diagnosticos/`.\n_Avoid_: confundir com o [[player]] do Ana OS (o player toca a grava\u00e7\u00e3o pronta; o painel mostra o que est\u00e1 acontecendo); escrever no prompt ou nos cen\u00e1rios a partir do painel ou da skill (s\u00f3 leitura, como o OS).\n\n**Mesa de testes**:\nA skill `/testes` (13/out/2026): abre com o relat\u00f3rio dos cen\u00e1rios por capacidade (`ana/bancada/relatorio.py`: \u00faltimas 3 rodadas, intermitentes, regress\u00e3o contra a bateria anterior, capacidades e n\u00f3s do SOP sem cen\u00e1rio) e oferece quatro ramos no menu: ver, executar (pelo `e2e.py`, com a [[bancada-ao-vivo]] mostrando), montar (tr\u00eas propostas por valor, s\u00f3 em capacidade que existe, gravadas no `capacidades.json` depois da aprova\u00e7\u00e3o e rodadas uma vez) e revisar (apagar, reescrever ou manter, item a item). As pr\u00e1ticas que guiam montar e revisar vivem em `ana/bancada/PRATICAS.md`.\n_Avoid_: montar capacidade nova por aqui (\u00e9 issue); gravar cen\u00e1rio sem rodar uma vez; confundir com a skill `bancada`, que \u00e9 a bateria inteira com diagn\u00f3stico.\n\n**Player**:\nA tela do [[ana-os]] que toca uma [[conversa-gravada]] (ADR-0032): paciente \u00e0 esquerda, Ana \u00e0 direita, ferramentas entre os bal\u00f5es, confer\u00eancia falha em vermelho, avan\u00e7o por \"pr\u00f3ximo\". Aparece nos testes das capacidades, nas jornadas do Mapa do SOP (com o fluxograma acendendo ao lado) e nas ferramentas. O verbo \u00e9 **tocar** (\"tocar o C01\"). S\u00f3 no OS, n\u00e3o no Retrato.\n_Avoid_: \"percorrer a jornada\" como anima\u00e7\u00e3o sem conversa (virou o player); tocar cen\u00e1rio que nunca rodou.\n\n**Trio l\u00f3gico da Ana**:\nDesde 12/ago/2026 (ADR-0012, supera os \"Modos da Ana\" de jun/2026) a Ana se organiza em tr\u00eas agentes l\u00f3gicos: a **orquestradora** (triagem de urg\u00eancia, identifica\u00e7\u00e3o, conv\u00eanio, prontu\u00e1rio, d\u00favidas, encerramento), o **Particular** (comercial, valores, ancoragem, agendamento de consultas e exames, tools GH e a P6 quando acender) e a **Ouvidoria**. Como a plataforma n\u00e3o tem transfer\u00eancia entre agentes de IA, o trio vive como fonte compilada num agente f\u00edsico \u00fanico (a [[compilacao-de-prompt]]); vira tr\u00eas agentes f\u00edsicos quando o supervisor router da fazer.ai existir. Sem\u00e2ntica: o especialista devolve \u00e0 orquestradora entre assuntos; a triagem de urg\u00eancia \u00e9 Regra Global replicada nos tr\u00eas; thread com tag `ouvidoria` nunca roteia para o Particular (a antiga regra de exclus\u00e3o, agora regra de roteamento).\n_Avoid_: \"modos da Ana\" (termo superado); transfer\u00eancia no meio da jornada de venda (comercial e agendamento s\u00e3o o mesmo bloco); workaround de um agente chamar o playground do outro.\n\n**Compila\u00e7\u00e3o de prompt**:\nA fonte da verdade dos prompts do trio (ADR-0012): n\u00facleo comum (persona, tom, Regras Globais, princ\u00edpios) + um arquivo por agente l\u00f3gico, morando no repo. Uma sess\u00e3o Claude compila cada prompt final (podendo aparar o n\u00facleo por agente) e publica via `prompt_set`, carimbando vers\u00e3o. O Mapa do SOP l\u00ea os mesmos arquivos. A plataforma deixa de ser onde o prompt nasce e passa a ser onde ele roda.\n_Avoid_: editar prompt direto na plataforma sem passar pela fonte; Regra Global divergindo entre blocos.\n\n**Modelo padr\u00e3o do tenant (gpt-5.6-luna)**:\nDesde 12/ago/2026 (ADR-0013) todo agente do tenant roda `gpt-5.6-luna` (tier econ\u00f4mico da fam\u00edlia GPT-5.6 da OpenAI; pre\u00e7o cortado em 80% em 30/jul: $0,20/$1,20 por 1M tokens). A plataforma n\u00e3o exp\u00f5e `reasoning_effort` (feature request aberto); rollback documentado \u00e9 voltar a `gpt-5-mini`.\n_Avoid_: usar o alias `gpt-5.6` (aponta para o Sol, tier caro); citar o gpt-5-mini como modelo atual (\u00e9 hist\u00f3rico).\n\n**Bloco cadastral (nome + CPF)**:\nDesde 12/ago/2026 (ADR-0014, prompt v6.3) o \u00fanico conjunto de dados pessoais que a Ana pede na conversa: nome completo + CPF, numa \u00fanica mensagem, apenas nos fluxos que escalam para humano (2.4A, 3.2, 5.B) e no PASSO 1 da ouvidoria. Data de nascimento, telefone e e-mail nunca s\u00e3o pedidos: o telefone a equipe j\u00e1 tem pelo WhatsApp, e o cadastro completo na GH/MV \u00e9 feito pela equipe ao confirmar o agendamento (busca interna vazia vira anota\u00e7\u00e3o \"paciente sem cadastro no sistema\" no resumo da escalada). Na mesma decis\u00e3o, o **split de mensagens da plataforma foi desligado**: uma resposta da Ana \u00e9 uma \u00fanica mensagem (a corrida de chunks da bateria v2 gerava falsa dupla confirma\u00e7\u00e3o), e o cat\u00e1logo de tags fechou em 8 com a entrada da `emergencia` (aplicada na Se\u00e7\u00e3o 0 junto da escalada).\n_Avoid_: pedir nascimento/telefone em qualquer fluxo conversacional; reintroduzir cadastro pelo bot antes da P6; tag fora do cat\u00e1logo de 8; religar o split sem decis\u00e3o registrada.\n\n**Canal principal (WhatsApp oficial)**:\nO n\u00famero de WhatsApp do hospital que concentra o volume real de pacientes (~20 mil mensagens/m\u00eas e a fila de n\u00e3o respondidas do baseline). Hoje est\u00e1 conectado ao Kommo e \u00e9 atendido s\u00f3 por humanos; a Ana ainda n\u00e3o passa por ele. Levar a Ana para este canal \u00e9 a entrega que ataca a fila e realiza o valor do programa.\n\n**Canal de teste (Telegram)**:\nCanal Telegram (bot SaoMatheusBot) plugado no Chatwoot onde a Ana opera hoje, respondida pelo fazer.ai agents. \u00c9 o palco do Roteiro de cen\u00e1rios; sem o volume real do hospital.\n_Avoid_: dizer \"Ana em produ\u00e7\u00e3o\" sem qualificar o canal; \"ligar o bot na plataforma nova\" (a inbox do Telegram j\u00e1 est\u00e1 vinculada \u00e0 Ana; o que faltava era aposentar o n8n).\n\n**Kommo**:\nCRM legado do hospital, onde o canal principal est\u00e1 plugado hoje e onde os atendentes trabalham; fonte do baseline congelado do documento-mestre. Sai de cena quando o canal principal migrar para o Chatwoot.\n_Avoid_: buscar m\u00e9tricas da Ana no Kommo (a Ana n\u00e3o passa por l\u00e1)\n\n**Transbordo seletivo**:\nPol\u00edtica comercial decidida pela dire\u00e7\u00e3o (jul/2026): a Ana fecha consulta e exame particular sozinha, 24/7; o humano entra s\u00f3 para cirurgia, procedimento e negocia\u00e7\u00e3o de valores, al\u00e9m dos fallbacks t\u00e9cnicos. O SOP v2 j\u00e1 nasce com este desenho.\n_Avoid_: \"Ana aquece e o humano fecha\" como regra geral (modelo anterior \u00e0 decis\u00e3o)\n\n**Congelamento do Chatwoot (fase de testes)**:\nDecis\u00e3o de 06/jul/2026: enquanto a fase de testes da integra\u00e7\u00e3o MV n\u00e3o termina, a configura\u00e7\u00e3o atual do Chatwoot (etapas, tags, estados, nomes) n\u00e3o muda. A estrutura da se\u00e7\u00e3o 4 do documento-mestre (funil de 7 etapas, fam\u00edlias de tags, estados, SLA) \u00e9 a espec-alvo para depois, discutida e configurada junto com a entrada no canal principal.\n\n**Chatwoot Pro (o canal da Ana)**:\nA instala\u00e7\u00e3o do Chatwoot da fazer.ai em `chatwoot.mala-ia.cloud` (conta 1), edi\u00e7\u00e3o **Pro**, por onde a Ana ouve e fala. Container pr\u00f3prio, separado da plataforma fazer.ai agents. Desde 26/ago/2026 (**ADR-0024**) a **vers\u00e3o** dele \u00e9 fato rastreado do programa: o n\u00famero instalado se pergunta ao vivo (`GET /api` devolve `{\"version\": ...}` sem credencial), o atraso aparece no [[mapa-da-integracao]] e no `/check`, a leitura curada das vers\u00f5es mora em `ana/plataforma/chatwoot-releases.md`, e o acervo se refaz com `python3 ana/plataforma/scripts/fetch-chatwoot-releases.py`. Subir de vers\u00e3o \u00e9 pr\u00e9-requisito da Ana entrar num n\u00famero de WhatsApp real (tarefa V32). O [[congelamento-do-chatwoot]] congela **configura\u00e7\u00e3o**, n\u00e3o vers\u00e3o: s\u00e3o coisas diferentes.\n_Avoid_: confundir com a **plataforma fazer.ai agents** (`agents.hospitalsaomatheus.cloud`, numera\u00e7\u00e3o pr\u00f3pria, hoje 1.4.1); tratar a nota de release como prova de que um bug morreu (a `.112` descreve o bug da V8 e a inspe\u00e7\u00e3o do fork CE contradiz: s\u00f3 o teste depois de subir vale); escrever o n\u00famero da vers\u00e3o em arquivo do repo ou do `os/dados/` (regra do ADR-0017).\n\n**Diferenciais**:\nColunas da tabela de consultas particulares da [[base-ana]] que trazem o destaque do hospital por especialidade. S\u00e3o o insumo da ancoragem de valor no modo comercial (os `[Diferencial_1]`/`[Diferencial_2]` do SOP), lidos pela tool `consultar_precos_consultas` (sucessora da `Get_Consultas` do n8n).\n_Avoid_: \"justificativa de especialidade\" (termo usado na conversa com o diretor; o mecanismo \u00e9 este)\n\n**P\u00f3s-atendimento**:\nAgente novo, separado da Ana, proativo e anal\u00edtico: dispara pesquisa de satisfa\u00e7\u00e3o em massa (come\u00e7ando s\u00f3 pelo eletivo), classifica respostas e gera relat\u00f3rio por setor/profissional/per\u00edodo. Dois mecanismos: escuta interna (sem filtro) + motor de reputa\u00e7\u00e3o Google (sem review gating). Pr\u00e9-condi\u00e7\u00e3o: fonte de dados do MV com desfecho. A Frente 4 foi estendida (jul/2026) com a gest\u00e3o de avalia\u00e7\u00f5es do Google Meu Neg\u00f3cio: rascunhos de resposta gerados por IA, publica\u00e7\u00e3o s\u00f3 com aprova\u00e7\u00e3o humana (regra dura para avalia\u00e7\u00f5es negativas).\n_Avoid_: \"modo pesquisa da Ana\" (\u00e9 agente separado); review gating; publicar resposta a avalia\u00e7\u00e3o sem aprova\u00e7\u00e3o humana\n\n**Paciente-sonda**:\nO cadastro de teste TESTE INTEGRACAO ANA VITTA (CPF 66301102770, id 1681) criado de prop\u00f3sito na homologa\u00e7\u00e3o da Global Health (07/jul/2026). \u00c9 a refer\u00eancia fixa dos testes de leitura da API e da investiga\u00e7\u00e3o sobre qual banco MV a homolog enxerga.\n_Avoid_: apagar o registro; usar CPF de paciente real em teste.\n\n**Protocolo da ouvidoria**:\nO n\u00famero que a Ana informa ao paciente ao registrar uma manifesta\u00e7\u00e3o, no formato ANO-NNNN (ex.: 2026-0007). Nasceu na OV1 (06/ago/2026, ADR-0010) na tabela `5_Ouvidoria_Protocolos` do NocoDB. **Desde 18/ago/2026 (V24, ADR-0015 fase 2) mora no Postgres do Hospital Reuni\u00f5es**, na tabela `ouvidoria_protocolos`: o n\u00famero \u00e9 gerado pelo banco (sequence + coluna gerada), nunca composto pelo modelo, e o NNNN \u00e9 cont\u00ednuo, n\u00e3o reinicia por ano. Diferente do protocolo de agendamento (num\u00e9rico, devolvido pela Global Health), que nunca se mistura com este. Guarda s\u00f3 o \u00edndice da manifesta\u00e7\u00e3o (data, prazo, status, categoria, setor, resumo em linguagem de relato): nome, CPF e relato completo ficam na conversa do Chatwoot. Se a grava\u00e7\u00e3o falhar, vale a Regra H\u00edbrida e a Ana n\u00e3o cita n\u00famero algum. Regra da v6.3 (12/ago/2026, ressalva R4): **protocolo em m\u00e3os = protocolo comunicado**, a mensagem final e o resumo interno DEVEM conter o n\u00famero quando ele existe. **Desenho da v6.4 (18/ago/2026, ADR-0016):** o POST devolve o n\u00famero na pr\u00f3pria resposta, ent\u00e3o o registro \u00e9 **uma chamada s\u00f3** (a trava das duas chamadas era artefato do NocoDB, onde o POST s\u00f3 devolvia o `Id`); a trava dura continua, ancorada em \"c\u00f3pia literal do campo `protocolo` da resposta de `registrar_ouvidoria` nesta conversa\". A tool 12 deixou de ser passo do registro e virou consulta por ANO-NNNN para o **paciente que volta** (Se\u00e7\u00e3o 7.5), informando s\u00f3 data e prazo, nunca o `status` nem o `resumo`. O elo com a conversa vive na **dire\u00e7\u00e3o inversa**: `{{conversation_id}}` n\u00e3o existe na plataforma (lista fechada de 10 vari\u00e1veis), ent\u00e3o a Ana grava uma nota interna `PROTOCOLO ANO-NNNN` e quem est\u00e1 no painel busca esse n\u00famero no Chatwoot.\n_Avoid_: a Ana compor ou estimar o n\u00famero; nome ou CPF na tabela; ler o \u00faltimo protocolo e incrementar; responder ao paciente sem o n\u00famero tendo o protocolo em m\u00e3os; ler o `status` da manifesta\u00e7\u00e3o para o paciente (\"respondido\" \u00e9 a equipe interna ter fechado, n\u00e3o o paciente ter sido contatado); esperar que `conversa_id` venha preenchido.\n\n**Base TST (Oracle do MV)**:\nO banco Oracle de teste do MV que o DBeaver e a sess\u00e3o Claude leem diretamente (prefixo `tst`, ~2,5 mil pacientes, base viva). Regra de acesso (07/jul/2026): homolog = leitura direta pela sess\u00e3o; produ\u00e7\u00e3o = s\u00f3 o Pedro, manualmente, no DBeaver. N\u00e3o est\u00e1 confirmado que \u00e9 o mesmo banco que a homologa\u00e7\u00e3o da Global Health enxerga; at\u00e9 prova em contr\u00e1rio (pergunta GH-18), tratar como ambientes distintos.\n_Avoid_: chamar de \"produ\u00e7\u00e3o\"; assumir que escrita via API GH aparece nela sem verificar.\n\n**Playground GH (bancada e roteiro)**:\nA se\u00e7\u00e3o do [[ana-os]] dedicada ao ensaio da API GH de homologa\u00e7\u00e3o (desde o ADR-0007 \u00e9 se\u00e7\u00e3o, n\u00e3o mais o portal inteiro): a **bancada da API** (chamar cada endpoint da homologa\u00e7\u00e3o, ver a resposta crua, painel \"No banco\" execut\u00e1vel contra a Base TST e a [[prova-no-banco]] nas escritas) e o **roteiro por endpoint** (passo a passo com os dados mocados + query de confer\u00eancia para colar no DBeaver: nas escritas, prova de inser\u00e7\u00e3o antes/depois; nos GETs, query espelho para bater com a resposta da API). Chamada ao vivo, s\u00f3 homologa\u00e7\u00e3o/TST; produ\u00e7\u00e3o jamais \u00e9 chamada.\n_Avoid_: apontar qualquer rota para produ\u00e7\u00e3o; usar \"playground\" para o portal inteiro (o portal \u00e9 o Ana OS).\n\n**Cadeias (p\u00e1gina do Ana OS)**:\nSe\u00e7\u00e3o do [[ana-os]] (06/ago/2026) que conta a API GH de homologa\u00e7\u00e3o como seis hist\u00f3rias encadeadas do hospital, em que a resposta de um elo alimenta o seguinte, cobrindo os 22 endpoints do [[mapa-das-apis]]: A paciente novo chega pelo WhatsApp (GET antes com zero, POST /pessoas, GET reencontrando por CPF e por telefone), B paciente conhecido (o [[paciente-sonda]]), C conv\u00eanio e carteiras (a \u00e1rvore conv\u00eanio \u2192 plano \u2192 sub-plano e a API recusando dado incompleto), D agendar consulta (especialidade \u2192 prestadores \u2192 conv\u00eanio \u2192 hor\u00e1rios \u2192 instru\u00e7\u00f5es/tipos \u2192 finaliza\u00e7\u00e3o), E agendar exame (triagem, preparo e anexos) e F gerir o agendado (listar, detalhar, remarcar, cancelar). Desde 08/set/2026 (ADR-0027) cada elo roda sozinho ou em sequ\u00eancia, com o contexto da cadeia guardado entre cliques: antes de rodar mostra a **entrada** (cada campo com o valor, de qual elo veio e por qu\u00ea), depois mostra a **sa\u00edda** (o que segue e para qual elo), com veredito (funcionou / vazio esperado / recusou / bloqueado / n\u00e3o roda daqui / s\u00f3 conversa / falha real) e o payload e a resposta crua expans\u00edveis. Ao lado de cada elo, a **conversa da Ana pareada**: a fala do paciente, as ferramentas que ela chama naquele momento (com o [[selo-de-origem]] e a marca \"n\u00e3o tem\" onde ela n\u00e3o pode chamar) e a mensagem dela, montada com a resposta real quando d\u00e1. Elos \"s\u00f3 conversa\" cobrem o que sai da Global Health (pre\u00e7o na API do Hospital, handoff) sem a p\u00e1gina perder a origem \u00fanica. Os quatro elos da Se\u00e7\u00e3o 2.3.1 s\u00e3o compartilhados entre as cadeias C (conv\u00eanio, ADR-0025) e D (particular, a conversa real de 08/set). Os dados mocados da escrita s\u00e3o regenerados aleatoriamente a cada execu\u00e7\u00e3o (CPF, telefone, nascimento, sexo), sempre com o nome-prefixo TESTE DEMO ANA VITTA. As finaliza\u00e7\u00f5es (agendar, reagendar, cancelar) nunca rodam da p\u00e1gina: s\u00e3o atos deliberados da bancada, com [[prova-no-banco]]. \u00c9 a tela oficial da demonstra\u00e7\u00e3o ao diretor, em dois atos (decis\u00e3o de 06/ago/2026, reescrita em 08/set/2026): Ato 1, o sistema responde (Cadeias A e C); Ato 2, a Ana achando hor\u00e1rio real de Cardiologia elo a elo (Cadeia D) e o que ainda falta para ela marcar sozinha.\n_Avoid_: CPF real em demonstra\u00e7\u00e3o; cadastro de teste sem o prefixo TESTE DEMO; tratar cadeia como teste de endpoint solto (isso \u00e9 a bancada); rodar finaliza\u00e7\u00e3o pela p\u00e1gina; tratar a conversa pareada como sa\u00edda do modelo (\u00e9 curada do prompt e da conversa real, n\u00e3o gerada); chamar a Ana de verdade pela p\u00e1gina (isso \u00e9 o playground da plataforma).\n\n**Massa pr\u00f3pria (homolog)**:\nO caminho aberto em 26/ago/2026 (ADR-0023, tarefa V31) para preencher o cat\u00e1logo vazio da homologa\u00e7\u00e3o sem esperar a GH-19: o tutorial oficial da MV (`ana/api-mv/tutorial-agenda-online-gh.pdf`, \"Disponibiliza\u00e7\u00e3o de agenda no ambiente Online\") mostra que a massa nasce de cadastro comum, agenda p\u00fablica no SoulMV com prestador vinculado ao item de agendamento e unidade preenchida, mais a ativa\u00e7\u00e3o do item no Painel de Controle GH (com conv\u00eanio vinculado ao plano, ou a flag de exibir agendas sem conv\u00eanio). Divis\u00e3o de pap\u00e9is: o analista de TI cadastra no SoulMV TST (o Pedro n\u00e3o tem acesso ao Soul), o Pedro inspeciona e ativa no Painel GH de homologa\u00e7\u00e3o (acesso confirmado), a sess\u00e3o prova pelo `smoke-gh.py`. Pedido m\u00ednimo: 1 agenda de Cardiologia, o cen\u00e1rio da vitrine da V15. Nenhum passo exige VPN do Pedro. O pendente GH19 segue aberto: a massa pr\u00f3pria prova o circuito das tools; homologar conte\u00fado real continua precisando da GH.\n_Avoid_: tocar o Painel de produ\u00e7\u00e3o (homologa\u00e7\u00e3o somente); pedido grande ao analista (uma agenda prova o circuito); tratar a massa pr\u00f3pria como cancelamento da GH-19; confundir com o [[pacote-de-absorcao]] (que \u00e9 retrato de produ\u00e7\u00e3o, outro mundo).\n\n**Atlas do banco (produ\u00e7\u00e3o)**:\nAs p\u00e1ginas do portal que retratam o banco DBAMV de PRODU\u00c7\u00c3O: modelo real, rela\u00e7\u00f5es, dom\u00ednios, volumes, cruzamento com os endpoints da GH e a se\u00e7\u00e3o de insights para diretoria e novos fluxos. Nunca chama banco nenhum ao vivo: \u00e9 alimentado pelos CSVs do [[pacote-de-absorcao]] depositados em `absorcao-producao/resultados/` (o servidor os exp\u00f5e em leitura; `amostras/` nunca \u00e9 servida). Nasce com hip\u00f3teses e ganha evid\u00eancia conforme os CSVs chegam (C9). Arquivado em `os/arquivo/` desde 20/ago/2026 (ADR-0019): volta ao menu quando a colheita C8 rodar e os CSVs chegarem ao dep\u00f3sito.\n_Avoid_: dado pessoal de paciente no atlas; confundir retrato da produ\u00e7\u00e3o com a bancada homolog (cada p\u00e1gina declara seu ambiente).\n\n**Pacote de absor\u00e7\u00e3o (produ\u00e7\u00e3o)**:\n`ana/api-mv/absorcao-producao/`: queries prontas que o Pedro roda manualmente no DBeaver da PRODU\u00c7\u00c3O (\u00fanica via permitida para produ\u00e7\u00e3o), com instru\u00e7\u00e3o passo a passo e nome de arquivo de resultado pr\u00e9-definido por query. Duas camadas de resultado: cat\u00e1logo, contagens e dom\u00ednios (commit\u00e1veis, sem dado pessoal) e amostras completas (pasta `resultados/amostras/`, ignorada pelo git). A pasta de resultados \u00e9 a base de conhecimento que as sess\u00f5es futuras leem para raciocinar sobre o banco real; parte das perguntas do C6 e o GH-18 se respondem empiricamente por ela. Ciclo: C7 (montar, Claude) \u2192 C8 (rodar, Pedro) \u2192 C9 (absorver, Claude).\n_Avoid_: rodar o pacote pela sess\u00e3o (produ\u00e7\u00e3o \u00e9 sempre manual, no DBeaver); credencial de produ\u00e7\u00e3o no `.env`; dado pessoal em resultado commit\u00e1vel.\n\n**Prova no banco**:\nO veredito autom\u00e1tico do Playground GH para chamadas de escrita: fotografa o resultado da query de verifica\u00e7\u00e3o na Base TST antes da chamada, roda de novo depois, e mostra a diferen\u00e7a (a linha que apareceu ou mudou). Tr\u00eas desfechos: criou (diff vis\u00edvel), nada mudou, ou API recusou (sucesso: false). Desde a resposta da D\u00e1cilla (MV, 24/jul/2026), a prova s\u00f3 \u00e9 decisiva na [[finalizacao-do-agendamento]]: nos passos intermedi\u00e1rios (pessoas, anexos etc.) \"nada mudou\" \u00e9 o comportamento esperado, porque esses dados moram no banco SaaS da GH, n\u00e3o no Soul.\n_Avoid_: tratar \"resposta 200 da API\" como prova de escrita; esperar que POST /pessoas apare\u00e7a na PACIENTE (n\u00e3o aparece por arquitetura, n\u00e3o por falha).\n\n**Finaliza\u00e7\u00e3o do agendamento**:\nO ato que efetiva a marca\u00e7\u00e3o: o `POST /horarios/agendar` (e seus derivados `reagendar` e o DELETE de cancelar). Fato oficial da MV (D\u00e1cilla, suporte MV, 24/jul/2026): a API de agendamento WhatsApp roda sobre o banco SaaS da Global Health (inacess\u00edvel aos hospitais) e os dados do paciente s\u00f3 s\u00e3o gravados no Soul (banco MV) no momento da finaliza\u00e7\u00e3o. \u00c9 o \u00fanico ponto do fluxo onde faz sentido procurar o agendamento no Oracle. Na homolog, a hip\u00f3tese \u00e9 que o Soul correspondente seja a Base TST; provar isso \u00e9 a forma atual da pergunta GH-18.\n_Avoid_: procurar no Oracle efeitos de passos intermedi\u00e1rios do fluxo; tratar GH-18 como respondida antes de uma finaliza\u00e7\u00e3o bem-sucedida aparecer na TST.\n\n**Fachada de agenda (desenho GH1)**:\nA decis\u00e3o da sess\u00e3o de desenho GH1 (06/ago/2026, ADR-0009): a Ana n\u00e3o ganha 22 tools, uma por endpoint da API GH; ela ganha as **7 ferramentas de agenda que o SOP reescrito j\u00e1 define** (`docs/04-sop-ana-reescrito.md`), cada uma encapsulando a cadeia de endpoints correspondente. Implementa\u00e7\u00e3o por fases: P4 (identifica\u00e7\u00e3o, tools HTTP diretas), P5 (disponibilidade e pr\u00e9-requisitos, via proxy fino de orquestra\u00e7\u00e3o na VPS), P6 (finaliza\u00e7\u00e3o e gest\u00e3o, gated pela [[prova-no-banco]]/GH-18). Token GH sempre em credencial/vault, nunca no prompt do agente; sanitiza\u00e7\u00e3o de entrada (nome sem n\u00fameros, CPF 11 d\u00edgitos, enums em caixa alta) e tradu\u00e7\u00e3o do 417 para a Regra H\u00edbrida acontecem na fachada. A metade de **busca** da identifica\u00e7\u00e3o est\u00e1 implementada desde 06/ago/2026 (V12): as tools `buscar_paciente_por_cpf` e `buscar_paciente_por_telefone` na plataforma, com a credencial `gh-homolog-token` no vault (tipo header, header `Token`) e o prompt do agente na v5.1 (se\u00e7\u00e3o Identifica\u00e7\u00e3o de Paciente com guardrail de LGPD e o PASSO 3.5 do Princ\u00edpio de Coleta: busca autom\u00e1tica ap\u00f3s CPF validado, resultado s\u00f3 no resumo interno da escalada). A fase P4 fechou em 07/ago/2026 (V14) com o **cadastro**: a tool `cadastrar_paciente` (`POST /pessoas` da homolog, id 7, risco medium) s\u00f3 dispara quando a busca por CPF volta vazia e o paciente confirma os quatro dados; o prompt est\u00e1 na v5.2 (PASSO 3.6 do Princ\u00edpio de Coleta). Payload m\u00ednimo aceito pela API: nome, CPF, data de nascimento e telefone; sexo \u00e9 opcional e ficou de fora para n\u00e3o custar uma pergunta. A sanitiza\u00e7\u00e3o \u00e9 da fachada: nome sem n\u00fameros (417), CPF 11 d\u00edgitos e data em aaaa-mm-dd (a API grava a data crua, sem normalizar). Regras pr\u00e1ticas da inst\u00e2ncia: `input_schema` das tools HTTP no **formato compacto nativo** (`{campo: {type, required, description}}`), porque a vers\u00e3o implantada n\u00e3o normaliza JSON Schema padr\u00e3o (campo-fantasma e query vazio; achado da V12, no report V10); e o nome do campo do `input_schema` precisa ser **id\u00eantico \u00e0 chave do JSON** enviado no body, sen\u00e3o o valor chega vazio na API (achado da V14). O systemPrompt tem teto de 50.000 caracteres que o dry_run n\u00e3o valida (achado da V14). A fase P5 (disponibilidade) entrou em 07/ago/2026 (V15) com **tools HTTP diretas**, desvio consciente do proxy fino previsto no ADR-0009: a cadeia da via particular tem s\u00f3 dois elos (GET /consultas acha o item agend\u00e1vel, GET /agendas/v2 lista os hor\u00e1rios; prestadores \u00e9 informativo e o ramo de conv\u00eanio segue no portal), e o antiloop que motivava o proxy virou regra de porta (elo 1 vazio para a cadeia; a mesma chamada nunca se repete com os mesmos argumentos). Tr\u00eas tools de leitura (ids 8, 9 e 10: `consultar_especialidades_agenda`, `consultar_horarios_livres`, `consultar_prestadores_agenda`), mesma credencial. Prompt na v5.3 (dieta de 49.991 para 49.353 caracteres: sa\u00edram as men\u00e7\u00f5es ao `resolve_conversation`, fora dos grants desde a V6, e duplica\u00e7\u00f5es literais entre prompt e descriptions; entrou a Se\u00e7\u00e3o 2.3.1 com os PASSO A1/A2/A3). Com a GH-19 pendente, o caso vazio \u00e9 regra expl\u00edcita: a Ana informa que a agenda online est\u00e1 indispon\u00edvel, nunca sugere ou estima hor\u00e1rio, nunca diz que est\u00e1 marcado, e cai na escalada da 2.4A; a vitrine com slots reais destrava sozinha quando a massa for publicada. O proxy volta a ser avaliado na P6. Corre\u00e7\u00e3o de contrato (07/ago): `GET /pessoas` n\u00e3o usa o envelope `conteudo` (objeto puro quando encontra, corpo vazio quando n\u00e3o encontra), diferente de `/consultas`, `/prestadores`, `/convenios` e `/exames`. **Desde 12/ago/2026 (ADR-0014) o cadastro pelo bot est\u00e1 suspenso:** a tool `cadastrar_paciente` saiu do grant do agente (a defini\u00e7\u00e3o fica na plataforma) e o [[bloco-cadastral]] \u00e9 s\u00f3 nome + CPF; o cadastro volta ao bot junto com a P6.\n_Avoid_: tool crua por endpoint no agente; token GH no prompt; a Ana prometer protocolo antes de a GH-18 estar provada; JSON Schema padr\u00e3o em `input_schema` de tool HTTP da inst\u00e2ncia; a Ana expor ao paciente dado de cadastro que ele n\u00e3o informou; a Ana oferecer, estimar ou prometer hor\u00e1rio que n\u00e3o veio de ferramenta nesta conversa; a Ana dizer que um hor\u00e1rio est\u00e1 marcado, reservado ou garantido antes da P6.\n\n**Hotfix do prompt**:\nPrimeira fase de execu\u00e7\u00e3o (decis\u00e3o desta sess\u00e3o): corrigir o prompt em produ\u00e7\u00e3o antes da integra\u00e7\u00e3o MV. Escopo: triagem de urg\u00eancia como nova Regra Global 1, Regra 6 reescrita (Ana assume \"assistente virtual\"), exclus\u00e3o comercial\u2194ouvidoria, guardrails jur\u00eddicos da ouvidoria e ajustes menores.\n\n### Programa (documento-mestre)\n\n**Documento-mestre**:\n`Documento-Mestre_Programa-Ana-CRM.md`, na raiz do repo: o registro vivo do programa mantido com a dire\u00e7\u00e3o do hospital. O log de decis\u00f5es (se\u00e7\u00e3o 7) e as quest\u00f5es em aberto (se\u00e7\u00e3o 8) s\u00e3o a mem\u00f3ria compartilhada; decis\u00e3o fechada l\u00e1 n\u00e3o se reabre, e o roadmap do repo deve se manter coerente com elas.\n\n**Frentes (1 a 4)**:\nAs quatro frentes do programa: 1 atendimento e agendamento aut\u00f4nomo no WhatsApp; 2 captura e convers\u00e3o do paciente particular; 3 ouvidoria 24/7; 4 voz do paciente e p\u00f3s-atendimento (inclui a reputa\u00e7\u00e3o no Google).\n\n**Fases do Programa**:\nFase 1: Ana no WhatsApp (frentes 1 a 4 conforme maturidade). Fase 2: agente de voz no telefone. \"Fase\" sem qualificador refere-se a estas; as etapas internas de execu\u00e7\u00e3o s\u00e3o as trilhas do TODO.\n_Avoid_: numerar entregas internas como \"Fase N\" solta (colide com as fases do programa)\n\n### Roadmap e cockpit\n\n**Ana OS**:\nO cockpit \u00fanico do programa (decis\u00e3o de 30/jul/2026, ADR-0007): o portal local em `localhost:8777` evolui, muda para a pasta `os/` na raiz e passa a reunir tudo numa navega\u00e7\u00e3o comum, no visual do `DESIGN.md` (desde 31/jul/2026, ADR-0008: refer\u00eancia refero, sidebar preta flutuante s\u00f3 de \u00edcones, canvas claro, cards brancos arredondados, tema claro \u00fanico; substituiu o estilo Aaply): desde o saneamento de 20/ago/2026 (ADR-0019) o menu \u00e9 enxuto: home dashboard com indicadores funcionais do roadmap e a [[mesa-de-acao]], o [[grafo-de-execucao]], diagrama de arquitetura dos canais, Mapa do SOP, Circuito da Ana, Mapa da Integra\u00e7\u00e3o, Compara\u00e7\u00e3o, [[testes-manuais]] (a d\u00e9cima p\u00e1gina, ADR-0020, exce\u00e7\u00e3o consciente ao enxugamento: n\u00e3o guarda dado novo), a bancada da API GH e as Cadeias. Sete p\u00e1ginas antigas ([[mapa-das-apis]], o [[atlas-do-banco]], absor\u00e7\u00e3o, insights, roteiro, conex\u00e3o TST e a [[biblioteca]]) moram intactas em `os/arquivo/`, fora do menu, abertas por URL direta. Substituiu o `roadmap/mapa.html` (aposentado em `roadmap/arquivo/` em 30/jul/2026). As regras de ambiente do ADR-0004 continuam valendo p\u00e1gina a p\u00e1gina.\nDesde 09/set/2026 (ADR-0028) o menu tem **cinco abas**, uma por pergunta: Cockpit (mesa de a\u00e7\u00e3o e grafo), Mecanismo (Circuito, com a Arquitetura e o Mapa da Integra\u00e7\u00e3o absorvidos), Mapa do SOP, Provas (Compara\u00e7\u00e3o, Testes manuais e Fam\u00edlias juntos) e Global Health (as Cadeias); a Bancada da API GH foi para `os/arquivo/`. O OS \u00e9 **s\u00f3 leitura**: nenhuma escrita pela tela, todo estado muda por sess\u00e3o no terminal. O que se mostra para fora \u00e9 o [[retrato-da-ana]], produto separado.\nDesde o ADR-0030 (terceiro grilling de 09/set/2026) o OS \u00e9 **uma p\u00e1gina s\u00f3** (`os/index.html`), o esqueleto do Retrato vestido de Ledger: a aba **Cockpit** (mesa de a\u00e7\u00e3o, grafo e o radar em uma linha por item) mais as **quatro esferas com os mesmos nomes e a mesma ordem do Retrato** (O que a Ana faz hoje, As regras da Ana, Onde ela busca a resposta, Global Health: o que d\u00e1 e o que n\u00e3o d\u00e1), desenhadas pelos motores JS do pr\u00f3prio Retrato (servidos por `/retrato/`, fonte \u00fanica) sobre o dado montado ao vivo pela rota `/api/retrato` (o `gerar.py` chamado em processo). Por cima, a [[camada-de-operacao]]. O leitor \u00e9 um arquiteto: o Pedro e quem pegar o programa depois. As cinco p\u00e1ginas do ADR-0028 (Cockpit, Mecanismo, Mapa do SOP, Provas, Cadeias) est\u00e3o intactas em `os/arquivo/`, fora do menu. As aplica\u00e7\u00f5es externas viraram \u00edcones na sidebar.\nDesde 09/out/2026 (ADR-0031) o Cockpit \u00e9 a **aba do GitHub**: l\u00ea as [[issue-do-roadmap]] pelo `gh` (via `os/roadmap_github.py`, rota `/api/roadmap` com a mesma forma de antes e `/api/issue/<n>` para o detalhe), com filtros com contagem (canal, \u00e1rea, estado, busca), funil, mesa, grafo, radar e o card da issue com linha do tempo e coment\u00e1rios. Segue s\u00f3 leitura: escrever \u00e9 `gh` na sess\u00e3o.\nDesde 06/nov/2026 o Ana OS saiu do repo (`os/server.py`, `os/esferas.html`, `os/assets/`, `os/arquivo/` e `tools/workflow-dashboard/`): o painel das issues \u00e9 o PedroOS (repo `pedrorezendefig/os`). Ficaram `os/dados/`, que o `retrato/gerar.py`, a bancada e o `smoke-hospital.py` leem ou gravam, e `os/roadmap_github.py`, que mede o term\u00f4metro do `/check`. O resto deste verbete \u00e9 hist\u00f3ria.\n_Avoid_: \"playground\" como nome do portal inteiro (virou se\u00e7\u00e3o do OS); manter mapa.html e OS vivos ao mesmo tempo; terceira \"central\" paralela; estilo Aaply como refer\u00eancia (aposentado); publicar o OS na Vercel (o que sobe \u00e9 o Retrato); bot\u00e3o ou formul\u00e1rio que escreve no roadmap. Desde o ADR-0030: nome de aba diferente do Retrato; texto que explica de novo o que o desenho ao lado j\u00e1 mostra; copiar os motores do Retrato para `os/assets/` (o server serve a pasta original); o OS ler o `retrato.json` publicado (o OS l\u00ea o agora).\n\n**Retrato da Ana**:\nO segundo produto do programa (09/set/2026, ADR-0028): um site est\u00e1tico em `retrato/` na raiz, publicado na Vercel, que mostra ao diretor do hospital o que a Ana \u00e9 hoje. Quatro **esferas**, uma aba nomeada cada: **O que a Ana faz hoje** (capacidades, promete versus entrega, com prova), **As regras da Ana** (o prompt completo e literal: Mapa do SOP e anatomia das se\u00e7\u00f5es com as ferramentas), **Onde ela busca a resposta** (ferramentas e integra\u00e7\u00f5es juntas, por origem) e **Global Health: o que d\u00e1 e o que n\u00e3o d\u00e1** (cadeias A a F com a conversa da Ana, s\u00f3 o veredito). O \"o que falta\" mora dentro de cada esfera como estado do item. Sem servidor e sem dado ao vivo: `retrato/gerar.py` grava um JSON carimbado com a data, e o rodap\u00e9 diz \"retrato de DD/MM/AAAA\". O script recusa gerar se achar CPF, paciente-sonda, URL de ambiente, token, credencial ou ID de tarefa. Miolo literal, moldura em linguagem de diretor. Desde o ADR-0029 (09/set/2026) veste o design system do app do hospital (HP Simplified, azul-marinho, cantos pequenos, vidro s\u00f3 na barra de abas e nos pain\u00e9is flutuantes; se\u00e7\u00e3o pr\u00f3pria no `DESIGN.md`), obedece o [[contrato-de-links]], tem barra de filtros em toda esfera (busca mais chips, filtro na URL) e tr\u00eas fluxogramas na gram\u00e1tica do hospital com bot\u00e3o de percorrer (caminho de uma mensagem, cadeia elo a elo, jornada no mapa).\n_Avoid_: chamar de vitrine (a vitrine \u00e9 a lista de hor\u00e1rios reais), de painel (\u00e9 o `/ouvidoria` e o Painel GH) ou de cockpit (\u00e9 o Ana OS); aba de pr\u00f3ximos passos no Retrato; traduzir os n\u00f3s do SOP \u00e0 m\u00e3o; dado ao vivo; senha.\n\n**Contrato de links (Retrato e Ana OS)**:\nA regra de navega\u00e7\u00e3o do ADR-0029 (09/set/2026): toda men\u00e7\u00e3o a ferramenta, se\u00e7\u00e3o do prompt, n\u00f3 do mapa, capacidade ou cadeia \u00e9 link para o item, e todo item lista, linkados, os que o mencionam (a volta). O link troca de aba ou de p\u00e1gina sozinho, rola at\u00e9 o alvo e o acende por dois segundos; a URL carrega destino e filtro (`#<aba>/<alvo>?<filtros>` no Retrato; no OS, desde o ADR-0030, a mesma gram\u00e1tica em `index.html#<aba>/<alvo>?<filtros>`, com o `liga.js` do Retrato cuidando da chegada e a aba `cockpit` a mais, por exemplo `#cockpit/no-V37` abre a ficha do n\u00f3 no grafo). Item sem liga\u00e7\u00e3o real n\u00e3o ganha link inventado.\n_Avoid_: link que s\u00f3 vai e n\u00e3o volta; alvo que n\u00e3o acende ao chegar; liga\u00e7\u00e3o escrita \u00e0 m\u00e3o no HTML quando o dado (secao_ids, ferramentas por se\u00e7\u00e3o, ferramenta por elo) j\u00e1 existe no JSON.\n\n**Camada de opera\u00e7\u00e3o (Ana OS)**:\nO que o Ana OS mostra al\u00e9m do que o [[retrato-da-ana]] mostra (ADR-0030, 09/set/2026), pela regra de corte do terceiro grilling: tr\u00eas camadas e nada mais. (a) O **ao vivo**: selo de origem lido da plataforma, a chamada real de cada ferramenta (m\u00e9todo e caminho, de `/api/tools`), a vers\u00e3o do Chatwoot (`/api/chatwoot`) e o bot\u00e3o de rodar cada elo da Global Health na homologa\u00e7\u00e3o (motor em `os/assets/cadeias-motor.js`, sem DOM, extra\u00eddo da p\u00e1gina Cadeias), com entrada de cada valor, resultado, sa\u00edda que segue, o que foi enviado e a resposta crua; elo rodado com sucesso monta a fala da Ana com a resposta real. (b) A **prova crua**: os testes manuais de cada capacidade (de `comparacao.json`) e as fam\u00edlias da bancada, com o c\u00f3digo do cen\u00e1rio. (c) O **Cockpit**. Vive em `os/assets/os-esferas.js`, que escuta o evento `retrato:pronto` dos motores do Retrato e acrescenta por cima. Tudo o que era texto explicativo repetindo o desenho ao lado saiu do menu e vive nas p\u00e1ginas arquivadas.\n_Avoid_: p\u00f4r na camada o que o Retrato j\u00e1 mostra; texto de manual explicando o desenho; dado ao vivo sem dizer quando foi lido; escrever pela tela.\n\n**Roadmap do OS**:\nA estrutura do roadmap dentro do Ana OS: **Est\u00e1gio atual** (tarefas Vn, disciplinadas, espelho do TODO.md), **Pendente** (d\u00edvidas conscientes, uma linha cada), a faixa de **Ideias** e a camada de [[propostas]]. Desde 31/jul/2026 (ADR-0008) \u00e9 renderizado tamb\u00e9m como [[grafo-de-execucao]] em p\u00e1gina pr\u00f3pria; segue sem trilho da receita, sem criticidade derivada, com m\u00e9tricas sempre funcionais. Os dados vivem em arquivo JSON versionado (n\u00e3o em HTML); o `/check` reconcilia TODO.md com esse arquivo, preservando propostas e prompts (que n\u00e3o t\u00eam espelho narrativo).\nDesde 09/out/2026 (ADR-0031) o roadmap **mora nas Issues do GitHub** (`pedrorezendefig/programa-ana`): o `roadmap.json` morreu, o TODO.md ficou s\u00f3 narrativa, Pendente e Propostas acabaram (o GitHub s\u00f3 tem aberta ou fechada), o est\u00e1gio \u00e9 o milestone. Ver [[issue-do-roadmap]], [[area-label]] e [[canal-de-acao]].\n_Avoid_: \"vista Foco\"; trilho da receita, alavanca do dia, esfor\u00e7o P/M/G e criticidade (conceitos do mapa arquivado); reintroduzir mensalidade/KPI; card do n8n no painel; kanban de colunas.\n\n**Grafo de execu\u00e7\u00e3o**:\nA p\u00e1gina Roadmap do Ana OS (ADR-0008): grafo SVG sem biblioteca externa que renderiza tarefas, pendentes e [[propostas]] como n\u00f3s com depend\u00eancias, em colunas da esquerda para a direita (feitas \u2192 est\u00e1gio ativo \u2192 propostas \u2192 horizonte). Cada n\u00f3 acion\u00e1vel tem o seu [[prompt-de-no]] com bot\u00e3o de copiar; n\u00f3 feito aparece conclu\u00eddo, sem bot\u00e3o; n\u00f3 bloqueado fica esmaecido mostrando quem o bloqueia. Reverte conscientemente o \"sem grafo\" do ADR-0007: o prop\u00f3sito \u00e9 outro (mapa de leitura e execu\u00e7\u00e3o, n\u00e3o mesa de arrastar cards).\nDesde 09/set/2026 (ADR-0028) o grafo mora na home do Cockpit, abaixo da [[mesa-de-acao]], renderizado por `os/assets/grafo.js`; a p\u00e1gina roadmap.html morreu.\nDesde 09/out/2026 (ADR-0031) as faixas do grafo s\u00e3o as seis [[area-label]] (a primeira label `area:` da issue), as arestas v\u00eam de `## Bloqueada por`, e os filtros de dono, pendente e proposta sumiram.\n_Avoid_: edi\u00e7\u00e3o de n\u00f3s pelo grafo (n\u00e3o existe escrita pela tela desde o ADR-0028); tratar o grafo como fonte do estado (a fonte \u00e9 TODO.md + roadmap.json).\n\n**Mesa de a\u00e7\u00e3o (home do Ana OS)**:\nA se\u00e7\u00e3o principal da home desde 11/ago/2026 (OS12, ADR-0011), no lugar dos antigos cards de destaque: todos os itens abertos do roadmap (tarefas a fazer, pendentes, propostas e radar) agrupados por [[canal-de-acao]], cada card com hover mostrando a ficha `mesa {destrava, gesto}` e clique fixando painel com a nota, o prompt copi\u00e1vel **rotulado pelo canal** (prompt de terminal para dispare/aguardando, que guia ou redige a a\u00e7\u00e3o externa; prompt de sess\u00e3o para comigo, que executa a tarefa) e, nos cards dispare, o gesto **\"marquei: disparado\"** (move para aguardando com a data do dia, a \u00fanica escrita da mesa). Card sem prompt exibe \"sem prompt ainda\": \u00e9 defeito vis\u00edvel a corrigir, n\u00e3o estado aceit\u00e1vel. Itens de espera mostram a idade (\"h\u00e1 N dias\", vermelho a partir de 14). Responde \"o que eu toco agora e o que est\u00e1 na m\u00e3o de quem\"; o [[grafo-de-execucao]] segue respondendo \"como as coisas se encadeiam\".\nDesde 09/set/2026 (ADR-0028) o gesto \"marquei: disparado\" n\u00e3o existe mais: mover de canal \u00e9 pedido no terminal e a sess\u00e3o escreve nos dois arquivos.\nDesde 09/out/2026 (ADR-0031) a mesa l\u00ea as issues abertas do GitHub; o canal \u00e9 a label `canal:` e a idade vem da data do evento da label. Ganhou filtros com contagem, funil e o card da issue com linha do tempo.\n_Avoid_: derivar canal de dono/deps (canal \u00e9 ju\u00edzo de situa\u00e7\u00e3o curado); hist\u00f3rico de movimentos por card (a hist\u00f3ria mora em canal_desde + log do TODO.md); mesa mostrando item conclu\u00eddo; escrita pela tela.\n\n**Canal de a\u00e7\u00e3o**:\nO campo `canal` dos itens abertos do `roadmap.json` (com `canal_desde`, a data de entrada no canal): **dispare** (depende s\u00f3 do Pedro, minutos: enviar mensagem, criar tabela, clicar em painel), **comigo** (resolve numa sess\u00e3o Claude Code) e **aguardando** (j\u00e1 foi pedido a terceiro; aqui mora a cobran\u00e7a, com a idade \u00e0 vista). \u00c9 a taxonomia do /check virando dado: as sess\u00f5es escrevem, a UI da mesa s\u00f3 move dispare \u2192 aguardando, e o /check \u00e9 o fiador da atualidade na reconcilia\u00e7\u00e3o. A distin\u00e7\u00e3o que vale ouro: cobran\u00e7a pronta n\u00e3o enviada \u00e9 **dispare** (est\u00e1 na m\u00e3o do Pedro), n\u00e3o aguardando.\nDesde 09/out/2026 (ADR-0031) o canal \u00e9 a **label `canal:dispare` / `canal:comigo` / `canal:aguardando`** da issue, uma por issue aberta, obrigat\u00f3ria; `canal_desde` morreu (a idade vem do evento `labeled`), e o \"dono\" tamb\u00e9m: o canal j\u00e1 diz quem move. Mover \u00e9 `gh issue edit N --add-label canal:x --remove-label canal:y`.\n_Avoid_: canal em item conclu\u00eddo; quarto canal; \"aguardando\" para o que ningu\u00e9m pediu ainda (exce\u00e7\u00e3o deliberada: a P3 aguarda a VPN, cujo pedido \u00e9 o card P2).\n\n**Issue do roadmap**:\nDesde 09/out/2026 (ADR-0031), um card do roadmap \u00e9 uma Issue do repo privado `pedrorezendefig/programa-ana`: aberta \u00e9 a fazer, fechada \u00e9 feita; t\u00edtulo em linguagem de a\u00e7\u00e3o; labels [[area-label]] e [[canal-de-acao]] (mais `radar` ou `in-progress`); corpo com as se\u00e7\u00f5es fixas `## Destrava`, `## Gesto`, `## Pronto quando`, `## Prompt`, `## Bloqueada por` (uma linha `#N` por depend\u00eancia) e `## Nota`, e `Antes: <ID antigo>` na primeira linha das migradas; a ficha de conclus\u00e3o (Fez, Mudou, Valor) \u00e9 o coment\u00e1rio `## Ficha` do fechamento; o milestone \u00e9 o est\u00e1gio. O ID \u00e9 o n\u00famero da issue. O term\u00f4metro do est\u00e1gio \u00e9 fechadas sobre o total, sem `radar`.\n_Avoid_: espelho em arquivo (TODO.md, JSON); \"bloqueada\" escrita \u00e0 m\u00e3o (deriva de `## Bloqueada por`); issue aberta sem `canal:`, sem Gesto ou sem Prompt (defeito vis\u00edvel); mudar o estado pela tela do OS.\n\n**\u00c1rea (label)**:\nA categoria de uma [[issue-do-roadmap]], como label `area:`: `global-health`, `ana`, `fazer-ai`, `chatwoot`, `app-hospital`, `os`. Uma issue pode ter mais de uma; a primeira \u00e9 a faixa do [[grafo-de-execucao]]. Substitui o campo `tema` do roadmap.json.\n_Avoid_: s\u00e9tima \u00e1rea sem decis\u00e3o do Pedro; \u00e1rea como substituto do canal (\u00e1rea diz do que \u00e9, canal diz quem move).\n\n**Mapa do SOP (p\u00e1gina do Ana OS)**:\nO retrato visual do comportamento da Ana (06/ago/2026, a proposta P7 executada como V13; desde o ADR-0030 \u00e9 a se\u00e7\u00e3o \"O mapa das regras\" da aba As regras da Ana do `os/index.html`, desenhada pelo `sop.js` do Retrato; a p\u00e1gina `os/arquivo/sop.html` segue intacta): `os/sop.html` desenha o SOP inteiro em oito raias (as cinco jornadas, mais entrada e sa\u00edda transversais e a raia de apoio de prontu\u00e1rio/d\u00favidas), com etapas, decis\u00f5es e chamadas de tool ligadas por setas. Cada n\u00f3 carrega a \u00e2ncora do prompt: o trecho literal, guardado em `os/dados/sop-fluxo.json`, que originou aquele passo. O mapa retrata um prompt congelado (a vers\u00e3o e a data de exporta\u00e7\u00e3o ficam carimbadas no JSON e no cabe\u00e7alho da p\u00e1gina). Desde o ADR-0018 (19/ago/2026) h\u00e1 uma exce\u00e7\u00e3o declarada: cada n\u00f3 de tool carrega o [[selo-de-origem]], que \u00e9 lido ao vivo da plataforma. Trecho literal \u00e9 retrato datado; selo de origem \u00e9 de agora, e a p\u00e1gina diz qual \u00e9 qual. A re-valida\u00e7\u00e3o \u00e9 feita por sess\u00e3o Claude, que reexporta o prompt e procura cada trecho como texto exato; trecho n\u00e3o encontrado \u00e9 n\u00f3 defasado. N\u00e3o confundir com o SOP em texto (`docs/04-sop-ana-reescrito.md`), que \u00e9 o documento de origem, nem com o [[grafo-de-execucao]], que mapeia tarefas do programa e n\u00e3o o comportamento do agente.\n_Avoid_: tratar o mapa como fonte viva do prompt (\u00e9 retrato datado); editar os trechos literais \u00e0 m\u00e3o; confundir com o grafo de execu\u00e7\u00e3o.\n\n**Circuito da Ana (p\u00e1gina do Ana OS)**:\nA vis\u00e3o do mecanismo (10/ago/2026, OS10; desde o ADR-0028 \u00e9 a aba **Mecanismo**, que abre com o desenho da Arquitetura e fecha com o [[mapa-da-integracao]]; desde o ADR-0030 o que sobrou dela vive na aba Onde ela busca a resposta do `os/index.html`, com o caminho de uma mensagem, as ferramentas por origem com a chamada real e os tr\u00eas caminhos da integra\u00e7\u00e3o; a p\u00e1gina inteira est\u00e1 em `os/arquivo/circuito.html`): `os/circuito.html` costura tr\u00eas coisas que nenhuma outra p\u00e1gina junta: o circuito de execu\u00e7\u00e3o de um turno (paciente \u2192 Chatwoot \u2192 plataforma fazer.ai agents \u2192 gpt-5-mini \u2192 ferramentas \u2192 backends, com o trace no Langfuse), o cat\u00e1logo das ferramentas concedidas ao agente (nativas, RAG e HTTP, com exemplo real est\u00e1tico de pedido e resposta vindo das provas registradas) e a anatomia do prompt (as se\u00e7\u00f5es na ordem do export, cada uma com as ferramentas que invoca e os trechos literais). Os dados vivem em `os/dados/circuito.json`; os trechos literais v\u00eam do `os/dados/sop-fluxo.json` e seguem a mesma regra de re-valida\u00e7\u00e3o por sess\u00e3o do [[mapa-do-sop]]. Desde a OS17 (19/ago/2026, ADR-0017), o `circuito.json` **n\u00e3o declara mais o backend de cada ferramenta**: URL, credencial e estado v\u00eam ao vivo da inst\u00e2ncia, pela mesma rota que o [[mapa-da-integracao]] usa. O ADR-0018 fecha o resto do buraco: a prosa que ainda dizia NocoDB some, e cada ferramenta do cat\u00e1logo ganha o [[selo-de-origem]], o mesmo das outras duas p\u00e1ginas. O campo declarado apodreceu em sil\u00eancio quando a V21 virou a tool 1 para a API do Hospital. N\u00e3o existe LangChain nem n8n no circuito: quem orquestra \u00e9 a plataforma fazer.ai agents. A p\u00e1gina nunca chama API (quem roda ao vivo s\u00e3o Cadeias e Bancada). Desde a OS11 (11/ago/2026), o desenho carrega **fichas de hover** (tooltip padr\u00e3o OS9, clique fixa): cada passo explica **o que entra / o que acontece / o que sai** (variando com o caminho selecionado), cada raia diz quem \u00e9 e o que s\u00f3 ela faz, a **zona do la\u00e7o** (a moldura tracejada dos passos 4 a 7) explica a repeti\u00e7\u00e3o com exemplos reais das provas, fios mostram o que trafega e chips resumem o caminho; a lista abaixo do desenho \u00e9 a vers\u00e3o narrativa das mesmas fichas. Divis\u00e3o de altitude: a Arquitetura mostra as caixas dos servi\u00e7os, o Mapa do SOP mostra as jornadas do paciente, o Circuito mostra o mecanismo de um turno.\n_Avoid_: chamar API da p\u00e1gina; tratar os exemplos est\u00e1ticos como resposta atual do ambiente (s\u00e3o provas datadas); duplicar nela o conte\u00fado do Mapa do SOP ou da Arquitetura.\n\n**Mapa da Integra\u00e7\u00e3o (p\u00e1gina do Ana OS)**:\nO desenho da fronteira externa da Ana (19/ago/2026, OS17): desde o ADR-0028 \u00e9 a se\u00e7\u00e3o \"A fronteira externa\" da aba Mecanismo (`os/circuito.html#fronteira`, hoje em `os/arquivo/`; antes p\u00e1gina pr\u00f3pria `os/integracao.html`; desde o ADR-0030 os tr\u00eas caminhos e a vers\u00e3o do Chatwoot vivem na aba Onde ela busca a resposta do `os/index.html`), e mostra tudo o que a Ana fala com o mundo fora dela, em tr\u00eas faixas horizontais. A **ida** (leitura): algu\u00e9m do hospital edita na tela `/admin/dados-atendimento`, vira Postgres, vira `GET /api/ana/*`, vira ferramenta HTTP, vira a fala que o paciente l\u00ea no WhatsApp. A **volta** (escrita): o paciente relata uma queixa, a Ana grava por `POST`, o protocolo ANO-NNNN nasce da sequence e aparece no painel `/ouvidoria`. A **fronteira parada**: as seis ferramentas da Global Health, em homologa\u00e7\u00e3o, aguardando a massa (GH19). As raias s\u00e3o as aplica\u00e7\u00f5es (Ana, App do Hospital, Global Health; a raia do NocoDB saiu em 19/ago/2026 com o ADR-0018, junto com o servi\u00e7o parado) e o placar no topo conta as doze ferramentas HTTP por destino. Desde o ADR-0018, cada ferramenta desenhada carrega o [[selo-de-origem]], e a Global Health continua na tela, marcada pelo selo e com a pend\u00eancia GH19 em vermelho, em vez de ser escondida. Cada n\u00f3 carrega no cart\u00e3o o nome, o selo de estado e, quando existe defeito medido, o n\u00famero com a data; o hover abre a ficha inteira (para que serve, quando a Ana chama, o que devolve, os limites, o que acontece quando falha) mais os links para a defini\u00e7\u00e3o da ferramenta na plataforma, para o trecho do prompt e para o cen\u00e1rio da bancada que prova aquele elo. Segue a regra do [[o-os-nao-guarda-o-que-muda]]: o `os/dados/integracao.json` guarda s\u00f3 a prosa curada, e URL, credencial, m\u00e9todo, estado e se a ferramenta est\u00e1 ligada v\u00eam ao vivo da inst\u00e2ncia. Divis\u00e3o de altitude: a Arquitetura mostra as caixas dos servi\u00e7os, o [[circuito-da-ana]] mostra o mecanismo de um turno, o [[mapa-do-sop]] mostra as jornadas do paciente, o Mapa da Integra\u00e7\u00e3o mostra a fronteira com as outras aplica\u00e7\u00f5es.\n_Avoid_: escrever URL, credencial ou estado de migra\u00e7\u00e3o dentro do JSON; repetir nela o cat\u00e1logo endpoint a endpoint da API GH (isso \u00e9 o [[mapa-das-apis]]); mostrar n\u00famero medido sem a data ao lado.\n\n**O OS n\u00e3o guarda o que muda (regra de dados do Ana OS)**:\nA regra nascida no ADR-0017 (18/ago/2026): quando um dado do cockpit existe ao vivo numa fonte autoritativa, o JSON curado n\u00e3o o guarda. Ferramenta \u00e9 o caso can\u00f4nico: URL, m\u00e9todo, credencial e se est\u00e1 ligada v\u00eam da rota `/api/v1/tools` da plataforma, lida pelo `os/server.py` com o `AGENTS_API_TOKEN` do `.env` e casada com o n\u00f3 pelo nome da ferramenta. Estado de migra\u00e7\u00e3o n\u00e3o \u00e9 campo: \u00e9 derivado do host da URL viva. Sem token ou sem rede, a p\u00e1gina diz que n\u00e3o conseguiu ler, nunca mostra valor guardado como se fosse de agora. O que a p\u00e1gina n\u00e3o pode buscar vem gravado por script e aparece sempre com a data da medi\u00e7\u00e3o ao lado. S\u00e3o dois casos hoje: a medi\u00e7\u00e3o que exigiria chamar a produ\u00e7\u00e3o do Hospital (a regra do server pro\u00edbe) e a **concess\u00e3o de ferramenta ao agente**, que a inst\u00e2ncia 1.4.1 n\u00e3o exp\u00f5e em rota REST (oito caminhos testados em 19/ago devolveram 404; s\u00f3 a ferramenta MCP `agent_tools_get` alcan\u00e7a). A rota que falta \u00e9 pend\u00eancia registrada para a fazer.ai, no report V10. Nasceu do caso concreto: a `os/dados/circuito.json` declarava `\"backend\": \"nocodb\"` para a tool 1, virou mentira no dia da V21 e ficou assim cinco dias sem nenhum sinal.\n_Avoid_: aplicar a regra ao prompt (l\u00e1 vale o carimbo com re-valida\u00e7\u00e3o por sess\u00e3o do [[mapa-do-sop]], porque o prompt s\u00f3 muda quando uma sess\u00e3o o publica); p\u00f4r o token no HTML servido ao navegador.\n\n**Selo de origem (ferramenta no cockpit)**:\nO r\u00f3tulo que toda ferramenta desenhada no Ana OS carrega, dizendo quem responde aquela chamada (19/ago/2026, ADR-0018; estendido ao cockpit inteiro em 20/ago/2026, ADR-0020). Tr\u00eas fam\u00edlias, mesmo vocabul\u00e1rio e mesma cor em toda p\u00e1gina que desenha ferramenta: **API do Hospital** (verde), **Global Health** (\u00e2mbar) e **nativa da plataforma** (cinza). \u00c9 derivado, nunca escrito: ferramenta presente em `/api/v1/tools` recebe a fam\u00edlia pelo host da `urlTemplate`; ferramenta ausente daquela rota mas presente no carimbo de grants \u00e9 nativa, porque n\u00e3o sai da plataforma; nome ausente das duas fontes n\u00e3o ganha selo (\u00e9 ferramenta inexistente). P\u00e1gina mista (Integra\u00e7\u00e3o, SOP, Circuito, Compara\u00e7\u00e3o, [[testes-manuais]], Arquitetura) mostra o selo por item; p\u00e1gina de origem \u00fanica (Bancada e Cadeias, 100% Global Health) mostra uma faixa fixa no topo em vez de repetir o selo. Ao lado dele pode aparecer o estado de **concess\u00e3o** (\"a Ana n\u00e3o pode chamar\"), que hoje n\u00e3o tem rota REST na inst\u00e2ncia 1.4.1 e por isso vem carimbado por script com a data da confer\u00eancia, no padr\u00e3o da cl\u00e1usula 4 do [[o-os-nao-guarda-o-que-muda]]. As nativas n\u00e3o se subdividem em Chatwoot, base de conhecimento e rel\u00f3gio: a pergunta que o selo responde \u00e9 se a chamada sai da plataforma, e para onde.\n_Avoid_: escrever a fam\u00edlia num campo de JSON curado; criar cor nova de selo por p\u00e1gina; mostrar concess\u00e3o sem a data ao lado; repetir selo por item em p\u00e1gina de origem \u00fanica.\n\n**Testes manuais (p\u00e1gina do Ana OS)**:\nA d\u00e9cima p\u00e1gina do cockpit (20/ago/2026, ADR-0020; redesenhada em 24/ago/2026, ADR-0021): a se\u00e7\u00e3o Testes da aba Provas (`os/comparacao.html#testes`, desde o ADR-0028, hoje em `os/arquivo/`; antes p\u00e1gina pr\u00f3pria `os/testes.html`; desde o ADR-0030 cada capacidade da aba O que a Ana faz hoje carrega os seus testes manuais num bloco dobr\u00e1vel) re\u00fane num lugar s\u00f3 todos os testes do programa, prontos para uso, sem guardar dado novo (l\u00ea `os/dados/comparacao.json`, os cen\u00e1rios da bancada pela rota `/api/cenarios` e as se\u00e7\u00f5es do prompt em `os/dados/circuito.json`). \u00c9 uma lista \u00fanica de linhas compactas, uma por teste, com **assertividade derivada**, nunca escrita \u00e0 m\u00e3o: **humano roda** (expectativa em prosa; o Pedro copia e cola no Telegram) ou **m\u00e1quina roda** (asser\u00e7\u00e3o literal `contem`/`nao_contem`/`tools`; insumo da futura automa\u00e7\u00e3o pela API do fazer.ai agents). O detalhe vive num popover: hover mostra, clique fixa; dentro dele, os links \"\u00a7 se\u00e7\u00e3o\" levam \u00e0 anatomia do prompt no Circuito via [[secao-ids]]. Filtros (quem roda, se\u00e7\u00e3o do SOP, busca livre) e ordena\u00e7\u00e3o (jornada do SOP, ID, bloco/fam\u00edlia), com estado no hash da URL. Capacidade sem teste aparece como \"aguardando a Global Health\". Cada ferramenta citada carrega o [[selo-de-origem]]. Divis\u00e3o de trabalho: a Compara\u00e7\u00e3o responde \"o que a Ana sabe fazer contra o que o SOP promete\"; os Testes manuais respondem \"o que eu rodo agora para provar\".\n_Avoid_: escrever teste novo no testes.html ou em JSON pr\u00f3prio dele (teste mora na Compara\u00e7\u00e3o ou nos cen\u00e1rios da bancada); nota de assertividade num\u00e9rica curada \u00e0 m\u00e3o; tratar a faixa m\u00e1quina como j\u00e1 automatizada (a API ainda n\u00e3o roda os cen\u00e1rios); resolver a se\u00e7\u00e3o de um teste por parser da prosa (o v\u00ednculo \u00e9 o `secao_ids` curado na fonte).\n\n**Fam\u00edlias da bancada (p\u00e1gina do Ana OS)**:\nA d\u00e9cima primeira p\u00e1gina do cockpit (24/ago/2026, ADR-0022): a se\u00e7\u00e3o Fam\u00edlias da aba Provas (`os/comparacao.html#familias`, desde o ADR-0028, hoje em `os/arquivo/`; antes p\u00e1gina pr\u00f3pria `os/familias.html`; desde o ADR-0030 \u00e9 a se\u00e7\u00e3o \"As provas da bancada\" da aba O que a Ana faz hoje do `os/index.html`) explica por dentro os c\u00f3digos dos cen\u00e1rios de integra\u00e7\u00e3o (A1, C1b, D5, E3...). Cada **fam\u00edlia** vigia uma promessa: A espelho da edi\u00e7\u00e3o (bloqueante), B fidelidade do formato (ajuste), C cobertura da tabela inteira (bloqueante por tabela, o vigia do teto de 4.000), D ouvidoria e a dire\u00e7\u00e3o da escrita (bloqueante), E robustez (ajuste). L\u00ea `os/dados/familias.json`, curadoria de `roadmap/roteiro-integracao-hospital.md` (o roteiro \u00e9 a verdade; rodada nova pede atualizar a curadoria). Cada cen\u00e1rio abre num stepper (monte, edite, envie, espere, falha se, reverta) com perigo em destaque, variantes por tabela e o hist\u00f3rico das rodadas datadas. Divis\u00e3o de trabalho: a p\u00e1gina Testes manuais responde \"o que eu rodo agora\"; a Fam\u00edlias responde \"o que essa prova significa e como ela est\u00e1\".\n_Avoid_: escrever veredito novo direto no familias.json sem registrar a rodada no roteiro antes (a ordem \u00e9 roteiro primeiro, curadoria depois); parser autom\u00e1tico do markdown do roteiro; repetir na p\u00e1gina Testes a anatomia que mora aqui.\n\n**secao_ids (v\u00ednculo teste e prompt)**:\nO campo que liga um teste \u00e0s se\u00e7\u00f5es do prompt (24/ago/2026, ADR-0021): lista de ids reais das se\u00e7\u00f5es do `circuito.json` (ex.: `[\"2-3\", \"2-3-1\"]`), curada na fonte, nas capacidades da Compara\u00e7\u00e3o e nos cen\u00e1rios da bancada (que tamb\u00e9m ganharam a prosa `secao`). Gera o link `circuito.html#sec-<id>`, o filtro de se\u00e7\u00e3o e a ordena\u00e7\u00e3o \"jornada do SOP\" na p\u00e1gina de Testes manuais. Lista vazia significa fora do prompt compilado (caso ADR-0015, Se\u00e7\u00e3o 2.5 gated): aparece a prosa, sem link inventado.\n_Avoid_: parser autom\u00e1tico da prosa `secao`; escrever o v\u00ednculo na p\u00e1gina em vez da fonte; id que n\u00e3o existe no `circuito.json`.\n\n**Propostas (camada do roadmap)**:\nPassos futuros recomendados pelas sess\u00f5es Claude, com ID pr\u00f3prio (P1, P2...), deps e prompt, vivendo na chave `propostas` do `roadmap.json`. Renderizadas no grafo com visual distinto (tracejado). Proposta n\u00e3o \u00e9 compromisso: n\u00e3o tem status nem dono, e n\u00e3o entra no TODO.md at\u00e9 o Pedro pux\u00e1-la para o est\u00e1gio (a\u00ed vira tarefa com ficha e \"pronto quando\", nos dois arquivos). Trilha inicial P1..P6: demo do cat\u00e1logo GH ao diretor, VPN da TST, prova da finaliza\u00e7\u00e3o (GH-18), tools GH de identifica\u00e7\u00e3o, hor\u00e1rios livres na conversa, agendamento fim a fim em homolog. O desenho do fluxo GH n\u00e3o \u00e9 proposta: \u00e9 a pendente GH1, que ganha posi\u00e7\u00e3o no grafo (deps e prompt) sem mudar de natureza.\nExtinta em 09/out/2026 (ADR-0031): estava vazia e o GitHub s\u00f3 tem issue aberta ou fechada. Um passo futuro recomendado vira issue normal com `canal:` quando o Pedro quiser.\n_Avoid_: dar status/dono a proposta; criar proposta como tarefa oficial sem decis\u00e3o do Pedro; deixar proposta puxada sem espelho no TODO.md.\n\n**Prompt de n\u00f3**:\nO campo `prompt` dos n\u00f3s acion\u00e1veis do `roadmap.json` (tarefas `fazer`, pendentes, propostas): texto pronto para o Pedro colar no Claude Code, em pt-BR, passo a passo para leigo. Tarefa manual do Pedro vira prompt do tipo \"me guie enquanto eu fa\u00e7o, diga o que clicar e confira cada resultado\"; tarefa t\u00e9cnica vira prompt que manda a sess\u00e3o executar com ele acompanhando.\nDesde 09/out/2026 (ADR-0031) o prompt \u00e9 a se\u00e7\u00e3o `## Prompt` do corpo da issue.\n_Avoid_: prompt em n\u00f3 feito (ru\u00eddo); prompt que assume conhecimento t\u00e9cnico do Pedro; prompt em arquivo separado do roadmap.json.\n\n**Ideias (faixa do roadmap)** (extinta em 09/set/2026, ADR-0028: card nasce s\u00f3 pelo terminal; a chave `ideias` saiu do roadmap.json):\nCards livres do Roadmap do OS: t\u00edtulo + poucas linhas + link opcional para doc. Ideia n\u00e3o tem ID, dono nem depend\u00eancia at\u00e9 ser puxada para o est\u00e1gio (a\u00ed vira tarefa no TODO.md, com ficha e \"pronto quando\"). A rota de escrita da UI \u00e9 restrita ao arquivo de dados do roadmap (ADR-0007) e cobre s\u00f3 as Ideias e o mover de canal da [[mesa-de-acao]] (ADR-0011).\n_Avoid_: promover ideia a tarefa sem passar pelo TODO.md; dar status/dono a card de ideia.\n\n**Mapa das APIs**:\nP\u00e1gina do Ana OS que organiza os endpoints da API GH de WhatsApp por tema (identifica\u00e7\u00e3o, cat\u00e1logo, disponibilidade, agendamento, anexos), cada um com **selo de testabilidade** derivado da din\u00e2mica dos bancos ([[finalizacao-do-agendamento]]): *leitura de cat\u00e1logo* (resposta da API \u00e9 a prova), *escrita no SaaS GH* (test\u00e1vel s\u00f3 pela resposta; invis\u00edvel no Oracle por arquitetura) e *finaliza\u00e7\u00e3o* (o \u00fanico ponto com [[prova-no-banco]] na TST). Nasceu puxando a metade \"cat\u00e1logo e viabilidade\" da GH1; a metade \"onde encaixar no fluxo da Ana\" foi fechada em 06/ago/2026 pela [[fachada-de-agenda]] (ADR-0009). Arquivado em `os/arquivo/` desde 20/ago/2026 (ADR-0019): o Mapa da Integra\u00e7\u00e3o e a Compara\u00e7\u00e3o assumiram o papel com dados vivos.\n_Avoid_: tratar a API GH como janela de leitura do banco MV (ela \u00e9 puramente de agendamento; quem l\u00ea o MV \u00e9 o Oracle TST direto, e o Atlas para produ\u00e7\u00e3o).\n\n**Biblioteca**:\nSe\u00e7\u00e3o do Ana OS que exibe a documenta\u00e7\u00e3o do reposit\u00f3rio renderizada no navegador, a partir de uma **allowlist expl\u00edcita** servida pelo server (CONTEXT.md, `docs/adr/`, `roadmap/`, os `.md` de `ana/api-mv/`, documento-mestre). A doc continua morando no git como fonte \u00fanica; o OS s\u00f3 exibe. `dados-locais/` e `resultados/amostras/` s\u00e3o proibidos por regra no servidor. Arquivada em `os/arquivo/` desde 20/ago/2026 (ADR-0019); segue abrindo por URL direta (os links de doc do Cockpit apontam para l\u00e1).\n_Avoid_: wiki externa ou c\u00f3pia da doc; servir qualquer pasta fora da allowlist.\n\n**Acervo do roadmap**:\n`roadmap/arquivo/`: o roadmap anterior completo (TODO com a
