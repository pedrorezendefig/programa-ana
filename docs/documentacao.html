-agenda-online-gh.pdf`) revela o mecanismo: a massa n\u00e3o \u00e9 um \"pacote\" que a GH publica por um ato especial. Ela nasce de cadastro comum: agenda no SoulMV (p\u00fablica, com prestador vinculado ao item de agendamento e unidade de atendimento preenchida) mais ativa\u00e7\u00e3o do item no Painel de Controle GH, com conv\u00eanio vinculado ao plano ou a flag de exibir agendas sem conv\u00eanio.\n- Acessos levantados no grilling: o Pedro tem o Painel de Controle GH **de homologa\u00e7\u00e3o** (confirmado por ele); n\u00e3o tem o SoulMV TST. Quem tem a m\u00e3o no Soul \u00e9 o analista de TI do hospital.\n- O cat\u00e1logo vazio na API tem duas causas poss\u00edveis que s\u00f3 o Painel distingue: nada existe no Soul TST, ou existe e est\u00e1 desligado no Painel. A inspe\u00e7\u00e3o do Painel responde isso em minutos.\n\n## Decis\u00e3o\n\n1. **Pedido m\u00ednimo, n\u00e3o pacote:** uma agenda s\u00f3 (Cardiologia), para provar o circuito Soul \u2192 Painel \u2192 API. Cardiologia porque \u00e9 o cen\u00e1rio da vitrine da V15, j\u00e1 pronto para re-validar. Amplia\u00e7\u00e3o vem depois, com o circuito provado.\n2. **Divis\u00e3o de pap\u00e9is:** o analista de TI cadastra no SoulMV TST com o tutorial na m\u00e3o; o Pedro inspeciona e ativa no Painel GH homolog; a sess\u00e3o Claude prova pelo smoke e pela vitrine.\n3. **A pergunta de arquitetura viaja junto:** o pedido ao analista inclui a confirma\u00e7\u00e3o \"o SoulMV TST alimenta a homolog `dem.agenda.globalhealth.mv`?\", que \u00e9 uma das 4 perguntas sem resposta da cobran\u00e7a de 12/ago.\n4. **GH19 n\u00e3o morre:** o pendente segue aberto e cobr\u00e1vel. O que muda \u00e9 que ele deixa de ser o \u00fanico caminho.\n5. **Regra de ambiente inalterada:** tudo em homologa\u00e7\u00e3o. Painel de produ\u00e7\u00e3o jamais; se algum acesso se revelar de produ\u00e7\u00e3o, vira somente leitura e o plano para.\n\n## Considered options\n\n- **S\u00f3 re-cobrar a GH:** rejeitado como caminho \u00fanico. 50 dias de sil\u00eancio; custo de continuar cobrando \u00e9 baixo, ent\u00e3o a cobran\u00e7a segue, mas sem carregar o roadmap sozinha.\n- **Pacote completo de uma vez (especialidades, exames, conv\u00eanios, agendas):** rejeitado. Pedido grande a terceiro emperra; o pedido de 1 agenda prova o circuito e cria o precedente.\n- **Pedir acesso ao SoulMV TST para o Pedro:** n\u00e3o descartado, mas n\u00e3o bloqueia. O analista executa mais r\u00e1pido do que um acesso novo \u00e9 concedido; se o fluxo virar rotina, o acesso vira pedido pr\u00f3prio.\n\n## Consequ\u00eancias\n\n- Nasce a tarefa **V31** (dono P+E, com prova da sess\u00e3o): inspe\u00e7\u00e3o do Painel + pedido ao analista (`ana/api-mv/pedido-agenda-cardiologia-tst.md`) + prova pelo smoke.\n- **Pronto quando:** o smoke sai de VAZIO para OK em `/consultas`. Na sequ\u00eancia, a vitrine da V15 re-valida (Cardiologia no playground com hor\u00e1rio real) e a Cadeia D destrava sozinha na p\u00e1gina Cadeias.\n- **VPN:** nenhum passo deste caminho exige VPN do Pedro (Painel GH e API s\u00e3o web; o Soul \u00e9 do analista). A VPN s\u00f3 volta na Prova no banco (P3/GH-18), que continua sendo o gate da P6.\n- O tutorial entra no repo (`ana/api-mv/tutorial-agenda-online-gh.pdf`) e vira refer\u00eancia cit\u00e1vel em cobran\u00e7as e pedidos.\n- Risco aceito: a massa criada por n\u00f3s pode n\u00e3o representar a massa \"oficial\" que a GH publicaria. Para provar o circuito das tools isso \u00e9 irrelevante; para homologar conte\u00fado real, a GH-19 continua necess\u00e1ria.", "cita": [], "decisao": "", "emenda": [], "emendada_por": [], "file": "docs/adr/0023-massa-propria-na-homolog.md", "number": 23, "slug": "0023-massa-propria-na-homolog", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A massa de homologa\u00e7\u00e3o deixa de ser espera: criamos o cat\u00e1logo de teste n\u00f3s mesmos, com o tutorial da MV"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do Pedro (26/ago/2026, sess\u00e3o de grilling sobre as notas de vers\u00e3o da fazer.ai): a vers\u00e3o do Chatwoot que a Ana usa deixa de ser um n\u00famero que algu\u00e9m escolheu uma vez no onboarding e passa a ser um **fato rastreado do programa**. O atraso \u00e9 medido ao vivo, a leitura das vers\u00f5es novas tem lente fixa e cai no `/check`, e subir de vers\u00e3o \u00e9 **pr\u00e9-requisito declarado** da Ana entrar num n\u00famero de WhatsApp real.\n\n## Contexto\n\n- A Ana conversa **atrav\u00e9s** do Chatwoot. O canal, as tags, a etapa do kanban e o handoff para gente s\u00e3o todos do Chatwoot; a plataforma fazer.ai agents \u00e9 o c\u00e9rebro, mas a boca e os ouvidos s\u00e3o de l\u00e1. Um defeito no Chatwoot aparece como defeito da Ana.\n- A inst\u00e2ncia roda `4.16.0-fazer-ai-pro.111`, escolhida no onboarding de **29/jul/2026** e nunca mais tocada. Em 26/ago/2026 a \u00faltima publicada era `v4.17.0-fazer-ai-pro.120`: **9 vers\u00f5es de atraso**, e ningu\u00e9m sabia. N\u00e3o havia sinal em lugar nenhum do repo, do cockpit ou do `/check`.\n- A leitura dessas 9 vers\u00f5es achou dois problemas que est\u00e3o no ar hoje. A `.119` corrige **\"conversas que o bot deixava sem resposta\"**: uma lentid\u00e3o moment\u00e2nea tirava a conversa do bot e ela silenciava. A `.120` tira a conversa que est\u00e1 com um bot da aba \"N\u00e3o atribu\u00eddas\", mudando a fila que a secret\u00e1ria v\u00ea. Nenhum dos dois \u00e9 hip\u00f3tese: s\u00e3o notas de release da vers\u00e3o que a inst\u00e2ncia n\u00e3o tem.\n- A `.112` (31/jul) descreve **\"erros com token de acesso da API ao gerenciar bots, etiquetas\"**, que \u00e9 a descri\u00e7\u00e3o exata do bug do radar **V8**, remendado desde 29/jul por uma corre\u00e7\u00e3o de 1 linha aplicada **dentro do container**, que evapora em qualquer redeploy. O programa carrega esse hotfix como d\u00edvida fr\u00e1gil h\u00e1 quase dois meses, e o fix pode j\u00e1 existir sem ningu\u00e9m ter olhado.\n- Ler a p\u00e1gina \u00e9 mais dif\u00edcil do que parece, e isso \u00e9 parte da causa. <https://fazer.ai/chatwoot-release-notes> mostra **5** releases e esconde **143** atr\u00e1s de um bot\u00e3o \"Load more\". Um scrape comum devolve as 5 e parece completo. O acervo inteiro j\u00e1 vem no HTML, no payload do Next.js, mas seis das notas mais compridas (entre elas a `.119` e a `.116`) chegam como refer\u00eancias n\u00e3o resolvidas e somem **sem erro nenhum**. Quem n\u00e3o sabe disso l\u00ea um recorte achando que leu tudo.\n- O ADR-0017 j\u00e1 resolveu o problema g\u00eameo para as ferramentas: dado que a fonte sabe ao vivo n\u00e3o se escreve em arquivo, porque arquivo apodrece calado (a `circuito.json` passou cinco dias mentindo). A vers\u00e3o instalada \u00e9 exatamente esse tipo de dado: `GET /api` do Chatwoot devolve `{\"version\": ...}` sem exigir credencial.\n- O programa j\u00e1 tem um ritual que roda toda sess\u00e3o de retomada: a skill `/check`. Rotina que depende de algu\u00e9m lembrar n\u00e3o acontece; rotina pendurada num ritual que j\u00e1 existe, acontece.\n\n## Decis\u00e3o\n\n1. **O placar de vers\u00f5es \u00e9 vivo, nunca escrito.** Vers\u00e3o instalada vem de `GET {CHATWOOT_URL}/api`; \u00faltima publicada vem da p\u00e1gina da fazer.ai. Nenhum dos dois n\u00fameros entra em arquivo do repo. Vale a cl\u00e1usula 3 do ADR-0017: sem fonte, a tela diz que n\u00e3o sabe, em vez de mostrar um valor velho com cara de fato.\n2. **O Ana OS mostra o atraso.** Rota `/api/chatwoot` no `os/server.py` e um bloco no Mapa da Integra\u00e7\u00e3o: instalada, \u00faltima, quantas vers\u00f5es atr\u00e1s. O atraso muda de cor quando passa de 3 vers\u00f5es.\n3. **A leitura tem lente fixa.** Cada release nova responde quatro perguntas: toca o caminho da Ana (bot, token, tags, inbox, handoff)? toca a evid\u00eancia que a bancada confere no Chatwoot (etapa, tag, avisos de status)? toca o que o hospital v\u00ea (filas, abas, permiss\u00f5es)? muda contrato que o `e2e.py` usa? Quem n\u00e3o bate em nenhuma n\u00e3o \u00e9 registrado.\n4. **A leitura curada mora no repo, o acervo n\u00e3o.** `ana/plataforma/chatwoot-releases.md` guarda o que s\u00f3 gente sabe: o que cada vers\u00e3o significa para a Ana. O dump das 148 releases n\u00e3o \u00e9 versionado; o caminho at\u00e9 ele \u00e9 o `ana/plataforma/scripts/fetch-chatwoot-releases.py`, que desempacota a p\u00e1gina inteira e resolve as refer\u00eancias que somem calado.\n5. **O `/check` cobra.** O ritual ganha um passo: comparar as duas vers\u00f5es e, havendo atraso, ler as releases novas com a lente e reportar. Atraso vira linha do relat\u00f3rio, como bloqueio externo parado.\n6. **Subir vers\u00e3o \u00e9 pr\u00e9-requisito do WhatsApp real.** A Ana s\u00f3 vai para um n\u00famero de WhatsApp de paciente com a inst\u00e2ncia na vers\u00e3o corrente. Sete das nove vers\u00f5es atrasadas s\u00e3o confiabilidade de WhatsApp; subir com a casa vazia \u00e9 barato, subir com paciente dentro \u00e9 caro. Nasce a tarefa **V32**.\n7. **A nota de release n\u00e3o \u00e9 prova.** A `.112` descreve o bug da V8, mas em 06/ago a inspe\u00e7\u00e3o do fork CE mostrou o defeito vivo na base CE dessa mesma release. O fechamento da V8 exige **teste por token em `/agent_bots` e `/labels` depois de subir**, nunca a leitura da nota.\n8. **A fronteira \u00e9 expl\u00edcita.** Este ADR e o documento vivo cobrem s\u00f3 o Chatwoot. A plataforma fazer.ai agents tem numera\u00e7\u00e3o e notas pr\u00f3prias; os achados dela continuam no radar **V10**.\n\n## Considered options\n\n- **Guardar o acervo das 148 releases no repo:** rejeitado. S\u00e3o 300 KB de texto que a fonte j\u00e1 publica e que envelhece a cada release. O script custa menos e n\u00e3o mente. Se a fazer.ai tirar a p\u00e1gina do ar, o script quebra alto, o que \u00e9 melhor do que um arquivo silenciosamente velho.\n- **Escrever a vers\u00e3o instalada num JSON do `os/dados/`:** rejeitado pelo ADR-0017. Seria repetir a `circuito.json`: o n\u00famero certo no dia em que foi escrito, e mentira a partir do primeiro redeploy que ningu\u00e9m anotou.\n- **Deixar o upgrade no radar, junto da V8:** considerado com seriedade, porque a Ana est\u00e1 em modo teste e nenhum paciente real sofre o bug hoje. Rejeitado por causa da ordem: o custo de subir cresce quando a Ana estiver atendendo, e o radar n\u00e3o tem data. A tarefa puxa a V8 junto, o que resolve as duas d\u00edvidas numa janela s\u00f3.\n- **Assinar as notas por e-mail ou webhook, em vez de perguntar:** rejeitado por ora. A fazer.ai n\u00e3o oferece um feed, e um aviso que chega na caixa de entrada do Pedro compete com tudo o mais que chega l\u00e1. O `/check` j\u00e1 \u00e9 o lugar onde ele olha o estado do programa de prop\u00f3sito.\n- **Subir para a vers\u00e3o corrente automaticamente, sempre:** rejeitado. A `.120` muda a fila que a secret\u00e1ria v\u00ea sem ningu\u00e9m configurar nada. Vers\u00e3o do canal do paciente \u00e9 decis\u00e3o, e decis\u00e3o passa pelo Pedro.\n\n## Consequ\u00eancias\n\n- O programa ganha uma d\u00edvida vis\u00edvel que antes era invis\u00edvel. Isso \u00e9 o ponto, mas significa que o cockpit vai acusar atraso com frequ\u00eancia: o Chatwoot da fazer.ai publica de duas a tr\u00eas vers\u00f5es por semana. A r\u00e9gua de aten\u00e7\u00e3o \u00e9 a lente, n\u00e3o o n\u00famero: nove vers\u00f5es que n\u00e3o tocam a Ana valem menos que uma que toca.\n- O `/check` fica um pouco mais longo e passa a depender de alcan\u00e7ar duas URLs externas. Se qualquer uma falhar, ele registra e segue, como j\u00e1 faz com o MCP da plataforma.\n- O Mapa da Integra\u00e7\u00e3o passa a falar de uma coisa que n\u00e3o \u00e9 ferramenta. \u00c9 coerente com o nome da p\u00e1gina (a fronteira externa da Ana) e evita criar p\u00e1gina nova para dois n\u00fameros.\n- O hotfix da V8 ganha data de validade. Ou a V32 prova que ele n\u00e3o \u00e9 mais necess\u00e1rio, ou prova que ainda \u00e9, e a\u00ed ele volta reaplicado e com evid\u00eancia fresca. Nos dois casos a d\u00edvida sai do limbo em que est\u00e1 desde julho.\n- Custo aceito: o `fetch-chatwoot-releases.py` depende do formato do payload do Next.js da p\u00e1gina. Se a fazer.ai reconstruir o site, o script quebra. Ele falha alto, com mensagem dizendo que a p\u00e1gina mudou de formato, em vez de devolver lista vazia.", "cita": [], "decisao": "", "emenda": [], "emendada_por": [], "file": "docs/adr/0024-a-versao-do-chatwoot-e-decisao-do-programa.md", "number": 24, "slug": "0024-a-versao-do-chatwoot-e-decisao-do-programa", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A vers\u00e3o do Chatwoot \u00e9 decis\u00e3o do programa, n\u00e3o detalhe de infra"}, {"amended_by": null, "amends": null, "body_md": "- **Data:** 26/ago/2026\n- **Estado:** aceita\n- **Contexto de origem:** sess\u00e3o do dia em que a massa de homologa\u00e7\u00e3o apareceu (V31) e a vitrine de hor\u00e1rios da V15 foi destravada.\n\n## Contexto\n\nAt\u00e9 hoje a Ana respondia \"o conv\u00eanio X cobre a especialidade Y?\" lendo uma tabela curada \u00e0 m\u00e3o pela\nsecret\u00e1ria, no m\u00f3dulo `/admin/dados-atendimento` do app do hospital, via a tool 4\n`consultar_convenios_especialidade` (`GET /api/ana/convenios`).\n\nCom a agenda de Cardiologia publicada na homologa\u00e7\u00e3o da Global Health, ficou provado que a pr\u00f3pria\nAPI da GH responde essa pergunta, filtrada por especialidade:\n\n```\nGET /convenios?idItemAgendamento=1843&size=100   -> 200, 32 conv\u00eanios\nGET /convenios?idItemAgendamento=1               -> 200, 0\nGET /convenios?idItemAgendamento=1842            -> 200, 0\nGET /convenios?idItemAgendamento=999999          -> 200, 0\nGET /convenios                (sem o par\u00e2metro)  -> 200, 0\n```\n\nA lista \u00e9 escopada pelo item agend\u00e1vel. N\u00e3o \u00e9 uma lista geral do hospital: \u00e9 a lista de quem \u00e9 aceito\nnaquela especialidade. O mesmo vale para `GET /prestadores?idItemAgendamento=`.\n\nAs duas fontes j\u00e1 divergiam. A tabela curada tinha **Amil**, **Golden Cross** e **Hapvida**; nenhum dos\ntr\u00eas aparece nos 32 conv\u00eanios da agenda de Cardiologia. Uma das duas estava mentindo ao paciente, e a\nque decide se o agendamento acontece \u00e9 a da agenda.\n\n## Decis\u00e3o\n\n**A agenda online da Global Health passa a ser a fonte \u00fanica de cobertura de conv\u00eanio por especialidade.**\n\n1. A tool 4 `consultar_convenios_especialidade` sai do grant do agente 1. A defini\u00e7\u00e3o fica preservada,\n   como foi feito com a tool 7 no ADR-0014.\n2. A Se\u00e7\u00e3o 3.2 do prompt (`ana/prompt/bloco-orquestradora.md`) passa a rodar os dois primeiros elos da\n   cadeia da Se\u00e7\u00e3o 2.3.1 e a decidir por tr\u00eas casos:\n   - **conv\u00eanio na lista** \u2192 a Ana segue a cadeia e entrega hor\u00e1rio, igual ao fluxo particular, com a\n     tag `agendamento-convenio`. O portal n\u00e3o \u00e9 citado.\n   - **conv\u00eanio fora da lista** \u2192 n\u00e3o atendemos aquele conv\u00eanio naquela especialidade; oferecer particular.\n   - **especialidade n\u00e3o publicada na agenda** (`conteudo` vazio, item bloqueado ou falha) \u2192 n\u00e3o afirmar\n     nem negar a cobertura; `search_knowledge` s\u00f3 para saber se o conv\u00eanio \u00e9 aceito no hospital em geral,\n     e mandar ao portal, como era antes.\n3. A tabela de conv\u00eanios por especialidade some do app do hospital, junto com o endpoint\n   `GET /api/ana/convenios`. Prompt de execu\u00e7\u00e3o em `ana/api-hospital/pedido-espelho-gh.md`.\n4. No lugar dela, uma tela **somente leitura** que espelha ao vivo o que a Global Health publica\n   (o Espelho da Global Health), com o token de homologa\u00e7\u00e3o no backend e nada gravado em banco.\n\n## Consequ\u00eancias\n\n**Ganhos**\n\n- Uma verdade s\u00f3. A diverg\u00eancia entre a tabela e a agenda deixa de existir por constru\u00e7\u00e3o.\n- Morre uma classe inteira de bug: o caso \"conv\u00eanio aceito mas cobertura n\u00e3o detalhada\" (a dor da v6.6)\n  n\u00e3o existe mais, porque ou o conv\u00eanio est\u00e1 na lista ou n\u00e3o est\u00e1.\n- O paciente de conv\u00eanio ganha hor\u00e1rio na conversa. Antes ele s\u00f3 recebia o link do portal.\n\n**Perdas, assumidas**\n\n- A coluna `observacao` da tabela curada n\u00e3o tem equivalente na Global Health. Texto como\n  \"Cobre consultas. Exames de alta complexidade sujeitos a autoriza\u00e7\u00e3o.\" deixa de ser dito.\n  Por isso o prompt do app manda dumpar a tabela antes do drop: o texto \u00e9 conte\u00fado escrito por gente e\n  perd\u00ea-lo \u00e9 irrevers\u00edvel. Se fizer falta, volta como uma tabela s\u00f3 de observa\u00e7\u00e3o, e s\u00f3 depois de fazer\n  falta de verdade. Guardar \"por precau\u00e7\u00e3o\" \u00e9 o caminho de volta para a diverg\u00eancia que este ADR mata.\n- A cobertura passa a depender da disponibilidade da API da Global Health. O Caso 3 \u00e9 a rede de\n  seguran\u00e7a: sem resposta da agenda, o comportamento antigo (portal) continua valendo.\n\n**Ressalvas honestas registradas**\n\n- S\u00f3 existe **uma** especialidade publicada na homologa\u00e7\u00e3o (id 1843). O escopo por item foi provado\n  pelo negativo (id diferente devolve zero), n\u00e3o pela compara\u00e7\u00e3o entre duas especialidades reais.\n  Publicar um segundo item no Painel fecha essa prova.\n- Por decis\u00e3o do Pedro, a homologa\u00e7\u00e3o \u00e9 tratada como se fosse produ\u00e7\u00e3o. A confer\u00eancia das duas listas\n  em produ\u00e7\u00e3o fica para quando a virada de ambiente for pauta.\n\n## Alternativa descartada\n\nEspelhar os conv\u00eanios da Global Health de volta para o app do hospital, criando uma c\u00f3pia sincronizada.\nDescartada por duas raz\u00f5es: a API da GH **n\u00e3o tem endpoint de escrita de conv\u00eanio** (s\u00f3\n`GET /convenios`, `GET /convenios/{id}/planos` e `GET .../subPlanos`), e uma c\u00f3pia sincronizada \u00e9\nexatamente o mecanismo que produziu a diverg\u00eancia que este ADR est\u00e1 consertando.\n\n## Pergunta aberta que nasce daqui\n\n`GET /convenios/{idConvenio}/planos` devolve muitos planos para conv\u00eanio real (Unimed Do Brasil veio\ncom 10 na primeira p\u00e1gina, e mais p\u00e1ginas atr\u00e1s). Hoje a Ana escolhe o primeiro plano sem perguntar ao\npaciente. Nos testes desta sess\u00e3o o `idPlano` **n\u00e3o** alterou os hor\u00e1rios devolvidos, mas isso foi\nmedido numa base com uma agenda s\u00f3. A pergunta \"o `idPlano` filtra a disponibilidade, e o que fazer\nquando o paciente n\u00e3o sabe o plano dele?\" entra em `ana/api-mv/perguntas-global-health.md`.", "cita": [], "decisao": "**A agenda online da Global Health passa a ser a fonte \u00fanica de cobertura de conv\u00eanio por especialidade.**", "emenda": [], "emendada_por": [], "file": "docs/adr/0025-cobertura-de-convenio-vem-da-agenda-online.md", "number": 25, "slug": "0025-cobertura-de-convenio-vem-da-agenda-online", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "ADR-0025: a cobertura de conv\u00eanio vem da agenda online, n\u00e3o de tabela curada"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do Pedro (31/ago/2026, sess\u00e3o de grilling sobre o retorno do jur\u00eddico): a VITTA TECH aceita negociar sobre a minuta reescrita pelo jur\u00eddico do Hospital S\u00e3o Matheus, em vez de insistir no texto pr\u00f3prio. A resposta preenche os dois campos em amarelo (reajuste e SLA) e pede exatamente duas corre\u00e7\u00f5es de m\u00e9rito. O texto de `contrato/fonte/` deixa de ser o documento que vai a assinatura e vira material de leitura e hist\u00f3rico.\n\n## Contexto\n\n- Em 02/jul/2026 o Felipe enviou a minuta da VITTA TECH ao hospital e se declarou em conflito de interesse, pedindo que a condu\u00e7\u00e3o ficasse com a administra\u00e7\u00e3o (Josiane), sem participa\u00e7\u00e3o dele.\n- Em 13/07/2026 o jur\u00eddico (Ana Camelo) devolveu o contrato **reescrito no modelo padr\u00e3o do hospital**, com o contratante identificado: AMA Assist\u00eancia M\u00e9dica Alternativa Ltda - EPP, representada pelo Lauro Menezes Lima. A cadeia chegou ao Pedro em 27/ago, via encaminhamento do Felipe.\n- O cora\u00e7\u00e3o da minuta da VITTA TECH sobreviveu intacto: tabela modular de pre\u00e7os (R$ 5.000 / 6.000 / 8.000 / 9.000 com Termo de Entreg\u00e1vel), propriedade intelectual com licen\u00e7a perp\u00e9tua p\u00f3s-t\u00e9rmino e entrega de c\u00f3digo-fonte, LGPD com o hospital como Controladora, Anexos I e II, prazo indeterminado com aviso de 30 dias, foro RJ.\n- O jur\u00eddico marcou em amarelo dois campos para preencher: o \u00edndice de reajuste (Cl\u00e1usula 3\u00aa, \u00a74\u00ba) e os prazos de resposta e solu\u00e7\u00e3o por gravidade de falha, com multa de abatimento (Cl\u00e1usula 6\u00aa, nova).\n- A reescrita trouxe tr\u00eas sobras do modelo padr\u00e3o, sem destaque: a Cl\u00e1usula 2\u00aa diz que o servi\u00e7o \u00e9 **presencial em hor\u00e1rio comercial** (e chama o contrato de \"aditivo\"), contradizendo a pr\u00f3pria Cl\u00e1usula 1\u00aa (\"continuada e remota\"); a Cl\u00e1usula 12\u00aa, \u00a74\u00ba permite **rescis\u00e3o imediata por descumprimento de qualquer cl\u00e1usula**, sem prazo de cura, contradizendo o \u00a72\u00ba da mesma cl\u00e1usula; e a Cl\u00e1usula 11\u00aa tem par\u00e1grafos de contrato presencial (limpeza do local, circula\u00e7\u00e3o no hospital).\n\n## Decis\u00e3o\n\n1. **Negociar sobre a minuta deles.** Brigar por formato custa semanas e o conte\u00fado essencial sobreviveu. O go-live pede contrato assinado logo.\n2. **Reajuste: IPCA (IBGE), anual**, a contar da assinatura. Padr\u00e3o de mercado, f\u00e1cil de aceitar.\n3. **SLA enxuto, do tamanho de uma opera\u00e7\u00e3o de uma pessoa:** Grave: resposta em 4 horas \u00fateis, solu\u00e7\u00e3o em 48 horas corridas; M\u00e9dia: resposta em 1 dia \u00fatil, solu\u00e7\u00e3o em 5 dias \u00fateis; Leve: resposta em 2 dias \u00fateis, solu\u00e7\u00e3o em 15 dias \u00fateis. Hor\u00e1rio \u00fatil: segunda a sexta, 9h \u00e0s 18h.\n4. **Multa: 5% de abatimento por descumprimento, com teto de 10% da mensalidade no m\u00eas**, e pedido de que o abatimento seja a \u00fanica penalidade pelo atraso (no lugar de \"sem preju\u00edzo de outras san\u00e7\u00f5es\").\n5. **Duas corre\u00e7\u00f5es de m\u00e9rito, e s\u00f3 elas:** a Cl\u00e1usula 2\u00aa volta a dizer presta\u00e7\u00e3o **remota e continuada** (reuni\u00f5es presenciais quando acordadas), e a rescis\u00e3o imediata da 12\u00aa, \u00a74\u00ba passa a exigir notifica\u00e7\u00e3o por escrito e 15 dias para sanar.\n6. **As sobras da Cl\u00e1usula 11\u00aa ficam.** Limpeza de local e circula\u00e7\u00e3o no hospital n\u00e3o obrigam a VITTA TECH a nada que ela v\u00e1 fazer; pedir a remo\u00e7\u00e3o s\u00f3 alonga a rodada.\n7. A resposta vai por e-mail do Pedro \u00e0 Josiane, com o jur\u00eddico em c\u00f3pia, sem passar pelo Felipe (conflito de interesse declarado por ele mesmo).\n\n## Considered options\n\n- **Exigir a volta da minuta da VITTA TECH:** rejeitado. O formato \u00e9 do hospital, o conte\u00fado \u00e9 nosso; a briga seria por vaidade e custaria a data do go-live.\n- **SLA de mercado (resposta em 1 hora, solu\u00e7\u00e3o em 24 horas):** rejeitado. Prazo assinado vira multa; uma pessoa s\u00f3 n\u00e3o sustenta esse n\u00famero em f\u00e9rias, viagem ou doen\u00e7a.\n- **Aceitar tudo e s\u00f3 preencher os amarelos:** rejeitado. Assinar obriga\u00e7\u00e3o de trabalho presencial e rescis\u00e3o imediata sem prazo de cura \u00e9 risco real, n\u00e3o detalhe.\n- **Pedir a limpeza completa da Cl\u00e1usula 11\u00aa:** rejeitado por ora. Cada item a mais \u00e9 uma rodada a mais com o jur\u00eddico; os par\u00e1grafos n\u00e3o mordem.\n\n## Consequ\u00eancias\n\n- O SLA deixa de ser informal: estourar 48 horas numa falha grave passa a custar dinheiro. O monitoramento da Ana e do aplicativo ganha um motivo contratual, n\u00e3o s\u00f3 t\u00e9cnico.\n- `contrato/fonte/CONTRATO-servicos-continuos.md` e o site publicado na Vercel continuam existindo como vers\u00e3o de leitura, mas quem vale \u00e9 o documento do hospital. Mudan\u00e7a futura de escopo se negocia sobre a minuta deles.\n- O marco do KPI da Ana segue \"[a ser definido entre as Partes]\" no contrato, como na nossa minuta; a defini\u00e7\u00e3o fica para o Termo de Entreg\u00e1vel correspondente.\n- Se o jur\u00eddico recusar alguma das duas corre\u00e7\u00f5es, a decis\u00e3o volta ao Pedro; nenhuma das duas \u00e9 cosm\u00e9tica.", "cita": [], "decisao": "", "emenda": [], "emendada_por": [], "file": "docs/adr/0026-o-contrato-assina-na-minuta-do-hospital.md", "number": 26, "slug": "0026-o-contrato-assina-na-minuta-do-hospital", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O contrato assina na minuta do hospital, com SLA enxuto e reajuste pelo IPCA"}, {"amended_by": "0030", "amends": "0020", "body_md": "Decis\u00e3o do Pedro (08/set/2026): a p\u00e1gina Cadeias do Ana OS deixa de ser s\u00f3 \"rodar a hist\u00f3ria inteira e ler o placar\". Cada elo passa a rodar sozinho, mostrar de onde veio cada valor de entrada e para onde vai cada valor de sa\u00edda, e ter ao lado a conversa da Ana naquele momento: a fala do paciente, as ferramentas que ela chama e a mensagem que ela responde.\n\n## Contexto\n\n- Na manh\u00e3 de 08/set o Pedro testou a Ana no Telegram e ela devolveu tr\u00eas hor\u00e1rios reais de Cardiologia. A pergunta que veio em seguida n\u00e3o era \"funcionou?\", era \"**como** ela achou isso? o que saiu de uma chamada e entrou na outra? por que 14 dias? por que o plano id 2?\". A resposta existia nos logs da plataforma, mas espalhada em quatro chamadas com JSON cru.\n- A p\u00e1gina Cadeias (ADR-0007, OS8) j\u00e1 encadeava as chamadas, mas escondia a liga\u00e7\u00e3o: o bot\u00e3o rodava tudo de uma vez e o leitor via o veredito, n\u00e3o o id atravessando de um elo para o outro. E a Cadeia D ainda estava escrita para o mundo de 06/ago (bloqueada na GH-19, dois ids no `/agendas/v2`), quando desde 26/ago a cadeia tem quatro elos e tr\u00eas ids (V33).\n- O Pedro quer testar \"ponto a ponto, na pr\u00f3pria p\u00e1gina, simulando\", em todos os cen\u00e1rios que a Ana cobre: consulta, exame, agendamento e cancelamento. E quer ver, pareado, o que estaria acontecendo na conversa enquanto a ferramenta roda.\n\n## Decis\u00e3o\n\n1. **Cada elo \u00e9 execut\u00e1vel sozinho.** Bot\u00e3o \"Rodar elo\" por elo, \"Rodar tudo\" por cadeia, \"Recome\u00e7ar\" apaga o contexto. O contexto da cadeia (os ids guardados) sobrevive entre cliques, ent\u00e3o o elo 4 s\u00f3 destrava depois dos elos 1 a 3. Elo sem pr\u00e9-requisito aparece bloqueado com o motivo escrito (\"precisa do id do plano\").\n2. **Entrada com origem, sa\u00edda com destino.** Antes de rodar, cada elo lista os campos que vai mandar com o valor atual, de qual elo veio e por qu\u00ea (a regra da tool ou do prompt que manda usar aquele valor). Depois de rodar, lista o que saiu e para qual elo segue. \u00c9 a resposta visual \u00e0 pergunta \"o que de um output entrou como input do outro\".\n3. **A conversa da Ana pareada.** A coluna direita de cada elo mostra o paciente, as ferramentas chamadas naquele momento (com o selo de origem do ADR-0018 e a marca \"n\u00e3o tem\" quando a Ana n\u00e3o pode chamar) e a mensagem dela. Onde d\u00e1, a mensagem \u00e9 montada com a resposta real do elo (a lista numerada de hor\u00e1rios, os nomes dos prestadores). Onde a Ana ainda n\u00e3o tem a ferramenta, a nota diz o que ela faz hoje e onde isso est\u00e1 gated (P6, Se\u00e7\u00e3o 2.5 e 2.6).\n4. **Elos \"s\u00f3 conversa\".** Momentos em que a Ana chama outra coisa que n\u00e3o a Global Health (pre\u00e7o na API do Hospital, etiqueta, handoff) entram como elo sem chamada, para a hist\u00f3ria ficar inteira sem a p\u00e1gina deixar de ser de origem \u00fanica. A faixa do topo passa a dizer \"toda chamada desta p\u00e1gina \u00e9 Global Health\".\n5. **As seis cadeias cobrem o que a Ana faz:** A identificar e cadastrar, B paciente conhecido, C conv\u00eanio pela agenda (ADR-0025, com hor\u00e1rio do conv\u00eanio), D consulta particular (a conversa real de 08/set, elo a elo, at\u00e9 o handoff e a finaliza\u00e7\u00e3o que n\u00e3o roda daqui), E exame (pre\u00e7o e preparo pela API do Hospital funcionam; a agenda de exame est\u00e1 vazia como a Cardiologia estava antes de 26/ago), F gerir e cancelar (listagem ao vivo; remarcar e cancelar seguem sendo finaliza\u00e7\u00e3o).\n6. **Elos compartilhados.** Os quatro elos da Se\u00e7\u00e3o 2.3.1 s\u00e3o fun\u00e7\u00f5es reutilizadas nas cadeias C e D, com a escolha do conv\u00eanio parametrizada (pelo nome que o paciente disse, ou pela linha Particular). Um \u00fanico lugar para a regra, dois cen\u00e1rios.\n\n## Considered options\n\n- **Deixar a p\u00e1gina como estava e mandar o Pedro ler o log da plataforma:** rejeitado. O log tem os fatos, mas n\u00e3o conta a hist\u00f3ria nem liga output a input. Foi exatamente a pergunta que a sess\u00e3o respondeu \u00e0 m\u00e3o antes de desenhar.\n- **P\u00e1gina nova s\u00f3 para o passo a passo:** rejeitado. A Cadeias j\u00e1 \u00e9 a p\u00e1gina desta pergunta (ADR-0007). Uma p\u00e1gina a mais repetiria o proxy, o status e a demo, contra o enxugamento do ADR-0019.\n- **Simular a Ana de verdade (chamar o modelo pela p\u00e1gina):** rejeitado por agora. A conversa pareada \u00e9 curada do prompt e da conversa real, n\u00e3o gerada. Gerar exigiria a API da plataforma pela p\u00e1gina e mudaria a natureza da tela (de prova de API para playground). O playground existe na plataforma.\n\n## Consequ\u00eancias\n\n- A Cadeia D reflete a realidade de 26/ago em diante: quatro elos, tr\u00eas ids, hor\u00e1rios reais. A demo de 5 minutos foi reescrita: o Ato 2 mostra a Ana achando hor\u00e1rio, n\u00e3o mais o cat\u00e1logo vazio.\n- Achado registrado na pr\u00f3pria p\u00e1gina: `GET /horarios/{id}/instrucoes` devolve HTTP 500 com idHorario real (medido em 08/set). Fica como \"falha real\" no elo D8 e como pergunta \u00e0 Global Health.\n- Achado de regra: duas linhas do `/convenios` t\u00eam `particular = true` (Particular e Funcionario). A descri\u00e7\u00e3o da tool 13 fala \"a linha\", no singular. A p\u00e1gina escolhe pelo nome; a tool precisa da mesma frase.\n- Achado de regra: a tool 14 manda pegar o primeiro plano (Particular Apartamento), sem perguntar. \u00c9 decis\u00e3o do programa: perguntar ao paciente ou fixar um padr\u00e3o.\n- `os/dados/grants-medida.json` est\u00e1 carimbado de 19/ago e n\u00e3o conhece as tools 13 e 14 nem a sa\u00edda da tool 4 do grant (ADR-0025). A p\u00e1gina Cadeias n\u00e3o l\u00ea esse arquivo (a concess\u00e3o est\u00e1 na pr\u00f3pria curadoria da p\u00e1gina), mas o carimbo pede renova\u00e7\u00e3o.", "cita": [], "decisao": "", "emenda": [20], "emendada_por": [30], "file": "docs/adr/0027-cadeias-elo-a-elo-com-a-conversa-da-ana-ao-lado.md", "number": 27, "slug": "0027-cadeias-elo-a-elo-com-a-conversa-da-ana-ao-lado", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "As Cadeias rodam elo a elo, e cada elo mostra a conversa da Ana ao lado"}, {"amended_by": "0029, 0030, 0031", "amends": "0007, 0011, 0019", "body_md": "Decis\u00e3o do Pedro (grilling de 09/set/2026): o que vai para a Vercel n\u00e3o \u00e9 o Ana OS. Nasce um segundo produto, o **Retrato da Ana**, um site est\u00e1tico em `retrato/` que mostra ao diretor do hospital o que a Ana faz, as regras que ela segue, onde ela busca cada resposta e o que d\u00e1 e o que n\u00e3o d\u00e1 na Global Health. O Ana OS continua local, cai de 11 para 5 abas, perde toda escrita pela tela, e o roadmap \u00e9 reiniciado com nove cards escritos do ponto em que o programa est\u00e1.\n\n## Contexto\n\n- O Pedro quer publicar na Vercel abas direcionadas ao prompt, \u00e0s capacidades, \u00e0s ferramentas, \u00e0s integra\u00e7\u00f5es e ao que a Global Health permite, em linguagem funcional para o diretor. Mas o cockpit de hoje n\u00e3o sobe: das 11 abas, s\u00f3 Arquitetura e Fam\u00edlias s\u00e3o est\u00e1ticas. As outras nove chamam o `os/server.py` para algo (ferramentas ao vivo pelo ADR-0017, proxy da GH homolog, Oracle TST, vers\u00e3o do Chatwoot). Na Vercel n\u00e3o h\u00e1 servidor com o `.env`, e o token nunca pode ir ao navegador (ADR-0004).\n- O invent\u00e1rio das abas mostrou que 11 p\u00e1ginas respondem a 5 perguntas. Cockpit e Roadmap respondem \"o que eu fa\u00e7o hoje\". Arquitetura, Circuito e Mapa da Integra\u00e7\u00e3o respondem \"como a Ana funciona\", desenhando as mesmas ferramentas tr\u00eas vezes. Compara\u00e7\u00e3o, Testes manuais e Fam\u00edlias respondem \"o que ela faz e como eu provo\", uma lendo a outra. Bancada e Cadeias respondem \"o que a GH responde\", e desde o ADR-0027 cada elo roda sozinho nas Cadeias.\n- O roadmap aberto tinha cinco itens vivos (V29, V35, GH19 j\u00e1 resolvida, P3, P6), tr\u00eas com nome de c\u00f3digo da Global Health no t\u00edtulo, mais tr\u00eas hotfixes no radar e duas ideias mortas. O Pedro pediu \"reset disso tudo\": cards enxutos, n\u00edtidos, do que falta a partir de onde a Ana est\u00e1.\n- O Pedro decidiu que nenhum card nasce pela tela: ele pede no terminal e a sess\u00e3o escreve nos dois arquivos. A escrita da UI do ADR-0011 (Ideias e o gesto \"marquei: disparado\") perde o motivo de existir.\n\n## Decis\u00e3o\n\n1. **Dois produtos.** O Ana OS segue local, cockpit do Pedro. O Retrato da Ana \u00e9 um site est\u00e1tico novo, em `retrato/` na raiz, irm\u00e3o de `os/`, sem servidor, sem segredo, sem dado ao vivo. A Vercel aponta para essa pasta.\n2. **Quatro esferas no Retrato**, uma aba com nome cada, no topo da p\u00e1gina: (1) **O que a Ana faz hoje**, das capacidades da Compara\u00e7\u00e3o, promete versus entrega, com prova; (2) **As regras da Ana**, o prompt completo como est\u00e1, o Mapa do SOP inteiro e a anatomia das se\u00e7\u00f5es com as ferramentas que cada uma chama; (3) **Onde ela busca a resposta**, ferramentas e integra\u00e7\u00f5es numa esfera s\u00f3, por origem (API do Hospital, Global Health, nativa); (4) **Global Health: o que d\u00e1 e o que n\u00e3o d\u00e1**, as cadeias A a F com a conversa da Ana ao lado, sem payload, s\u00f3 o veredito, e a lista curada do que ainda n\u00e3o d\u00e1.\n3. **O \"o que falta\" mora dentro de cada esfera**, como estado do item (funciona, em parte, ainda n\u00e3o). N\u00e3o h\u00e1 aba de pr\u00f3ximos passos no Retrato. O roadmap \u00e9 do OS.\n4. **Miolo literal, moldura de diretor.** Os n\u00f3s do SOP e as se\u00e7\u00f5es do prompt mostram o texto exato. S\u00f3 a moldura muda: t\u00edtulos, subt\u00edtulos, legendas, nomes das raias, e \"prompt congelado\" vira \"regras em vigor desde a data\".\n5. **Script de retrato.** `retrato/gerar.py` l\u00ea a plataforma (ferramentas e grants), a Compara\u00e7\u00e3o, o SOP, o Circuito, a Integra\u00e7\u00e3o e as Cadeias, e grava um \u00fanico JSON carimbado com a data em `retrato/dados/`. O site inteiro traz \"retrato de DD/MM/AAAA\" no rodap\u00e9. O Retrato \u00e9 o caso do ADR-0017 em que o dado n\u00e3o pode ser lido ao vivo: vem gravado por script, sempre com a data ao lado.\n6. **Regra de sa\u00edda.** O `gerar.py` recusa gerar se encontrar no JSON de sa\u00edda CPF, nome do paciente-sonda, URL de ambiente, token, nome de credencial do vault ou ID de tarefa do roadmap. A p\u00e1gina leva `noindex`. Link sem senha: quem tem o link, v\u00ea.\n7. **Visual.** Os tokens do `DESIGN.md` (cores, fontes, cards, chips), para os dois produtos parecerem da mesma fam\u00edlia. A navega\u00e7\u00e3o \u00e9 diferente: quatro abas nomeadas no topo, sem sidebar e sem \u00edcone.\n8. **O Ana OS cai para cinco abas**, uma por pergunta: **Cockpit** (home com a mesa de a\u00e7\u00e3o e o grafo de execu\u00e7\u00e3o logo abaixo), **Mecanismo** (Circuito, com o desenho da Arquitetura como abertura e as faixas ida, volta e fronteira do Mapa da Integra\u00e7\u00e3o, mais a vers\u00e3o do Chatwoot), **Mapa do SOP** (s\u00f3 ele: 81 n\u00f3s n\u00e3o dividem tela), **Provas** (Compara\u00e7\u00e3o em cima, a lista de Testes manuais embaixo, e o c\u00f3digo do cen\u00e1rio abrindo a fam\u00edlia), **Global Health** (as Cadeias). A Bancada da API GH vai intacta para `os/arquivo/`, aberta por URL direta, para quando precisar do endpoint cru e do SQL para o DBeaver. Nada se perde: cada aba absorvida vira se\u00e7\u00e3o da que a absorve.\n9. **O OS vira s\u00f3 leitura.** Some a faixa de Ideias, some o formul\u00e1rio, some o bot\u00e3o \"marquei: disparado\" e some a rota `POST /api/roadmap`. Card novo, card conclu\u00eddo e canal movido nascem s\u00f3 por sess\u00e3o no terminal, nos dois arquivos (TODO.md e roadmap.json). O `/check` deixa de reconciliar escrita de tela.\n10. **Roadmap reiniciado.** As tarefas feitas do est\u00e1gio anterior saem do grafo e v\u00e3o para `roadmap/arquivo/`, com o roadmap.json anterior guardado inteiro. O est\u00e1gio novo nasce com nove cards, t\u00edtulo em linguagem de a\u00e7\u00e3o, sem c\u00f3digo da GH: a GH aceita a marca\u00e7\u00e3o (hoje 417), a marca\u00e7\u00e3o aparece no banco do MV, a Ana marca, remarca e cancela de ponta a ponta, a GH publica a agenda de exames, a bancada fecha 16 de 16, o app do hospital espelha a GH, a Ana entra no WhatsApp real, o Ana OS com cinco abas, e o Retrato no ar. Os tr\u00eas hotfixes seguem no radar; as duas ideias antigas morrem (uma j\u00e1 puxada, a outra morta com a massa). Cards a mais s\u00f3 depois de o Pedro ver a esfera de capacidades.\n\n## Considered options\n\n- **Subir o Ana OS inteiro na Vercel, escondendo as abas de opera\u00e7\u00e3o:** rejeitado. O \"ao vivo\" quebra sem servidor, o diretor v\u00ea IDs de tarefa e \"homolog\", e cada aba nova do cockpit passaria a ter dois p\u00fablicos.\n- **Cinco esferas, com ferramentas separadas de integra\u00e7\u00f5es:** rejeitado. Para o diretor, ferramenta e integra\u00e7\u00e3o s\u00e3o a mesma coisa: onde a Ana busca a resposta. O selo de origem j\u00e1 faz essa jun\u00e7\u00e3o no cockpit.\n- **Uma frase de diretor por cima de cada n\u00f3 do SOP:** rejeitado. Seriam 81 tradu\u00e7\u00f5es curadas \u00e0 m\u00e3o, envelhecendo a cada vers\u00e3o do prompt. A moldura basta.\n- **Retrato sem dado da plataforma:** rejeitado. A esfera \"Onde ela busca\" perderia a informa\u00e7\u00e3o principal. O script de retrato resolve, com data.\n- **Manter uma escrita na tela (s\u00f3 o \"marquei: disparado\"):** rejeitado pelo Pedro. Um caminho s\u00f3 para mudar estado, o terminal.\n- **Seis abas no OS, com a Bancada no menu:** rejeitado. Desde o ADR-0027 cada elo roda sozinho nas Cadeias; a Bancada crua fica por URL.\n- **Retrato com senha da Vercel:** rejeitado. Plano pago e senha para o diretor lembrar; a lista de proibidos no script j\u00e1 tira do ar o que n\u00e3o pode sair.\n\n## Consequ\u00eancias\n\n- Nasce `retrato/` (HTML, `gerar.py`, `dados/`), e um `vercel.json` na raiz apontando para ela.\n- `os/` perde seis p\u00e1ginas do menu (Roadmap, Arquitetura, Integra\u00e7\u00e3o, Testes, Fam\u00edlias, Bancada), cinco absorvidas e uma arquivada, e o `nav.js` passa a ter cinco itens. O `server.py` perde `POST /api/roadmap`.\n- `os/dados/roadmap.json` perde a chave `ideias` e ganha um est\u00e1gio novo; o anterior vai para `roadmap/arquivo/`. O `roadmap/TODO.md` reinicia, com o log preservado no arquivo.\n- O `CONTEXT.md` ganha o termo Retrato da Ana, e as entradas Ana OS, Mesa de a\u00e7\u00e3o e Ideias registram a mudan\u00e7a.\n- A skill `/check` precisa parar de esperar a faixa de Ideias e a escrita de tela.\n- Publicar \u00e9 ato do Pedro: `vercel` na raiz, depois de rodar o `gerar.py` e ler o que saiu.", "cita": [], "decisao": "", "emenda": [7, 11, 19], "emendada_por": [29, 30, 31], "file": "docs/adr/0028-retrato-da-ana-e-o-os-de-cinco-abas-so-leitura.md", "number": 28, "slug": "0028-retrato-da-ana-e-o-os-de-cinco-abas-so-leitura", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O Retrato da Ana nasce para o diretor, e o Ana OS vira cinco abas s\u00f3 de leitura"}, {"amended_by": "0030, 0032", "amends": "0028, 0018", "body_md": "Decis\u00e3o do Pedro (segundo grilling de 09/set/2026): a navega\u00e7\u00e3o do Retrato da Ana e do Ana OS passa a obedecer um contrato \u00fanico, \"toda men\u00e7\u00e3o \u00e9 link, e todo link tem volta\". O Retrato ganha filtros em todas as esferas, tr\u00eas fluxogramas com bot\u00e3o de percorrer, transi\u00e7\u00e3o suave entre abas e vidro s\u00f3 no que flutua. E o Retrato deixa o visual Ledger do `DESIGN.md` para vestir o design system do aplicativo do hospital (fonte HP Simplified, azul-marinho `#2B2E7E`, cantos pequenos, sombra e vidro do app, logo do hospital), porque \u00e9 o sistema que o diretor j\u00e1 usa todo dia. O Ana OS mant\u00e9m o Ledger e ganha s\u00f3 o contrato de links.\n\n## Contexto\n\n- O Retrato nascido no ADR-0028 tinha link s\u00f3 dentro da aba das regras (\u00edndice para se\u00e7\u00e3o, n\u00f3 para n\u00f3). Capacidade, ferramenta e elo de cadeia n\u00e3o levavam a lugar nenhum, embora o dado da liga\u00e7\u00e3o j\u00e1 existisse (`secao_ids` nas capacidades, ferramentas por se\u00e7\u00e3o no `circuito.json`, ferramenta por elo nas cadeias). O Pedro pediu: \"tudo deve ter link: chamadas, ferramentas, se\u00e7\u00f5es, direto para o prompt\", no Retrato e no OS.\n- Ele pediu tamb\u00e9m mais intera\u00e7\u00e3o (filtros, anima\u00e7\u00e3o, fluxogramas), troca de abas mais fluida, \"um pouco mais liquid glass\", e o visual do app do hospital s\u00f3 no Retrato.\n- O app do hospital (`~/PedroDev/Hospital`, `frontend/src/app/globals.css`) tem design system expl\u00edcito: HP Simplified (s\u00f3 o peso regular), `--color-primary #2B2E7E`, `--color-primary-light #3B6FB6`, `--color-secondary #88D7A4` (verde), `--color-accent #FFC067` (\u00e2mbar), `--color-error #FC9D9D`, `--color-info #7CC2F2`, raios de 1 a 12 px, `--shadow-premium`, a utilit\u00e1ria `.glass-card` (branco a 80% com desfoque de 12 px) e as anima\u00e7\u00f5es `fade-in-up` e `fade-in-right`. E tem um renderizador pr\u00f3prio de fluxograma (ADR-0024 de l\u00e1): cards numerados, decis\u00f5es em \u00e2mbar, retornos em curva, terminais. O diretor l\u00ea os POPs nesse desenho.\n\n## Decis\u00e3o\n\n1. **Contrato de links (Retrato e OS).** Toda men\u00e7\u00e3o a ferramenta, se\u00e7\u00e3o do prompt, n\u00f3 do mapa, capacidade ou cadeia \u00e9 um link para o item. Todo item lista, linkados, os que o mencionam: ferramenta mostra as se\u00e7\u00f5es que a chamam, as capacidades que dependem dela e as cadeias que a usam; se\u00e7\u00e3o mostra os n\u00f3s do mapa e as ferramentas; capacidade mostra se\u00e7\u00f5es e ferramentas; elo de cadeia mostra ferramenta e se\u00e7\u00e3o. O link troca de aba (ou de p\u00e1gina, no OS) sozinho, rola at\u00e9 o alvo e o acende por dois segundos. Item sem liga\u00e7\u00e3o n\u00e3o ganha link inventado.\n2. **A URL carrega o destino e o filtro.** No Retrato: `#<aba>/<alvo>?<filtros>` (ex.: `#regras/sec-2-3-1`, `#faz?estado=ainda-nao`). No OS: `<pagina>.html#<alvo>`, com o mesmo acender de chegada em toda p\u00e1gina (um `os/assets/liga.js` comum).\n3. **Filtros em toda esfera do Retrato**, numa barra fixa abaixo das abas: busca livre mais chips. Faz: estado e bloco. Regras: raia, tipo de n\u00f3 e ferramenta (os n\u00f3s que n\u00e3o a chamam esmaecem). Busca: origem e \"pode chamar hoje\". Global Health: veredito.\n4. **Tr\u00eas fluxogramas na gram\u00e1tica do hospital, cada um com \"percorrer\".** O caminho de uma mensagem (paciente, WhatsApp, Ana, ferramenta, fonte, resposta) na esfera \"Onde ela busca\", com o caminho de cada ferramenta acendendo ao clique. Cada cadeia da Global Health desenhada elo a elo (recusa de prop\u00f3sito como decis\u00e3o em \u00e2mbar, \"ainda n\u00e3o\" como terminal tracejado), com o percorrer avan\u00e7ando um elo por vez e a conversa da Ana ao lado. E o percorrer de uma jornada no mapa das regras: acende os n\u00f3s da raia na ordem e abre o trecho literal de cada um. Nada roda sozinho ao abrir a p\u00e1gina; `prefers-reduced-motion` desliga toda anima\u00e7\u00e3o.\n5. **Vidro s\u00f3 no que flutua.** A barra de abas do Retrato fica fixa no topo, transl\u00facida com desfoque (a `.glass-card` do app). Os pain\u00e9is flutuantes (ficha do n\u00f3, ficha da ferramenta) ganham o mesmo vidro. Cards e fundo continuam opacos. A troca de aba \u00e9 uma transi\u00e7\u00e3o de 250 ms (sai desvanecendo, entra deslizando de leve).\n6. **O Retrato veste o app do hospital.** Tokens copiados para `retrato/assets/`: HP Simplified (t\u00edtulos crescem em tamanho, n\u00e3o em peso), azul-marinho como cor principal, verde, \u00e2mbar e vermelho do app como cores de estado, raios pequenos, sombra premium, logo `logo-hsm.png`. Selos de origem: API do Hospital em azul-marinho, Global Health em \u00e2mbar (como o ADR-0018 pedia), nativa em cinza. O `DESIGN.md` da Ana ganha a se\u00e7\u00e3o \"Retrato: veste o app do hospital\". O Ana OS n\u00e3o muda de visual.\n7. **A fonte HP Simplified \u00e9 propriet\u00e1ria da HP.** O app do hospital j\u00e1 a serve publicamente; o Retrato a republica num dom\u00ednio da Vercel. O Pedro foi avisado e decidiu manter. Se a decis\u00e3o mudar, a troca \u00e9 uma linha no CSS (Source Sans 3 como substituta).\n\n## Considered options\n\n- **S\u00f3 ida para o prompt, sem volta:** rejeitado. O diretor chega na regra e n\u00e3o consegue voltar para \"onde ela busca\".\n- **Vidro em tudo (cards transl\u00facidos, manchas de cor ao fundo):** rejeitado. Quebra a leitura de tabela e de SVG, e contraria o pr\u00f3prio design system do app, que usa vidro s\u00f3 em card flutuante e modal.\n- **S\u00f3 as cores do hospital, mantendo Poppins/Inter e o Ledger:** rejeitado. Fica um h\u00edbrido que n\u00e3o \u00e9 nem o OS nem o hospital.\n- **S\u00f3 busca livre, sem chips:** rejeitado. O diretor n\u00e3o descobre sozinho que d\u00e1 para ver \"s\u00f3 o que falta\".\n- **S\u00f3 a cadeia vira fluxo:** rejeitado. O caminho da mensagem e o percorrer da jornada s\u00e3o o que faz o Retrato explicar em vez de listar.\n- **Reusar o c\u00f3digo React do renderizador do hospital:** rejeitado. O Retrato \u00e9 est\u00e1tico sem build; copia-se a gram\u00e1tica visual (formas, cores, numera\u00e7\u00e3o), n\u00e3o o componente.\n\n## Consequ\u00eancias\n\n- `retrato/` \u00e9 reescrito por dentro: `assets/hospital.css` (tokens), `assets/liga.js` (contrato de links e URL), `assets/filtros.js`, `assets/fluxo.js` (gram\u00e1tica do hospital, com percorrer), `sop.js` ganha o percorrer de jornada. O `gerar.py` passa a gravar as liga\u00e7\u00f5es inversas (quem menciona quem) no `retrato.json`.\n- `os/assets/liga.js` novo, carregado por todas as p\u00e1ginas do OS; Provas, Mecanismo, Mapa do SOP e Global Health ganham os links que faltavam.\n- `DESIGN.md` ganha a se\u00e7\u00e3o do Retrato; `CONTEXT.md` atualiza o termo Retrato da Ana e ganha o termo Contrato de links.", "cita": [], "decisao": "", "emenda": [28, 18], "emendada_por": [30, 32], "file": "docs/adr/0029-tudo-tem-link-e-o-retrato-veste-o-app-do-hospital.md", "number": 29, "slug": "0029-tudo-tem-link-e-o-retrato-veste-o-app-do-hospital", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Tudo tem link, e o Retrato da Ana veste o design system do app do hospital"}, {"amended_by": "0031, 0032, 0034, 0035", "amends": "0028, 0029, 0017, 0027", "body_md": "Decis\u00e3o do Pedro (terceiro grilling de 09/set/2026): o Ana OS estava obeso. Cinco abas com 340 KB de HTML, textos que explicavam de novo o que o mapa ao lado j\u00e1 mostrava, e tr\u00eas p\u00e1ginas desenhando as mesmas ferramentas. O Retrato da Ana, nascido dois grillings antes, j\u00e1 era a vers\u00e3o curada, ligada e filtr\u00e1vel de quatro dessas abas. O OS passa a ser o Retrato com o motor aberto: uma p\u00e1gina s\u00f3, Cockpit mais as quatro esferas com os mesmos nomes, desenhadas pelos mesmos motores JS, lendo o dado ao vivo, com a roupa Ledger e uma camada de opera\u00e7\u00e3o que s\u00f3 um arquiteto precisa.\n\n## Contexto\n\n- O Pedro descreveu o OS como \"uma obesidade de informa\u00e7\u00e3o\": muita coisa, falando da mesma coisa, pouco naveg\u00e1vel. Ele queria algo mais simples, mais enxuto, com muitas liga\u00e7\u00f5es, e t\u00e9cnico s\u00f3 na medida em que um arquiteto precisa, na tang\u00eancia com o funcional.\n- O leitor do OS mudou. Deixa de ser s\u00f3 o Pedro e passa a incluir quem pegar o programa depois (um analista de TI do hospital, algu\u00e9m da fazer.ai). O OS precisa se explicar sozinho.\n- Quatro das cinco abas do OS tinham par direto no Retrato: Provas era \"O que a Ana faz hoje\", Mapa do SOP era \"As regras da Ana\", Mecanismo era \"Onde ela busca a resposta\", Global Health era Global Health. S\u00f3 o Cockpit n\u00e3o tinha par.\n- Os motores do Retrato (`liga.js`, `filtros.js`, `fluxo.js`, `sop.js`, `retrato.js`) j\u00e1 implementavam o contrato de links do ADR-0029, os filtros por esfera e os fluxogramas com percorrer. O OS tinha o seu pr\u00f3prio `liga.js` e nada dos outros.\n- O `retrato/gerar.py` j\u00e1 montava, a partir de `os/dados/` e da plataforma, o documento com as liga\u00e7\u00f5es inversas calculadas. S\u00f3 gravava em arquivo, para a Vercel.\n\n## Decis\u00e3o\n\n1. **O leitor \u00e9 um arquiteto.** O OS escreve para o Pedro e para quem pegar o programa depois. Nada depende da mem\u00f3ria de quem l\u00ea: IDs, ambientes e nomes de c\u00f3digo aparecem, mas com uma frase que os explica.\n2. **S\u00f3 o esqueleto do Retrato, n\u00e3o a roupa.** O OS ganha as abas nomeadas no topo numa barra fixa transl\u00facida, a barra de filtros por esfera, o painel lateral de detalhe e os fluxogramas com percorrer. Mant\u00e9m o Ledger do `DESIGN.md` (Poppins e Inter, preto sobre claro, cards sem sombra, sidebar preta). Roupa diferente diz em qual dos dois produtos voc\u00ea est\u00e1.\n3. **As mesmas quatro esferas, com os mesmos nomes e a mesma ordem do Retrato**, mais o Cockpit na frente: Cockpit, O que a Ana faz hoje, As regras da Ana, Onde ela busca a resposta, Global Health: o que d\u00e1 e o que n\u00e3o d\u00e1. Um mapa s\u00f3 para os dois produtos.\n4. **A regra de corte.** O OS mostra o que o Retrato mostra, mais tr\u00eas camadas, e nada al\u00e9m: (a) o ao vivo: selo de origem lido da plataforma, a chamada real de cada ferramenta (m\u00e9todo e caminho), a vers\u00e3o do Chatwoot, o bot\u00e3o de rodar cada elo na Global Health; (b) a prova crua: os testes manuais de cada capacidade e as fam\u00edlias da bancada, com o c\u00f3digo do cen\u00e1rio; (c) o Cockpit. Sai do menu tudo o que era texto explicativo repetindo o desenho ao lado: os quatro n\u00edveis de teste, o caminho de um teste manual, os comandos e artif\u00edcios, as travas, as oito regras de ouro, as dez raias do kanban, as oito etiquetas, \"ao redor do fluxo\", \"o trecho futuro: agendamento no MV\", \"por que esta se\u00e7\u00e3o n\u00e3o envelhece\", \"o que fica de fora\" e a demonstra\u00e7\u00e3o de cinco minutos. Tudo isso segue intacto nas p\u00e1ginas arquivadas.\n5. **O OS continua lendo o dado vivo.** N\u00e3o l\u00ea o `retrato.json` publicado. O `os/server.py` ganha a rota `/api/retrato`, que importa o `retrato/gerar.py` e chama a mesma fun\u00e7\u00e3o `montar` em processo, a cada pedido (cache de 60 s em mem\u00f3ria), lendo `os/dados/` e a plataforma. Uma l\u00f3gica de montagem s\u00f3, sem a varredura de proibidos (o OS \u00e9 local) e sem gravar arquivo. \u00c9 a regra do ADR-0017 aplicada ao Retrato: o OS \u00e9 o lugar do agora; o Retrato \u00e9 a foto com data. A p\u00e1gina diz \"lido agora, HH:MM\" onde o Retrato diz \"retrato de DD/MM/AAAA\".\n6. **Os motores do Retrato s\u00e3o fonte \u00fanica.** O server serve `retrato/assets/*.js` por `/retrato/`, s\u00f3 JS e CSS, nunca fontes, logo ou dados. Os motores ganharam ganchos pequenos para o OS: lista de abas configur\u00e1vel (`window.LIGA_ABAS`, a primeira \u00e9 a de chegada), URL do dado (`window.RETRATO_DADOS`), fonte de medi\u00e7\u00e3o dos textos (`window.FLUXO_FONTE`), paleta dos fluxogramas (`window.FLUXO_PALETA`) e o evento `retrato:pronto` ao fim da montagem. O Retrato n\u00e3o muda de comportamento.\n7. **A roupa \u00e9 CSS, e CSS \u00e9 forkado de prop\u00f3sito.** `os/assets/esferas.css` reescreve as classes do `retrato.css` nos tokens Ledger e escopa o que colide (os n\u00f3s do mapa do SOP em `#svg`, os cart\u00f5es do grafo em `#grafo`). O esqueleto (HTML e JS) \u00e9 compartilhado; a roupa \u00e9 de cada produto, como o ADR-0029 j\u00e1 decidia.\n8. **O Cockpit responde uma pergunta s\u00f3: o que eu fa\u00e7o agora.** Ficam a mesa de a\u00e7\u00e3o e o grafo. O radar vira uma linha por item, abaixo do grafo, com a prioridade num c\u00edrculo. As aplica\u00e7\u00f5es externas (plataforma, Chatwoot, Langfuse, Coolify, bot do Telegram) viram \u00edcones na sidebar, que j\u00e1 existia e \u00e9 s\u00f3 \u00edcone. O cabe\u00e7alho de indicadores some: o placar do grafo j\u00e1 conta o que falta. Os par\u00e1grafos de manual viram uma linha curta.\n9. **A camada de opera\u00e7\u00e3o vive num script \u00e0 parte** (`os/assets/os-esferas.js`), que escuta `retrato:pronto` e acrescenta o que a regra de corte permite. O motor das cadeias saiu da p\u00e1gina antiga para `os/assets/cadeias-motor.js`, sem DOM, com API para rodar um elo, uma cadeia inteira ou recome\u00e7ar; a aba Global Health desenha a cadeia com o motor do Retrato e p\u00f5e, em cada elo, a chamada real, a entrada de cada valor (de onde veio e por qu\u00ea), o bot\u00e3o de rodar, o resultado, a sa\u00edda que segue, o que foi enviado e a resposta crua. Quando o elo roda com sucesso, a fala da Ana ao lado \u00e9 montada com a resposta real.\n10. **As p\u00e1ginas antigas v\u00e3o intactas para `os/arquivo/`** (`cockpit.html`, `circuito.html`, `sop.html`, `comparacao.html`, `cadeias.html`), com os caminhos de assets corrigidos, fora do menu, por URL direta. Os nomes das abas mudam; a URL do OS passa a ser `index.html#<aba>/<alvo>`, a mesma gram\u00e1tica do Retrato.\n11. **Os textos passam por um passe de escrita humana.** As descri\u00e7\u00f5es do roadmap (mesa, notas, radar) e as molduras das abas perdem os tiques de texto de m\u00e1quina: contraste \"n\u00e3o X, mas Y\", fechos de uma linha, tr\u00edades for\u00e7adas, r\u00f3tulos em negrito, palavras infladas. Fatos ficam; enfeite sai.\n\n## Considered options\n\n- **Manter as cinco p\u00e1ginas e s\u00f3 cortar gordura dentro de cada uma:** rejeitado. Continuaria com dois esqueletos (OS e Retrato) e dois vocabul\u00e1rios de aba para o mesmo conte\u00fado.\n- **Vestir o OS tamb\u00e9m com o design system do hospital:** rejeitado pelo Pedro. O que pesa \u00e9 o esqueleto; a roupa diferente ajuda a distinguir os dois produtos, e o ADR-0029 j\u00e1 tinha decidido que o OS fica no Ledger.\n- **O OS ler o `retrato.json` publicado:** rejeitado. O OS ficaria datado como o Retrato e rodar o `gerar.py` viraria passo obrigat\u00f3rio antes de olhar o cockpit. O OS \u00e9 o lugar do agora (ADR-0017).\n- **Portar a montagem do `gerar.py` para JavaScript e calcular as liga\u00e7\u00f5es no navegador:** rejeitado na execu\u00e7\u00e3o. Seriam 600 linhas duplicadas; importar o script em processo no server d\u00e1 o mesmo resultado, vivo, com uma l\u00f3gica s\u00f3.\n- **Copiar os motores do Retrato para `os/assets/`:** rejeitado. C\u00f3pia diverge em sil\u00eancio; o server serve a pasta original.\n- **Cockpit com os cinco blocos (indicadores, mesa, grafo, radar, aplica\u00e7\u00f5es):** rejeitado. Tr\u00eas dos cinco falavam do mesmo est\u00e1gio de jeitos diferentes.\n- **Manter o bot\u00e3o de rodar elo s\u00f3 na Bancada arquivada:** rejeitado. Rodar cada elo \u00e9 a camada ao vivo que d\u00e1 sentido ao OS na aba Global Health (ADR-0027).\n\n## Consequ\u00eancias\n\n- `os/index.html` \u00e9 reescrito como p\u00e1gina \u00fanica; `os/assets/esferas.css`, `os/assets/cockpit.js`, `os/assets/os-esferas.js` e `os/assets/cadeias-motor.js` nascem; `os/assets/nav.js` vira sidebar de logo e aplica\u00e7\u00f5es; `os/assets/grafo.js` ganha ids com prefixo `grafo-`. O `os/assets/liga.js` antigo segue existindo s\u00f3 para as p\u00e1ginas arquivadas.\n- `os/server.py` ganha `/api/retrato` e `/retrato/<x>.js|.css`. As regras de seguran\u00e7a n\u00e3o mudam: token nunca no navegador, GH s\u00f3 homologa\u00e7\u00e3o, produ\u00e7\u00e3o proibida.\n- `retrato/gerar.py` passa a ter dois chamadores: a linha de comando (grava o `retrato.json` publicado, com a varredura) e o server do OS (monta em mem\u00f3ria, sem varredura). A fun\u00e7\u00e3o `montar` \u00e9 o contrato.\n- `retrato/assets/*.js` ganham os ganchos da decis\u00e3o 6. Verifica\u00e7\u00e3o de regress\u00e3o do Retrato: zero erros de console, 768 links e nenhum morto, cores do hospital intactas.\n- Verifica\u00e7\u00e3o do OS: zero erros de console a 1360 e 390 px, sem rolagem horizontal, 774 links e nenhum morto, o elo B1 rodado de verdade na homologa\u00e7\u00e3o, chegada acesa por link, mesa abrindo o painel.\n- `CONTEXT.md` atualiza Ana OS e Contrato de links e ganha o termo Camada de opera\u00e7\u00e3o; `DESIGN.md` ganha a se\u00e7\u00e3o do esqueleto do Retrato no Ledger; `CLAUDE.md` descreve a p\u00e1gina \u00fanica.\n- O `/check` n\u00e3o muda: continua reconciliando TODO.md e roadmap.json.", "cita": [], "decisao": "", "emenda": [28, 29, 17, 27], "emendada_por": [31, 32, 34, 35], "file": "docs/adr/0030-o-ana-os-e-uma-pagina-so-o-esqueleto-do-retrato-vestido-de-ledger.md", "number": 30, "slug": "0030-o-ana-os-e-uma-pagina-so-o-esqueleto-do-retrato-vestido-de-ledger", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O Ana OS \u00e9 uma p\u00e1gina s\u00f3: o esqueleto do Retrato vestido de Ledger, com a camada de opera\u00e7\u00e3o por cima"}, {"amended_by": "0035", "amends": "0008, 0011, 0028, 0030", "body_md": "Decis\u00e3o do Pedro (grilling de 09/out/2026, na volta depois de quatro semanas parado): os cards do roadmap deixam de viver em `roadmap/TODO.md` + `os/dados/roadmap.json` e passam a ser **Issues do repo privado `pedrorezendefig/programa-ana`**. O Cockpit do Ana OS vira a aba do GitHub: a mesma mesa, o mesmo grafo e o mesmo radar, agora lidos ao vivo pelo `gh`, com os filtros, o funil e o card da issue que o Hospital OS j\u00e1 tem. O `roadmap.json` morre; o `TODO.md` fica s\u00f3 com a narrativa.\n\n## Contexto\n\n- O estado morava em dois arquivos que precisavam concordar sempre, e o `/check` era o fiador do sync. Funcionou, mas custava um ritual por sess\u00e3o e um arquivo JSON que ningu\u00e9m lia direto.\n- O repo do hospital (`hospital-reunioes`) j\u00e1 roda inteiro em GitHub Issues, com o **Hospital OS** (`tools/workflow-dashboard/`) lendo o `gh` ao vivo: filtros em dropdown, funil por fase, \u00e1rvore de issues, card com linha do tempo e coment\u00e1rios. A regra de l\u00e1: \"nada deriva de arquivo o que o GitHub j\u00e1 diz\".\n- O Pedro quer o mesmo conceito aqui, e quer ver os cards por categoria (Global Health, Ana, fazer.ai, Chatwoot, app do hospital, OS) e atribuir tudo a si para medir o tamanho de cada coisa.\n- `propostas` e `pendentes` estavam vazios no `roadmap.json` de 10/set: os dois conceitos morrem sem perda.\n\n## Decis\u00e3o\n\n1. **O GitHub \u00e9 a \u00fanica fonte dos cards.** Issue aberta \u00e9 card aberto; issue fechada \u00e9 card feito. N\u00e3o existe espelho em arquivo. O `roadmap.json` sai de `os/dados/` (a \u00faltima vers\u00e3o fica em `roadmap/arquivo/`), e a tabela de tarefas sai do `TODO.md`, que mant\u00e9m s\u00f3 o par\u00e1grafo \"Estado\" e o log.\n2. **Categorias s\u00e3o labels `area:`**, seis: `area:global-health`, `area:ana`, `area:fazer-ai`, `area:chatwoot`, `area:app-hospital`, `area:os`. Uma issue pode ter mais de uma. A primeira delas \u00e9 o tema da faixa no grafo.\n3. **O canal da mesa \u00e9 label `canal:`**, uma por issue aberta, obrigat\u00f3ria: `canal:dispare`, `canal:comigo`, `canal:aguardando`. O \"dono\" (P/C/E) morre: o canal j\u00e1 diz quem move. A idade no canal (\"h\u00e1 N dias\") vem da data em que a label foi posta, lida dos eventos da issue; o campo `canal_desde` morre.\n4. **O corpo da issue tem se\u00e7\u00f5es fixas**, lidas pela aba: `Antes: <ID antigo>` na primeira linha (s\u00f3 nas migradas), `## Destrava`, `## Gesto`, `## Pronto quando`, `## Prompt`, `## Bloqueada por` (uma linha `#N` por depend\u00eancia, a mesma gram\u00e1tica do hospital) e `## Nota`. Issue aberta sem `## Gesto` ou sem `## Prompt` aparece como defeito no Cockpit, como hoje.\n5. **A ficha de conclus\u00e3o \u00e9 um coment\u00e1rio** com `## Ficha` e tr\u00eas linhas (`Fez:`, `Mudou:`, `Valor:`), escrito ao fechar. \u00c9 o que o hover do grafo mostra no n\u00f3 feito.\n6. **O radar \u00e9 a label `radar`** mais a linha `Prioridade: N/10` no corpo. Fica fora do grafo e fora do term\u00f4metro, como antes.\n7. **O est\u00e1gio \u00e9 um milestone.** Toda issue do est\u00e1gio entra nele; ao fechar o est\u00e1gio, fecha o milestone e nasce outro. Para os pr\u00f3ximos est\u00e1gios isso substitui o `roadmap/arquivo/`.\n8. **O term\u00f4metro \u00e9 issues fechadas sobre o total**, sem contar `radar`. O `/check` mede pelo `gh`, n\u00e3o mais por arquivo.\n9. **O Cockpit vira a aba do GitHub**, no lugar, n\u00e3o ao lado. Mesa, grafo e radar ficam e ganham o que o Hospital OS tem: filtros (canal, \u00e1rea, estado, busca, com a contagem em cada op\u00e7\u00e3o), o funil (um card com o total pendente e um por canal) e o card da issue com o corpo, a linha do tempo e os coment\u00e1rios. Sem aba de PRs nem de Produ\u00e7\u00e3o: o repo da Ana n\u00e3o usa PR.\n10. **O OS continua s\u00f3 leitura.** Criar issue, mover canal e fechar seguem gestos de sess\u00e3o no terminal, agora via `gh` em vez de editar JSON. O `/check` l\u00ea o `gh` e perde a reconcilia\u00e7\u00e3o de dois arquivos.\n11. **O servidor monta o mesmo JSON de antes a partir do GitHub.** A rota `/api/roadmap` continua existindo com a mesma forma (`estagio`, `tarefas`, `radar`, `mesa`, `prompt`, `deps`, `ficha`), agora preenchida por `gh issue list` e pelos eventos de cada issue, com cache curto em mem\u00f3ria. O grafo e a mesa quase n\u00e3o mudam; o que muda \u00e9 a fonte.\n12. **Migra\u00e7\u00e3o em 09/out/2026:** as 8 issues abertas e as 3 do radar nascem atribu\u00eddas ao Pedro; as 3 feitas (OS25, OS27, OS28) nascem e fecham na hora, com a ficha no coment\u00e1rio, para o est\u00e1gio continuar em 3 de 11. As datas de `canal_desde` anteriores a hoje se perdem (a idade recome\u00e7a na data da label): perda aceita.\n\n## Alternativas rejeitadas\n\n- **Manter os arquivos e espelhar no GitHub:** tr\u00eas fontes para desincronizar em vez de duas. Rejeitada.\n- **Sexta aba s\u00f3 para o GitHub, Cockpit intacto:** duas telas do mesmo roadmap. Rejeitada.\n- **Ler as issues do repo do hospital dentro do Ana OS:** as 20 abertas de l\u00e1 n\u00e3o tocam a Ana, a GH nem a fazer.ai. Rejeitada.\n- **N\u00e3o criar as issues j\u00e1 feitas:** o term\u00f4metro cairia para 0 de 8 e o est\u00e1gio perderia o hist\u00f3rico. Rejeitada.\n\n## Consequ\u00eancias\n\n- O `/check` muda de rotina: passo 0 mede pelo `gh`; os passos 4, 8 e 9 (reconciliar e escrever os dois arquivos) somem; card novo, canal movido e card feito viram comandos `gh` na sess\u00e3o.\n- O Retrato n\u00e3o muda: ele nunca mostrou o roadmap (ADR-0028, decis\u00e3o 3).\n- Sem rede ou sem `gh` autenticado, o Cockpit mostra o motivo em vez da mesa. O OS \u00e9 o lugar do agora (ADR-0017), ent\u00e3o n\u00e3o h\u00e1 cache em disco.\n- O repo tem que continuar privado: os corpos das issues citam o hospital, o ambiente de homologa\u00e7\u00e3o e os nomes das ferramentas.\n- A se\u00e7\u00e3o `## Prompt` \u00e9 texto que o Pedro cola numa sess\u00e3o do Claude Code. Quem escreve numa issue escreve, na pr\u00e1tica, uma instru\u00e7\u00e3o para a sess\u00e3o. Hoje s\u00f3 o Pedro tem acesso de escrita ao repo; se entrar colaborador, revisar o prompt antes de colar vira regra, e o Cockpit mostra quem editou por \u00faltimo na linha do tempo.\n- O `os/server.py` s\u00f3 aceita pedidos com `Host` local (localhost ou 127.0.0.1): barreira contra DNS rebinding, j\u00e1 que as rotas passam a expor o conte\u00fado das issues e o detalhe de cada uma.", "cita": [], "decisao": "", "emenda": [8, 11, 28, 30], "emendada_por": [35], "file": "docs/adr/0031-o-roadmap-sai-dos-arquivos-e-vai-para-o-github.md", "number": 31, "slug": "0031-o-roadmap-sai-dos-arquivos-e-vai-para-o-github", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O roadmap sai dos arquivos e vai para as Issues do GitHub; o Cockpit l\u00ea o `gh`"}, {"amended_by": null, "amends": "0022, 0029, 0030", "body_md": "Decis\u00e3o do Pedro (grilling de 09/out/2026, 16 decis\u00f5es, todas no recomendado): a se\u00e7\u00e3o \"provas da bancada\" (fam\u00edlias A a E) sai do Ana OS, os testes manuais das capacidades viram cen\u00e1rios da bancada com conversa gravada, e o OS ganha o **player**, uma tela que toca uma conversa real do paciente com a Ana.\n\n## Contexto\n\n- As fam\u00edlias A a E nasceram para provar a migra\u00e7\u00e3o do NocoDB para o app do hospital (ADR-0015, ADR-0022). A migra\u00e7\u00e3o acabou em 19/ago/2026 e o NocoDB est\u00e1 parado. O n\u00edvel 1.5 (Diverg\u00edmetro) s\u00f3 compara o app com o NocoDB. A se\u00e7\u00e3o ficou confusa: mistura prova de migra\u00e7\u00e3o encerrada com prova da Ana de hoje.\n- 26 das 30 capacidades t\u00eam teste manual com a frase do paciente e os campos objetivos (etiqueta, raia, handoff, ferramenta), mas nenhum guarda a resposta real da Ana. Resposta real s\u00f3 existia nos 26 cen\u00e1rios de `ana/bancada/cenarios/integracao.json`, e s\u00f3 da \u00faltima rodada, num arquivo fora do git.\n- O \"percorrer a jornada\" do Mapa do SOP anda r\u00e1pido demais e n\u00e3o mostra uma conversa. Os filtros escondem itens mas n\u00e3o levam at\u00e9 eles.\n\n## Decis\u00e3o\n\n1. **A se\u00e7\u00e3o da bancada sai da tela** e vai para `os/arquivo/`. Os cen\u00e1rios B, C, D e E e a fam\u00edlia A (manual) viram testes das capacidades dos blocos \"A Base Ana\" e \"Ouvidoria\". O Diverg\u00edmetro morre: `divergimetro.py` vai para `ana/bancada/arquivo/`.\n2. **Os testes manuais viram cen\u00e1rios** em `ana/bancada/cenarios/capacidades.json`, rodados pelo `e2e.py` no canal de teste real. A m\u00e1quina confere s\u00f3 o objetivo (etiqueta, raia, handoff, ferramenta chamada, frases proibidas). O texto \"espere\" n\u00e3o vira nota autom\u00e1tica: o player o mostra ao lado da resposta para o Pedro julgar. Sem juiz por IA.\n3. **A conversa gravada fica versionada**: um arquivo por cen\u00e1rio em `ana/bancada/conversas/<id>.json`, dentro do git, sobrescrito a cada bateria. O hist\u00f3rico das rodadas \u00e9 o `git log`. Os contatos s\u00e3o de teste, sem dado de paciente.\n4. **O player** abre por cima da p\u00e1gina, fecha com Esc e tem endere\u00e7o (`#tocar=<id>`, contrato de links do ADR-0029). Paciente em bal\u00e3o cinza \u00e0 esquerda, Ana em azul-marinho \u00e0 direita, ferramenta chamada como chip entre os bal\u00f5es, confer\u00eancia falha em faixa vermelha com \"esperado / veio\". Avan\u00e7a com \"pr\u00f3ximo\"; o play opcional anda uns 4 s por passo. Cen\u00e1rio sem conversa gravada mostra \"nunca rodou\" e n\u00e3o toca. S\u00f3 conversa real, nunca exemplo escrito \u00e0 m\u00e3o.\n5. **O player aparece em tr\u00eas lugares**: nos testes de cada capacidade, nas jornadas do Mapa do SOP (o \"percorrer\" vira o player: conversa \u00e0 esquerda, fluxograma \u00e0 direita, cada n\u00f3 acende no turno que o cen\u00e1rio declara, e fica vermelho se a confer\u00eancia daquele turno falhar) e nas ferramentas (toca o primeiro cen\u00e1rio que a chama, com lista quando h\u00e1 mais de um).\n6. **S\u00f3 no Ana OS.** O Retrato fica sem player por enquanto: o `gerar.py` recusa contato de teste.\n7. **Todo filtro leva at\u00e9 a se\u00e7\u00e3o**: em todas as abas, o chip filtra e rola at\u00e9 o primeiro item que bate, com um destaque r\u00e1pido.\n\n## Consequ\u00eancias\n\n- O OS continua s\u00f3 leitura: a bateria roda no terminal, o OS s\u00f3 l\u00ea `ana/bancada/conversas/`.\n- Cen\u00e1rio de agendamento chama a Global Health em homologa\u00e7\u00e3o; enquanto a massa n\u00e3o existir, a conversa gravada mostra a sa\u00edda de escape, e isso \u00e9 a prova honesta.\n- Capacidade sem cen\u00e1rio automatiz\u00e1vel (A, D2, D3, manuais) fica sem play e mostra s\u00f3 os passos.", "cita": [], "decisao": "", "emenda": [22, 29, 30], "emendada_por": [], "file": "docs/adr/0032-a-bancada-da-migracao-sai-da-tela-e-o-os-ganha-o-player.md", "number": 32, "slug": "0032-a-bancada-da-migracao-sai-da-tela-e-o-os-ganha-o-player", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A bancada da migra\u00e7\u00e3o sai da tela, os testes manuais viram cen\u00e1rios e o OS ganha o player"}, {"amended_by": null, "amends": null, "body_md": "Data: 13/out/2026. Estado: aceito.\n\n## Contexto\n\nDesde o ADR-0032 cada cen\u00e1rio da bancada grava a sua conversa em `ana/bancada/conversas/<id>.json`, e o player do Ana OS toca essa grava\u00e7\u00e3o. Mas a grava\u00e7\u00e3o nasce s\u00f3 no fim do cen\u00e1rio. Para ver a bateria rodando, o Pedro abria outro terminal com `tail -f` no log de texto ou filtrava a inbox no Chatwoot, que n\u00e3o mostra o trace. O ritual das tr\u00eas rodadas (um script de sess\u00e3o, `bateria3x.sh`, c\u00f3pia das conversas na m\u00e3o, diagn\u00f3stico em `resultados/`, que o git ignora) vivia na cabe\u00e7a de cada sess\u00e3o e sumia com ela.\n\n## Decis\u00e3o\n\n1. **O runner emite eventos.** O `e2e.py` grava `ana/bancada/resultados/ao-vivo.jsonl`, uma linha JSON por acontecimento (bateria, cen\u00e1rio, conversa, paciente, Ana, trace, veredito, placar), zerado a cada execu\u00e7\u00e3o. O log de texto continua igual.\n2. **O runner cuida das rodadas.** Com `--bateria <nome> --rodada <n>` ele grava `bateria-<nome>-rodada<n>.log`, copia as conversas para `conversas-<nome>-rodada<n>/` e anota as janelas, tudo em `resultados/`. Os nomes s\u00e3o os que j\u00e1 existiam. O evento `bateria` leva os vereditos das rodadas anteriores da mesma bateria, e o evento `cenario` leva o veredito da grava\u00e7\u00e3o anterior, para o painel marcar regress\u00e3o sem ler nada al\u00e9m do arquivo.\n3. **O painel \u00e9 um mod do Claude Code** em `.claude/skills/bancada/`, na mesma pasta da skill, versionado: lista de cen\u00e1rios mais conversa do selecionado, segue o que roda, teclas para navegar, rodadas lado a lado, \"regrediu\" e \"melhorou\", tempo e estimativa, linha de status e toasts. L\u00ea o `ao-vivo.jsonl` a cada segundo; sem ele, monta a bancada das conversas gravadas. S\u00f3 leitura, como o OS: o \u00fanico gesto de escrita \u00e9 `/bancada rodar`, que dispara o pr\u00f3prio `e2e.py`.\n4. **O diagn\u00f3stico \u00e9 versionado** em `ana/bancada/diagnosticos/`, e a skill `bancada` fixa o ritual das tr\u00eas rodadas. Ela s\u00f3 diagnostica; mudar o prompt \u00e9 outra sess\u00e3o.\n\n## Alternativas\n\n- **O painel l\u00ea o log de texto.** Quebra a cada frase que mudar no runner. Descartado.\n- **Mod fora do repo**, na pasta de mods da m\u00e1quina. Quem pegar o programa depois n\u00e3o ganha o painel. Descartado.\n- **Rodadas pela skill**, com o runner cego a elas. O runner \u00e9 quem sabe os nomes dos arquivos e o veredito anterior; fora dele a c\u00f3pia e a regress\u00e3o ficam na m\u00e3o. Descartado.\n\n## Consequ\u00eancias\n\n- O `resultados/` continua fora do git; o `ao-vivo.jsonl` \u00e9 ef\u00eamero por desenho.\n- O motor do Claude Code escreve `.claude/skills/bancada/.claude-plugin/types/` ao carregar o mod; a pasta est\u00e1 no `.gitignore`.\n- O painel abre sozinho s\u00f3 em terminal com 144 colunas ou mais; abaixo disso, `/bancada`.\n- Termo novo no `CONTEXT.md`: **Bancada ao vivo**.\n\n## Adendo (13/out/2026, mesmo dia)\n\nO painel ganhou uma segunda aba, **Testes**, que desenha o relat\u00f3rio por capacidade (`relatorio.py --json`: rodadas, classe, regress\u00e3o e buracos de cobertura) em cores, com filtros por tecla. O mod registra a ferramenta `abrir_testes`, que a skill `/testes` chama na abertura em vez de colar o relat\u00f3rio no chat. A alternativa de uma p\u00e1gina no Ana OS ficou para depois, porque mexeria na regra de corte do ADR-0030; um artefato publicado foi descartado por ser est\u00e1tico e levar o texto dos cen\u00e1rios para fora da m\u00e1quina.\n\n## Adendo 2 (13/out/2026, noite): custo por conversa e navega\u00e7\u00e3o por categoria (#24)\n\nA Meta cobra cada resposta da Ana no WhatsApp desde 01/out/2026 (R$ 0,035 por mensagem de service, depois de 1.000 gr\u00e1tis por n\u00famero por m\u00eas), e o grilling do mesmo dia decidiu que a bancada \u00e9 a r\u00e9gua desse custo. Fatos que mandaram no desenho:\n\n- **A plataforma n\u00e3o guarda tokens por conversa.** Os logs da etapa `generate` trazem s\u00f3 o prompt e a dura\u00e7\u00e3o; `GET /api/v1/metrics` soma tokens por janela de tempo (`since`), e `until` e `conversationId` s\u00e3o ignorados na 1.15.0. Como a bancada roda um cen\u00e1rio por vez, o runner l\u00ea a soma \"desde o in\u00edcio da conversa at\u00e9 agora\" ao fim de cada cen\u00e1rio e grava `uso` (entrada, cache, cria\u00e7\u00e3o de cache, sa\u00edda, chamadas, modelos) e `custo` (`openai_usd`, `meta_brl`, `mensagens_ana`, `modelo`) na conversa gravada. Ru\u00eddo poss\u00edvel: uma mensagem no Telegram de teste no mesmo minuto.\n- **Os pre\u00e7os moram em `ana/bancada/precos.json`** (OpenAI por 1M tokens; Meta por mensagem e franquia; c\u00e2mbio; `conferido_em`). O relat\u00f3rio avisa quando passam de 60 dias.\n- **Travess\u00e3o \u00e9 falha global.** `checar()` reprova qualquer resposta da Ana com travess\u00e3o (U+2014) ou meia-risca (U+2013), sem precisar listar por cen\u00e1rio. Os nomes das etapas do kanban continuam com travess\u00e3o: a regra \u00e9 da fala, n\u00e3o das ferramentas.\n- **O relat\u00f3rio deriva, n\u00e3o escreve:** `depende_gh` vem das ferramentas do cen\u00e1rio (as da Global Health, ADR-0009/0025) ou do estado `gh` da capacidade; `fatia_sop` \u00e9 a parte dos n\u00f3s do Mapa do SOP que o cen\u00e1rio, a capacidade ou o bloco cobre; `funciona` \u00e9 \"todo cen\u00e1rio execut\u00e1vel passa\"; `alerta_mensagens` marca conversa com mais de 8 respostas da Ana (`TETO_MENSAGENS_ANA`).\n- **Todo buraco diz de onde vem.** O relat\u00f3rio classifica cada capacidade sem cen\u00e1rio execut\u00e1vel e cada n\u00f3 do SOP sem cen\u00e1rio numa de quatro origens, derivadas (estado da capacidade no comparativo, ferramentas do n\u00f3, cen\u00e1rios manuais): Global Health com homologa\u00e7\u00e3o vazia (terceiros), ainda n\u00e3o desenvolvido (n\u00f3s, atr\u00e1s da GH), s\u00f3 com gente ou quebrando algo de prop\u00f3sito (n\u00f3s), falta escrever o cen\u00e1rio (n\u00f3s). Tamb\u00e9m lista os cen\u00e1rios que passam s\u00f3 pelo desvio da GH (a agenda responde vazio e a Ana encaminha). O painel mostra a legenda, a etiqueta de quem depende e o porqu\u00ea de cada um.\n- **O cursor da aba Testes para nos tr\u00eas n\u00edveis** (categoria, capacidade, cen\u00e1rio) e o detalhe muda com ele: na categoria, o resumo do comparativo, a fatia do SOP, quantas funcionam, quantas n\u00e3o, quantas dependem da GH e o custo m\u00e9dio; na capacidade, o `faz`, o que falta, as ferramentas e os cen\u00e1rios com custo; no cen\u00e1rio, o que j\u00e1 havia mais custo, modelo e chamadas. A faixa do topo mostra o custo m\u00e9dio por conversa da bateria (Meta + OpenAI) e quantas conversas foram medidas. A aba Bateria mostra o custo da conversa assim que o runner o emite (evento `custo`).", "cita": [], "decisao": "O painel ganhou uma segunda aba, **Testes**, que desenha o relat\u00f3rio por capacidade (`relatorio.py --json`: rodadas, classe, regress\u00e3o e buracos de cobertura) em cores, com filtros por tecla. O mod registra a ferramenta `abrir_testes`, que...", "emenda": [], "emendada_por": [], "file": "docs/adr/0033-a-bancada-ganha-um-painel-ao-vivo-no-claude-code.md", "number": 33, "slug": "0033-a-bancada-ganha-um-painel-ao-vivo-no-claude-code", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "ADR-0033: a bancada ganha um painel ao vivo no Claude Code"}, {"amended_by": "0035", "amends": "0030, 0008", "body_md": "Data: 15/out/2026. Estado: aceito. Emenda o ADR-0030 (as cinco abas saem do topo) e o ADR-0008 (raios e cinzas do Ledger).\n\n## Contexto\n\nO Ana OS tinha dois menus: o pill preto estreito \u00e0 esquerda, s\u00f3 com o logo e as aplica\u00e7\u00f5es externas, e as cinco abas numa barra no topo, junto do t\u00edtulo, do est\u00e1gio e das conex\u00f5es. O topo comia a primeira dobra de toda aba. O Hospital OS e o IAE OS passaram na mesma semana para um menu s\u00f3, na lateral, com a marca no alto. Uma medi\u00e7\u00e3o de contraste no Ana OS achou o cinza dos r\u00f3tulos em 3,4:1 (abaixo do 4,5:1 de texto) e as setas dos diagramas em 2:1 ou menos (abaixo do 3:1 de elemento gr\u00e1fico).\n\n## Decis\u00e3o\n\n1. **A barra lateral \u00e9 a navega\u00e7\u00e3o inteira.** O pill preto fica largo (264px) e leva, de cima para baixo: a logo do Hospital S\u00e3o Matheus e \"Ana OS\", o est\u00e1gio lido do GitHub, as cinco abas com \u00edcone e nome, as aplica\u00e7\u00f5es externas com nome e, no p\u00e9, as conex\u00f5es e o selo do ambiente. O meio da tela fica s\u00f3 com o conte\u00fado da aba e a barra de filtros dela.\n2. **Cantos discretos:** card 8px, interno 6px, \u00edcone 6px, a barra 14px. Os n\u00f3s do mapa das regras seguem pelo CSS do OS, sem mexer no `sop.js`, que tamb\u00e9m desenha o Retrato.\n3. **Contraste:** `--cor-rotulo` passa a `#6b6b6b` (5,3:1) e nasce `--cor-linha` `#8a8782` (3,6:1) para seta, aresta e contorno de n\u00f3, sem opacidade por cima.\n4. **Movimento:** a barra entra em sequ\u00eancia e o \u00edcone da aba responde ao mouse e \u00e0 troca; `prefers-reduced-motion` desliga tudo, como antes.\n\n## Alternativas\n\n- **Manter as abas no topo e s\u00f3 alargar a barra.** Dois menus para o mesmo lugar. Descartado.\n- **Trocar o preto do Ledger pelo \u00edndigo do Hospital OS.** O preto \u00e9 a marca do Ana OS desde o ADR-0008. Descartado.\n\n## Consequ\u00eancias\n\n- As p\u00e1ginas de `os/arquivo/` seguem com o pill estreito: o `nav.js` s\u00f3 cria a barra quando a p\u00e1gina n\u00e3o traz a lateral pronta.\n- O Retrato da Ana (site do diretor) n\u00e3o muda: os motores em `retrato/assets/` ficaram intocados.", "cita": [], "decisao": "", "emenda": [30, 8], "emendada_por": [35], "file": "docs/adr/0034-o-menu-do-ana-os-vai-para-a-barra-lateral.md", "number": 34, "slug": "0034-o-menu-do-ana-os-vai-para-a-barra-lateral", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "ADR-0034: o menu do Ana OS vai para a barra lateral"}, {"amended_by": null, "amends": "0030, 0031, 0034", "body_md": "## Contexto\n\nO Hospital OS e o IAE OS trabalham do mesmo jeito: cada mudan\u00e7a nasce como issue, vira branch e PR, passa por CI e, quando mexe no produto, por um revisor. O painel d
