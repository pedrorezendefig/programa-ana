ar, sem identificar ningu\u00e9m.\n5. **`Prazo_Resposta` em dias corridos (7)** como aproxima\u00e7\u00e3o dos 5 dias \u00fateis. \u00c9 indicador de painel, n\u00e3o promessa.\n\n## Consequ\u00eancias\n\n- A promessa de protocolo do script sai do limbo: hoje o prompt promete um n\u00famero que nenhuma ferramenta produz. At\u00e9 a fase 4 rodar, o comportamento correto continua sendo **n\u00e3o citar protocolo**.\n- A Base Ana deixa de ser exclusivamente p\u00fablica. Passa a existir uma tabela que s\u00f3 \u00e9 acess\u00edvel com token, e o token de API do NocoDB \u00e9 amplo (alcan\u00e7a a base inteira, inclusive as quatro tabelas de valores). Mitiga\u00e7\u00e3o: `allowed_hosts` restrito, `risk_tier` correto e a migra\u00e7\u00e3o para o proxy na fase 5, que tira o segredo da plataforma.\n- O prazo de 5 dias \u00fateis volta a ser audit\u00e1vel. Com `Status` e `Prazo_Resposta` na tabela, d\u00e1 para ver manifesta\u00e7\u00e3o vencida sem abrir conversa nenhuma, o que o alerta D+4 do n8n fazia e ningu\u00e9m substituiu.\n- A tabela \u00e9 o embri\u00e3o do painel da ouvidoria para o hospital, na mesma tela de planilha que o neg\u00f3cio j\u00e1 usa para editar valores. Nenhuma ferramenta nova entra na vida do usu\u00e1rio.\n- Nada foi criado na plataforma fazer.ai nesta sess\u00e3o: nem tool, nem credencial, nem mudan\u00e7a de prompt.", "cita": [], "decisao": "Fecha a pendente **OV1**. A Ana passa a informar ao paciente um n\u00famero de protocolo de ouvidoria no formato `ANO-NNNN` (ex.: `2026-0001`), gerado por uma tabela nova da Base Ana (`5_Ouvidoria_Protocolos`), gravada e lida por ferramentas...", "emenda": [], "emendada_por": [15, 16], "file": "docs/adr/0010-protocolo-ouvidoria.md", "number": 10, "slug": "0010-protocolo-ouvidoria", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O protocolo da ouvidoria \u00e9 um sequencial ANO-NNNN numa tabela pr\u00f3pria do NocoDB, fora de qualquer shared view"}, {"amended_by": "0028, 0031", "amends": null, "body_md": "Nasce da tarefa **OS12** (grilling de 11/ago/2026). A home do Ana OS substitui os dois cards de destaque (\"fronteira\" e \"pr\u00f3xima proposta\") pela **Mesa de a\u00e7\u00e3o**: todos os itens abertos do roadmap (tarefas a fazer, pendentes, propostas e radar) agrupados por **canal de a\u00e7\u00e3o**, respondendo a pergunta que a home n\u00e3o respondia: \"o que eu toco agora, e o que est\u00e1 na m\u00e3o de quem\".\n\n## Contexto\n\n- Com o grafo limpo (nenhuma tarefa aberta em 11/ago), a home mostrava \"est\u00e1gio limpo\" e apontava a P3 como \"pr\u00f3xima proposta destravada\". Verdade estrutural (a P3 n\u00e3o tem deps no grafo), mentira pr\u00e1tica (a P3 espera a VPN da TST, ca\u00edda desde 13/jul). **A home n\u00e3o sabia o que \u00e9 externo.**\n- A espera externa mais importante do programa (a GH-19, massa da homolog pedida em 07/jul) n\u00e3o era card em lugar nenhum: vivia em notas. Uma mesa de a\u00e7\u00e3o que n\u00e3o mostra a espera de 35 dias falha no prop\u00f3sito.\n- O ritual `/check` j\u00e1 organiza o relat\u00f3rio em tr\u00eas canais (dispare hoje / sente comigo / aguardando terceiros), mas esse ju\u00edzo morria no chat: n\u00e3o era dado.\n- V\u00e1rios itens abertos j\u00e1 tinham `prompt` no estilo certo (o da P2 guia a cobran\u00e7a da VPN; o da V7 guia o painel da Cloudflare). Faltava o resto da estrutura.\n\n## Decis\u00f5es\n\n| Decis\u00e3o | Alternativa descartada | Por qu\u00ea |\n|---|---|---|\n| **Mesa na home**, substituindo os destaques | Reformular a p\u00e1gina Roadmap | O gesto di\u00e1rio \u00e9 \"o que toco agora\" (home); o grafo responde \"como se encadeia\" e acabou de ganhar filtros (OS9) |\n| **Tr\u00eas canais**: `dispare` / `comigo` / `aguardando` | Dois (externo/interno) | \"Cobran\u00e7a pronta n\u00e3o enviada\" (dispare) e \"enviado h\u00e1 35 dias\" (aguardando) s\u00e3o gestos diferentes; fundir os dois esconde exatamente o que a mesa quer mostrar |\n| **Campo expl\u00edcito `canal`** (+ `canal_desde`), curado por sess\u00f5es e reconciliado pelo `/check` | Derivar de `dono`/`deps` | Propostas e radar n\u00e3o t\u00eam dono; o mesmo item muda de canal sem mudar de dono (P2 \u00e9 dispare at\u00e9 a mensagem ir, aguardando depois); canal \u00e9 ju\u00edzo de situa\u00e7\u00e3o, n\u00e3o atributo estrutural |\n| **A GH-19 vira card** (pendente `GH19`) | Seguir como nota | Radar \u00e9 \"n\u00e3o impacta o objetivo\" e a GH-19 impacta; pendente \u00e9 a faixa das d\u00edvidas conscientes |\n| **A UI move canal** (`canal`/`canal_desde` em item aberto, nada mais) | UI somente leitura (regra do ADR-0007: s\u00f3 Ideias) | O \"enviei a mensagem\" acontece fora de sess\u00e3o; esperar o /check perde a data real, e \"aguardando h\u00e1 N dias\" depende dela. Amplia\u00e7\u00e3o cir\u00fargica: a UI n\u00e3o cria, n\u00e3o conclui, n\u00e3o edita t\u00edtulo nem prompt |\n| **Ficha de hover curada** `mesa {destrava, gesto}` por item aberto | Nota truncada no hover | A nota \u00e9 registro denso; o hover precisa responder \"por que eu tocaria nisso agora\" e \"qual o gesto\", que n\u00e3o s\u00e3o deriv\u00e1veis com confian\u00e7a |\n| **Sem hist\u00f3rico por card** | Log de movimentos estruturado | `canal` + `canal_desde` + o log do TODO.md j\u00e1 contam a hist\u00f3ria; um segundo hist\u00f3rico seria mais uma narrativa a sincronizar |\n| **Card sem prompt \u00e9 defeito vis\u00edvel** (\"sem prompt ainda\") | Bot\u00e3o simplesmente ausente | Defeito silencioso n\u00e3o gera corre\u00e7\u00e3o |\n\n## O contrato dos campos novos (itens abertos de qualquer faixa)\n\n```\n\"canal\":       \"dispare\" | \"comigo\" | \"aguardando\"\n\"canal_desde\": \"AAAA-MM-DD\"  (quando o item entrou neste canal)\n\"mesa\": { \"destrava\": \"o que fechar este card libera\",\n          \"gesto\":    \"o pr\u00f3ximo movimento concreto\" }\n```\n\n- Item **conclu\u00eddo** perde `canal`/`canal_desde`/`mesa` (e `prompt`, regra que j\u00e1 existia): a mesa \u00e9 s\u00f3 de abertos.\n- O prompt \u00e9 **um por card**, rotulado pelo canal na UI: `dispare`/`aguardando` ganham \"prompt de terminal\" (a sess\u00e3o guia ou redige a a\u00e7\u00e3o externa); `comigo` ganha \"prompt de sess\u00e3o\" (executa a tarefa).\n- O `/check` passa a ser fiador de `canal`, `canal_desde` e `mesa` na reconcilia\u00e7\u00e3o, como j\u00e1 era de propostas e prompts.\n- O server valida os campos novos; a regra do ADR-0007 fica reescrita: **a UI escreve Ideias e move canal de item aberto**. Todo o resto continua sendo ato de sess\u00e3o.\n\n## Sobre \"nada deveria depender do externo\"\n\nQuestionado no grilling e respondido com evid\u00eancia: a documenta\u00e7\u00e3o da API sustentou **construir** tudo (as 6 tools GH existem e est\u00e3o costuradas no prompt), mas n\u00e3o substitui hor\u00e1rios reais (n\u00e3o existe POST de cat\u00e1logo na API GH, provado ao vivo em 06/ago/2026) nem a Prova no banco (VPN). O que sobrou de test\u00e1vel sem externo virou a tarefa **V16** (mini-roteiro GH no canal de teste: os fluxos das V12/V14/V15 nunca rodaram fora do playground). A ideia de massa simulada (mock para ensaiar o caminho feliz A1) foi **guardada na faixa de Ideias, n\u00e3o executada**: provaria o prompt contra um contrato imaginado, e a resposta verdadeira chega de gra\u00e7a quando a massa for publicada.\n\n## Consequ\u00eancias\n\n- A home passa a mostrar idade de espera (\"aguardando h\u00e1 N dias\"), o que cria press\u00e3o saud\u00e1vel de cobran\u00e7a; o custo \u00e9 curadoria: canal desatualizado mente, e a mitiga\u00e7\u00e3o \u00e9 o `/check` reconciliar a cada rodada.\n- Dois campos curados novos (`canal`, `mesa`) entram no contrato do `roadmap.json`; sess\u00f5es que concluem tarefa precisam remov\u00ea-los junto com o `prompt`.\n- A rota de escrita da UI cresce pela primeira vez desde o ADR-0007. O escopo estreito \u00e9 deliberado; qualquer nova amplia\u00e7\u00e3o merece novo debate.", "cita": [], "decisao": "Nasce da tarefa **OS12** (grilling de 11/ago/2026). A home do Ana OS substitui os dois cards de destaque (\"fronteira\" e \"pr\u00f3xima proposta\") pela **Mesa de a\u00e7\u00e3o**: todos os itens abertos do roadmap (tarefas a fazer, pendentes, propostas e...", "emenda": [], "emendada_por": [28, 31], "file": "docs/adr/0011-mesa-de-acao.md", "number": 11, "slug": "0011-mesa-de-acao", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A home do Ana OS ganha a Mesa de a\u00e7\u00e3o: cards abertos agrupados por canal (dispare / comigo / aguardando), com ficha de hover e prompt por canal"}, {"amended_by": null, "amends": null, "body_md": "Supera a decis\u00e3o \"Modos da Ana\" do briefing do diretor (jun/2026: um agente com tr\u00eas modos, nunca subagentes). O Pedro decidiu, como arquitetura definitiva e n\u00e3o como paliativo, que a Ana se organiza em **tr\u00eas agentes l\u00f3gicos**: a **Ana orquestradora** (triagem de urg\u00eancia, identifica\u00e7\u00e3o do atendimento, conv\u00eanio, prontu\u00e1rio, d\u00favidas gerais, encerramento), o **Particular** (comercial, valores, ancoragem com diferenciais, agendamento de consultas e exames, todas as tools GH, a P6 quando acender) e a **Ouvidoria** (acolhimento, guardrails jur\u00eddicos, protocolo quando a OV2 entrar).\n\nComo a plataforma fazer.ai agents **n\u00e3o tem transfer\u00eancia de conversa entre agentes de IA** (fato verificado no c\u00f3digo-fonte em 12/ago/2026: cat\u00e1logo nativo sem transfer entre agentes, v\u00ednculo inbox\u2192agente 1:1 por coluna escalar no schema, \"supervisor router\" listado como *Deferred* no roadmap deles), o trio vive hoje como **estrutura fonte no repo, compilada num prompt \u00fanico** publicado na Ana id 1. Quando a plataforma entregar o roteador entre agentes, os mesmos arquivos-fonte viram tr\u00eas agentes f\u00edsicos sem redesenho.\n\n## Contexto\n\n- O prompt v5.3 est\u00e1 em 49.353 de 50.000 caracteres; a P6 (finaliza\u00e7\u00e3o) n\u00e3o cabe. O teto de 50k \u00e9 do build de 29/jul da inst\u00e2ncia: no c\u00f3digo atual da plataforma o teto \u00e9 100.000, configur\u00e1vel por `AGENT_PROMPT_MAX_CHARS` (o build antigo n\u00e3o l\u00ea essa env var).\n- Medi\u00e7\u00e3o do prompt vivo por se\u00e7\u00e3o: n\u00facleo comum (persona, tom, Regras Globais, Princ\u00edpio de Coleta, Princ\u00edpio de Ferramentas, resumo) soma ~15,4k; as jornadas do SOP somam 27,6k, com ouvidoria (6,2k) e agendamento particular (4,1k) como maiores e os dois \u00fanicos blocos com crescimento previsto (OV2 e P6).\n- O corte \"consultoria particular\" separada de \"agendamento particular\" (ideia inicial) foi descartado no grilling: \u00e9 a mesma jornada de venda, e uma fronteira ali colocaria uma transfer\u00eancia no meio do fluxo que o transbordo seletivo mandou a Ana fechar sozinha.\n\n## Decis\u00f5es de desenho\n\n- **Corte em tr\u00eas**: Particular engloba comercial + valores + agendamento + exames. Conv\u00eanio fica na orquestradora (jornada curta, termina em portal ou escalada). Ouvidoria separada.\n- **Sem\u00e2ntica de retorno**: o especialista conclui a jornada dele e devolve \u00e0 orquestradora; assunto novo passa pela triagem de novo. Exce\u00e7\u00e3o dura: a triagem de urg\u00eancia \u00e9 Regra Global replicada nos tr\u00eas blocos, escala para humano direto. A exclus\u00e3o comercial\u2194ouvidoria vira regra de roteamento da orquestradora: thread com tag `ouvidoria` n\u00e3o roteia para o Particular.\n- **Fonte da verdade**: os prompts nascem no repo (n\u00facleo comum + um arquivo por agente l\u00f3gico); uma sess\u00e3o Claude compila cada prompt final e publica via `prompt_set`, carimbando vers\u00e3o. A compila\u00e7\u00e3o pode aparar o n\u00facleo por agente (a Ouvidoria n\u00e3o carrega regras de agenda). O Mapa do SOP l\u00ea os mesmos arquivos.\n- **Escopo GH**: as tools da P6 (agendar, reagendar, cancelar) nascem prontas no bloco Particular com o prompt escrito, e o acender continua gated por GH-19 (massa do cat\u00e1logo) e GH-18 (prova no banco via VPN da TST). Este plano n\u00e3o promete escrita real no banco antes dos destravas.\n- **OV2 fora do escopo**: a Ouvidoria nasce com a Se\u00e7\u00e3o 7 atual (Regra H\u00edbrida, sem citar n\u00famero); o protocolo entra quando a pendente OV2 andar (depende de gesto manual do Pedro no NocoDB).\n- **Rollout**: substituir direto no canal de teste (Telegram, gatilho `/teste`) e ajustar no ar, decis\u00e3o expl\u00edcita do Pedro. Piso de seguran\u00e7a: `agent_export` da v5.3 arquivado no repo antes da primeira mudan\u00e7a. Crit\u00e9rio de pronto a posteriori: Roteiro de cen\u00e1rios v2, incluindo cen\u00e1rios de fronteira (urg\u00eancia no meio do agendamento, ouvidoria\u2192comercial bloqueado, assunto misto com volta \u00e0 orquestradora).\n- **Infra no in\u00edcio do plano**: atualizar a imagem `agents-pro` no Coolify (build 29/jul \u2192 atual) para destravar o teto de 100k. O Chatwoot \u00e9 outro container; o hotfix fr\u00e1gil n\u00e3o \u00e9 tocado.\n- **Mapa do SOP**: `os/sop.html` passa a desenhar o trio em tr\u00eas zonas visuais numa p\u00e1gina \u00fanica, com as transfer\u00eancias como n\u00f3s de fronteira expl\u00edcitos (quem decide, com qual crit\u00e9rio, o que viaja junto), tools nos quadrados pretos e \u00e2ncoras apontando o arquivo-fonte do bloco correspondente. P\u00fablico-alvo: funcion\u00e1rio novo entendendo o organismo inteiro.\n\n## Alternativas descartadas\n\n- **4 agentes** (consultoria e agendamento particular separados): transfer\u00eancia no meio da venda.\n- **Workaround tool\u2192playground** (um agente chama o playground do outro por HTTP tool): thread isolada, sem mem\u00f3ria da conversa, sem atribui\u00e7\u00e3o no Chatwoot; o pr\u00f3prio c\u00f3digo da plataforma fecha essa porta.\n- **Esperar ou implementar o roteador**: ficar ref\u00e9m de terceiro sem prazo, ou projeto de engenharia \u00e0 parte. O trio l\u00f3gico entrega a organiza\u00e7\u00e3o agora e aproveita o roteador quando existir.\n\n## Consequ\u00eancias\n\n- O CONTEXT.md troca o termo \"Modos da Ana\" por \"Trio l\u00f3gico da Ana\"; \"subagentes\" deixa de ser palavra proibida e passa a designar o desenho l\u00f3gico (a proibi\u00e7\u00e3o valia para o f\u00edsico, que continua \u00fanico por ora).\n- O Roteiro de cen\u00e1rios v2 vira o crit\u00e9rio de pronto da reorganiza\u00e7\u00e3o; conversa livre n\u00e3o conta.\n- A troca de modelo que acompanha este plano est\u00e1 no ADR-0013.", "cita": [], "decisao": "Supera a decis\u00e3o \"Modos da Ana\" do briefing do diretor (jun/2026: um agente com tr\u00eas modos, nunca subagentes). O Pedro decidiu, como arquitetura definitiva e n\u00e3o como paliativo, que a Ana se organiza em **tr\u00eas agentes l\u00f3gicos**: a **Ana...", "emenda": [], "emendada_por": [], "file": "docs/adr/0012-trio-logico-agentes.md", "number": 12, "slug": "0012-trio-logico-agentes", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "A Ana vira um trio l\u00f3gico (orquestradora, Particular, Ouvidoria) compilado num agente f\u00edsico \u00fanico"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do Pedro (12/ago/2026): a Ana (e todo agente futuro do tenant `vitta-tech`) passa a rodar **`gpt-5.6-luna`**, o tier econ\u00f4mico da fam\u00edlia GPT-5.6 da OpenAI (Sol/Terra/Luna, lan\u00e7ada em 9/jul/2026). A troca \u00e9 direta no `modelConfig` (sem fase de teste paralela), coerente com o apetite de risco do rollout do ADR-0012: o canal vivo \u00e9 o Telegram de teste com gatilho `/teste`.\n\n## Contexto (fatos verificados em fontes prim\u00e1rias, 12/ago/2026)\n\n- Em 30/jul/2026 a OpenAI cortou o pre\u00e7o do Luna em 80%: **$0,20 input / $1,20 output por 1M tokens**, contra $0,25/$2,00 do gpt-5-mini atual (input -20%, output -40%). Contexto de 1M tokens, cutoff de conhecimento fev/2026 (o mini \u00e9 mai/2024). Suporta function calling, structured outputs e prompt caching.\n- O model id exato \u00e9 `gpt-5.6-luna`. O alias `gpt-5.6` aponta para o Sol (tier caro); usar sempre o id completo.\n- \u00c9 modelo de racioc\u00ednio: tokens de racioc\u00ednio s\u00e3o cobrados como output, e o controle \u00e9 `reasoning_effort` (none a max, default medium). A inten\u00e7\u00e3o do Pedro \u00e9 rodar \"sem reasoning\" (effort none, o modo mais b\u00e1sico).\n- A plataforma fazer.ai agents **n\u00e3o exp\u00f5e `reasoning_effort`**: o `modelConfig` aceita s\u00f3 provider, model, credentialRef, baseURL e temperature (campo desconhecido \u00e9 descartado na valida\u00e7\u00e3o). O Luna vai rodar no comportamento default do chat/completions at\u00e9 a plataforma expor o campo.\n- A plataforma j\u00e1 trata a fam\u00edlia gpt-5* corretamente no ponto que derrubava o mini: descarta `temperature` para modelos de racioc\u00ednio antes de chamar a API.\n- Risco documentado: h\u00e1 relato de a API recusar function tools com `reasoning_effort` expl\u00edcito no chat/completions (a mensagem de erro manda usar a Responses API ou effort none). Com o campo ausente (caso da plataforma) o comportamento esperado \u00e9 funcionar; a confirma\u00e7\u00e3o \u00e9 emp\u00edrica.\n\n## Decis\u00e3o e mitiga\u00e7\u00e3o\n\n1. Trocar `modelConfig.model` de `gpt-5-mini` para `gpt-5.6-luna` na Ana id 1 (mesma credencial, mesmo provider).\n2. Imediatamente ap\u00f3s a troca, rodar no playground um turno que force tool calling (busca por CPF, hor\u00e1rios ou pre\u00e7os) e conferir no Langfuse a chamada e o custo.\n3. Se a API recusar tools ou o custo por resposta subir de forma an\u00f4mala (reasoning tokens no effort default), rollback de um comando para `gpt-5-mini`.\n4. Disparar feature request \u00e0 fazer.ai (canal j\u00e1 aberto por bug reports anteriores): expor `reasoning_effort` no `modelConfig`. Quando existir, fixar `none`.\n\n## Resultado da execu\u00e7\u00e3o (12/ago/2026)\n\nO risco se materializou, literal. Com a plataforma j\u00e1 atualizada (1.4.1) e `modelConfig.model = gpt-5.6-luna`, o primeiro turno com tool no playground devolveu:\n\n> `400 Function tools with reasoning_effort are not supported for gpt-5.6-luna in /v1/chat/completions. To use function tools, use /v1/responses or set reasoning_effort to 'none'.`\n\nRollback executado no ato para `gpt-5-mini`; smoke test p\u00f3s-rollback saud\u00e1vel (tool call de pre\u00e7os + kanban + tag funcionando). O estado desta decis\u00e3o passa a ser: **inten\u00e7\u00e3o mantida, execu\u00e7\u00e3o bloqueada pela plataforma**. Caminhos para destravar, a decidir com o Pedro:\n\n1. **Feature request \u00e0 fazer.ai** (o caminho limpo): expor `reasoning_effort` no `modelConfig` ou migrar o cliente OpenAI para a Responses API. Sem prazo sob nosso controle.\n2. **Proxy fino de modelo na VPS**: provider `openai-compatible` com `baseURL` apontando para um proxy local que injeta `reasoning_effort: \"none\"` e repassa para a OpenAI. Funciona hoje, mas p\u00f5e a chave OpenAI trafegando por um servi\u00e7o nosso e cria infraestrutura para manter.\n\nAt\u00e9 um dos dois destravar, o tenant segue no `gpt-5-mini`.\n\n### Segunda tentativa, via MCP (12/ago/2026, mais tarde)\n\nDescoberta nova: pela rota MCP (`agent_update`), o `modelConfig` ACEITA e PERSISTE `reasoning_effort: \"none\"` (diferente da UI, que descarta o campo). Mas persistir n\u00e3o basta: o cliente OpenAI da plataforma n\u00e3o repassa o campo para a API, e o turno com tool no playground devolveu o mesmo 400. Ou seja, o bloqueio n\u00e3o \u00e9 de valida\u00e7\u00e3o de schema, \u00e9 do request builder. Rollback para `gpt-5-mini` executado de novo; o campo persistido refor\u00e7a o feature request (metade do caminho j\u00e1 existe no banco).\n\n### Terceira tentativa: aplicado (08/set/2026)\n\nA plataforma fazer.ai agents subiu de 1.4.1 para 1.15.0. A release 1.5.0 passou a rodar a fam\u00edlia gpt-5.6 com `reasoning_effort: none` (fix #73) e a 1.6.0 exp\u00f4s `reasoningEffort` por agente (#87). O `agent_update` via MCP aceitou `{\"model\":\"gpt-5.6-luna\",\"reasoningEffort\":\"none\"}` e a fuma\u00e7a com tools passou (pre\u00e7o e cadeia de 4 elos de hor\u00e1rios, sem 400). A decis\u00e3o deste ADR est\u00e1 em vigor; a bateria v3 no canal real \u00e9 o crit\u00e9rio para declarar est\u00e1vel.\n\n### Compara\u00e7\u00e3o de modelos (13/out/2026, #20)\n\nTr\u00eas rodadas da bateria de capacidades (29 cen\u00e1rios, 37 turnos) por candidato, trocando s\u00f3 o `modelConfig` do agente 1. Tempo \u00e9 o da etapa `generate` nos logs da plataforma; custo vem dos tokens somados pela plataforma por modelo, com os pre\u00e7os oficiais de 13/out/2026 (gpt-6-luna 0,10 / 0,01 / 0,50; gpt-5.6-luna 0,20 / 0,02 / 1,20; gpt-5-mini 0,25 / 0,025 / 2,00 por 1M de tokens, entrada / cache / sa\u00edda).\n\n| Modelo | Rodadas (de 29) | Modelo por turno | Custo por conversa |\n|---|---|---|---|\n| gpt-5.6-luna, none (em vigor) | 28, 28, 27 | 7,4 s | US$ 0,0023 |\n| gpt-6-luna, none | 28, 29, 28 | 8,4 s | US$ 0,0014 |\n| gpt-5-mini, low | fuma\u00e7a passou; bateria interrompida pelo Pedro | sem medida | sem medida |\n\nA plataforma 1.15.0 aceita `gpt-6-luna` com `reasoningEffort: none` sem ajuste (fuma\u00e7a com tool sem 400). Das duas falhas do gpt-6-luna, uma foi do modelo (C29-1: `skip_reply` na despedida em vez de encerrar) e a outra foi infra (C13-1: API do Hospital 503 e GH sem resposta em 10 s). Detalhe e logs na issue #20.\n\n**Decis\u00e3o (13/out/2026, grilling): `gpt-6-luna` com `reasoningEffort: none` \u00e9 o modelo da Ana.** O teste do gpt-5-mini low foi cancelado pelo Pedro: custa 2,5x o 6-luna na entrada e 4x na sa\u00edda, tem conhecimento de 2024 e j\u00e1 havia perdido para o 5.6-luna em agosto. Pesquisa de 13/out/2026: o gpt-6-luna (lan\u00e7ado 22/set/2026) \u00e9 o tier econ\u00f4mico da gera\u00e7\u00e3o 6 (n\u00e3o existe mini/nano nela), e a OpenAI o aponta como o mais r\u00e1pido e barato para alto volume, com +5,4 pontos sobre o 5.6-luna em function calling (AutomationBench, dado da pr\u00f3pria OpenAI; nenhum benchmark independente cobre a gera\u00e7\u00e3o 6 ainda). Troca aplicada por `agent_update` (diff conferido), fuma\u00e7a C05-1 com tool passou (conversa #530). Rollback: o mesmo `agent_update` com `gpt-5.6-luna`.\n\nContexto de custo que pesou na decis\u00e3o: desde 01/out/2026 a Meta cobra R$ 0,035 por resposta da Ana no WhatsApp (service message, 1.000 gr\u00e1tis por n\u00famero por m\u00eas). Numa conversa de 10 turnos a Meta custa R$ 0,35 e o modelo R$ 0,008; o modelo \u00e9 2% do custo vari\u00e1vel. A r\u00e9gua de custo por conversa (Meta + OpenAI) entra no painel da bancada (#24) e o prompt v7 (#25) mira menos mensagens por conversa.\n\n## Consequ\u00eancias\n\n- \"Modelo universal\" vira regra do tenant: agente novo nasce com o modelo deste ADR (`gpt-6-luna` desde 13/out/2026) salvo decis\u00e3o contr\u00e1ria registrada.\n- A compara\u00e7\u00e3o de custo real (Langfuse, antes vs depois) fica como evid\u00eancia da troca; se o effort default corroer a economia da tabela, a decis\u00e3o volta \u00e0 mesa com n\u00fameros.\n- Refer\u00eancias de modelo espalhadas pelo repo (Circuito da Ana, CONTEXT.md, mem\u00f3ria de sess\u00e3o) passam a citar o gpt-5-mini como hist\u00f3rico, n\u00e3o como estado.", "cita": [], "decisao": "Decis\u00e3o do Pedro (12/ago/2026): a Ana (e todo agente futuro do tenant `vitta-tech`) passa a rodar **`gpt-5.6-luna`**, o tier econ\u00f4mico da fam\u00edlia GPT-5.6 da OpenAI (Sol/Terra/Luna, lan\u00e7ada em 9/jul/2026). A troca \u00e9 direta no `modelConfig`...", "emenda": [], "emendada_por": [], "file": "docs/adr/0013-modelo-universal-luna.md", "number": 13, "slug": "0013-modelo-universal-luna", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "gpt-5.6-luna \u00e9 o modelo padr\u00e3o do tenant, trocado direto e sem gate"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do Pedro (12/ago/2026, sess\u00e3o de grilling sobre os achados da bateria E2E v2): a Ana **deixa de cadastrar paciente** no sistema de agendamento (Global Health). Em toda a conversa, o \u00fanico bloco de dados que ela pede \u00e9 **nome completo + CPF**. Data de nascimento e telefone n\u00e3o s\u00e3o perguntados em nenhum fluxo: o telefone a equipe j\u00e1 tem pelo pr\u00f3prio WhatsApp, e o cadastro completo passa a ser feito pela equipe humana no momento de confirmar o agendamento.\n\n## Contexto\n\n- A V14 tinha entregue a primeira escrita do bot na GH: a tool `cadastrar_paciente` (POST /pessoas, homolog), acionada quando `buscar_paciente_por_cpf` voltava vazia (PASSO 3.6 do prompt at\u00e9 a v6.2). O contrato da GH exige os quatro campos: nome, cpf, telefone e dataNascimento, todos obrigat\u00f3rios.\n- Na bateria v2 (12/ago, conversa 56 do Chatwoot), o caminho funcionou tecnicamente (GH id 1697 criado), mas a conversa ficou burocr\u00e1tica: pergunta de nascimento e telefone, resumo de confirma\u00e7\u00e3o e a corrida de chunks que gerou a falsa \"dupla confirma\u00e7\u00e3o\". O Pedro julgou a experi\u00eancia ruim para um lead quente: dado demais, atrito demais, cara de formul\u00e1rio.\n- Alternativa estudada: puxar o telefone do webhook. A pesquisa no c\u00f3digo-fonte da 1.4.1 (conclu\u00edda horas depois da decis\u00e3o; `ana/plataforma/pesquisa-contact-phone-http-tools.md`) provou que a via EXISTE e \u00e9 confi\u00e1vel: `{{contact_phone}}` no body/campo fixo de HTTP tool \u00e9 injetado server-side a partir do espelho do webhook (lista fechada de 10 vari\u00e1veis; formato E.164 com `+`; nome fora da lista vira string vazia em sil\u00eancio, e o playground nunca tem contexto de contato, o que explica os nulos vistos). Ou seja: o telefone era resolv\u00edvel sem perguntar. A decis\u00e3o se sustenta pelos outros dois pilares: a **data de nascimento** n\u00e3o tem webhook que resolva (continuaria custando pergunta e confirma\u00e7\u00e3o), e a experi\u00eancia de formul\u00e1rio no lead quente foi o inc\u00f4modo central do Pedro.\n\n## Decis\u00e3o\n\n1. O prompt (v6.3) remove o PASSO 3.6 e toda men\u00e7\u00e3o a cadastro, nascimento e telefone. O Princ\u00edpio de Coleta vira: pedir nome+CPF (uma mensagem), validar, rodar `buscar_paciente_por_cpf` internamente e, se vazia, apenas anotar \"paciente sem cadastro no sistema\" no resumo interno da escalada.\n2. O grant da tool `cadastrar_paciente` (id 7) sai do agente 1. A defini\u00e7\u00e3o da tool fica guardada na plataforma, desabilitada de uso pelo agente.\n3. A equipe humana cadastra o paciente na GH/MV ao confirmar o agendamento, com os dados que o processo dela exigir.\n\n## Volta planejada\n\nO cadastro pelo bot **volta junto com a finaliza\u00e7\u00e3o de agendamento** (P6, se\u00e7\u00e3o 2.5 gated do bloco particular): quando GH-19 (massa do cat\u00e1logo) e GH-18 (prova no banco) destravarem e o bot passar a gravar agendamento de verdade, o cadastro de paciente novo volta a ser pr\u00e9-condi\u00e7\u00e3o execut\u00e1vel pelo bot (re-granting da tool 7 e reintrodu\u00e7\u00e3o do passo no prompt). Na volta, o telefone deve vir autom\u00e1tico via `{{contact_phone}}` como campo fixo do body (sem o modelo no meio, ver pesquisa citada acima; aten\u00e7\u00e3o ao formato E.164 com `+`, a GH quer s\u00f3 d\u00edgitos com DDD, transforma\u00e7\u00e3o a resolver na fachada), restando ao paciente apenas a data de nascimento. Este ADR n\u00e3o descarta a V14: suspende o uso dela no fluxo conversacional at\u00e9 o fluxo ter valor de ponta a ponta.\n\n## Consequ\u00eancias\n\n- Conversa mais curta e humana no caminho quente do particular (pre\u00e7o \u2192 nome+CPF \u2192 agenda \u2192 equipe), sem coleta de dado que o bot n\u00e3o usa hoje para nada al\u00e9m do POST.\n- O resumo interno da escalada ganha o campo \"tem/n\u00e3o tem cadastro\" como informa\u00e7\u00e3o de trabalho para a equipe.\n- O cadastro de teste GH id 1697 (TESTE GOLF HOTEL) permanece na homolog como sonda de busca positiva.\n- Riscos aceitos: a equipe faz um passo a mais por lead novo; se o volume crescer antes de P6, a decis\u00e3o volta \u00e0 mesa com n\u00fameros.", "cita": [], "decisao": "O cadastro pelo bot **volta junto com a finaliza\u00e7\u00e3o de agendamento** (P6, se\u00e7\u00e3o 2.5 gated do bloco particular): quando GH-19 (massa do cat\u00e1logo) e GH-18 (prova no banco) destravarem e o bot passar a gravar agendamento de verdade, o...", "emenda": [], "emendada_por": [], "file": "docs/adr/0014-cadastro-sai-do-bot.md", "number": 14, "slug": "0014-cadastro-sai-do-bot", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Cadastro de paciente sai do bot: nome + CPF \u00e9 o \u00fanico bloco cadastral da conversa"}, {"amended_by": "0016", "amends": "0006, 0010", "body_md": "Decis\u00e3o do Pedro (14/ago/2026, sess\u00e3o de grilling com pesquisa citada): a fonte da verdade dos dados que alimentam a Ana muda do NocoDB para o Postgres do **Hospital Reuni\u00f5es** (o Aplicativo do hospital, repo `~/PedroDev/Hospital`). O app ganha o m\u00f3dulo de edi\u00e7\u00e3o das tabelas de valores e um painel de ouvidoria; a Ana passa a ler e escrever via API do app; o NocoDB se aposenta por completo. Ativa a op\u00e7\u00e3o que o ADR-0006 registrou como \"melhor destino final poss\u00edvel\" e tinha adiado de prop\u00f3sito.\n\n## Contexto\n\n- A Base Ana (ADR-0006) vive num NocoDB no Coolify da VPS: 4 tabelas de valores/cobertura lidas por shared views p\u00fablicas (tools 1-4) e a tabela `5_Ouvidoria_Protocolos` (ADR-0010), lida/escrita com o `xc-token` do vault (tools 11-12). Nenhum dado de paciente; agenda e cadastro s\u00e3o Global Health/MV e n\u00e3o participam.\n- O Hospital Reuni\u00f5es \u00e9 o outro produto do mesmo hospital: FastAPI + Next.js + Supabase self-hosted (Postgres), em produ\u00e7\u00e3o (v0.47.2), no **mesmo VPS** (31.97.29.32). A diretoria e as secret\u00e1rias j\u00e1 logam nele; o NocoDB, ningu\u00e9m do hospital visita.\n- O ADR-0010 registrou como risco o `xc-token` alcan\u00e7ar a base inteira, com mitiga\u00e7\u00e3o prevista \"proxy fino na fase 5\". A migra\u00e7\u00e3o resolve por outro caminho: API com escopo restrito.\n- Pesquisa em fonte prim\u00e1ria (docs oficiais e c\u00f3digo do NocoDB, 14/ago/2026) fechou as alternativas h\u00edbridas: webhooks do NocoDB n\u00e3o t\u00eam retry (entrega \u00fanica, timeout 30s, erro engolido; feature request aberta desde 2023), escrita direta no Postgres n\u00e3o dispara webhook (o gatilho vive na camada de aplica\u00e7\u00e3o do NocoDB), e o modo \"data source externo\" desaconselha edi\u00e7\u00e3o de schema e exige sync manual. Qualquer arquitetura com o NocoDB no meio seria fr\u00e1gil.\n- No `.env` do Hospital Reuni\u00f5es existem `ANA_READONLY_PASSWORD` e `ANA_READONLY_DB_URL` (usu\u00e1rio Postgres read-only provisionado para a Ana, nunca usado por c\u00f3digo). Com esta decis\u00e3o fica obsoleto: o caminho \u00e9 API, n\u00e3o banco direto.\n\n## Decis\u00e3o\n\n1. **Escopo.** As 5 tabelas da Base Ana migram para o Postgres do Hospital Reuni\u00f5es. O app ganha edi\u00e7\u00e3o das tabelas de valores na \u00e1rea admin e um painel de ouvidoria. A Ana consulta no app o que migrou.\n2. **NocoDB aposenta por completo.** Depois da valida\u00e7\u00e3o da fase 2, o servi\u00e7o `nocodb-base-ana` sai do Coolify. Um dono s\u00f3 para os dados, zero duplica\u00e7\u00e3o.\n3. **Auth.** Endpoints `/api/ana/*` no FastAPI do Hospital, protegidos por API key de servi\u00e7o dedicada (header), guardada no vault do fazer.ai. Mesma chave para leitura e para a escrita da ouvidoria. Substitui o par \"shared view p\u00fablica + xc-token de base inteira\".\n4. **Sequ\u00eancia.** Fase 1: as 4 tabelas de valores (CRUD no app, endpoints GET, tools 1-4 da Ana trocam de URL; valida\u00e7\u00e3o por compara\u00e7\u00e3o de respostas). Fase 2: ouvidoria (POST + consulta, painel, migra\u00e7\u00e3o dos protocolos existentes). O NocoDB s\u00f3 desliga depois da fase 2 validada.\n5. **Edi\u00e7\u00e3o.** M\u00f3dulo na \u00e1rea admin do app: super admins e secret\u00e1rias editam; facilitadores leem. A garantia \"mudan\u00e7a vale na resposta seguinte\" se mant\u00e9m (leitura direta, sem cache).\n6. **Ouvidoria.** Painel com mudan\u00e7a de Status (aberto/respondido) para diretoria e secret\u00e1rias. A invariante **\u00edndice, n\u00e3o dossi\u00ea** migra junto: nenhum dado pessoal entra no app; nome, CPF e relato seguem s\u00f3 na conversa do Chatwoot, ligados por `Conversa_Id`.\n7. **Protocolo.** Formato ANO-NNNN mantido, numera\u00e7\u00e3o continua do \u00faltimo n\u00famero (a sequence do Postgres nasce dele), gera\u00e7\u00e3o pelo banco, nunca pelo modelo. Protocolos j\u00e1 informados a pacientes continuam consult\u00e1veis.\n8. **Registro e divis\u00e3o do trabalho.** O desenvolvimento acontece no Hospital (ADR pr\u00f3prio l\u00e1 + PRD + issues pelo workflow do repo). Do lado Ana ficam: este ADR, o CONTEXT.md atualizado e a proposta P9 no roadmap (trocar as URLs das 6 tools, credencial nova no vault, rodar o roteiro de regress\u00e3o, desligar o NocoDB).\n\n## Considered options\n\n- **Manter o NocoDB e integr\u00e1-lo ao app (webhooks ou data source externo):** rejeitado pela pesquisa citada no contexto: sem retry, sem gatilho em escrita externa, sync de schema manual. Dois sistemas para sempre, sincroniza\u00e7\u00e3o cega.\n- **Migrar s\u00f3 as 4 tabelas de valores, ouvidoria fica no NocoDB:** rejeitado. O painel de ouvidoria no app teria que ler do NocoDB, mantendo os dois sistemas e o risco do token de base inteira.\n- **Ana l\u00ea direto do Postgres do Hospital (o usu\u00e1rio ANA_READONLY):** rejeitado. As tools da Ana s\u00e3o HTTP/HTTPS pela plataforma fazer.ai; banco direto n\u00e3o \u00e9 um caminho que a inst\u00e2ncia executa, e furaria as regras de neg\u00f3cio que vivem no Python do app.\n- **Usu\u00e1rio t\u00e9cnico no Supabase Auth (JWT):** rejeitado. As tools HTTP do fazer.ai n\u00e3o renovam token; expiraria em produ\u00e7\u00e3o.\n- **Big-bang (migrar tudo e desligar numa janela s\u00f3):** rejeitado. A falha silenciosa de interpola\u00e7\u00e3o da plataforma (achado V14) j\u00e1 provou que erro de escrita pode passar calado; faseamento com valida\u00e7\u00e3o por fase.\n\n## Consequ\u00eancias\n\n- O Hospital Reuni\u00f5es vira a casa dos dados do atendimento: edi\u00e7\u00e3o com login, auditoria e pap\u00e9is, no produto que o hospital j\u00e1 usa e paga.\n- As tools 1-4, 11 e 12 da Ana trocam de URL e de credencial (uma API key no vault no lugar do xc-token); o comportamento conversacional n\u00e3o muda.\n- O risco do ADR-0010 (token com alcance de base inteira) morre com o NocoDB; o \"proxy fino da fase 5\" previsto l\u00e1 deixa de ser necess\u00e1rio para a ouvidoria.\n- O guia `docs/07-guia-edicao-base-ana.md` e o termo Base Ana do CONTEXT.md passam a apontar para o app quando a fase 1 entrar; at\u00e9 l\u00e1, o NocoDB segue sendo a fonte viva.\n- Requisito herdado para os endpoints de escrita: a vari\u00e1vel cr\u00edtica vai na URL ou o campo \u00e9 obrigat\u00f3rio no banco (defesa contra a falha silenciosa de interpola\u00e7\u00e3o da plataforma).\n- Cuidado de fronteira: os endpoints `/api/ana/*` nascem na API de produ\u00e7\u00e3o do app; a API key \u00e9 de escopo restrito a eles e nunca aparece em prompt de agente.", "cita": [], "decisao": "", "emenda": [6, 10], "emendada_por": [16], "file": "docs/adr/0015-base-ana-migra-para-hospital-reunioes.md", "number": 15, "slug": "0015-base-ana-migra-para-hospital-reunioes", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Base Ana migra do NocoDB para o Hospital Reuni\u00f5es"}, {"amended_by": null, "amends": "0010, 0015", "body_md": "Decis\u00e3o do Pedro (18/ago/2026, sess\u00e3o de grilling): na fase 2 do ADR-0015, a Ana passa a informar ao paciente o n\u00famero que o `POST /api/ana/ouvidoria/protocolos` j\u00e1 devolve, em uma \u00fanica chamada. A trava dura das DUAS chamadas (R2 grava, R3 l\u00ea), nascida na v6.2, \u00e9 aposentada porque a causa dela desapareceu com a troca de fonte. Na mesma sess\u00e3o, o campo `conversa_id` sai do body da tool 11 e o v\u00ednculo entre o \u00edndice e o dossi\u00ea passa a existir s\u00f3 na dire\u00e7\u00e3o inversa.\n\n## Contexto\n\n- O ADR-0010 desenhou o protocolo na tabela `5_Ouvidoria_Protocolos` do NocoDB. Ali o POST devolvia apenas o `Id`: o campo `Protocolo` era coluna de f\u00f3rmula, calculada depois da grava\u00e7\u00e3o. Ler de volta era o **\u00fanico** caminho poss\u00edvel para ter o n\u00famero.\n- A trava dura da v6.2 (\"a frase s\u00f3 pode ser enviada se `registrar_ouvidoria` E `consultar_protocolo_ouvidoria` tiverem sido de fato executadas\") nasceu de uma alucina\u00e7\u00e3o real flagrada em 12/ago: em 1 de 4 provas o modelo pulou as duas chamadas e inventou \"protocolo 2026-0123\". A garantia que a trava d\u00e1 n\u00e3o \u00e9 o n\u00famero de chamadas: \u00e9 a exig\u00eancia de que o n\u00famero seja **c\u00f3pia literal de um campo devolvido por ferramenta**.\n- No Hospital Reuni\u00f5es o n\u00famero \u00e9 gerado pelo banco (sequence + coluna gerada, migration `063`) e o endpoint devolve a linha inteira j\u00e1 gravada, com o campo `protocolo` pronto (`app/routers/ana.py`, `registrar_protocolo`). Um POST bem-sucedido j\u00e1 entrega tudo o que o R3 iria buscar.\n- O `GET /api/ana/ouvidoria/protocolos/{protocolo}` consulta por ANO-NNNN, n\u00e3o por id, e n\u00e3o existe consulta por id nem listagem em `/api/ana/*`. A tool 12 n\u00e3o tem como continuar sendo o passo R3 sem receber do R2 o pr\u00f3prio n\u00famero que ela iria confirmar.\n- A tool 11 mandava `Conversa_Id: {{conversation_id}}` no body. A pesquisa no c\u00f3digo-fonte da 1.4.1 (`ana/plataforma/pesquisa-contact-phone-http-tools.md`) mostra uma **lista fechada de 10 vari\u00e1veis** de contexto interpol\u00e1veis no body, e `conversation_id` n\u00e3o est\u00e1 nela. Nome fora da lista vira string vazia em sil\u00eancio. Os 3 registros de teste do NocoDB sa\u00edram com `Conversa_Id` nulo por isso, e n\u00e3o por serem do playground: o achado da V19 estava certo no fato e errado na causa.\n- A \u00fanica vari\u00e1vel da lista que serviria de identificador \u00e9 `{{contact_phone}}`. Telefone \u00e9 dado pessoal e violaria a invariante \u00edndice-n\u00e3o-dossi\u00ea (ADR-0010; ADR-0015 decis\u00e3o 6).\n- A tabela de produ\u00e7\u00e3o nasceu vazia e a sequence em 1 (conferido em 18/ago). Os 3 protocolos do NocoDB (2026-0001 a 0003) s\u00e3o de teste da bateria v2 e o texto deles parece manifesta\u00e7\u00e3o real: migrar as linhas encheria o painel `/ouvidoria` da diretoria de reclama\u00e7\u00f5es que nunca aconteceram.\n\n## Decis\u00e3o\n\n1. **Uma chamada.** A Se\u00e7\u00e3o 7.3 passa a informar ao paciente o campo `protocolo` da resposta de `registrar_ouvidoria`. O PASSO R3 de leitura deixa de existir.\n2. **Trava dura reancorada, n\u00e3o removida.** A regra continua, com o mesmo peso, mudando s\u00f3 a \u00e2ncora: a frase \"registrada com o protocolo\" s\u00f3 pode ser enviada se `registrar_ouvidoria` foi de fato executada nesta conversa e o n\u00famero for c\u00f3pia literal do campo `protocolo` que ela devolveu. Sem esse campo, protocolo n\u00e3o existe e vale a mensagem sem n\u00famero.\n3. **Tool 12 muda de papel.** Deixa de ser passo do registro e vira consulta por ANO-NNNN, para o paciente que volta citando o n\u00famero. Resposta m\u00ednima e segura: confirma que a manifesta\u00e7\u00e3o existe, informa data de abertura e prazo, e escala para humano. A Ana **n\u00e3o** l\u00ea o resumo de volta e **n\u00e3o** informa o `status`: \"respondido\" no painel significa que a equipe interna fechou o caso, n\u00e3o que o paciente foi contatado, e dizer isso a quem nunca recebeu retorno \u00e9 dano.\n4. **O `conversa_id` sai do body.** Campo que sempre chegou vazio e lia como se funcionasse. A tool 11 manda `categoria`, `setor` e `resumo`.\n5. **O elo \u00edndice-dossi\u00ea inverte.** Depois do registro, a Ana grava uma nota interna com o n\u00famero do protocolo. Quem est\u00e1 no painel `/ouvidoria` l\u00ea o n\u00famero e busca por ele no Chatwoot. A ponte vive dentro da conversa, n\u00e3o dentro do \u00edndice.\n6. **Continuidade sem heran\u00e7a de teste.** Nenhuma das 3 linhas do NocoDB \u00e9 migrada. S\u00f3 a sequence \u00e9 adiantada (`setval` para 3), ent\u00e3o o primeiro registro real nasce `2026-0004`. Nenhum n\u00famero se repete e o painel do hospital nasce limpo. O buraco 0001-0003 n\u00e3o tem dono real que possa consult\u00e1-lo.\n\n## Considered options\n\n- **Manter as duas chamadas por paridade e seguran\u00e7a:** rejeitado. O R3 leria de volta um n\u00famero que o R2 j\u00e1 entregou, o que n\u00e3o protege contra inven\u00e7\u00e3o (a prote\u00e7\u00e3o \u00e9 ser c\u00f3pia literal de campo de ferramenta, e o R2 j\u00e1 satisfaz). Em troca, cria uma falha nova: R3 com 404 ou timeout depois de uma grava\u00e7\u00e3o bem-sucedida faria a Ana calar um n\u00famero que existe no banco, violando a regra \"protocolo em m\u00e3os = protocolo comunicado\" da v6.3.\n- **Migrar as 3 linhas de teste e rodar o `setval`:** rejeitado. Cumpre o ADR-0015 decis\u00e3o 7 ao p\u00e9 da letra, mas o painel \u00e9 lido pela diretoria e pelas secret\u00e1rias, e os resumos de teste (\"paciente relata que esperou cerca de 3 horas na recep\u00e7\u00e3o\") seriam lidos como manifesta\u00e7\u00f5es reais. A decis\u00e3o 7 fala em manter consult\u00e1veis os n\u00fameros **j\u00e1 informados a pacientes**; nenhum desses tr\u00eas foi.\n- **N\u00e3o fazer nada com a numera\u00e7\u00e3o:** rejeitado. A sequence nasce em 1 e o pr\u00f3ximo registro real seria `2026-0001`, n\u00famero j\u00e1 dito numa conversa da bateria.\n- **Preencher `conversa_id` com `{{contact_phone}}`:** rejeitado. \u00c9 a \u00fanica vari\u00e1vel da lista fechada que identifica algu\u00e9m, e \u00e9 justamente dado pessoal. Quebra a invariante \u00edndice-n\u00e3o-dossi\u00ea.\n- **Tool 12 informando o `status` ao paciente:** rejeitado, ver decis\u00e3o 3.\n\n## Consequ\u00eancias\n\n- A Se\u00e7\u00e3o 7.3 encurta: R1 nota do dossi\u00ea, R2 grava e j\u00e1 traz o n\u00famero, R3 nota com o n\u00famero, mensagem ao paciente. Uma chamada de rede a menos por registro e uma janela de falha a menos entre a grava\u00e7\u00e3o e a fala.\n- Nasce a Se\u00e7\u00e3o 7.5 (paciente que volta com protocolo), fluxo que n\u00e3o existia no prompt.\n- A regra \"uma grava\u00e7\u00e3o por conversa\" fica mais f\u00e1cil de cumprir: em d\u00favida se gravou, a Ana consulta pelo pr\u00f3prio n\u00famero que recebeu, nunca grava de novo.\n- O `{{conversation_id}}` some do repert\u00f3rio: qualquer tool futura que precise ligar registro e conversa tem que usar a dire\u00e7\u00e3o inversa ou uma vari\u00e1vel da lista fechada de 10.\n- O ADR-0010 fica emendado em dois pontos: o \"condicional do `Conversa_Id`\" que a V16 dera por resolvido a favor estava errado, e a leitura em duas etapas era artefato do NocoDB, n\u00e3o requisito de seguran\u00e7a.\n- O `setval` \u00e9 gesto manual do Pedro no SQL Editor do Supabase Studio. N\u00e3o h\u00e1 caminho de API para ele em `/api/ana/*`, por desenho.", "cita": [], "decisao": "", "emenda": [10, 15], "emendada_por": [], "file": "docs/adr/0016-protocolo-vem-do-post.md", "number": 16, "slug": "0016-protocolo-vem-do-post", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O protocolo da ouvidoria vem do POST, e o elo com a conversa inverte de dire\u00e7\u00e3o"}, {"amended_by": "0018, 0030", "amends": "0007", "body_md": "Decis\u00e3o do Pedro (18/ago/2026, noite, sess\u00e3o de grilling do Mapa da Integra\u00e7\u00e3o): quando um dado do Ana OS existe ao vivo numa fonte autoritativa, o JSON curado **n\u00e3o guarda esse dado**. Ele guarda s\u00f3 o que s\u00f3 uma pessoa sabe (para que serve, quando se usa, o que acontece quando falha) e busca o resto na fonte, na hora de renderizar. O que a p\u00e1gina n\u00e3o pode buscar ao vivo aparece sempre com a data da medi\u00e7\u00e3o ao lado. Nasce com a p\u00e1gina `os/integracao.html` e passa a valer para toda p\u00e1gina do OS.\n\n## Contexto\n\n- O Ana OS (ADR-0007) rende suas p\u00e1ginas a partir de JSON curados em `os/dados/`. O padr\u00e3o at\u00e9 aqui \u00e9 o do Mapa do SOP: o arquivo guarda tudo, inclusive trechos literais do prompt, e carrega um carimbo (`meta.versao_prompt`) mais uma regra escrita de revalida\u00e7\u00e3o por sess\u00e3o. Funciona para o prompt, que s\u00f3 muda quando uma sess\u00e3o o publica.\n- Para as **ferramentas**, o mesmo padr\u00e3o falhou de forma silenciosa. A `os/dados/circuito.json` guarda `\"backend\": \"nocodb\"` na tool 1. Em 14/ago a V21 apontou essa tool para `api.hospitalsaomatheus.cloud`. O arquivo virou mentira no mesmo dia, ningu\u00e9m foi avisado, e a p\u00e1gina seguiu afirmando o contr\u00e1rio com a mesma confian\u00e7a de antes. O `meta.versao_prompt` dela ainda diz `v5.3`; o prompt no ar \u00e9 o v6.4.\n- A `os/arquitetura.html` desenha o NocoDB como a casa das quatro tabelas. Tamb\u00e9m deixou de ser verdade para uma delas, pelo mesmo motivo.\n- A fonte autoritativa existe e \u00e9 barata: a rota `GET /api/v1/tools` da plataforma devolve `urlTemplate`, `method`, `credentialRef` e `enabled` de cada ferramenta. O `ana/bancada/divergimetro.py` j\u00e1 l\u00ea essa rota com o `AGENTS_API_TOKEN` do `.env`, exatamente para n\u00e3o deixar as URLs do NocoDB escritas no repo.\n- O `os/server.py` j\u00e1 carrega o `.env` e j\u00e1 serve rotas de API pr\u00f3prias (`/api/status`, `/api/roadmap`, `/api/sql`), ent\u00e3o somar uma rota de leitura n\u00e3o muda a natureza do cockpit.\n- Uma regra da casa limita o alcance: o server **n\u00e3o chama produ\u00e7\u00e3o**. A API do Hospital \u00e9 produ\u00e7\u00e3o, ent\u00e3o as medi\u00e7\u00f5es que dependem dela (tamanho da resposta em caracteres, itens que passam do teto de 4.000, protocolos que devolvem 404) n\u00e3o podem ser feitas pela p\u00e1gina.\n\n## Decis\u00e3o\n\n1. **Dado que a plataforma sabe n\u00e3o entra no JSON.** URL, m\u00e9todo, credencial e se a ferramenta est\u00e1 ligada nunca s\u00e3o escritos em arquivo do `os/dados/`. V\u00eam de `/api/v1/tools` na hora, por uma rota de leitura do `os/server.py`, e s\u00e3o casados com o n\u00f3 do desenho pelo **nome** da ferramenta.\n2. **Estado \u00e9 derivado, nunca declarado.** O selo \"j\u00e1 migrou\" ou \"ainda no NocoDB\" n\u00e3o existe como campo. A p\u00e1gina o deriva do host da URL viva. Virar uma tool na plataforma muda o desenho sozinho, sem ningu\u00e9m lembrar de editar nada.\n3. **Sem fonte, a p\u00e1gina diz que n\u00e3o sabe.** Se o token faltar ou a plataforma n\u00e3o responder, o n\u00f3 mostra \"n\u00e3o consegui ler a inst\u00e2ncia\". Nunca um valor guardado antes, apresentado como se fosse de agora.\n4. **O que n\u00e3o d\u00e1 para buscar, vem carimbado.** Medi\u00e7\u00e3o que exige chamar produ\u00e7\u00e3o \u00e9 gravada por script (`smoke-hospital.py` passa a escrever `os/dados/integracao-medida.json`) e a p\u00e1gina sempre mostra o n\u00famero **com a data ao lado**. Medida velha muda de cor e pede que o smoke rode de novo. O n\u00famero nunca aparece sozinho.\n5. **O JSON curado guarda o que s\u00f3 gente sabe.** Para que serve a chamada, em que momento real do atendimento a Ana a usa, o que ela devolve, quais os limites, o que acontece quando falha, qual cen\u00e1rio da bancada a prova, e a \u00e2ncora para o trecho do prompt. Nada disso est\u00e1 em lugar nenhum que uma m\u00e1quina possa ler.\n6. **Vale para tr\u00e1s tamb\u00e9m.** A `circuito.json` para de declarar o backend por ferramenta e passa a ler a mesma rota; a `arquitetura.html` deixa de afirmar quem \u00e9 a casa das quatro tabelas e aponta para o Mapa da Integra\u00e7\u00e3o.\n\n## Considered options\n\n- **Manter o padr\u00e3o do Mapa do SOP (carimbo mais script de confer\u00eancia):** rejeitado para ferramentas. \u00c9 exatamente o que a `circuito.json` faz, e o resultado foi cinco dias de mentira sem sinal nenhum. O carimbo funciona para o prompt porque o prompt s\u00f3 muda quando uma sess\u00e3o o publica, e a publica\u00e7\u00e3o \u00e9 o momento natural de recarimbar. A ferramenta muda pelo console, por outra sess\u00e3o, ou por outra pessoa, sem passar pelo repo.\n- **A p\u00e1gina ler `/api/v1/tools` direto do navegador:** rejeitado. Poria o `AGENTS_API_TOKEN` no HTML servido. O token fica no server, que j\u00e1 o l\u00ea do `.env`.\n- **A p\u00e1gina medir o tamanho das respostas ao vivo, com um bot\u00e3o:** rejeitado por ora. Daria o n\u00famero sempre fresco, mas faria o Ana OS chamar a API de produ\u00e7\u00e3o do Hospital, o que a regra do server pro\u00edbe. O carimbo com data resolve o problema honesto (n\u00e3o mentir sobre frescor) sem abrir a exce\u00e7\u00e3o. Se um dia a exce\u00e7\u00e3o for aberta, ela vira ADR pr\u00f3prio.\n- **N\u00e3o fazer a p\u00e1gina e s\u00f3 consertar a `circuito.json`:** rejeitado. O conserto sozinho n\u00e3o resolve o que falta, que \u00e9 o desenho das duas dire\u00e7\u00f5es entre as duas aplica\u00e7\u00f5es, com estado de migra\u00e7\u00e3o e provas. E a `circuito.json` voltaria a apodrecer na virada seguinte, porque a causa \u00e9 o padr\u00e3o, n\u00e3o o valor errado.\n\n## Consequ\u00eancias\n\n- O Ana OS passa a ter dois tipos de dado, e a diferen\u00e7a precisa ficar expl\u00edcita em cada arquivo novo: o curado (prosa, escrito por gente) e o vivo (buscado na fonte). P\u00e1gina nova que misturar os dois sem separar volta a apodrecer.\n- O cockpit ganha uma depend\u00eancia de rede para renderizar por completo. \u00c9 aceit\u00e1vel porque ele j\u00e1 \u00e9 local e j\u00e1 depende do `.env` para a bancada, o Atlas e a conex\u00e3o TST, e porque a falha \u00e9 expl\u00edcita na tela.\n- O `smoke-hospital.py` ganha um efeito colateral: al\u00e9m de imprimir, grava a medi\u00e7\u00e3o. Quem rodar o smoke alimenta a p\u00e1gina sem saber, o que \u00e9 o comportamento desejado.\n- A `circuito.json` perde o campo `backend` de cada tool e o `meta.versao_prompt` dela deixa de valer como carimbo das ferramentas (segue valendo para os trechos do prompt).\n- Custo aceito: uma p\u00e1gina do OS aberta sem o server rodando mostra buracos. O OS nunca foi para ser aberto por `file://`, ent\u00e3o isso n\u00e3o muda o uso real.", "cita": [], "decisao": "", "emenda": [7], "emendada_por": [18, 30], "file": "docs/adr/0017-o-os-nao-guarda-o-que-muda.md", "number": 17, "slug": "0017-o-os-nao-guarda-o-que-muda", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "As p\u00e1ginas do Ana OS n\u00e3o guardam o que a plataforma j\u00e1 sabe"}, {"amended_by": "0020, 0029", "amends": "0017", "body_md": "Decis\u00e3o do Pedro (19/ago/2026, sess\u00e3o de grilling sobre o Mapa da Integra\u00e7\u00e3o): toda ferramenta desenhada em qualquer p\u00e1gina do Ana OS carrega um **selo de origem** com o mesmo vocabul\u00e1rio e a mesma cor, dizendo quem responde aquela chamada. S\u00e3o tr\u00eas fam\u00edlias: **API do Hospital**, **Global Health** e **nativa da plataforma**. O selo \u00e9 derivado, nunca escrito \u00e0 m\u00e3o. A Global Health **continua no Mapa da Integra\u00e7\u00e3o**, marcada pelo selo, em vez de sair da tela. O NocoDB sai do cockpit inteiro.\n\n## Contexto\n\n- O ADR-0017 tirou URL, m\u00e9todo, credencial e estado de dentro dos JSON curados e passou a deriv\u00e1-los da rota `/api/v1/tools` da plataforma. Resolveu a mentira, mas resolveu numa p\u00e1gina s\u00f3: o Mapa da Integra\u00e7\u00e3o.\n- As outras duas p\u00e1ginas que falam de ferramenta seguiram no padr\u00e3o velho e j\u00e1 apodreceram. A `os/dados/circuito.json` ainda diz que `consultar_precos_consultas` l\u00ea \"a Base Ana (NocoDB)\", coisa que deixou de ser verdade em 14/ago com a V21. A `os/arquitetura.html` ainda desenha o NocoDB como casa das quatro tabelas e ainda diz que \"a migra\u00e7\u00e3o est\u00e1 pela metade\". O `os/dados/apps.json` ainda lista o NocoDB como aplica\u00e7\u00e3o viva. O servi\u00e7o est\u00e1 parado desde 19/ago (V26).\n- O Mapa do SOP mostra as ferramentas como chip cinza no painel lateral, sem dizer de onde v\u00eam. Quem l\u00ea o fluxo n\u00e3o distingue uma chamada que j\u00e1 funciona em produ\u00e7\u00e3o de uma que espera a massa da Global Health. Era exatamente a pergunta que o Pedro fazia olhando a tela.\n- A jun\u00e7\u00e3o j\u00e1 existe nos dados e ningu\u00e9m a usava: cada n\u00f3 de tool do `sop-fluxo.json` guarda a lista de nomes de ferramenta no campo `tools`, e cada n\u00f3 do `integracao.json` guarda o mesmo nome mais a \u00e2ncora de volta para o n\u00f3 do SOP. Faltava o caminho inverso e faltava o selo.\n- Leitura ao vivo em 19/ago/2026 confirmou a base da deriva\u00e7\u00e3o: a inst\u00e2ncia tem 12 ferramentas HTTP, 6 no host `api.hospitalsaomatheus.cloud` e 6 no host `dem.agenda.globalhealth.mv`. As nativas (`assign_label`, `kanban_move_card`, `handoff_to_human`, `private_note`, `get_current_time`) e a RAG (`search_knowledge`) **n\u00e3o aparecem** nessa rota, porque n\u00e3o saem da plataforma. Aus\u00eancia da lista \u00e9, por si s\u00f3, o sinal da terceira fam\u00edlia.\n- A concess\u00e3o \u00e9 outra hist\u00f3ria. A Ana tem 11 das 12 ferramentas HTTP concedidas; a `cadastrar_paciente` (id 7) est\u00e1 fora dos grants desde a V20 (ADR-0014), e hoje isso vive como alerta escrito \u00e0 m\u00e3o no `integracao.json`. A inst\u00e2ncia 1.4.1 **n\u00e3o exp\u00f5e rota REST de grants**: oito caminhos testados em 19/ago devolveram 404, e s\u00f3 a ferramenta MCP `agent_tools_get` alcan\u00e7a o dado.\n\n## Decis\u00e3o\n\n1. **Tr\u00eas fam\u00edlias, um vocabul\u00e1rio.** Toda ferramenta desenhada no cockpit carrega o selo **API do Hospital**, **Global Health** ou **nativa da plataforma**, com a mesma palavra e a mesma cor em todas as p\u00e1ginas. As nativas n\u00e3o se subdividem em Chatwoot, base de conhecimento e rel\u00f3gio: a pergunta que o selo responde \u00e9 se a chamada sai da plataforma, e para onde.\n2. **Origem \u00e9 derivada, nunca declarada.** Ferramenta que aparece em `/api/v1/tools` recebe a fam\u00edlia pelo host da `urlTemplate`, casada com a lista de destinos do `integracao.json`. Ferramenta ausente daquela rota \u00e9 nativa. Nenhum campo de origem entra em JSON curado, o que estende a regra do ADR-0017 \u00e0s p\u00e1ginas Circuito e Mapa do SOP.\n3. **O selo vale nas tr\u00eas p\u00e1ginas.** Mapa da Integra\u00e7\u00e3o, Mapa do SOP e Circuito da Ana passam a mostrar o selo na pr\u00f3pria caixa, sem exigir clique. Continuam sendo tr\u00eas p\u00e1ginas com tr\u00eas altitudes diferentes, e n\u00e3o viram uma s\u00f3.\n4. **O link vai e volta.** A \u00e2ncora que hoje leva do Mapa da Integra\u00e7\u00e3o ao n\u00f3 do SOP ganha o caminho inverso, montado na renderiza\u00e7\u00e3o a partir do nome da ferramenta. Nenhum \u00edndice novo \u00e9 escrito em arquivo.\n5. **A Global Health fica na tela, marcada.** As seis ferramentas de agenda continuam desenhadas no Mapa da Integra\u00e7\u00e3o, na faixa da fronteira parada, com o selo \u00e2mbar e com o alerta da GH19 em vermelho. Pend\u00eancia real continua vermelha; some quando deixa de ser verdade, n\u00e3o porque incomoda.\n6. **A concess\u00e3o vem carimbada, com data.** Enquanto n\u00e3o houver rota REST de grants, o estado \"a Ana n\u00e3o pode chamar\" \u00e9 gravado por script (leitura via MCP `agent_tools_get`) num JSON de medi\u00e7\u00e3o, e a p\u00e1gina o mostra sempre com a data da confer\u00eancia ao lado, no mesmo padr\u00e3o da cl\u00e1usula 4 do ADR-0017. O alerta escrito \u00e0 m\u00e3o sai do `integracao.json`. A rota que falta entra no report V10 para a fazer.ai.\n7. **O NocoDB sai do cockpit.** A raia, o destino, o n\u00f3 e os alertas do NocoDB somem do `integracao.json`; a men\u00e7\u00e3o some do `apps.json`, do `circuito.json`, da `arquitetura.html`, do `circuito.html` e do `roadmap.html`. O servi\u00e7o parado \u00e9 hist\u00f3ria, e hist\u00f3ria mora no TODO.md e no CONTEXT.md, n\u00e3o no desenho do que existe hoje.\n\n## Considered options\n\n- **Fundir o Mapa do SOP e o Mapa da Integra\u00e7\u00e3o numa tela s\u00f3:** rejeitado. Seriam 81 n\u00f3s de fluxo mais 24 de fronteira no mesmo canvas, e a densidade mataria a leitura das duas coisas. As altitudes diferentes j\u00e1 s\u00e3o a raz\u00e3o de existirem tr\u00eas p\u00e1ginas (ADR-0007 e o termo de cada uma no CONTEXT.md). A l\u00edngua comum entrega a integra\u00e7\u00e3o que o Pedro queria sem pagar o pre\u00e7o da fus\u00e3o.\n- **Tirar a Global Health do Mapa da Integra\u00e7\u00e3o:** rejeitado pelo pr\u00f3prio Pedro no meio da sess\u00e3o. O mapa se chama fronteira externa da Ana, e a Global Health \u00e9 metade dessa fronteira. Escond\u00ea-la faria a p\u00e1gina mentir por omiss\u00e3o, que \u00e9 o defeito que o ADR-0017 nasceu para matar. O que incomodava n\u00e3o era a presen\u00e7a, era n\u00e3o distinguir o que \u00e9 do Hospital do que \u00e9 da Global Health.\n- **Cinco fam\u00edlias (Hospital, Global Health, Chatwoot, base de conhecimento, rel\u00f3gio):** rejeitado. Mais preciso e menos leg\u00edvel: cinco cores competindo em telas que j\u00e1 usam cor para estado e para defeito. As tr\u00eas nativas se comportam igual no que o selo mede, porque nenhuma sai da plataforma.\n- **Escrever a fam\u00edlia num campo do JSON:** rejeitado pelo ADR-0017. Seria o mesmo `\"backend\": \"nocodb\"` com outro nome, e apodreceria na virada seguinte de tool.\n- **Manter a concess\u00e3o como alerta escrito \u00e0 m\u00e3o:** rejeitado. \u00c9 o padr\u00e3o que j\u00e1 falhou. O carimbo com data \u00e9 pior que ao vivo e melhor que prosa, porque nunca finge frescor.\n\n## Consequ\u00eancias\n\n- Uma virada de tool na plataforma passa a atualizar sozinha as tr\u00eas p\u00e1ginas, e n\u00e3o mais s\u00f3 uma.\n- O `os/server.py` n\u00e3o muda de natureza: a rota `/api/tools` que ele j\u00e1 serve passa a alimentar mais duas p\u00e1ginas.\n- Nasce um segundo arquivo de medi\u00e7\u00e3o carimbada, com os grants. Quem rodar a confer\u00eancia alimenta o cockpit, do mesmo jeito que quem roda o `smoke-hospital.py` alimenta a medida das tabelas.\n- O Mapa do SOP deixa de ser retrato puramente congelado: continua carimbado no que diz respeito ao prompt, mas o selo de origem das ferramentas passa a ser vivo. A distin\u00e7\u00e3o precisa ficar clara na p\u00e1gina, para ningu\u00e9m achar que o trecho literal tamb\u00e9m \u00e9 de agora.\n- A aus\u00eancia de rota de grants vira pend\u00eancia registrada para a fazer.ai, somando ao report V10 junto com `resolve_conversation`, o teto de 2.000 caracteres da descri\u00e7\u00e3o de tool e o `reasoning_effort` no modelConfig.", "cita": [], "decisao": "", "emenda": [17], "emendada_por": [20, 29], "file": "docs/adr/0018-lingua-unica-da-origem-da-ferramenta.md", "number": 18, "slug": "0018-lingua-unica-da-origem-da-ferramenta", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Uma l\u00edngua s\u00f3 para a origem da ferramenta, nas tr\u00eas p\u00e1ginas do cockpit"}, {"amended_by": "0020, 0022, 0028", "amends": null, "body_md": "Decis\u00e3o do Pedro (20/ago/2026, sess\u00e3o de saneamento do Ana OS): o cockpit cai de 16 para **9 p\u00e1ginas**. Sete p\u00e1ginas saem da navega\u00e7\u00e3o e v\u00e3o intactas para `os/arquivo/`: **Absor\u00e7\u00e3o, Insights, Atlas, Roteiro, Mapa das APIs, Conex\u00e3o TST e Biblioteca**. Nada \u00e9 apagado; cada p\u00e1gina tem um crit\u00e9rio expl\u00edcito de volta.\n\n## Contexto\n\n- A auditoria de 20/ago abriu as 16 p\u00e1ginas no navegador e conferiu os dados por tr\u00e1s de cada uma. Tr\u00eas fatos derrubaram o grupo:\n  - **A colheita da produ\u00e7\u00e3o nunca rodou.** A pasta `ana/api-mv/absorcao-producao/resultados/` est\u00e1 vazia (zero CSVs do pacote C8). Absor\u00e7\u00e3o (o manual da colheita), Insights (13 hip\u00f3teses sem nenhuma evid\u00eancia) e Atlas (que promete produ\u00e7\u00e3o hidratada e s\u00f3 mostra TST) vivem esperando dados que n\u00e3o chegaram desde o in\u00edcio de agosto.\n  - **O Roteiro ensinava um comando morto** (`ana/api-mv/playground/server.py`, que n\u00e3o existe mais) e o resto dele repete a Bancada: as duas p\u00e1ginas cobrem a mesma homologa\u00e7\u00e3o dem.agenda.\n  - **O Mapa das APIs parou em 04/ago** e o Mapa da Integra\u00e7\u00e3o (os17, ADR-0017 e ADR-0018) mais a Compara\u00e7\u00e3o contam hoje quase tudo o que ele contava, com dados vivos.\n- A Conex\u00e3o TST nasceu para diagnosticar uma conex\u00e3o que j\u00e1 funciona (o essencial vive em `ana/api-mv/conexao-oracle.md`); a Biblioteca renderiza documentos que se leem melhor no editor.\n- O Circuito da Ana tamb\u00e9m estava defasado (retratava o prompt v5.3 de 07/ago com s\u00f3 40 de 95 trechos v\u00e1lidos), mas \u00e9 a \u00fanica p\u00e1gina do mecanismo de execu\u00e7\u00e3o: em vez de sair, foi re-validado contra o export v6.4 de 20/ago (88 trechos, 100% batendo) e ficou.\n\n## Decis\u00e3o\n\n1. **Sete p\u00e1ginas v\u00e3o para `os/arquivo/`**, intactas, servidas pelo mesmo server, fora da navega\u00e7\u00e3o. Mesmo padr\u00e3o do `roadmap/arquivo/`: acervo de consulta, nunca fonte do estado atual.\n2. **A navega\u00e7\u00e3o cai para 9 itens:** Cockpit, Roadmap (grafo), Arquitetura, Mapa do SOP, Circuito da Ana, Mapa da Integra\u00e7\u00e3o, Compara\u00e7\u00e3o, Bancada e Cadeias. O `nav.js` marca p\u00e1ginas abertas de dentro de `os/arquivo/` com a trilha \"arquivo\".\n3. **Crit\u00e9rios de volta:** Absor\u00e7\u00e3o, Insights e Atlas voltam no dia em que a colheita C8 rodar e os CSVs chegarem ao dep\u00f3sito. As demais s\u00f3 voltam se uma necessidade nova as puxar; a expectativa \u00e9 que n\u00e3o voltem.\n4. **O que era \u00fatil migrou antes de arquivar:** as queries de confer\u00eancia exclusivas do Roteiro (detector de integra\u00e7\u00e3o pelas colunas `*_INTEGRA` e busca do id da GH na `IT_AGENDA_CENTRAL`) entraram nos cards da Bancada; os links das p\u00e1ginas vivas que apontavam para as arquivadas foram redirecionados (Arquitetura e Cadeias para o Mapa da Integra\u00e7\u00e3o, Bancada para `conexao-oracle.md`).\n\n## Considered options\n\n- **Apagar as sete p\u00e1ginas:** rejeitado. Absor\u00e7\u00e3o, Insights e Atlas s\u00e3o trabalho pronto esperando dados; apagar custaria refazer. O arquivo preserva com `git mv`.\n- **S\u00f3 tirar do menu, sem mover:** rejeitado. P\u00e1gina fora do menu mas na pasta principal volta a parecer viva para quem lista `os/`. A pasta `arquivo/` \u00e9 a fronteira vis\u00edvel entre o que vale e o que \u00e9 acervo.\n- **Arquivar tamb\u00e9m o Circuito e as Cadeias:** rejeitado pelo Pedro. O Circuito \u00e9 a \u00fanica p\u00e1gina do mecanismo de execu\u00e7\u00e3o e estava em manuten\u00e7\u00e3o ativa (19/ago); a solu\u00e7\u00e3o para a defasagem era re-validar, n\u00e3o arquivar. As Cadeias s\u00e3o a \u00fanica p\u00e1gina que prova consequ\u00eancia encadeada (o que um POST cria, o GET seguinte encontra).\n\n## Consequ\u00eancias\n\n- O `CLAUDE.md` passa a descrever o cockpit de 9 p\u00e1ginas; a descri\u00e7\u00e3o antiga citava Atlas, Biblioteca e roteiro.\n- A Bancada vira a p\u00e1gina \u00fanica da homolog GH (chamadas ao vivo + queries de confer\u00eancia, incluindo as herdadas do Roteiro).\n- O Circuito ganhou a re-valida\u00e7\u00e3o completa: meta v6.4 (53.251 chars, export de 20/ago via MCP `agent_export`), 88 trechos literais 100% v\u00e1lidos, grants ao vivo (8 nativas nomeadas, 1 RAG, 11 HTTP) e a sa\u00edda da `cadastrar_paciente` refletida (fora dos grants desde a V20, ADR-0014).\n- Quem procurar uma p\u00e1gina arquivada abre `os/arquivo/<nome>.html` direto; os assets continuam funcionando (paths ajustados com `../`).", "cita": [], "decisao": "", "emenda": [], "emendada_por": [20, 22, 28], "file": "docs/adr/0019-cockpit-enxuto-sete-paginas-para-o-arquivo.md", "number": 19, "slug": "0019-cockpit-enxuto-sete-paginas-para-o-arquivo", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Cockpit enxuto: sete p\u00e1ginas saem de cena para o arquivo"}, {"amended_by": "0021, 0027", "amends": "0018, 0019", "body_md": "Decis\u00e3o do Pedro (20/ago/2026, sess\u00e3o de grilling): o cockpit ganha a p\u00e1gina **Testes manuais** (a d\u00e9cima, aberta horas depois de o ADR-0019 fechar em nove), o **selo de origem** do ADR-0018 se estende \u00e0s p\u00e1ginas que ficaram de fora, e cada teste ganha uma **faixa de assertividade derivada**: m\u00e1quina ou humano, nunca escrita \u00e0 m\u00e3o.\n\n## Contexto\n\n- Os testes copi\u00e1veis j\u00e1 existiam, mas escondidos: 35 testes (envie / espere / falhou se) dentro das fichas das 30 capacidades da Compara\u00e7\u00e3o, e 26 cen\u00e1rios com checagem literal (`contem` / `nao_contem`) em `ana/bancada/cenarios/integracao.json`. N\u00e3o havia lugar \u00fanico para sentar e rodar uma bateria manual, nem etiqueta dizendo qual teste uma m\u00e1quina consegue julgar sozinha.\n- O Pedro quer dois destinos claros: cen\u00e1rio com checagem exata vai para a automa\u00e7\u00e3o (via API do fazer.ai agents, quando essa frente abrir); teste com expectativa em prosa, multi-turno ou com julgamento de tom fica para o humano copiar e colar no Telegram.\n- O ADR-0018 p\u00f4s o selo de origem em tr\u00eas p\u00e1ginas (Integra\u00e7\u00e3o, SOP, Circuito). Compara\u00e7\u00e3o, Bancada, Cadeias e Arquitetura seguiram sem dizer quem responde cada chamada, exatamente a pergunta que o selo nasceu para responder.\n- No Circuito, a lista de passos repetia por extenso o entra/acontece/sai que o hover j\u00e1 conta, e a anatomia do prompt (41 se\u00e7\u00f5es, 88 trechos) era uma parede de cards sem navega\u00e7\u00e3o.\n\n## Decis\u00e3o\n\n1. **Nasce a p\u00e1gina Testes manuais** (`os/testes.html`), a d\u00e9cima do menu. Exce\u00e7\u00e3o consciente ao ADR-0019: ela n\u00e3o guarda dado novo nenhum. L\u00ea `os/dados/comparacao.json` e os cen\u00e1rios da bancada (servidos pela rota nova `/api/cenarios` do `os/server.py`) e apresenta os 61 testes prontos para uso, com bot\u00e3o de copiar em cada mensagem, turno a turno. O crit\u00e9rio do ADR-0019 continua valendo: p\u00e1gina sem dado pr\u00f3prio n\u00e3o apodrece.\n2. **Assertividade \u00e9 derivada, em duas faixas.** Teste com asser\u00e7\u00e3o literal por m\u00e1quina (`contem` / `nao_contem` / `tools`) cai na faixa **m\u00e1quina roda** (insumo da futura automa\u00e7\u00e3o pela API do fazer.ai agents). Teste com expectativa em prosa cai na faixa **humano roda**. Nenhum campo de nota entra em JSON curado, na linha dos ADR-0017/0018.\n3. **A p\u00e1gina abre pelas faixas, n\u00e3o pelas capacidades.** Primeiro \"para voc\u00ea rodar no Telegram\", depois \"para a m\u00e1quina rodar\"; dentro de cada faixa, os testes se agrupam pelos blocos de capacidade da Compara\u00e7\u00e3o. Capacidade sem teste aparece marcada como \"aguardando a Global Health\", nunca some.\n4. **O selo de origem passa a valer no cockpit inteiro.** P\u00e1gina mista (Compara\u00e7\u00e3o, Testes manuais, Arquitetura) mostra o selo por item, derivado pelo `assets/origem.js`; p\u00e1gina de origem \u00fanica (Bancada e Cadeias, ambas 100% Global Health homolog) mostra uma faixa fixa no topo em vez de repetir o mesmo selo em cada card. Emenda a cl\u00e1usula 3 do ADR-0018: de \"tr\u00eas p\u00e1ginas\" para \"toda p\u00e1gina que desenha ferramenta\".\n5. **Selo s\u00f3 para ferramenta que existe.** Nome que n\u00e3o est\u00e1 em `/api/v1/tools` nem no carimbo de grants (`grants-medida.json`) n\u00e3o ganha selo: a aus\u00eancia das duas fontes significa ferramenta inexistente, n\u00e3o nativa.\n6. **O Circuito perde a repeti\u00e7\u00e3o e ganha navega\u00e7\u00e3o.** A lista de passos mostra s\u00f3 n\u00famero, raia e t\u00edtulo (a ficha entra/acontece/sai vive no hover, que a lista tamb\u00e9m ganha). A anatomia do prompt vira acorde\u00e3o de dois n\u00edveis (se\u00e7\u00e3o e trecho) com \u00edndice lateral fixo das 41 se\u00e7\u00f5es e os bot\u00f5es \"abrir tudo\" / \"fechar tudo\", tudo fechado ao carregar.\n\n## Considered options\n\n- **Modo teste dentro da Compara\u00e7\u00e3o, sem p\u00e1gina nova:** rejeitado. A Compara\u00e7\u00e3o compara prometido contra entregue; rodar bateria \u00e9 outro trabalho, e chegar num teste exigiria achar a capacidade e abrir a ficha. A p\u00e1gina nova custa um item de menu e zero dado novo.\n- **Nota de assertividade 1 a 10 curada \u00e0 m\u00e3o:** rejeitado. \u00c9 o campo que os ADR-0017/0018 mataram: ningu\u00e9m atualiza quando o teste muda. A faixa derivada da forma da asser\u00e7\u00e3o n\u00e3o mente.\n- **Selo por item tamb\u00e9m na Bancada e nas Cadeias:** rejeitado. Dezenas de selos id\u00eanticos numa p\u00e1gina de origem \u00fanica viram papel de parede; a faixa no topo diz o mesmo uma vez.\n\n## Consequ\u00eancias\n\n- O menu volta a crescer: 10 p\u00e1ginas. O crit\u00e9rio de entrada fica registrado: p\u00e1gina nova s\u00f3 quando o trabalho \u00e9 novo e o dado \u00e9 derivado.\n- O `os/server.py` ganha a rota de leitura `/api/cenarios` (o arquivo de cen\u00e1rios vive fora de `os/`); nenhuma escrita nova.\n- Quando a automa\u00e7\u00e3o pela API do fazer.ai agents nascer, a faixa \"m\u00e1quina roda\" j\u00e1 \u00e9 a lista de entrada dela.\n- O CONTEXT.md atualiza os verbetes Ana OS e Selo de origem e ganha o verbete Testes manuais.", "cita": [], "decisao": "", "emenda": [18, 19], "emendada_por": [21, 27], "file": "docs/adr/0020-testes-manuais-e-selo-no-cockpit-inteiro.md", "number": 20, "slug": "0020-testes-manuais-e-selo-no-cockpit-inteiro", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "Testes manuais como decima pagina, e o selo de origem no cockpit inteiro"}, {"amended_by": null, "amends": "0020", "body_md": "Decis\u00e3o do Pedro (24/ago/2026, sess\u00e3o de grilling): cada teste ganha um v\u00ednculo expl\u00edcito com as se\u00e7\u00f5es do prompt (`secao_ids`, curado na fonte), e a p\u00e1gina Testes manuais troca as duas faixas abertas por uma lista compacta com filtros, ordena\u00e7\u00e3o e detalhe em popover.\n\n## Contexto\n\n- A p\u00e1gina do ADR-0020 mostrava os 61 testes com a ficha inteira aberta: rolagem longa, sem filtro nenhum. Para achar \"os testes da Se\u00e7\u00e3o 2.3\" ou \"s\u00f3 o que a m\u00e1quina roda\", o Pedro rolava a p\u00e1gina inteira.\n- As capacidades da Compara\u00e7\u00e3o j\u00e1 tinham o campo `secao`, mas em prosa livre (\"Se\u00e7\u00f5es 2.3 e 6.A\", \"Regra H\u00edbrida\"). Um parser autom\u00e1tico falharia em 6 a 8 casos, sem avisar. Os cen\u00e1rios da bancada n\u00e3o tinham se\u00e7\u00e3o nenhuma.\n- A anatomia do prompt no Circuito (ADR-0020) j\u00e1 tem \u00e2ncora por se\u00e7\u00e3o (`circuito.html#sec-<id>`) e um campo `ordem` por se\u00e7\u00e3o: a jornada do SOP j\u00e1 est\u00e1 mapeada l\u00e1.\n\n## Decis\u00e3o\n\n1. **O v\u00ednculo teste e se\u00e7\u00e3o nasce na fonte, nunca na p\u00e1gina.** As 30 capacidades de `os/dados/comparacao.json` ganham `secao_ids` (lista de ids reais das se\u00e7\u00f5es do `circuito.json`); os 26 cen\u00e1rios de `ana/bancada/cenarios/integracao.json` ganham `secao` (prosa) e `secao_ids`. O runner da bancada ignora campos extras. A prosa continua para leitura; o id \u00e9 o que gera link e filtro.\n2. **Link s\u00f3 para se\u00e7\u00e3o que existe.** `secao_ids` vazio (caso ADR-0015, Se\u00e7\u00e3o 2.5 gated) n\u00e3o gera link: aparece a prosa com a marca \"fora do prompt compilado\". Nenhum link inventado, na linha do selo de origem (ADR-0020, cl\u00e1usula 5).\n3. **A p\u00e1gina abre como lista \u00fanica de linhas compactas, uma por teste.** Emenda a cl\u00e1usula 3 do ADR-0020: as duas faixas deixam de ser se\u00e7\u00f5es da p\u00e1gina e viram o filtro \"quem roda\". Cada linha mostra id, t\u00edtulo, a mensagem que se manda, chip da se\u00e7\u00e3o, quem julga e o bot\u00e3o de copiar.\n4. **Detalhe em popover: hover mostra, clique fixa.** O popover carrega a ficha completa (espere, falhou se, rastro do Chatwoot, checagens literais, turnos, selos de origem) e os links \"\u00a7 se\u00e7\u00e3o\" para `circuito.html#sec-<id>`. Esc ou clique fora fecha.\n5. **Filtros e ordena\u00e7\u00e3o, com estado na URL.** Filtros: quem roda (todos, humano, m\u00e1quina, sem teste), se\u00e7\u00e3o do SOP e busca livre. Ordena\u00e7\u00e3o: jornada do SOP (pela `ordem` das se\u00e7\u00f5es no `circuito.json`), ID, ou bloco e fam\u00edlia. O estado vive no hash da URL; a p\u00e1gina continua sem guardar nada (ADR-0017).\n\n## Considered options\n\n- **Parser autom\u00e1tico da prosa `secao`:** rejeitado. Falharia em sil\u00eancio nos casos que n\u00e3o batem com as 41 se\u00e7\u00f5es do circuito; link quebrado sem dono \u00e9 pior que link ausente.\n- **Manter as duas faixas e filtrar dentro de cada uma:** rejeitado. Duplicaria a barra de filtros e impediria a vis\u00e3o \"tudo da Se\u00e7\u00e3o 2.3\", que cruza as duas fontes.\n- **Modal grande centrado no clique:** rejeitado. Para varrer 61 testes, o hover com fixa\u00e7\u00e3o por clique \u00e9 mais r\u00e1pido; o modal esconde a lista que se est\u00e1 varrendo.\n\n## Consequ\u00eancias\n\n- A p\u00e1gina de Testes passa a ler tr\u00eas fontes: `comparacao.json`, `/api/cenarios` e `circuito.json` (se\u00e7\u00f5es, para r\u00f3tulo, ordem e \u00e2ncora).\n- Se uma se\u00e7\u00e3o mudar de id no circuito, o chip da se\u00e7\u00e3o some do teste na hora: defeito vis\u00edvel, n\u00e3o silencioso.\n- A curadoria dos `secao_ids` \u00e9 pontual (feita em 24/ago/2026); teste novo nasce com o campo, e o par \"Se\u00e7\u00e3o 7.5\" aponta para o n\u00f3 `7-4` do circuito, que hoje agrega o p\u00f3s-registro.\n- O CONTEXT.md atualiza o verbete Testes manuais.", "cita": [], "decisao": "", "emenda": [20], "emendada_por": [], "file": "docs/adr/0021-teste-aponta-para-a-secao-do-prompt.md", "number": 21, "slug": "0021-teste-aponta-para-a-secao-do-prompt", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "O teste aponta para a se\u00e7\u00e3o do prompt, e a p\u00e1gina de Testes vira lista filtr\u00e1vel"}, {"amended_by": "0032", "amends": "0019", "body_md": "Decis\u00e3o do Pedro (24/ago/2026): os c\u00f3digos A1, C1b, D5, E3 apareciam no cockpit sem explica\u00e7\u00e3o de onde v\u00eam nem do que provam. Nasce a p\u00e1gina **Fam\u00edlias da bancada** (`os/familias.html`, a d\u00e9cima primeira do menu), que explica cada fam\u00edlia por dentro: a promessa que ela vigia, a anatomia de cada cen\u00e1rio e o hist\u00f3rico das rodadas.\n\n## Contexto\n\n- O roteiro `roadmap/roteiro-integracao-hospital.md` define as cinco fam\u00edlias (A espelho, B formato, C cobertura, D ouvidoria, E robustez), os cen\u00e1rios de cada uma e o registro das rodadas (18 a 21/ago/2026). \u00c9 prosa longa, feita para quem executa, n\u00e3o para quem quer entender o mapa.\n- A p\u00e1gina Testes manuais lista os cen\u00e1rios da bancada como testes rod\u00e1veis, mas n\u00e3o explica o que uma fam\u00edlia significa, por que existe, nem o que j\u00e1 passou em qual rodada.\n- O Pedro esbarrou nos c\u00f3digos (E1, D4, E3) sem conseguir responder \"isso \u00e9 o qu\u00ea? devo me preocupar?\": a resposta existia, espalhada em 400 linhas de roteiro.\n\n## Decis\u00e3o\n\n1. **Nasce `os/dados/familias.json`**, curadoria do roteiro: por fam\u00edlia, a promessa, o peso (bloqueante ou ajuste) e a explica\u00e7\u00e3o; por cen\u00e1rio, os passos (monte, edite, envie, espere, falha se, reverta), o perigo quando toca produ\u00e7\u00e3o, as variantes por tabela, o hist\u00f3rico por rodada datada e a situa\u00e7\u00e3o de hoje. O roteiro segue sendo a verdade; o JSON \u00e9 o espelho curado para o OS, na linha do ADR-0017 (rodada nova no roteiro pede atualiza\u00e7\u00e3o da curadoria).\n2. **Nasce a p\u00e1gina Fam\u00edlias da bancada**, exce\u00e7\u00e3o consciente ao teto do ADR-0019 pela mesma r\u00e9gua do ADR-0020: trabalho novo (entender o porqu\u00ea, n\u00e3o rodar), dado derivado, p\u00e1gina que n\u00e3o guarda nada.\n3. **A anatomia \u00e9 visual:** cada cen\u00e1rio abre num stepper de passos com cores por tipo (preparo, envio, esperado, falha), aviso de perigo em destaque, variantes com bolinha de estado, e o hist\u00f3rico das rodadas em linha do tempo. Cen\u00e1rio da bancada linka para a p\u00e1gina Testes (busca pelo id); cen\u00e1rio manual \u00e9 marcado como tal.\n4. **Divis\u00e3o de trabalho:** a p\u00e1gina Testes responde \"o que eu rodo agora\"; a Fam\u00edlias responde \"o que essa prova significa e como ela est\u00e1\". Uma lista, a outra explica.\n\n## Considered options\n\n- **Explicar as fam\u00edlias dentro da p\u00e1gina Testes:** rejeitado. A Testes \u00e9 uma lista de execu\u00e7\u00e3o compacta; a anatomia (passos, rodadas, perigos) a deixaria pesada de novo, desfazendo a OS21.\n- **Linkar direto para o roteiro em markdown:** rejeitado. O roteiro \u00e9 a fonte e continua, mas 400 linhas de prosa n\u00e3o respondem \"devo me preocupar com o E1?\" num olhar.\n- **Derivar o JSON automaticamente do markdown:** rejeitado. O roteiro \u00e9 prosa livre; um parser quebraria em sil\u00eancio. A curadoria \u00e9 pequena (5 fam\u00edlias, 18 cen\u00e1rios) e muda s\u00f3 quando h\u00e1 rodada nova.\n\n## Consequ\u00eancias\n\n- O menu vai a 11 p\u00e1ginas. A r\u00e9gua de entrada segue a do ADR-0020: trabalho novo, dado derivado, p\u00e1gina sem estado.\n- Rodada nova registrada no roteiro pede a atualiza\u00e7\u00e3o de `familias.json` (vereditos e situa\u00e7\u00e3o de hoje). \u00c9 curadoria consciente, n\u00e3o autom\u00e1tica.\n- O CONTEXT.md ganha o verbete Fam\u00edlias da bancada; o CLAUDE.md passa a listar 11 p\u00e1ginas.", "cita": [], "decisao": "", "emenda": [19], "emendada_por": [32], "file": "docs/adr/0022-familias-da-bancada-explicadas-no-cockpit.md", "number": 22, "slug": "0022-familias-da-bancada-explicadas-no-cockpit", "status": "accepted", "substitui": [], "substituida_por": [], "superseded_by": null, "supersedes": null, "title": "As fam\u00edlias da bancada ganham p\u00e1gina pr\u00f3pria no cockpit"}, {"amended_by": null, "amends": null, "body_md": "Decis\u00e3o do grilling de 26/ago/2026. A massa de homologa\u00e7\u00e3o (GH-19) deixa de ser tratada como entreg\u00e1vel exclusivo da Global Health. O caminho ativo passa a ser criar a massa n\u00f3s mesmos: o analista de TI do hospital cadastra **uma agenda de teste de Cardiologia** no SoulMV TST seguindo o tutorial oficial da MV, e o Pedro confere e ativa no **Painel de Controle GH de homologa\u00e7\u00e3o**, ao qual ele tem acesso. O pendente GH19 continua aberto (a massa completa e as 4 perguntas de arquitetura seguem com a GH); a tarefa **V31** \u00e9 o caminho pr\u00f3prio.\n\n## Contexto\n\n- A GH-19 foi pedida em 07/jul/2026 e cobrada formalmente em 12/ago. Em 26/ago o smoke (`ana/api-mv/scripts/smoke-gh.py`) confirmou ao vivo: auth OK, cat\u00e1logo 100% vazio. S\u00e3o 50 dias de espera sem entrega.\n- As tools de agenda da Ana **j\u00e1 existem** (identifica\u00e7\u00e3o desde a V12, disponibilidade desde a V15). Elas respondem vazio por falta de dados, n\u00e3o por falta de implementa\u00e7\u00e3o. Nenhuma tool nova destrava nada agora.\n- O tutorial da MV \"Disponibiliza\u00e7\u00e3o de agenda no ambiente Online\" (docs.mv.com.br, salvo em `ana/api-mv/tutorial
