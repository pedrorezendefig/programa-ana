<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programa Ana · Mapa de execução</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETA E TIPOGRAFIA
   ============================================================ */
:root{
  --paper:#f4efe6;
  --paper-2:#ece5d8;
  --card:#fbf8f2;
  --ink:#211d18;
  --ink-soft:#5c5346;
  --ink-faint:#8a7f6d;
  --line:#d9cfbd;
  --line-soft:#e5ddcd;

  --dispare:#c8642b;      /* laranja queimado: sua vez, aja hoje */
  --dispare-bg:#f7e6d5;
  --comigo:#3f6f66;       /* pinho: sessão comigo */
  --comigo-bg:#dfe9e4;
  --aguarda:#9a7b3f;      /* ocre apagado: esperando terceiros */
  --aguarda-bg:#efe6d2;
  --andando:#2f6690;      /* azul sinal: em curso */
  --andando-bg:#dde7ef;
  --feito:#5f7a4f;        /* verde musgo: entregue */
  --feito-bg:#e2e8d8;
  --trancado:#b0a693;     /* cinza morno: represado */

  --shadow:0 1px 2px rgba(33,29,24,.04), 0 8px 24px -12px rgba(33,29,24,.18);
  --shadow-hi:0 2px 4px rgba(33,29,24,.06), 0 18px 40px -16px rgba(33,29,24,.28);

  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Hanken Grotesk",system-ui,sans-serif;
  --font-mono:"Spline Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font-body);color:var(--ink);
  background:
    radial-gradient(1200px 600px at 12% -8%, #fbf7ee 0%, rgba(251,247,238,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #efe8da 0%, rgba(239,232,218,0) 55%),
    var(--paper);
  line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,52px) clamp(16px,4vw,40px) 80px}

/* ============================================================
   CABEÇALHO
   ============================================================ */
.masthead{
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:20px;border-bottom:1.5px solid var(--line);padding-bottom:22px;
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
}
.brand{max-width:640px}
.kicker{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dispare);font-weight:600;margin:0 0 8px;
}
h1{
  font-family:var(--font-display);font-weight:600;font-size:clamp(2.1rem,5.4vw,3.4rem);
  line-height:1.02;margin:0;letter-spacing:-.015em;
}
h1 em{font-style:italic;color:var(--ink-soft);font-weight:400}
.frase{font-size:1.02rem;color:var(--ink-soft);margin:14px 0 0;max-width:56ch}
.meta{
  text-align:right;font-family:var(--font-mono);font-size:.78rem;
  color:var(--ink-faint);min-width:150px;line-height:1.7;
}
.meta .data{color:var(--ink);font-weight:600;font-size:.92rem}

/* barra de progresso */
.progresso{margin:26px 0 6px;animation:rise .7s .08s cubic-bezier(.2,.7,.2,1) both}
.progresso .rot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progresso .rot b{font-family:var(--font-mono);font-weight:600;font-size:.82rem;color:var(--ink-soft)}
.progresso .rot span{font-size:.8rem;color:var(--ink-faint)}
.bar{height:9px;border-radius:20px;background:var(--paper-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(33,29,24,.08)}
.bar>i{display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--feito),#7a9265);
  width:0;transition:width 1.1s .3s cubic-bezier(.2,.7,.2,1)}

/* ============================================================
   ALAVANCA DO DIA
   ============================================================ */
.alavanca{
  font-size:.9rem;color:var(--ink-soft);background:var(--dispare-bg);
  border:1px solid #e6cdb2;border-left:3px solid var(--dispare);
  padding:11px 16px;border-radius:12px;margin:24px 0 16px;cursor:pointer;
  transition:box-shadow .18s,transform .18s;
  animation:rise .7s .14s cubic-bezier(.2,.7,.2,1) both;
}
.alavanca:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.alavanca b{color:var(--dispare)}
.alavanca .cta{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-faint);margin-left:8px}

/* ============================================================
   LEGENDA E MAPA
   ============================================================ */
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0 0 14px;animation:rise .7s .18s cubic-bezier(.2,.7,.2,1) both}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--ink-soft)}
.legend .sw{width:13px;height:13px;border-radius:4px;flex:none}
.legend .railsw{width:22px;height:0;border-top:3.5px solid var(--dispare);opacity:.55;flex:none}

/* mapa em largura total: sai da coluna estreita e escala para caber tudo na tela */
.mapfull{position:relative;left:50%;transform:translateX(-50%);
  width:96vw;max-width:1840px;padding:10px;
  border:1px solid var(--line-soft);border-radius:18px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden}
svg.map{display:block;width:100%;height:auto;max-height:84vh;margin:0 auto}
.edge{fill:none;stroke:var(--line);stroke-width:1.5}
.edge.hot{stroke:var(--dispare);stroke-width:2;stroke-dasharray:5 6;animation:flow 1s linear infinite}
.edge.rail{stroke:var(--dispare);stroke-width:3.5;opacity:.5}
.node{cursor:pointer}
.node rect{transition:filter .15s}
.node:hover rect{filter:brightness(1.04)}
.node .nid{font-family:var(--font-mono);font-weight:600}
.node .ntt{font-family:var(--font-body);font-weight:600}
.node .nef{font-family:var(--font-mono);font-size:8.5px;font-weight:600;fill:var(--ink-faint)}
.node.act rect{animation:glow 2.6s ease-in-out infinite}
.lanelabel{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:var(--ink-faint);letter-spacing:.06em}

/* ============================================================
   CARD FLUTUANTE (ficha da tarefa)
   ============================================================ */
.fcard{
  position:absolute;z-index:6;width:min(370px,82vw);
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;box-shadow:var(--shadow-hi);
  animation:fade .15s ease both;
}
.fcard.pin{border-color:var(--ink-soft)}
.fcard .dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.fcard .dhead .titulo{font-family:var(--font-display);font-size:1.08rem;font-weight:600;line-height:1.15}
.fcard .badge{font-family:var(--font-mono);font-size:.64rem;font-weight:600;padding:2px 7px;border-radius:7px;white-space:nowrap}
.fcard .brow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.fcard .dbody{font-size:.85rem;color:var(--ink-soft);margin:9px 0 0}
.fcard .dnote{font-size:.8rem;margin:8px 0 0;display:flex;gap:6px;align-items:flex-start}
.fcard .dnote b{font-family:var(--font-mono);font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;flex:none;margin-top:2px}
.fcard .drow{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.78rem;color:var(--ink-faint)}
.fcard .drow b{color:var(--ink);font-weight:600;font-family:var(--font-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.fcard .refchip{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-family:var(--font-mono);font-size:.72rem;font-weight:600;color:var(--dispare);
  background:var(--dispare-bg);border:1px solid #e6cdb2;border-radius:8px;
  padding:4px 10px;text-decoration:none;transition:.15s;
}
.fcard .refchip:hover{filter:brightness(.97);box-shadow:var(--shadow)}
.fcard .pinhint{font-family:var(--font-mono);font-size:.62rem;color:var(--ink-faint);margin-top:10px}

/* ============================================================
   RODAPÉ
   ============================================================ */
.foot{margin-top:44px;border-top:1.5px solid var(--line);padding-top:18px;
  font-size:.8rem;color:var(--ink-faint);display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.foot code{font-family:var(--font-mono);background:var(--paper-2);padding:1px 6px;border-radius:5px;color:var(--ink-soft)}

/* ============================================================
   ANIMAÇÕES
   ============================================================ */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(200,100,43,0))}50%{filter:drop-shadow(0 0 6px rgba(200,100,43,.55))}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <p class="kicker">Programa Ana · Hospital São Matheus</p>
      <h1>Mapa de <em>execução</em></h1>
      <p class="frase" id="frase"></p>
    </div>
    <div class="meta">
      <div class="data" id="data"></div>
      <div id="contagem"></div>
      <div style="margin-top:6px">só leitura · abre com 2 cliques</div>
    </div>
  </header>

  <div class="progresso">
    <div class="rot"><b id="progtxt"></b><span>entregas concluídas</span></div>
    <div class="bar"><i id="progbar"></i></div>
  </div>

  <p class="alavanca" id="alavanca"></p>

  <div class="legend" id="legend"></div>

  <div class="mapfull" id="mapfull">
    <svg class="map" id="svg"></svg>
    <div class="fcard" id="fcard" hidden></div>
  </div>

  <footer class="foot">
    <span>Fonte narrativa: <code>roadmap/TODO.md</code> · este mapa é o espelho visual do estado.</span>
    <span>Atualizado pelo <code>/check</code> e por qualquer sessão que avance uma tarefa.</span>
  </footer>

</div>

<script>
/* ============================================================
   DADOS DO ROADMAP  ·  ESPELHO ESTRUTURADO DE roadmap/TODO.md
   ------------------------------------------------------------
   Esta é a ÚNICA fonte de dados deste mapa. Ao mudar um status
   aqui, mude também no TODO.md (e vice-versa). O /check
   reconcilia os dois toda vez que roda.

   Edite SÓ este bloco. Daqui para baixo é renderização.

   status : "feito" | "andando" | "afazer"
   canal  : "dispare" (você sozinho) | "comigo" (sessão) | "terceiro"
   esforco: "P" (disparo 5-15 min) | "M" (uma sessão 1-3h) | "G" (várias sessões/dias)
   dono   : rótulo livre (P / C / E / P+C ...), só informativo
   depende: lista de ids que precisam estar "feito" para liberar
   ref    : {label, href} link relativo para o material pronto (opcional)

   Criticidade NÃO é campo: é derivada do grafo na renderização
   (acionável agora E: no trilho da receita, ou destrava 2+,
   ou é disparo). Ver CONTEXT.md, seção "Roadmap e cockpit".
   ============================================================ */
const ESTADO = {
  data: "22/jul/2026",
  frase: "Portal do playground no ar com o pacote de absorção pronto; quatro disparos seus: validar o hotfix, perguntar ao analista, pedir à Global Health e rodar as queries na produção (C8)."
};

const TRILHAS = {
  A:"Hotfix", B:"Pesquisa", C:"Banco MV", D:"Integração",
  E:"Pós-atendimento", G:"Canal principal", F:"Contínuo"
};

/* trilho da receita: caminho crítico até o Termo de Entregável (+R$ 2k) */
const RAIL = ["D1","D2","D5","D6","D7","D8"];

const TAREFAS = [
  // ---- A · Hotfix ----
  {id:"A1",trilha:"A",titulo:"Redigir o prompt v1.1",dono:"C",status:"feito",canal:"comigo",esforco:"M",depende:[],
   resumo:"Regra de urgência, Regra 6 (assistente virtual) e guardrails jurídicos da ouvidoria."},
  {id:"A2",trilha:"A",titulo:"Aplicar o hotfix no n8n",dono:"P",status:"feito",canal:"dispare",esforco:"P",depende:["A1"],
   resumo:"Hotfix aplicado em produção via API; versão ativa confirmada."},
  {id:"A3",trilha:"A",titulo:"Validar o hotfix em sombra",dono:"P+C",status:"afazer",canal:"comigo",esforco:"M",depende:["A2"],
   resumo:"Rodar a bateria de 15 mensagens e o teste da 'dor no peito' num contato de teste.",
   porque:"No ar desde 06/jul sem validação. É barato e não depende de ninguém de fora.",
   prontoQuando:"15 cenários corretos e nenhum incidente na janela de conversas reais.",
   ref:{label:"passo a passo · PENDENCIAS §3",href:"PENDENCIAS.md"}},
  {id:"A5",trilha:"A",titulo:"Guardar o token do Chatwoot num cofre",dono:"P",status:"afazer",canal:"comigo",esforco:"M",depende:[],
   resumo:"Tirar o token de dentro dos fluxos e pô-lo numa Credential do n8n; gerar token novo. NÃO é sair do Chatwoot.",
   porque:"Enquanto o token estiver em texto puro, o repo não pode ter backup remoto sem vazar.",
   prontoQuando:"Nenhum token em texto puro nos exports e token antigo revogado.",
   ref:{label:"passo a passo · PENDENCIAS §5",href:"PENDENCIAS.md"}},
  {id:"A4",trilha:"A",titulo:"Re-exportar os fluxos para o repo",dono:"C",status:"afazer",canal:"comigo",esforco:"P",depende:["A3","A5"],
   resumo:"Exportar os workflows limpos (sem token) e commitar."},

  // ---- B · Pesquisa ----
  {id:"B1",trilha:"B",titulo:"Sessão ultracode",dono:"E",status:"feito",canal:"terceiro",esforco:"G",depende:[],
   resumo:"8 documentos de pesquisa e specs entregues (prompt v2, templates, classificador, analítica)."},
  {id:"B2",trilha:"B",titulo:"Revisar os 8 documentos da pesquisa",dono:"P+C",status:"afazer",canal:"comigo",esforco:"G",depende:["B1"],
   resumo:"Decidir o que entra, documento a documento. Começa pela síntese em relatorio-pesquisa.md.",
   porque:"Pivô: sem esta revisão, a construção da integração (D2, D3) e o template (E3) não começam.",
   prontoQuando:"Cada artefato marcado como aceito, aceito-com-ajuste ou rejeitado; decisões registradas.",
   ref:{label:"síntese · relatorio-pesquisa.md",href:"relatorio-pesquisa.md"}},
  {id:"B3",trilha:"B",titulo:"Consolidar o SOP v2",dono:"C",status:"afazer",canal:"comigo",esforco:"M",depende:["A1","B2"],
   resumo:"Juntar hotfix + agendamento + pesquisa num único prompt que sobe na homologação."},

  // ---- C · Banco MV ----
  {id:"C1",trilha:"C",titulo:"Conexão Oracle",dono:"P+E",status:"feito",canal:"terceiro",esforco:"P",depende:[],
   resumo:"Credencial read-only e conexão confirmadas."},
  {id:"C2",trilha:"C",titulo:"Explorar a estrutura da base",dono:"C",status:"feito",canal:"comigo",esforco:"M",depende:["C1"],
   resumo:"Pacotes de query rodados; base TST mapeada; conexão direta funcionando da sessão."},
  {id:"C3",trilha:"C",titulo:"Dicionário de colunas + diagrama",dono:"C",status:"andando",canal:"comigo",esforco:"M",depende:["C2"],
   resumo:"Dicionário das 13 tabelas e diagrama do fluxo entregues. Falta o carimbo do analista (C6)."},
  {id:"C4",trilha:"C",titulo:"Mapear o desfecho (alta/óbito)",dono:"C",status:"andando",canal:"comigo",esforco:"M",depende:["C3"],
   resumo:"Onde vive o desfecho no banco, para filtrar disparo com segurança. Query candidata pronta.",
   prontoQuando:"Query roda e o analista confirma a semântica dos motivos de alta."},
  {id:"C6",trilha:"C",titulo:"Perguntar ao analista de TI",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:[],
   resumo:"Enviar as perguntas (texto pronto em PENDENCIAS §1). O carimbo de quem conhece a operação.",
   porque:"Lead time longo e a base de produção é pré-condição do pós-atendimento (Fase 3).",
   ref:{label:"texto pronto · PENDENCIAS §1",href:"PENDENCIAS.md"}},
  {id:"C5",trilha:"C",titulo:"Varrer o Power BI (SCMA)",dono:"C+P",status:"afazer",canal:"comigo",esforco:"M",depende:[],
   resumo:"Opcional. Ver os indicadores que a gestão já acompanha, para desenhar o relatório na mesma língua."},
  {id:"C7",trilha:"C",titulo:"Portal do playground + pacote de absorção",dono:"C",status:"feito",canal:"comigo",esforco:"G",depende:["C3"],
   resumo:"Playground vira portal multi-página (localhost:8777): roteiro por endpoint com query de conferência, atlas da produção e insights; pacote de queries prontas para o DBeaver da produção.",
   prontoQuando:"Portal navegável com as páginas novas e cada query com instrução + nome de CSV pré-definido.",
   ref:{label:"decisão · ADR-0004",href:"../docs/adr/0004-fronteira-playground-atlas.md"}},
  {id:"C8",trilha:"C",titulo:"Rodar o pacote na produção (DBeaver)",dono:"P",status:"afazer",canal:"dispare",esforco:"M",depende:["C7"],
   resumo:"Executar as queries no DBeaver de PRODUÇÃO e depositar os CSVs com os nomes combinados (dado pessoal só em amostras/, fora do git).",
   porque:"É a única via permitida para produção; destrava o retrato real (C9) e responde parte do C6/GH-18 sem depender do analista.",
   ref:{label:"instruções · absorcao-producao/README.md",href:"../ana/api-mv/absorcao-producao/README.md"}},
  {id:"C9",trilha:"C",titulo:"Absorver os resultados no atlas",dono:"C",status:"afazer",canal:"comigo",esforco:"G",depende:["C8"],
   resumo:"Preencher o atlas do portal com o retrato real (domínios, volumes, relações), gerar os insights de diretoria com evidência e atualizar o dicionário."},
  {id:"C10",trilha:"C",titulo:"Destravar o firewall da TST (MV)",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:[],
   resumo:"Pedir ao MV a liberação do pool da HSM-VPN (10.100.64.0/22) até a porta 1521 do Oracle TST. Mensagem pronta para copiar na página Conexão TST do portal.",
   porque:"A TST está inalcançável desde 13/jul; religar devolve a consulta direta da sessão e o CSV automático no repositório.",
   ref:{label:"mensagem pronta · portal Conexão TST",href:"../ana/api-mv/playground/tst.html"}},

  // ---- D · Integração MV ----
  {id:"D1",trilha:"D",titulo:"Pedir à Global Health",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:[],
   resumo:"Massa de homolog, qual MV a API enxerga, token de produção e rate limit (texto pronto em PENDENCIAS §2).",
   porque:"Sem massa não dá para exercitar o agendamento. É externo e demora.",
   ref:{label:"texto pronto · PENDENCIAS §2",href:"PENDENCIAS.md"}},
  {id:"D2",trilha:"D",titulo:"Construir os subfluxos de agendamento",dono:"C",status:"afazer",canal:"comigo",esforco:"G",depende:["D1","B2"],
   resumo:"Identificar paciente, buscar horário, efetivar, remarcar e cancelar, com confirmação em 3 camadas."},
  {id:"D3",trilha:"D",titulo:"Classificador de urgência",dono:"C",status:"afazer",canal:"comigo",esforco:"M",depende:["B2"],
   resumo:"Segunda camada de defesa: filtro binário antes do agente, com zero falso-negativo."},
  {id:"D4",trilha:"D",titulo:"Etapa e tags novas no Kanban",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:[],
   resumo:"Criar a etapa 'FALHA AGENDAMENTO' e as tags que os subfluxos exigem. Aditivo mínimo, sem reforma."},
  {id:"D5",trilha:"D",titulo:"Homologar a integração",dono:"P+C",status:"afazer",canal:"comigo",esforco:"G",depende:["D2","D3","D4"],
   resumo:"Checklist completo: 6 jornadas, 7 fallbacks e os guardrails."},
  {id:"D6",trilha:"D",titulo:"Canário por inbox",dono:"P+C",status:"afazer",canal:"comigo",esforco:"M",depende:["D5"],
   resumo:"Ligar para um subconjunto e acompanhar taxa de sucesso vs falha por uma semana."},

   resumo:"Trocar para produção, smoke test e monitorar a primeira semana."},
  {id:"D8",trilha:"D",titulo:"Termo de Entregável (+R$ 2.000/mês)",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:["D7"],
   resumo:"Emitir o Termo. A mensalidade da Ana passa de R$ 6.000 para R$ 8.000."},

  // ---- E · Pós-atendimento ----
  {id:"E1",trilha:"E",titulo:"Fonte MV com desfecho",dono:"E",status:"afazer",canal:"terceiro",esforco:"M",depende:["C4"],
   resumo:"Extração diária: só eletivo, só alta benigna, com campos para personalizar o template."},
  {id:"E2",trilha:"E",titulo:"Base legal LGPD",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:[],
   resumo:"Adiada por decisão da direção, mas o jurídico tem lead time longo. Consentimento específico no termo.",
   porque:"Pré-condição dura do disparo em massa (POC). Reabrir antes do template."},
  {id:"E3",trilha:"E",titulo:"Template utility de abertura",dono:"C+P",status:"afazer",canal:"comigo",esforco:"M",depende:["B2"],
   resumo:"Escolher e registrar o template na Meta; provar que é cobrado como utility (9x mais barato)."},
  {id:"E4",trilha:"E",titulo:"POC do pós-atendimento eletivo",dono:"P+C",status:"afazer",canal:"comigo",esforco:"G",depende:["E1","E2","E3"],
   resumo:"250 a 1.000/dia, opt-out, ramificação por sentimento, métricas de resposta e custo."},
  {id:"E5",trilha:"E",titulo:"Camada analítica",dono:"C",status:"afazer",canal:"comigo",esforco:"G",depende:["E4"],
   resumo:"Armazenar cada resposta classificada e agregar por setor, profissional e tema ao longo do tempo."},
  {id:"E6",trilha:"E",titulo:"Categorias e ritual semanal",dono:"P+E",status:"afazer",canal:"terceiro",esforco:"M",depende:["E5"],
   resumo:"Co-desenhar as categorias com os coordenadores; ritual semanal com dono para cada ação."},
  {id:"E7",trilha:"E",titulo:"Respostas ao Google Meu Negócio",dono:"C+P",status:"afazer",canal:"comigo",esforco:"M",depende:["E4"],
   resumo:"Backlog. Rascunhos de resposta a avaliações por IA, publicação só com aprovação humana."},

  // ---- G · Canal principal ----
  {id:"G1",trilha:"G",titulo:"Descobrir a conexão do número",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:[],
   resumo:"Como o WhatsApp real está conectado hoje? WABA oficial? Qual BSP? Perguntar num papo natural.",
   porque:"Lead time longo e destrava tanto a migração quanto o registro do template na Meta."},
  {id:"G2",trilha:"G",titulo:"Migrar o número para o Chatwoot",dono:"E+P",status:"afazer",canal:"terceiro",esforco:"G",depende:["D7","G1"],
   resumo:"Levar o número para a API oficial plugada no Chatwoot; histórico fica no Kommo."},
  {id:"G3",trilha:"G",titulo:"Treinar os atendentes",dono:"E",status:"afazer",canal:"terceiro",esforco:"M",depende:["G2"],
   resumo:"Time treinado no Chatwoot antes do cutover; eles são o transbordo."},
  {id:"G4",trilha:"G",titulo:"Sombra com casos reais",dono:"P+C",status:"afazer",canal:"comigo",esforco:"G",depende:["G3"],
   resumo:"Ana rascunha em nota privada, atendente revisa e envia; calibra o tom com a população real."},
  {id:"G5",trilha:"G",titulo:"Ana autônoma + canário real",dono:"P+C",status:"afazer",canal:"comigo",esforco:"G",depende:["G4"],
   resumo:"Ana na entrada com transbordo; sucesso = a fila de não respondidas para de crescer."},
  {id:"G6",trilha:"G",titulo:"Reforma do Chatwoot + KPIs",dono:"P+C+E",status:"afazer",canal:"comigo",esforco:"G",depende:["G5"],
   resumo:"Funil de 7 etapas, famílias de tags, SLA e a camada de KPIs, com o time já operando."},

  // ---- F · Contínuo ----
  {id:"F1",trilha:"F",titulo:"Pauta com o Felipe",dono:"P",status:"afazer",canal:"dispare",esforco:"P",depende:["A2","B2"],
   resumo:"Regra 6, veredito do web-chat e a meta de desempenho da Ana no contrato."},
  {id:"F2",trilha:"F",titulo:"Manter tudo sincronizado",dono:"C",status:"andando",canal:"comigo",esforco:"M",depende:[],
   resumo:"TODO, este mapa e a memória sempre alinhados, via /check."},
  {id:"F3",trilha:"F",titulo:"Dimensionar a manutenção recorrente",dono:"P",status:"afazer",canal:"dispare",esforco:"M",depende:[],
   resumo:"Estimar horas/mês de manutenção e refletir no contrato antes de assinar o Termo (D8)."},
];

/* ============================================================
   FIM DOS DADOS · daqui para baixo é renderização.
   ============================================================ */
const byId = Object.fromEntries(TAREFAS.map(t=>[t.id,t]));
const isFeito = id => byId[id] && byId[id].status==="feito";
const depsProntas = t => t.depende.every(isFeito);
const actionable = t => t.status!=="feito" && depsProntas(t);
const quantasDestrava = id => TAREFAS.filter(t=>t.depende.includes(id)).length;

const railSet = new Set(RAIL);
const railEdges = new Set(RAIL.slice(1).map((id,i)=>RAIL[i]+">"+id));
/* criticidade derivada: acionável agora E pelo menos uma alavanca */
const critico = t => actionable(t) &&
  (railSet.has(t.id) || quantasDestrava(t.id)>=2 || t.canal==="dispare");

const CANAL_LABEL = {dispare:"Dispare",comigo:"Comigo",terceiro:"Terceiros"};
const ESFORCO_LABEL = {P:"P · disparo (5-15 min)",M:"M · uma sessão (1-3 h)",G:"G · várias sessões"};

document.getElementById("frase").textContent = ESTADO.frase;
document.getElementById("data").textContent = ESTADO.data;

/* ---- progresso ---- */
const contaveis = TAREFAS.filter(t=>t.id!=="F2");
const feitos = contaveis.filter(t=>t.status==="feito").length;
const total = contaveis.length;
const pct = Math.round(feitos/total*100);
document.getElementById("contagem").textContent = feitos+" de "+total+" tarefas";
document.getElementById("progtxt").textContent = pct+"%";
requestAnimationFrame(()=>document.getElementById("progbar").style.width = pct+"%");

/* ---- alavanca do dia ---- */
const frentes = TAREFAS.filter(t=>t.status==="afazer" && depsProntas(t) && t.canal!=="terceiro");
const disparos = frentes.filter(t=>t.canal==="dispare");
const alavanca = (disparos.length?disparos:frentes).slice()
  .sort((a,b)=>(quantasDestrava(b.id)+(railSet.has(b.id)?2:0))-(quantasDestrava(a.id)+(railSet.has(a.id)?2:0)))[0];
const alvEl = document.getElementById("alavanca");
if(alavanca){
  alvEl.innerHTML = "Se você só tiver 15 minutos hoje: <b>"+alavanca.id+" · "+alavanca.titulo+"</b>. "+
    "Há <b>"+frentes.length+"</b> frentes acionáveis em paralelo."+
    '<span class="cta">clique para ver a ficha</span>';
} else { alvEl.style.display="none"; }

/* ---- layout do grafo ---- */
const laneOrder = ["A","B","C","D","E","G","F"];

const depthCache = {};
function depth(id){
  if(id in depthCache) return depthCache[id];
  const t = byId[id];
  const d = t.depende.length ? 1+Math.max(...t.depende.map(depth)) : 0;
  return depthCache[id]=d;
}
TAREFAS.forEach(t=>depth(t.id));

const DIM = {P:{w:104,h:36}, M:{w:128,h:48}, G:{w:156,h:64}};
const COLW=184, VGAP=12, LABELH=24, LANEGAP=12, PADX=20, PADTOP=12;
const maxDepth = Math.max(...TAREFAS.map(t=>depthCache[t.id]));
const W = PADX + (maxDepth+1)*COLW + 20;

const laneNodes = Object.fromEntries(laneOrder.map(k=>[k,[]]));
TAREFAS.forEach(t=>laneNodes[t.trilha].push(t));

const pos = {};
const laneMeta = {};
let cursorY = PADTOP;
laneOrder.forEach(k=>{
  const groups = {};
  laneNodes[k].forEach(t=>{
    const d = depthCache[t.id];
    (groups[d] = groups[d] || []).push(t);
  });
  const nodesTop = cursorY + LABELH;
  let maxStack = DIM.M.h;
  Object.values(groups).forEach(gp=>{
    let y = nodesTop;
    gp.forEach(t=>{
      const dm = DIM[t.esforco] || DIM.M;
      pos[t.id] = { x: PADX + depthCache[t.id]*COLW, y: y, w: dm.w, h: dm.h };
      y += dm.h + VGAP;
    });
    const stackH = y - VGAP - nodesTop;
    if(stackH>maxStack) maxStack=stackH;
  });
  const laneHeight = LABELH + maxStack + 10;
  laneMeta[k] = { top: cursorY, height: laneHeight };
  cursorY += laneHeight + LANEGAP;
});
const H = cursorY + 6;

function corNode(t){
  if(t.status==="feito") return {fill:"var(--feito-bg)",stroke:"var(--feito)"};
  if(t.status==="andando") return {fill:"var(--andando-bg)",stroke:"var(--andando)"};
  if(actionable(t)) return t.canal==="comigo"
      ? {fill:"var(--comigo-bg)",stroke:"var(--comigo)"}
      : {fill:"var(--dispare-bg)",stroke:"var(--dispare)"};
  return {fill:"#efe9dd",stroke:"var(--trancado)"};
}

function trunc(s,n){return s.length>n ? s.slice(0,n-1)+"…" : s;}
function wrap2(s,n){
  if(s.length<=n) return [s];
  let cut = s.lastIndexOf(" ",n);
  if(cut<8) cut=n;
  return [s.slice(0,cut), trunc(s.slice(cut).trim(),n)];
}

const svg = document.getElementById("svg");
svg.setAttribute("viewBox","0 0 "+W+" "+H);
svg.setAttribute("preserveAspectRatio","xMidYMid meet");

let g = "";
// faixas (swimlanes) e rótulos de trilha, desenhados atrás dos nós
laneOrder.forEach((k,i)=>{
  const m = laneMeta[k];
  g += '<rect x="6" y="'+m.top+'" width="'+(W-12)+'" height="'+m.height+'" rx="14" fill="'+(i%2?"rgba(217,207,189,.16)":"rgba(217,207,189,.34)")+'"/>';
  g += '<text class="lanelabel" x="20" y="'+(m.top+19)+'">'+k+' · '+TRILHAS[k].toUpperCase()+'</text>';
});
// arestas (o trilho da receita é contínuo e mais grosso; laranja tracejado = destrava algo pronto)
TAREFAS.forEach(t=>{
  const hot = actionable(t);
  t.depende.forEach(d=>{
    const a = pos[d], b = pos[t.id];
    if(!a||!b) return;
    const rail = railEdges.has(d+">"+t.id);
    const x1=a.x+a.w, y1=a.y+a.h/2, x2=b.x, y2=b.y+b.h/2;
    const mx=(x1+x2)/2;
    const cls = "edge"+(rail?" rail":(hot?" hot":""));
    g += '<path class="'+cls+'" d="M'+x1+' '+y1+' C '+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'"/>';
  });
});
// nós: tamanho = esforço (P/M/G); borda grossa + pulso = crítica
TAREFAS.forEach(t=>{
  const p=pos[t.id], c=corNode(t), crit=critico(t);
  const small = t.esforco==="P";
  const lines = t.esforco==="G" ? wrap2(t.titulo,20) : [trunc(t.titulo, small?15:17)];
  g += '<g class="node'+(crit?' act':'')+'" data-id="'+t.id+'">';
  g += '<rect x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="10" fill="'+c.fill+'" stroke="'+c.stroke+'" stroke-width="'+(crit?3:1.6)+'"/>';
  g += '<text class="nid" x="'+(p.x+10)+'" y="'+(p.y+(small?13:16))+'" font-size="'+(small?10:11)+'" fill="'+c.stroke+'">'+t.id+'</text>';
  g += '<text class="nef" x="'+(p.x+p.w-8)+'" y="'+(p.y+(small?13:14))+'" text-anchor="end">'+t.esforco+'</text>';
  lines.forEach((ln,i)=>{
    g += '<text class="ntt" x="'+(p.x+10)+'" y="'+(p.y+(small?27:33)+i*15)+'" font-size="'+(small?10.5:11.5)+'" fill="var(--ink)">'+ln+'</text>';
  });
  g += '</g>';
});
svg.innerHTML = g;

/* ---- legenda ---- */
const LEG = [
  ["var(--dispare)","Pronto: dispare você"],
  ["var(--comigo)","Pronto: sessão comigo"],
  ["var(--andando)","Em curso"],
  ["var(--feito)","Entregue"],
  ["var(--trancado)","Represado"],
];
document.getElementById("legend").innerHTML =
  LEG.map(l=>'<span><span class="sw" style="background:'+l[0]+'"></span>'+l[1]+'</span>').join("") +
  '<span><span class="sw" style="background:transparent;border:2.5px solid var(--dispare)"></span>Borda pulsando: crítica, aja agora</span>' +
  '<span><span class="railsw"></span>Trilho da receita (D1→D8)</span>' +
  '<span>Tamanho do bloco = esforço: P disparo · M sessão · G construção</span>';

/* ---- card flutuante ---- */
const mapfull = document.getElementById("mapfull");
const fcard = document.getElementById("fcard");
let pinned = null, hideTimer = null;

function statusLabel(t){
  if(t.status==="feito") return ["Entregue","var(--feito)","var(--feito-bg)"];
  if(t.status==="andando") return ["Em curso","var(--andando)","var(--andando-bg)"];
  if(actionable(t)) return ["Pronto para começar","var(--dispare)","var(--dispare-bg)"];
  return ["Represado","var(--trancado)","#efe9dd"];
}
function motivosCritica(t){
  const m=[];
  if(railSet.has(t.id)) m.push("no trilho da receita");
  const n=quantasDestrava(t.id);
  if(n>=2) m.push("destrava "+n+" tarefas");
  if(t.canal==="dispare") m.push("disparo: o relógio corre");
  return m.join(" · ");
}
function cardHTML(t){
  const [sl,sc,sbg]=statusLabel(t);
  const falta = t.depende.filter(d=>!isFeito(d));
  const dest = TAREFAS.filter(x=>x.depende.includes(t.id)).map(x=>x.id);
  let h = '<div class="dhead"><span class="badge" style="color:'+sc+';background:'+sbg+'">'+t.id+'</span>';
  h += '<span class="titulo">'+t.titulo+'</span></div>';
  h += '<div class="brow"><span class="badge" style="color:'+sc+';background:'+sbg+'">'+sl+'</span>';
  if(critico(t)) h += '<span class="badge" style="color:#fff;background:var(--dispare)">CRÍTICA · '+motivosCritica(t)+'</span>';
  h += '<span class="badge" style="color:var(--ink-soft);background:var(--paper-2)">'+ESFORCO_LABEL[t.esforco]+'</span></div>';
  h += '<div class="dbody">'+t.resumo+'</div>';
  if(t.porque) h += '<div class="dnote" style="color:'+sc+'"><b>Por quê</b><span>'+t.porque+'</span></div>';
  if(t.prontoQuando) h += '<div class="dnote" style="color:var(--ink-soft)"><b>Pronto qdo</b><span>'+t.prontoQuando+'</span></div>';
  h += '<div class="drow">';
  h += '<span><b>Trilha</b>'+t.trilha+' · '+TRILHAS[t.trilha]+'</span>';
  h += '<span><b>Canal</b>'+CANAL_LABEL[t.canal]+'</span>';
  h += '<span><b>Dono</b>'+t.dono+'</span>';
  if(falta.length) h += '<span><b>Destrava com</b>'+falta.join(", ")+'</span>';
  if(dest.length) h += '<span><b>Destrava</b>'+dest.join(", ")+'</span>';
  h += '</div>';
  if(t.ref) h += '<a class="refchip" href="'+t.ref.href+'" target="_blank">↗ '+t.ref.label+'</a>';
  h += '<div class="pinhint">'+(pinned===t.id?"fixado · Esc ou clique fora para soltar":"clique no bloco para fixar")+'</div>';
  return h;
}
function showCard(id, anchorRect){
  fcard.innerHTML = cardHTML(byId[id]);
  fcard.hidden = false;
  fcard.classList.toggle("pin", pinned===id);
  const c = mapfull.getBoundingClientRect();
  const r = anchorRect.getBoundingClientRect();
  const cw = fcard.offsetWidth, ch = fcard.offsetHeight;
  let left = r.right - c.left + 12;
  if(left + cw > c.width - 8) left = r.left - c.left - cw - 12;
  if(left < 8) left = 8;
  let top = r.top - c.top;
  if(top + ch > c.height - 8) top = c.height - ch - 8;
  if(top < 8) top = 8;
  fcard.style.left = left+"px";
  fcard.style.top = top+"px";
}
function hideCard(){
  fcard.hidden = true;
  fcard.classList.remove("pin");
  pinned = null;
}
const nodeRect = id => svg.querySelector('.node[data-id="'+id+'"] rect');
svg.querySelectorAll(".node").forEach(n=>{
  const id = n.dataset.id;
  n.addEventListener("mouseenter",()=>{
    clearTimeout(hideTimer);
    if(!pinned) showCard(id, nodeRect(id));
  });
  n.addEventListener("mouseleave",()=>{
    if(!pinned) hideTimer = setTimeout(hideCard,160);
  });
  n.addEventListener("click",e=>{
    e.stopPropagation();
    pinned = id;
    showCard(id, nodeRect(id));
  });
});
fcard.addEventListener("mouseenter",()=>clearTimeout(hideTimer));
fcard.addEventListener("mouseleave",()=>{ if(!pinned) hideCard(); });
fcard.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>{ if(pinned) hideCard(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") hideCard(); });
if(alavanca){
  alvEl.addEventListener("click",e=>{
    e.stopPropagation();
    pinned = alavanca.id;
    showCard(alavanca.id, nodeRect(alavanca.id));
    mapfull.scrollIntoView({behavior:"smooth",block:"nearest"});
  });
}
</script>
</body>
</html>
